<!DOCTYPE html>
<html lang="es" data-mode="light">
<script>try{var m=localStorage.getItem("pc-mode");if(m==="dark"||m==="light")document.documentElement.setAttribute("data-mode",m);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preparador Concurso de Meritocracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: aplicación de escritorio. Barra lateral fija de 264px + área de trabajo fluida (máx. 1320px). Modo claro por defecto; modo oscuro opcional con [data-mode="dark"]. */
:root{
  --bg:#f4f5f8;
  --surface:#ffffff;
  --surface-2:#f8f9fb;
  --glass:#ffffff;
  --glass-2:#fbfbfd;
  --track:#e7eaf0;
  --line:#e2d6b8;
  --line-2:#e3e7ee;
  --ink:#121a2b;
  --ink-2:#2b3550;
  --muted:#667189;
  --gold:#a7822f;
  --gold-2:#c9a24f;
  --gold-3:#7d6020;
  --gold-text:#8a6a22;
  --tint:#f6efdd;
  --navy:#0f2347;
  --navy-2:#1a3a6e;
  --ok:#1f7a50; --ok-bg:#e8f4ee;
  --bad:#b4372c; --bad-bg:#fbecea;
  --warn:#9a5f0c; --warn-bg:#fcf1df;
  --side:#0d1a33;
  --shadow:0 1px 2px rgba(18,26,43,.04),0 10px 30px -18px rgba(18,26,43,.25);
  --shadow-h:0 2px 6px rgba(18,26,43,.06),0 22px 44px -22px rgba(18,26,43,.35);
  --glow:rgba(201,162,79,.12);
  --sel-ink:#1a1405;
  --font-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --font-body:"Geist","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#060b17;
  --surface:#0d1628;
  --surface-2:#0a1222;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.06);
  --track:rgba(255,255,255,.08);
  --line:rgba(212,175,95,.22);
  --line-2:rgba(255,255,255,.08);
  --ink:#e9edf5;
  --ink-2:#c3cbdb;
  --muted:#8f9bb2;
  --gold:#d4af5f;
  --gold-2:#f1d68f;
  --gold-3:#9c7a33;
  --gold-text:#f1d68f;
  --tint:rgba(212,175,95,.10);
  --ok:#5cc792; --ok-bg:rgba(92,199,146,.10);
  --bad:#ef8176; --bad-bg:rgba(239,129,118,.10);
  --warn:#e8b25a; --warn-bg:rgba(232,178,90,.10);
  --side:#050a15;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.8);
  --shadow-h:0 1px 0 rgba(255,255,255,.05) inset,0 26px 50px -24px rgba(0,0,0,.9);
  --glow:rgba(241,214,143,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.6;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.08;letter-spacing:-.012em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.8em;letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}
.foil{background:linear-gradient(170deg,#f3dca0 0%,var(--gold-2) 30%,var(--gold) 62%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
:root:not([data-mode="dark"]) .panel .foil,:root:not([data-mode="dark"]) .qbig{background:linear-gradient(170deg,#c9a24f 0%,#a7822f 55%,#6e5219 100%);-webkit-background-clip:text;background-clip:text}

/* Fondo: aurora suave + grano */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 35% at 25% 20%,rgba(201,162,79,.10),transparent 70%),radial-gradient(35% 40% at 85% 75%,rgba(40,80,160,.10),transparent 70%);
  filter:blur(30px);animation:aurora 40s ease-in-out infinite alternate}
:root[data-mode="dark"] body::before{background:radial-gradient(40% 35% at 25% 20%,rgba(212,175,95,.10),transparent 70%),radial-gradient(35% 40% at 85% 75%,rgba(40,80,160,.22),transparent 70%)}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-3%,2%,0) rotate(6deg)}100%{transform:translate3d(2%,-2%,0) rotate(-5deg)}}
body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:root[data-mode="dark"] body::after{opacity:.07;mix-blend-mode:overlay}

/* Estructura de escritorio */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);color:#e9edf5;display:flex;flex-direction:column;padding:26px 18px 20px;border-right:1px solid rgba(212,175,95,.25);overflow:auto}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 50% at 0% 0%,rgba(212,175,95,.12),transparent 60%)}
.sb-brand{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.seal{position:relative;width:48px;height:48px;color:#d4af5f;display:grid;place-items:center}
.seal svg{position:absolute;inset:0}
.seal span{font-family:var(--font-display);font-size:19px;letter-spacing:.04em;background:linear-gradient(170deg,#f1d68f,#d4af5f 60%,#9c7a33);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.02;letter-spacing:-.01em}
.sb-brand small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8f9bb2;margin-top:6px;line-height:1.5}
.nav{display:grid;gap:4px;padding:22px 0;position:relative}
.nav .nav-lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6f7b93;padding:0 12px 8px}
.nav button{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;color:#aab4c7;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:500;font-size:14.5px;transition:background .2s,color .2s}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:#f1d68f;background:linear-gradient(90deg,rgba(212,175,95,.16),rgba(212,175,95,.04));box-shadow:inset 2px 0 0 #d4af5f}
.nav .badge{font-family:var(--font-mono);font-size:11px;color:#8f9bb2}
.sb-foot{margin-top:auto;display:grid;gap:14px;position:relative}
.sb-mode{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px}
.sb-mode button{border:0;background:transparent;color:#aab4c7;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center}
.sb-mode button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.sb-mode button[aria-pressed="true"]{background:#f1d68f;color:#1a1405}
.sb-note{font-size:11.5px;color:#6f7b93;line-height:1.5;padding:0 6px}
.sb-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-meta div{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.sb-meta b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1;color:#f1d68f}
.sb-meta span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8f9bb2}

.content{min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1320px;margin:0 auto;padding:34px 44px 40px;display:grid;gap:22px}
footer{width:100%;max-width:1320px;margin:0 auto;padding:16px 44px 30px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2)}

.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:26px 28px;box-shadow:var(--shadow)}
.panel.ruled{position:relative;overflow:hidden}
.panel.ruled::before{content:"";position:absolute;left:26px;right:26px;top:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-2) 50%,var(--gold) 80%,transparent);transform-origin:left}
.eyebrow,.lab,.field>label,.field>.lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.eyebrow{color:var(--gold-text)}
.lab,.field>label,.field>.lab{color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.sec-h h2{font-size:38px}
.note{font-size:13.5px;color:var(--muted);margin:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.page-h h1{font-size:46px}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:70ch}

/* Portada */
.ficha{position:relative;isolation:isolate;display:grid;grid-template-columns:1.2fr 1fr;border-radius:22px;overflow:hidden;border:1px solid rgba(212,175,95,.35);background:linear-gradient(140deg,#0a1630 0%,#10244a 55%,#0b1934 100%);color:#e9edf5;box-shadow:var(--shadow-h)}
.ficha::before{content:"";position:absolute;inset:12px;border:1px solid rgba(212,175,95,.22);border-radius:14px;pointer-events:none;z-index:1}
.guilloche{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.7;pointer-events:none}
.ficha-l,.ficha-r{position:relative;z-index:2}
.ficha-l{padding:38px 42px 32px}
.ficha .eyebrow{color:#e2c27a}
.hero-h{font-size:66px;line-height:.98;letter-spacing:-.025em;margin:14px 0 16px}
.hero-h span{display:block}
.hero-h em{font-style:italic;padding-right:.06em}
.ficha-l p{margin:0 0 20px;color:#c3cbdb;max-width:52ch;font-weight:300}
.minimo{display:flex;align-items:center;gap:16px;border-top:1px solid rgba(212,175,95,.25);padding-top:18px}
.minimo .big{font-family:var(--font-display);font-size:84px;line-height:.9;letter-spacing:-.03em}
.minimo span:last-child{font-size:14px;color:#c3cbdb}
.ficha-r{padding:34px 38px;display:grid;gap:16px;align-content:center;border-left:1px solid rgba(212,175,95,.22)}
.comp{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.comp-n{font-size:14.5px;font-weight:500}
.comp-p{font-family:var(--font-display);font-size:32px;letter-spacing:-.02em}
.comp-bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.comp-bar i{display:block;height:100%;background:linear-gradient(90deg,#9c7a33,#f1d68f);transform-origin:left}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;margin-left:6px;vertical-align:2px}
.chip.parcial{color:#f1d68f}.chip.pend{color:#8f9bb2}

.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;left:20px;top:0;width:30px;height:2px;background:var(--gold-2);transform-origin:left}
.tile b{display:block;font-family:var(--font-display);font-weight:400;font-size:50px;letter-spacing:-.03em;line-height:1}
.tile span{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.act{position:relative;overflow:hidden;isolation:isolate;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:20px;cursor:pointer;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow);transition:border-color .2s,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.act:hover{border-color:var(--gold-2);transform:translateY(-3px);box-shadow:var(--shadow-h)}
.act strong{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:-.015em;line-height:1.05}
.act span{font-size:13.5px;color:var(--muted)}
.act .k{font-family:var(--font-mono);font-size:10.5px;color:var(--gold-text);letter-spacing:.1em}
.act.featured{background:linear-gradient(155deg,#0f2347,#1a3a6e);border-color:rgba(212,175,95,.55);color:#f5f7fb}
.act.featured strong{color:#f1d68f}
.act.featured span{color:#c3cbdb}
.act.featured .k{color:#e2c27a}
.act.featured::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(241,214,143,.28) 80%,transparent 90%);animation:orbit 8s linear infinite;z-index:-1}
@keyframes orbit{to{transform:rotate(360deg)}}
.act[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}

/* Dominio */
.dom{display:grid;gap:11px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 50px;gap:14px;align-items:center;font-size:14px}
.dom-row .lbl b{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--gold-text);margin-right:10px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;transform-origin:left}
.meter::after{content:"";position:absolute;left:60%;top:-3px;bottom:-3px;width:1.5px;background:var(--gold);opacity:.8}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Configuración */
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:24px 34px}
.field{display:grid;gap:10px;align-content:start}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:10px 15px;border-radius:12px;cursor:pointer;font-size:14.5px;text-align:left;transition:border-color .15s,background .15s}
.seg button:hover:not([disabled]){border-color:var(--gold-2)}
.seg button small{display:block;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--tint);color:var(--gold-text);box-shadow:inset 0 0 0 1px var(--gold)}
.seg button[aria-pressed="true"] small{color:var(--gold-text);opacity:.8}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg .rec{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-left:6px}
.temas{display:flex;flex-wrap:wrap;gap:8px}
.temas button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.temas button b{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--gold-text);margin-right:6px}
.temas button[aria-pressed="true"]{border-color:var(--gold-2)}
.temas button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number]{width:90px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);line-height:1.55}
textarea:focus{border-color:var(--gold);outline:none}
.warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:11px 15px;font-size:13.5px}
.cfg-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line-2);padding-top:20px}
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:12px 24px;font-weight:600;cursor:pointer;font-size:14.5px;letter-spacing:.01em;transition:filter .15s,border-color .15s,transform .15s,color .15s}
.btn.primary{background:linear-gradient(170deg,#f1d68f,#d4af5f 55%,#9c7a33);color:#1a1405;box-shadow:0 10px 24px -12px rgba(167,130,47,.8)}
.btn.primary::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);transition:left .7s cubic-bezier(.2,.7,.2,1)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.primary:hover::after{left:120%}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-text)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}

/* Brillo que sigue al cursor */
.panel,.tile,.act,.opt,.clist button,.seg button{background-image:radial-gradient(420px circle at var(--mx,-500px) var(--my,-500px),var(--glow),transparent 42%)}
.act::after,.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,-500px) var(--my,-500px),rgba(201,162,79,.75),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* Sesión */
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.sess-top h2{font-size:30px}
.prog{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-3),var(--gold-2));transition:width .4s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px rgba(201,162,79,.6)}
.timer{font-family:var(--font-mono);font-size:17px;padding:6px 13px;border:1px solid var(--line);border-radius:10px;color:var(--gold-text)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:32px 38px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-weight:500}
.tag.ia{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tag.orig{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tag.gold{color:var(--gold-text);border-color:var(--line)}
.qnum{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;color:var(--muted)}
.qnum span:last-child{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.qbig{font-family:var(--font-display);font-size:64px;line-height:1;letter-spacing:-.03em;background:linear-gradient(170deg,#fff1c4,#f1d68f 30%,#d4af5f 65%,#9c7a33);-webkit-background-clip:text;background-clip:text;color:transparent}
.qtext{font-size:21px;line-height:1.5;letter-spacing:-.01em;margin:0 0 24px;max-width:74ch}
.opts{display:grid;gap:11px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;text-align:left;border:1px solid var(--line-2);background-color:var(--surface);border-radius:14px;padding:14px 18px;cursor:pointer;font-size:16px;line-height:1.5;transition:border-color .15s,background-color .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.opt:hover:not([disabled]){border-color:var(--gold-2);transform:translateX(4px)}
.opt .L{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-2);display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-size:21px;color:var(--gold-text)}
.opt[aria-pressed="true"]{border-color:var(--gold);background-color:var(--tint)}
.opt[aria-pressed="true"] .L{background:linear-gradient(170deg,#f1d68f,#d4af5f);color:var(--sel-ink);border-color:var(--gold);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.opt.ok{border-color:var(--ok);background-color:var(--ok-bg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background-color:var(--bad-bg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:22px;border-radius:16px;padding:20px 24px;border:1px solid;border-left-width:3px;animation:fbIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{transform:translateY(10px);opacity:.2;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.fb.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.fb.neu{background:var(--tint);border-color:var(--line)}
.fb h3{font-size:30px;margin-bottom:6px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}.fb.neu h3{color:var(--gold-text)}
.fb p{margin:7px 0}
.fb ul{margin:6px 0;padding-left:20px}
.src{font-size:13px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.side{display:grid;gap:14px;position:sticky;top:24px}
.side .panel{padding:20px}
.grid-n{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid-n button{aspect-ratio:1;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;padding:0}
.grid-n button.ans{background:var(--tint);border-color:var(--gold-2);color:var(--gold-text);font-weight:600}
.grid-n button.cur{outline:2px solid var(--gold);outline-offset:1px}
.grid-n button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-top:12px}
.score-live{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.score-live b{font-family:var(--font-display);font-weight:400;font-size:46px;color:var(--gold-text)}
.kbd{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.kbd kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--ink)}

/* Resultados */
.cert{isolation:isolate}
.cert .guilloche{opacity:.22}
.cert>.res-head{position:relative;z-index:1}
.res-head{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center}
.nota{width:200px;height:200px;position:relative;display:grid;place-items:center}
.nota svg{position:absolute;inset:0;transform:rotate(-90deg)}
.nota div{text-align:center}
.nota b{font-family:var(--font-display);font-weight:400;font-size:88px;letter-spacing:-.04em;line-height:1;display:block}
.nota span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.veredicto{display:inline-block;font-weight:700;letter-spacing:.18em;font-size:12.5px;padding:7px 18px;border-radius:999px;border:1px solid}
.veredicto.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-bg)}
.veredicto.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-bg)}
.res-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.res-tiles div{border:1px solid var(--line-2);border-radius:14px;padding:12px 16px;background:var(--surface-2)}
.res-tiles b{display:block;font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.1}
.res-tiles span{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
ul.recs{margin:0;padding-left:18px;display:grid;gap:9px}
ul.recs li::marker{color:var(--gold)}
.review{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rv{border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;border-left:3px solid var(--bad);background:var(--surface-2)}
.rv.okk{border-left-color:var(--ok)}
.rv.skip{border-left-color:var(--warn)}
.rv h4{margin:0 0 8px;font-size:15.5px;font-weight:600}
.rv .ans{display:grid;gap:4px;font-size:14px;margin:8px 0}
.rv .ans .y{color:var(--bad)}.rv .ans .c{color:var(--ok)}
.rv p{margin:6px 0;font-size:14px}

/* Casos */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line-2);margin-bottom:20px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 4px;margin-right:22px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--gold-text);border-bottom-color:var(--gold)}
.cases{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.clist{display:grid;gap:6px;max-height:calc(100vh - 300px);min-height:420px;overflow:auto;padding-right:4px;position:sticky;top:24px}
.clist button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line-2);background-color:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13.5px;line-height:1.4}
.clist button:hover{border-color:var(--gold-2)}
.clist button[aria-current="true"]{border-color:var(--gold);background-color:var(--tint)}
.clist .st{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--track)}
.clist .st.bien{background:var(--ok)}.clist .st.parcial{background:var(--warn)}.clist .st.mal{background:var(--bad)}
.clist small{display:block;color:var(--muted);font-size:11.5px}
.ccard{padding:30px 36px}
.ccard .ofi{font-size:36px;margin:6px 0 14px}
.selfeval{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flash{min-height:340px;display:grid;align-content:center;text-align:center;padding:44px 40px}
.flash .fq{font-family:var(--font-display);font-size:38px;line-height:1.2;max-width:32ch;margin:10px auto 0}
.flash .fa{margin:22px auto 0;max-width:64ch;font-size:17px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:20px}

/* Historial */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.pill.neu{color:var(--muted);border-color:var(--line-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}

/* Diálogo */
.overlay{position:fixed;inset:0;background:rgba(6,11,23,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:40}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:480px;width:100%;padding:30px;display:grid;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dialog h3{font-size:32px}
.dialog .row{justify-content:flex-end}
.gen{display:grid;gap:12px;justify-items:start}
.spinner{width:30px;height:30px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Entrada de cada vista (solo al cambiar de sección) */
#app.enter>*{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
#app.enter>*:nth-child(2){animation-delay:.08s}#app.enter>*:nth-child(3){animation-delay:.16s}#app.enter>*:nth-child(4){animation-delay:.24s}#app.enter>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(18px);opacity:.15;filter:blur(6px)}to{transform:none;opacity:1;filter:none}}
#app.enter .hero-h span{animation:lineUp 1s cubic-bezier(.16,1,.3,1) both}
#app.enter .hero-h span:nth-child(2){animation-delay:.12s}
@keyframes lineUp{from{transform:translateY(40%);opacity:.1;filter:blur(10px)}to{transform:none;opacity:1;filter:none}}
#app.enter .panel.ruled::before,#app.enter .tile::before{animation:hair 1.2s cubic-bezier(.16,1,.3,1) .2s both}
@keyframes hair{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.enter .comp-bar i,#app.enter .meter i{animation:bar 1.3s cubic-bezier(.16,1,.3,1) .3s both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.enter .opts .opt{animation:rise .6s cubic-bezier(.16,1,.3,1) both}
#app.enter .opts .opt:nth-child(2){animation-delay:.05s}#app.enter .opts .opt:nth-child(3){animation-delay:.1s}#app.enter .opts .opt:nth-child(4){animation-delay:.15s}
::view-transition-old(root){animation:vtOut .3s cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vtIn .5s cubic-bezier(.16,1,.3,1) both}
@keyframes vtOut{to{opacity:0;filter:blur(6px)}}
@keyframes vtIn{from{opacity:0;filter:blur(6px)}}

/* Pantallas de portátil (1280–1440 px) */
@media (max-width:1440px){
  main{padding:28px 34px 34px}
  footer{padding:14px 34px 26px}
  .hero-h{font-size:56px}
  .minimo .big{font-size:72px}
  .tile b{font-size:44px}
  .act strong{font-size:25px}
  .qbig{font-size:56px}
}
@media (max-width:1180px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .actions{grid-template-columns:repeat(3,1fr)}
  .dash{grid-template-columns:1fr}
  .qwrap{grid-template-columns:minmax(0,1fr) 250px}
  .review{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}}

/* Acceso por participante */
body.is-login .shell{grid-template-columns:1fr}
body.is-login .sidebar{display:none}
body.is-login footer{display:none}
.login{position:relative;isolation:isolate;min-height:calc(100vh - 68px);display:grid;place-items:center;border-radius:26px;overflow:hidden;background:linear-gradient(140deg,#0a1630 0%,#10244a 55%,#0b1934 100%);color:#e9edf5;border:1px solid rgba(212,175,95,.35);box-shadow:var(--shadow-h)}
.login::before{content:"";position:absolute;inset:14px;border:1px solid rgba(212,175,95,.22);border-radius:18px;pointer-events:none}
.login .guilloche{opacity:.55}
.login-in{position:relative;z-index:1;width:min(720px,90%);padding:56px 0;display:grid;justify-items:center;text-align:center;gap:14px}
.login .eyebrow{color:#e2c27a}
.login .hero-h{font-size:72px;margin:6px 0 4px}
.login p{color:#c3cbdb;max-width:52ch;margin:0 0 18px;font-weight:300}
.big-seal{width:64px;height:64px}.big-seal svg{width:64px;height:64px}.big-seal span{font-size:24px}
.who-list{display:grid;gap:10px;width:100%;max-width:560px}
.who{display:grid;grid-template-columns:48px 1fr auto 20px;gap:16px;align-items:center;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 18px 12px 12px;cursor:pointer;color:#e9edf5;transition:border-color .2s,background .2s,transform .25s cubic-bezier(.2,.8,.2,1);animation:rise .7s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*60ms + 150ms)}
.who:hover{border-color:rgba(241,214,143,.6);background:rgba(212,175,95,.08);transform:translateX(4px)}
.who .av,.sb-user .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;color:#1a1405;background:linear-gradient(170deg,#f1d68f,#d4af5f 60%,#9c7a33)}
.who-n{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em}
.who-s{font-size:12.5px;color:#8f9bb2}
.who svg{width:18px;height:18px;stroke:#d4af5f;fill:none;stroke-width:1.8}
.sb-user{display:grid;grid-template-columns:40px 1fr 32px;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.sb-user:empty{display:none}
.sb-user .av{width:40px;height:40px;font-size:17px}
.sb-user small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8f9bb2}
.sb-user b{display:block;font-weight:500;font-size:14px;color:#fff;line-height:1.3}
.sb-user button{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:transparent;cursor:pointer;display:grid;place-items:center;color:#aab4c7}
.sb-user button:hover{color:#f1d68f;border-color:rgba(241,214,143,.5)}
.sb-user button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}

</style>

<script id="bank" type="application/json">{"temas": {"A": "Estructura del Estado y ubicación de la universidad", "B": "Fundamento constitucional y prohibiciones", "C": "Servidores públicos y empleos", "D": "Ley 909: objeto, principios y campo de aplicación", "E": "Clasificación, empleos temporales y provisión", "F": "Carrera, concursos, evaluación y permanencia", "G": "Retiro, protecciones y situaciones administrativas", "H": "Ley 30: sistema de educación superior", "I": "Ley 30: universidades estatales (naturaleza, gobierno, personal, finanzas)", "J": "Régimen disciplinario (Leyes 1952 de 2019 y 2094 de 2021)", "K": "Acoso sexual y violencias de género (Ley 2365 y Ac. Sup. 10/2019)", "L": "Convivencia laboral (Res. 3461 de 2025)", "M": "Estatuto General (Ac. Sup. 16 de 2023)", "N": "Estatuto de Personal (Ac. Sup. 07 de 2026)", "O": "Política de Integridad y Buen Gobierno"}, "preguntas": [{"id": "M1-001", "comp": "M1", "tema": "A", "nivel": "B", "tipo": "Conceptual", "q": "Según el artículo 113 de la Constitución, además de las tres ramas del poder público existen:", "o": ["Únicamente los organismos de control fiscal.", "Las empresas industriales y comerciales del Estado, como órganos independientes.", "Los entes territoriales, como cuarta rama del poder.", "Órganos de control, organización electoral y órganos autónomos e independientes para las demás funciones del Estado."], "k": 3, "e": "El art. 113 reconoce tres ramas y, por fuera de ellas, órganos de control, electorales y autónomos e independientes. A es incompleta; C y B describen entidades que hacen parte de la Rama Ejecutiva (C909 P3).", "f": "C909 P1; PPT d.10.", "n": "", "src": "propia"}, {"id": "M1-002", "comp": "M1", "tema": "A", "nivel": "B", "tipo": "Normativa", "q": "¿Qué naturaleza jurídica asigna el artículo 57 de la Ley 30 de 1992 a las universidades estatales u oficiales?", "o": ["Establecimientos públicos del orden nacional, departamental o municipal.", "Empresas sociales del Estado vinculadas al MEN.", "Entes universitarios autónomos con régimen especial, vinculados al MEN en lo referente a políticas y planeación del sector.", "Unidades administrativas especiales con personería jurídica."], "k": 2, "e": "Art. 57. A corresponde a las instituciones estatales que no son universidades (art. 57 par.); B y D son figuras de la Rama Ejecutiva.", "f": "C30 P31; PPT d.11.", "n": "", "src": "propia"}, {"id": "M1-003", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Diferencias", "q": "Las instituciones estatales de educación superior que NO tienen carácter de universidad deben organizarse como:", "o": ["Establecimientos públicos del orden nacional, departamental, distrital o municipal.", "Entes universitarios autónomos.", "Corporaciones o fundaciones sin ánimo de lucro.", "Instituciones de economía solidaria."], "k": 0, "e": "Parágrafo del art. 57. B es exclusivo de las universidades estatales; C y D son formas de las IES privadas (art. 98).", "f": "C30 P31; PPT d.31; C909 P9.", "n": "", "src": "propia"}, {"id": "M1-004", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Caso", "q": "Un compañero de la Oficina de Planeación afirma que, como la Universidad del Magdalena recibe orientaciones del Ministerio de Educación, pertenece a la Rama Ejecutiva y está bajo su control de tutela. ¿Cuál es la respuesta correcta?", "o": ["Tiene razón: toda entidad que recibe aportes de la Nación está sometida a tutela.", "Tiene razón parcialmente: está sometida a tutela solo en materia presupuestal.", "No tiene razón, porque la universidad no está sometida a ningún tipo de control del Estado.", "No tiene razón: es un ente universitario autónomo, no hace parte de la Rama Ejecutiva y su vínculo con el MEN se limita a las políticas y la planeación del sector."], "k": 3, "e": "Art. 57; C-589/97; C-220/97. A y B contradicen la prohibición de tutela administrativa y presupuestal (PPT d.11); C es falsa porque subsisten la inspección y vigilancia y el control fiscal (C-220/97; PPT d.32).", "f": "C909 Ej. 1 caso 1; C909 P9.", "n": "", "src": "propia"}, {"id": "M1-005", "comp": "M1", "tema": "A", "nivel": "B", "tipo": "Jurisprudencia", "q": "En la sentencia C-589 de 1997, la Corte Constitucional equiparó a las universidades estatales con:", "o": ["Los establecimientos públicos del sector descentralizado.", "Las entidades territoriales.", "Las superintendencias con personería jurídica.", "Órganos autónomos como el Banco de la República."], "k": 3, "e": "La Corte dijo que no son establecimientos públicos ni están supeditadas al Ejecutivo, y las equiparó a órganos autónomos como el Banco de la República.", "f": "C909 P1, P8; PPT d.7, d.11.", "n": "", "src": "propia"}, {"id": "M1-006", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Diferencias", "q": "Una entidad nacional asigna a su dirección regional la decisión de ciertos trámites en su territorio, y la regional sigue siendo parte de la misma entidad. Esta figura es:", "o": ["Delegación.", "Descentralización por servicios.", "Desconcentración.", "Descentralización territorial."], "k": 2, "e": "En la desconcentración las funciones pasan a dependencias de la misma entidad, sin personería ni patrimonio propio y sin romper la jerarquía. A exige transferir el ejercicio a otra autoridad mediante acto escrito; B y D trasladan funciones a otra persona jurídica.", "f": "C909 P5.", "n": "", "src": "propia"}, {"id": "M1-007", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Caso", "q": "El rector autoriza al secretario general para firmar en su nombre las certificaciones laborales. Un compañero dice que desde ese momento el rector ya no puede intervenir. Según la C-727 de 2000:", "o": ["El compañero tiene razón, porque hubo una delegación de funciones que trasladó la competencia.", "Es una desconcentración, porque la función pasó a otra dependencia.", "Es una descentralización, porque el secretario general adquiere autonomía.", "Es una delegación de firma: no hay traslado de competencias y el rector sigue siendo el titular."], "k": 3, "e": "En la delegación de firma no se transfiere la competencia; quien firma no adquiere funciones propias.", "f": "C909 P5, P10; C909 Ej. 1 caso 2.", "n": "", "src": "propia"}, {"id": "M1-008", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Conceptual", "q": "¿Cuál de las siguientes afirmaciones sobre la delegación de funciones es CORRECTA?", "o": ["Requiere autorización legal previa y acto escrito; el delegante conserva la titularidad y puede reasumir la función y revisar los actos del delegatario.", "Puede hacerse verbalmente cuando hay urgencia del servicio.", "Una vez hecha, el delegante pierde definitivamente la función.", "Solo procede entre entidades con personería jurídica distinta."], "k": 0, "e": "C.P. art. 211; C-561/99. B omite el acto escrito; C es contraria a la posibilidad de reasumir; D confunde con la descentralización (la delegación opera, en principio, entre órganos o cargos, C-727/00).", "f": "C909 P5.", "n": "", "src": "propia"}, {"id": "M1-009", "comp": "M1", "tema": "A", "nivel": "A", "tipo": "Análisis", "q": "¿En cuál de estas figuras la entidad central pierde la gestión directa de la función, pero conserva el control de tutela?", "o": ["Desconcentración.", "Descentralización.", "Delegación de firma.", "Delegación de funciones."], "k": 1, "e": "\"Pregunta típica\" de la cartilla: en la descentralización se pierde la gestión directa (no la tutela); en la desconcentración no se pierde nada frente a la entidad; en la delegación el delegante conserva la titularidad y puede recuperar el ejercicio.", "f": "C909 P5.", "n": "", "src": "propia"}, {"id": "M1-010", "comp": "M1", "tema": "A", "nivel": "B", "tipo": "Conceptual", "q": "¿Cuál de estas entidades pertenece al sector central de la Rama Ejecutiva del orden nacional?", "o": ["Un establecimiento público como el SENA.", "Una empresa industrial y comercial del Estado.", "Una empresa social del Estado.", "Un ministerio."], "k": 3, "e": "El sector central incluye ministerios y departamentos administrativos; A, B y C pertenecen al sector descentralizado.", "f": "C909 P3–P4.", "n": "", "src": "propia"}, {"id": "M1-011", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Conceptual", "q": "¿Qué criterio práctico señala la cartilla para identificar a una entidad descentralizada?", "o": ["Carece de personería jurídica y actúa a nombre de la Nación.", "Tiene personería jurídica, patrimonio propio y autonomía administrativa, y está sujeta al control de tutela.", "No está sujeta a ningún control del sector al que pertenece.", "Hace parte de la Rama Judicial."], "k": 1, "e": "A describe a un ministerio (sector central); C desconoce la tutela; D es incorrecta.", "f": "C909 P4.", "n": "", "src": "propia"}, {"id": "M1-012", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Normativa", "q": "¿Quién tiene la competencia para crear un nuevo ministerio?", "o": ["El Presidente de la República, mediante decreto ordinario.", "El Congreso de la República.", "El Ministro del Interior.", "La Comisión Nacional del Servicio Civil."], "k": 1, "e": "El Congreso determina la estructura de la administración nacional y crea ministerios; el Presidente puede suprimir o fusionar entidades conforme a la ley, pero no crear un ministerio.", "f": "C909 P7.", "n": "", "src": "propia"}, {"id": "M1-013", "comp": "M1", "tema": "A", "nivel": "B", "tipo": "Normativa", "q": "Según el artículo 130 de la Constitución, la Comisión Nacional del Servicio Civil:", "o": ["Administra y vigila las carreras de los servidores públicos, excepto las que tengan carácter especial.", "Formula las políticas de empleo público de la Rama Ejecutiva.", "Vigila la gestión fiscal de quienes manejan fondos públicos.", "Administra la carrera administrativa de las universidades estatales."], "k": 0, "e": "B corresponde al DAFP (PPT d.17); C a la Contraloría; D es falsa: la CNSC no administra la carrera de los entes universitarios autónomos (C-746/99; C-560/00).", "f": "C909 P8, P16.", "n": "", "src": "propia"}, {"id": "M1-014", "comp": "M1", "tema": "A", "nivel": "A", "tipo": "Identificar la incorrecta", "q": "¿Cuál de las siguientes afirmaciones sobre la autonomía universitaria es INCORRECTA?", "o": ["Se ejerce \"de acuerdo con la ley\".", "El Estado conserva la suprema inspección y vigilancia de la educación.", "Es una garantía institucional que sustrae a la universidad de todo control del Estado.", "El legislador no puede vaciarla de contenido."], "k": 2, "e": "La autonomía es una garantía institucional, pero no sustrae a la universidad del orden jurídico ni del control del Estado (C-337/96; C-589/97). A, B y D son correctas.", "f": "C30 P2; PPT d.32–33.", "n": "", "src": "propia"}, {"id": "M1-015", "comp": "M1", "tema": "A", "nivel": "I", "tipo": "Relación de conceptos", "q": "La PPT resume la autonomía universitaria del art. 69 en dos libertades clave. ¿Cuáles son?", "o": ["Autodirigirse (designar sus directivas) y autorregularse (regirse por sus propios estatutos).", "Fijar sus tributos y participar en las rentas nacionales.", "Crear sus propias leyes y nombrar a sus jueces.", "Definir su presupuesto sin control fiscal y elegir a su contralor."], "k": 0, "e": "PPT d.12. B describe la autonomía de las entidades territoriales (C.P. art. 287); C y D son ajenas a la autonomía universitaria (que no excluye el control fiscal, C-220/97).", "f": "PPT d.12; C30 P1.", "n": "", "src": "propia"}, {"id": "M1-016", "comp": "M1", "tema": "B", "nivel": "B", "tipo": "Normativa", "q": "¿Qué artículo de la Constitución garantiza la autonomía universitaria?", "o": ["Artículo 67.", "Artículo 125.", "Artículo 69.", "Artículo 209."], "k": 2, "e": "El 67 define la educación como derecho y servicio público; el 125 regula la carrera; el 209 los principios de la función administrativa.", "f": "C30 P1; C909 cuestionario 20.", "n": "", "src": "propia"}, {"id": "M1-017", "comp": "M1", "tema": "B", "nivel": "I", "tipo": "Normativa", "q": "El artículo 122 de la Constitución establece que:", "o": ["Los empleos en los órganos y entidades del Estado son de carrera.", "Los servidores no pueden nombrar parientes hasta el cuarto grado de consanguinidad.", "Los servidores públicos son los miembros de corporaciones públicas, empleados y trabajadores del Estado.", "No habrá empleo público sin funciones detalladas en la ley o el reglamento y, si es remunerado, debe estar en la planta y tener apropiación presupuestal."], "k": 3, "e": "A es el art. 125; B el art. 126; C el art. 123.", "f": "C909 P10; PPT d.15.", "n": "", "src": "propia"}, {"id": "M1-018", "comp": "M1", "tema": "B", "nivel": "A", "tipo": "Caso", "q": "Un jefe le pide a un auxiliar administrativo que ordene un gasto de la universidad \"para adelantar trabajo\", aunque ninguna norma le asigna esa función. ¿Qué reglas se lo impiden?", "o": ["Ninguna, si el jefe lo autoriza verbalmente.", "La legalidad de la competencia (art. 121), las funciones detalladas del empleo (art. 122) y la responsabilidad por extralimitación (art. 6).", "Únicamente el reglamento estudiantil.", "Ninguna, porque la autonomía universitaria (art. 69) permite redistribuir funciones libremente."], "k": 1, "e": "Ninguna autoridad puede ejercer funciones distintas de las que le atribuyen la Constitución y la ley; para delegar la ordenación del gasto se requiere acto escrito y norma que lo autorice. En la universidad, el estatuto general y el manual de funciones cumplen el papel de reglamento.", "f": "C909 P10; C909 Ej. 1 caso 4.", "n": "", "src": "propia"}, {"id": "M1-019", "comp": "M1", "tema": "B", "nivel": "I", "tipo": "Caso", "q": "Un jefe con facultad nominadora quiere nombrar a su cuñado en un empleo de su dependencia. ¿Qué responde?", "o": ["Puede hacerlo si el cuñado cumple los requisitos del cargo.", "Puede hacerlo si el cargo es de libre nombramiento y remoción.", "No puede: el art. 126 prohíbe nombrar parientes hasta el segundo grado de afinidad, y el cuñado está en ese grado.", "No puede, porque el cuñado es pariente en primer grado civil."], "k": 2, "e": "Art. 126: hasta el 4.º de consanguinidad, 2.º de afinidad o 1.º civil, cónyuge o compañero permanente. El cuñado es 2.º de afinidad (ejemplo de la cartilla). D da la razón equivocada.", "f": "C909 P17.", "n": "", "src": "propia"}, {"id": "M1-020", "comp": "M1", "tema": "B", "nivel": "B", "tipo": "Normativa", "q": "Según el artículo 128 de la Constitución:", "o": ["Nadie podrá desempeñar simultáneamente más de un empleo público ni recibir más de una asignación del tesoro público, salvo los casos expresamente determinados por la ley.", "Los servidores pueden recibir hasta dos asignaciones del tesoro público sin restricción.", "Los empleados de carrera pueden ocupar dos empleos si ambos son de medio tiempo.", "La prohibición de doble asignación solo aplica a los empleados de libre nombramiento."], "k": 0, "e": "Prohibición de doble asignación, con excepciones legales expresas.", "f": "C909 P17.", "n": "", "src": "propia"}, {"id": "M1-021", "comp": "M1", "tema": "B", "nivel": "B", "tipo": "Normativa", "q": "De acuerdo con el artículo 125 de la Constitución, ¿qué factor en ningún caso puede determinar el nombramiento, el ascenso o la remoción de un empleado de carrera?", "o": ["La calificación del desempeño.", "El cumplimiento de los requisitos del cargo.", "El resultado del concurso.", "La filiación política."], "k": 3, "e": "A, B y C son criterios legítimos de mérito o retiro.", "f": "C909 P14; C909 P2.", "n": "", "src": "propia"}, {"id": "M1-022", "comp": "M1", "tema": "B", "nivel": "I", "tipo": "Diferencias", "q": "Según la cartilla de la Ley 909, ¿cuál es la lista de principios de la función administrativa consagrada en el artículo 209 de la Constitución?", "o": ["Mérito, accesibilidad universal y transparencia.", "Igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y publicidad.", "Autonomía, autorregulación y autogobierno.", "Profesionalización, flexibilidad y responsabilidad."], "k": 1, "e": "A son los que agrega la Ley 909 (art. 2, mod. Ley 2418/2024); C es contenido de la autonomía universitaria; D son los criterios del art. 2, num. 3 de la Ley 909.", "f": "C909 P2, P21, P22.", "n": "Nota: la PPT d.18 incluye \"transparencia\" en la lista del art. 209; ver contradicción n.º 1 del análisis.", "src": "propia"}, {"id": "M1-023", "comp": "M1", "tema": "B", "nivel": "I", "tipo": "Normativa", "q": "Constitucionalmente, ¿a quién corresponde la inspección y vigilancia de la educación y en quién puede delegarse?", "o": ["Al Congreso; delegable en el CESU.", "Al Consejo Superior de cada universidad; indelegable.", "Al Presidente de la República; delegable en el Ministro de Educación Nacional.", "Al ICFES; delegable en las gobernaciones."], "k": 2, "e": "C.P. arts. 189 y 211; Ley 30 arts. 31 y 33 (la ejerce el Gobierno Nacional con asesoría del CESU).", "f": "C30 P6, P26; C30 Ej. 1 caso 3.", "n": "", "src": "propia"}, {"id": "M1-024", "comp": "M1", "tema": "B", "nivel": "B", "tipo": "Conceptual", "q": "El artículo 67 de la Constitución define la educación como:", "o": ["Un servicio privado sujeto a libre mercado.", "Un derecho de la persona y un servicio público que tiene una función social.", "Una función exclusiva del Estado.", "Un servicio público cultural reservado a las universidades estatales."], "k": 1, "e": "El Estado, la sociedad y la familia son responsables, y el Estado ejerce su suprema inspección y vigilancia. D mezcla la definición de la Ley 30 (servicio público cultural) con una restricción inexistente.", "f": "C30 P3.", "n": "", "src": "propia"}, {"id": "M1-025", "comp": "M1", "tema": "B", "nivel": "I", "tipo": "Normativa", "q": "¿Qué condición exige la Ley 30 a las instituciones de educación superior privadas?", "o": ["Ser sociedades comerciales con ánimo de lucro.", "Ser establecimientos públicos.", "Ser personas jurídicas de utilidad común y sin ánimo de lucro, organizadas como corporaciones, fundaciones o instituciones de economía solidaria.", "Estar adscritas a una universidad estatal."], "k": 2, "e": "Arts. 96 a 98; la ley prohíbe el ánimo de lucro.", "f": "C30 P4, P21; PPT d.29–30.", "n": "", "src": "propia"}, {"id": "M1-026", "comp": "M1", "tema": "C", "nivel": "B", "tipo": "Conceptual", "q": "¿Cuántas clases de servidores públicos distingue el artículo 123 de la Constitución y cuáles son?", "o": ["Dos: empleados públicos y contratistas.", "Cuatro: empleados de carrera, de libre nombramiento, temporales y provisionales.", "Tres: empleados públicos, trabajadores oficiales y contratistas.", "Tres: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales."], "k": 3, "e": "Los contratistas no son servidores públicos (A y C); B mezcla tipos de empleo y formas de provisión.", "f": "C909 P11; PPT d.19.", "n": "", "src": "propia"}, {"id": "M1-027", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Diferencias", "q": "¿Qué diferencia al empleado público del trabajador oficial?", "o": ["El empleado público se vincula por relación legal y reglamentaria (nombramiento y posesión); el trabajador oficial, por contrato de trabajo.", "El trabajador oficial siempre es de carrera y el empleado público nunca.", "El empleado público se vincula por contrato de prestación de servicios.", "No hay diferencia: ambos se rigen íntegramente por la Ley 909."], "k": 0, "e": "Los cargos de trabajadores oficiales no son de carrera (C-484/95; C-283/02).", "f": "C909 P13; PPT d.21.", "n": "", "src": "propia"}, {"id": "M1-028", "comp": "M1", "tema": "C", "nivel": "A", "tipo": "Caso", "q": "Una persona contratada por prestación de servicios para apoyar la oficina de talento humano recibe órdenes diarias, cumple el horario de la planta y lleva años en la misma actividad permanente. Según la C-154 de 1997:", "o": ["Sigue siendo contratista, porque la forma del contrato prevalece.", "Se convierte automáticamente en empleado de carrera.", "Si se acreditan los elementos de una relación laboral subordinada, prevalece la realidad sobre las formas y puede reclamar los derechos laborales ante la jurisdicción.", "Debe ser declarada insubsistente por acto no motivado."], "k": 2, "e": "La subordinación es el elemento que separa ambos contratos. B es falsa: nadie ingresa a carrera sin concurso (C-588/09).", "f": "C909 P13; C909 Ej. 1 caso 3.", "n": "", "src": "propia"}, {"id": "M1-029", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Conceptual", "q": "¿Cuál es el elemento que distingue el contrato de prestación de servicios del contrato de trabajo?", "o": ["El valor de los honorarios.", "La duración del contrato.", "La subordinación.", "El nivel académico del contratista."], "k": 2, "e": "C-154/97: la subordinación es el elemento diferenciador; la autonomía técnica es esencial al contrato de prestación de servicios.", "f": "C909 P13; C909 cuestionario 12.", "n": "", "src": "propia"}, {"id": "M1-030", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Diferencias", "q": "Según la presentación, el encargo y el nombramiento provisional son:", "o": ["Tipos de empleo público, como la carrera y el período fijo.", "Modalidades del empleo temporal.", "Formas de vinculación de los trabajadores oficiales.", "Mecanismos temporales para proveer vacantes, no tipos de empleo."], "k": 3, "e": "\"Importante: encargo y nombramiento provisional NO son tipos de empleo\".", "f": "PPT d.20–21; C909 P15.", "n": "", "src": "propia"}, {"id": "M1-031", "comp": "M1", "tema": "C", "nivel": "B", "tipo": "Conceptual", "q": "¿Cuáles son las clases de empleos públicos que menciona el artículo 1 de la Ley 909?", "o": ["Carrera, libre nombramiento y remoción, período fijo y temporales.", "Carrera, provisionales, encargados y comisionados.", "Elección popular, trabajadores oficiales, contratistas y carrera.", "Directivos, asesores, profesionales y técnicos."], "k": 0, "e": "B mezcla formas de provisión y situaciones; C incluye a quienes se rigen por otras normas o no son servidores; D son niveles jerárquicos.", "f": "C909 P20.", "n": "", "src": "propia"}, {"id": "M1-032", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Diferencias", "q": "¿Qué tipo de estabilidad tiene cada uno, según la cartilla de la Ley 909?", "o": ["Carrera: mínima; LNyR: reforzada; provisional: ninguna.", "Carrera: intermedia; LNyR: reforzada; provisional: mínima.", "Todos tienen la misma estabilidad por ser empleados públicos.", "Carrera: reforzada; LNyR: mínima; provisional: intermedia."], "k": 3, "e": "La de carrera se refuerza por el mérito; la del LNyR es mínima (retiro discrecional); la del provisional, intermedia (acto motivado; cede ante el ganador).", "f": "C909 P12.", "n": "", "src": "propia"}, {"id": "M1-033", "comp": "M1", "tema": "C", "nivel": "B", "tipo": "Normativa", "q": "¿Cuánto dura el período de prueba de quien ingresa a un empleo de carrera sin estar previamente en carrera?", "o": ["Tres meses.", "Un año.", "Seis meses.", "Doce meses prorrogables."], "k": 2, "e": "", "f": "PPT d.20; C909 P15.", "n": "", "src": "propia"}, {"id": "M1-034", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Normativa", "q": "Los profesores de dedicación exclusiva, tiempo completo y medio tiempo de una universidad estatal son:", "o": ["Trabajadores oficiales.", "Empleados públicos de libre nombramiento y remoción.", "Contratistas por períodos académicos.", "Empleados públicos amparados por el régimen especial, que no son de libre nombramiento y remoción, salvo durante el período de prueba."], "k": 3, "e": "Ley 30, art. 72.", "f": "C30 P41; PPT d.22, d.36; C909 P11.", "n": "", "src": "propia"}, {"id": "M1-035", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Normativa", "q": "¿Cómo se vinculan los profesores de cátedra según el artículo 73 de la Ley 30?", "o": ["Por nombramiento en período de prueba.", "Por resolución, por un término inferior a un año.", "Por contrato de trabajo a término indefinido.", "Por contrato de prestación de servicios celebrado por períodos académicos, que requiere registro presupuestal."], "k": 3, "e": "B describe a los ocasionales (art. 74).", "f": "C30 P41; PPT d.21.", "n": "", "src": "propia"}, {"id": "M1-036", "comp": "M1", "tema": "C", "nivel": "A", "tipo": "Jurisprudencia", "q": "¿Qué decidió la Corte en la sentencia C-006 de 1996 sobre los profesores de cátedra y ocasionales?", "o": ["Que son empleados de carrera.", "Que no tienen derecho a prestaciones por ser contratistas.", "Que tienen una relación subordinada y derecho a prestaciones sociales proporcionales al tiempo servido, por primacía de la realidad.", "Que solo tienen derecho a seguridad social en salud."], "k": 2, "e": "Declaró inexequibles los apartes del art. 74 (y por unidad normativa del 73) que les negaban el régimen prestacional y calificaban a los de cátedra como contratistas.", "f": "C30 P42.", "n": "", "src": "propia"}, {"id": "M1-037", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Normativa", "q": "Los profesores ocasionales, según la Ley 30, son:", "o": ["Los de tiempo completo o medio tiempo requeridos transitoriamente por un período inferior a un año, cuyos servicios se reconocen mediante resolución.", "Los vinculados por contrato de prestación de servicios por semestre.", "Los de dedicación exclusiva en período de prueba.", "Los profesores visitantes de otras universidades."], "k": 0, "e": "Art. 74.", "f": "C30 P41; PPT d.21.", "n": "", "src": "propia"}, {"id": "M1-038", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Relación de conceptos", "q": "Según la presentación, ¿cuál es la función de los artículos 123 y 125 de la Constitución?", "o": ["El 123 clasifica el cargo y el 125 identifica a la persona.", "Ambos regulan la autonomía universitaria.", "El 123 regula los contratistas y el 125 los trabajadores oficiales.", "El 123 identifica a la persona como servidor público y el 125 clasifica el cargo como de carrera o de excepción."], "k": 3, "e": "\"CLAVE: servidor público (art. 123) identifica a la persona; empleo de carrera o excepción (art. 125) clasifica el cargo.\" A invierte la relación.", "f": "PPT d.19.", "n": "", "src": "propia"}, {"id": "M1-039", "comp": "M1", "tema": "C", "nivel": "I", "tipo": "Identificar la incorrecta", "q": "¿Cuál de los siguientes NO es una excepción a la carrera prevista en el artículo 125 de la Constitución?", "o": ["Empleos de elección popular.", "Empleos de libre nombramiento y remoción.", "Empleos del nivel técnico de la planta permanente.", "Trabajadores oficiales."], "k": 2, "e": "Los empleos técnicos de planta son de carrera (regla general). El art. 125 exceptúa elección popular, LNyR, trabajadores oficiales y los demás que determine la ley.", "f": "C909 P14; PPT d.19.", "n": "", "src": "propia"}, {"id": "M1-040", "comp": "M1", "tema": "C", "nivel": "A", "tipo": "Jurisprudencia", "q": "Según la sentencia C-1019 de 2012, los miembros del Consejo Superior de una universidad estatal:", "o": ["No son servidores públicos por el solo hecho de integrarlo; esa calidad depende del cargo que ocupen.", "Son siempre empleados públicos de libre nombramiento y remoción.", "Son trabajadores oficiales de la universidad.", "Son servidores públicos de período fijo por mandato del art. 64 de la Ley 30."], "k": 0, "e": "", "f": "C909 P11.", "n": "", "src": "propia"}, {"id": "M1-041", "comp": "M1", "tema": "D", "nivel": "B", "tipo": "Normativa", "q": "¿Cuál es el objeto de la Ley 909 de 2004?", "o": ["Organizar el servicio público de la educación superior.", "Regular el sistema de empleo público y establecer los principios básicos del ejercicio de la gerencia pública.", "Regular la contratación estatal.", "Fijar el régimen disciplinario de los servidores públicos."], "k": 1, "e": "A es el objeto de la Ley 30.", "f": "C909 P19.", "n": "", "src": "propia"}, {"id": "M1-042", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Normativa", "q": "¿Qué principios agrega la Ley 909 (art. 2, modificado por la Ley 2418 de 2024) a los de la función administrativa del art. 209?", "o": ["Mérito, accesibilidad universal y transparencia.", "Autonomía, autogobierno y autorregulación.", "Descentralización, delegación y desconcentración.", "Publicidad, celeridad y economía."], "k": 0, "e": "D ya están en el art. 209; C son instrumentos (no principios); B corresponde a la autonomía universitaria.", "f": "C909 P2, P21.", "n": "", "src": "propia"}, {"id": "M1-043", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Conceptual", "q": "¿Cuáles son los tres criterios básicos que orientan la Ley 909 (art. 2, num. 3)?", "o": ["Igualdad, mérito y publicidad.", "Descentralización, delegación y desconcentración.", "Profesionalización de los recursos humanos; flexibilidad en la organización sin detrimento de la estabilidad; responsabilidad de los servidores por el trabajo desarrollado.", "Autonomía, eficiencia y control de tutela."], "k": 2, "e": "La responsabilidad se concreta en la evaluación del desempeño y los acuerdos de gestión.", "f": "C909 P22.", "n": "", "src": "propia"}, {"id": "M1-044", "comp": "M1", "tema": "D", "nivel": "B", "tipo": "Normativa", "q": "¿Qué disposición de la Ley 909 establece su aplicación supletoria a los entes universitarios autónomos?", "o": ["Artículo 5.", "Artículo 41.", "Artículo 3, numeral 2.", "Artículo 46."], "k": 2, "e": "El art. 5 trata la clasificación de empleos; el 41, el retiro; el 46, las reformas de planta.", "f": "C909 P24; PPT d.15, d.22.", "n": "", "src": "propia"}, {"id": "M1-045", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Diferencias", "q": "La Ley 909 se aplica en su INTEGRIDAD al personal administrativo de:", "o": ["Las universidades estatales organizadas como entes universitarios autónomos.", "Las instituciones de educación superior que no estén organizadas como entes universitarios autónomos.", "La Rama Judicial.", "La Fiscalía General de la Nación."], "k": 1, "e": "Art. 3, num. 1. A, C y D están entre las carreras especiales, donde la ley es supletoria (art. 3, num. 2).", "f": "C909 P23–P24.", "n": "", "src": "propia"}, {"id": "M1-046", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Caso", "q": "El estatuto del personal administrativo de una universidad estatal regula el encargo con una regla distinta a la del artículo 24 de la Ley 909. ¿Qué norma se aplica?", "o": ["La Ley 909, porque es ley y prevalece sobre un estatuto.", "El estatuto de la universidad, porque la Ley 909 solo llena los vacíos.", "Ambas a la vez, eligiendo la más favorable al empleado.", "Ninguna: debe consultarse a la CNSC."], "k": 1, "e": "\"Si el estatuto sí lo regula, aplica el estatuto aunque su regla sea distinta a la de la Ley 909.\" Si no lo regulara, se aplicaría el art. 24.", "f": "C909 P24 (ejemplo); PPT d.16.", "n": "", "src": "propia"}, {"id": "M1-047", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Normativa", "q": "¿Qué es la aplicación \"supletoria\" de la Ley 909?", "o": ["Que la Ley 909 prevalece y el estatuto solo la complementa.", "Que la Ley 909 se aplica solo a los concursos de ascenso.", "Que la Ley 909 no se aplica en ningún caso.", "Que primero se aplica la norma propia y la Ley 909 solo llena los vacíos."], "k": 3, "e": "C-175/06.", "f": "C909 P24; C909 simulacro 2.", "n": "", "src": "propia"}, {"id": "M1-048", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Diferencias", "q": "Un empleado del Inpec pertenece a una carrera:", "o": ["General, administrada por la CNSC.", "Especial de origen constitucional, fuera de la competencia de la CNSC.", "Específica de origen legal, cuya vigilancia corresponde a la CNSC.", "Universitaria, administrada por su consejo superior."], "k": 2, "e": "El Inpec está entre los sistemas específicos del art. 4 (como la DIAN).", "f": "C909 P25–P26.", "n": "", "src": "propia"}, {"id": "M1-049", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Identificar la incorrecta", "q": "¿Cuál de las siguientes NO es una carrera especial de origen constitucional?", "o": ["La de la DIAN.", "La de la Rama Judicial.", "La de la Procuraduría General de la Nación.", "La de las universidades estatales."], "k": 0, "e": "La DIAN tiene un sistema específico de carrera, de origen legal (art. 4; C-172/21).", "f": "C909 P25–P26; C-746/99.", "n": "", "src": "propia"}, {"id": "M1-050", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Normativa", "q": "¿Quién administra la carrera del personal administrativo de una universidad estatal organizada como ente autónomo y quién la vigila?", "o": ["La CNSC administra y vigila.", "El DAFP administra y la CNSC vigila.", "La universidad, conforme a su estatuto; la vigilancia corresponde al Consejo Superior.", "El Ministerio de Educación administra y la Procuraduría vigila."], "k": 2, "e": "C-746/99; C-560/00; Concepto CE 1906/2008 (Ley 30 art. 65 lit. c).", "f": "C909 P16; C909 cuestionario 6; PPT d.23.", "n": "", "src": "propia"}, {"id": "M1-051", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Caso", "q": "Una aspirante pregunta si el concurso para un cargo administrativo de la Universidad del Magdalena lo convoca la CNSC. ¿Qué es correcto responder?", "o": ["Sí, porque la CNSC administra todas las carreras sin excepción.", "Sí, pero solo para los cargos del nivel profesional.", "No; lo convoca el Ministerio de Educación.", "No; la universidad es un ente universitario autónomo, el concurso se rige por el estatuto del personal administrativo y la convocatoria expedida conforme a este, y la Ley 909 llena los vacíos."], "k": 3, "e": "", "f": "C909 P18 (ejemplo); C909 P16.", "n": "", "src": "propia"}, {"id": "M1-052", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Caso", "q": "El rector estudia reformar la planta administrativa y el jefe de planeación pregunta si debe pedir aprobación del DAFP (art. 46 de la Ley 909). ¿Qué responde?", "o": ["No: el art. 46 se refiere a la Rama Ejecutiva y, según el Concepto DAFP 066291 de 2021, no aplica a los entes universitarios autónomos; la reforma se rige por el estatuto y el Consejo Superior.", "Sí, toda reforma de planta del Estado requiere aprobación del DAFP.", "Sí, porque la Ley 909 se aplica íntegramente a la universidad.", "No, porque las universidades no necesitan motivar ni sustentar técnicamente sus reformas de planta."], "k": 0, "e": "D es incorrecta: la cartilla precisa que la reforma igual debe motivarse, fundarse en necesidades del servicio y apoyarse en estudios técnicos.", "f": "C909 P53; C909 caso C.", "n": "", "src": "propia"}, {"id": "M1-053", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Normativa", "q": "Según el Concepto 1906 de 2008 del Consejo de Estado, citado en la presentación, la Ley 909 frente al estatuto universitario:", "o": ["Deroga las normas especiales del Consejo Superior.", "Integra el ordenamiento, pero cede ante las normas especiales expedidas por el Consejo Superior.", "No hace parte del ordenamiento aplicable a las universidades.", "Solo se aplica si la CNSC lo autoriza."], "k": 1, "e": "", "f": "PPT d.16; C909 P16.", "n": "", "src": "propia"}, {"id": "M1-054", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Relación de conceptos", "q": "Según la presentación, la carrera especial universitaria tiene origen constitucional en:", "o": ["Los artículos 69 y 130 de la Constitución.", "El artículo 125 únicamente.", "Los artículos 189 y 211.", "El artículo 209."], "k": 0, "e": "La carrera general tiene origen en el art. 125; la especial universitaria en los arts. 69 (autonomía) y 130 (excepción de las carreras especiales).", "f": "PPT d.23.", "n": "", "src": "propia"}, {"id": "M1-055", "comp": "M1", "tema": "D", "nivel": "A", "tipo": "Identificar la incorrecta", "q": "Sobre la articulación entre el estatuto universitario y la Ley 909, ¿cuál afirmación es INCORRECTA?", "o": ["Prevalece el estatuto del personal administrativo adoptado por la universidad (Ley 30, art. 79).", "Si el estatuto guarda silencio sobre una figura, como el encargo, se aplica la Ley 909.", "La autonomía universitaria excluye de forma absoluta la Ley 909.", "El estatuto y la Ley 909 deben respetar el mérito (art. 125) y el debido proceso."], "k": 2, "e": "La relación no es de exclusión, sino de supletoriedad o complementariedad.", "f": "PPT d.16.", "n": "", "src": "propia"}, {"id": "M1-056", "comp": "M1", "tema": "D", "nivel": "I", "tipo": "Normativa", "q": "La gerencia pública de la Ley 909 (arts. 47 a 50) está diseñada para:", "o": ["Los empleos directivos de la Rama Ejecutiva nacional y territorial.", "Los rectores de las universidades estatales.", "Los empleos del nivel técnico.", "Los trabajadores oficiales."], "k": 0, "e": "La cartilla lee que no está pensada para la universidad, que no pertenece a la Rama Ejecutiva.", "f": "C909 P27.", "n": "", "src": "propia"}, {"id": "M1-057", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Identificar la incorrecta", "q": "¿Cuál de los siguientes NO es un criterio del artículo 5 de la Ley 909 para que un empleo sea de libre nombramiento y remoción?", "o": ["Dirección, conducción y orientación institucionales.", "Especial confianza, al servicio directo de ciertos funcionarios.", "Administración y manejo directo de bienes, dineros o valores del Estado.", "La antigüedad del empleado en la entidad."], "k": 3, "e": "También son criterios los empleos de escolta y los asesores de mesas directivas de asambleas y concejos.", "f": "C909 P29.", "n": "", "src": "propia"}, {"id": "M1-058", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Caso", "q": "La jefa de una oficina afirma que el técnico que digita la nómina ocupa un cargo \"de confianza\" y que puede retirarlo sin motivar. ¿Tiene razón?", "o": ["Sí, porque el jefe puede calificar libremente los cargos de su dependencia.", "Sí, siempre que le pague una indemnización.", "No: importan las funciones y no la denominación; el cargo es de carrera y el retiro exige una causal legal y acto motivado.", "No, porque los técnicos solo pueden ser retirados por pensión."], "k": 2, "e": "C-405/95; art. 5; art. 41 par. 2; C-479/92.", "f": "C909 P29; C909 Ej. 2 caso 5.", "n": "", "src": "propia"}, {"id": "M1-059", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Jurisprudencia", "q": "En la sentencia C-195 de 1994, la Corte declaró inexequible que la ley catalogara como de libre nombramiento y remoción a:", "o": ["Los jefes de control interno de las entidades territoriales.", "Los asesores de los concejos municipales.", "Los escoltas de los servidores públicos.", "Los rectores, vicerrectores y decanos de las universidades públicas, por afectar la autonomía universitaria."], "k": 3, "e": "", "f": "C909 P14, P29.", "n": "", "src": "propia"}, {"id": "M1-060", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Normativa", "q": "Si un empleo de carrera se declara de libre nombramiento y remoción, ¿qué ocurre con el empleado de carrera que lo ocupa (art. 6)?", "o": ["Queda retirado del servicio sin indemnización.", "Pasa automáticamente a ser de libre nombramiento.", "Se traslada a otro cargo de carrera de funciones afines y remuneración igual o superior, si hay vacante; si no la hay, conserva el cargo y sus derechos de carrera.", "Debe presentarse a un nuevo concurso para conservar el cargo."], "k": 2, "e": "Y si un cargo de LNyR pasa a carrera, se provee por concurso.", "f": "C909 P30.", "n": "", "src": "propia"}, {"id": "M1-061", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Normativa", "q": "¿Cuál es la duración máxima de un empleo temporal creado para labores de consultoría y asesoría institucional?", "o": ["Doce meses.", "Seis meses.", "Dos años.", "El tiempo que dure el proyecto, sin límite."], "k": 0, "e": "Art. 21.", "f": "C909 P32, P12.", "n": "", "src": "propia"}, {"id": "M1-062", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Caso", "q": "Una dependencia pide crear un empleo temporal de ocho meses para ejecutar un proyecto y propone nombrar sin proceso a un conocido del jefe. ¿Qué es correcto?", "o": ["Es válido, porque los empleos temporales son de libre designación.", "Es válido si el conocido lleva más de un año en la universidad.", "Debe crearse como empleo de carrera y proveerse por concurso abierto.", "El empleo temporal puede crearse para un proyecto de duración determinada, con motivación técnica y disponibilidad presupuestal; el ingreso se hace con listas de elegibles vigentes o, si no es posible, con evaluación de capacidades y competencias; no genera derechos de carrera."], "k": 3, "e": "Nombrar a un conocido sin proceso afecta igualdad, moralidad e imparcialidad.", "f": "C909 P32; C909 caso B; C-288/14.", "n": "", "src": "propia"}, {"id": "M1-063", "comp": "M1", "tema": "E", "nivel": "B", "tipo": "Normativa", "q": "Según el artículo 22 de la Ley 909, la regla general sobre la jornada de los empleos es:", "o": ["Medio tiempo.", "Tiempo parcial.", "Tiempo completo; por excepción puede haber empleos de medio tiempo o de tiempo parcial.", "La que pacte cada empleado con su jefe."], "k": 2, "e": "", "f": "C909 P33.", "n": "", "src": "propia"}, {"id": "M1-064", "comp": "M1", "tema": "E", "nivel": "B", "tipo": "Procedimiento", "q": "Los empleos de libre nombramiento y remoción se proveen mediante:", "o": ["Concurso abierto de méritos.", "Nombramiento ordinario, previo cumplimiento de requisitos y del procedimiento de ley.", "Encargo obligatorio.", "Contrato de trabajo."], "k": 1, "e": "", "f": "C909 P34; PPT d.20–21.", "n": "", "src": "propia"}, {"id": "M1-065", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Caso", "q": "Un cargo profesional de carrera queda vacante de forma definitiva mientras se surte el concurso. En el cargo inmediatamente inferior hay tres técnicos de carrera que acreditan los requisitos: X tiene evaluación sobresaliente y fue sancionado disciplinariamente hace catorce meses; Y tiene evaluación satisfactoria y ninguna sanción; Z tiene evaluación sobresaliente y fue sancionado hace cuatro meses. Aplicando el art. 24 de la Ley 909, ¿quién tiene derecho al encargo?", "o": ["X.", "Y.", "Z.", "Ninguno, porque todos tienen alguna limitación."], "k": 0, "e": "El requisito es no haber sido sancionado en el último año: X cumple (la sanción tiene más de un año) y tiene evaluación sobresaliente. Z queda excluido por la sanción reciente; Y solo entraría si no hubiera empleados con evaluación sobresaliente.", "f": "C909 P35; C909 Ej. 2 caso 3.", "n": "", "src": "propia"}, {"id": "M1-066", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Procedimiento", "q": "Vencidos los tres meses del encargo en vacancia definitiva y su prórroga de tres meses más, ¿qué debe hacerse?", "o": ["Prorrogar el encargo indefinidamente.", "Suprimir el empleo.", "Inscribir en carrera al encargado.", "Proveer el empleo en forma definitiva."], "k": 3, "e": "C contradice la C-588/09.", "f": "C909 P35.", "n": "", "src": "propia"}, {"id": "M1-067", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Normativa", "q": "¿Cuándo procede el nombramiento provisional en una vacancia temporal?", "o": ["Cuando el titular está en una situación administrativa que implica separación temporal del cargo y no es posible proveerlo por encargo con servidores de carrera; dura lo que dure esa situación.", "Siempre, como primera opción del nominador.", "Solo cuando el titular renuncia.", "Cuando el nominador quiere premiar a un contratista."], "k": 0, "e": "En la vacancia definitiva, la provisionalidad se admite mientras se surte el concurso.", "f": "C909 P36.", "n": "", "src": "propia"}, {"id": "M1-068", "comp": "M1", "tema": "E", "nivel": "I", "tipo": "Normativa", "q": "Un empleado de carrera con evaluación sobresaliente quiere ocupar un cargo de libre nombramiento y remoción sin perder su cargo de carrera. ¿Qué figura debe solicitar?", "o": ["Encargo.", "Licencia ordinaria.", "Comisión para desempeñar empleos de libre nombramiento y remoción o de período.", "Permiso remunerado."], "k": 2, "e": "Art. 26: hasta 3 años, prorrogables por igual término, con tope de 6.", "f": "C909 P37; C909 Ej. 2 caso 4.", "n": "", "src": "propia"}, {"id": "M1-069", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Normativa", "q": "¿Qué ocurre si la comisión para desempeñar un empleo de libre nombramiento, o la suma de las comisiones, supera seis años?", "o": ["El empleado queda inscrito en carrera en el cargo de libre nombramiento.", "Se produce la desvinculación automática del cargo de carrera.", "Se prorroga por tres años más.", "El empleado pasa a provisionalidad."], "k": 1, "e": "", "f": "C909 P37.", "n": "", "src": "propia"}, {"id": "M1-070", "comp": "M1", "tema": "E", "nivel": "A", "tipo": "Diferencias", "q": "¿Cuál afirmación sobre el encargo y la comisión es CORRECTA?", "o": ["Quien acepta un encargo pierde sus derechos de carrera.", "La comisión sirve para cubrir vacantes de carrera mientras se surte el concurso.", "El encargo en vacancia definitiva dura hasta 3 + 3 años.", "Quien acepta un encargo conserva los derechos de carrera; quien se posesiona en un cargo de libre nombramiento sin comisión los pierde."], "k": 3, "e": "A es al revés; B describe el encargo; C confunde meses (encargo) con años (comisión).", "f": "C909 P38, P50.", "n": "", "src": "propia"}, {"id": "M1-071", "comp": "M1", "tema": "F", "nivel": "B", "tipo": "Conceptual", "q": "La carrera administrativa es, según la Ley 909:", "o": ["Un beneficio que se adquiere por antigüedad en el cargo.", "Un sistema técnico de administración de personal que garantiza la eficiencia de la administración y ofrece estabilidad e igualdad de oportunidades, con ingreso y permanencia basados exclusivamente en el mérito.", "Un régimen exclusivo de los trabajadores oficiales.", "Una forma de contratación por prestación de servicios."], "k": 1, "e": "Art. 27.", "f": "C909 P39.", "n": "", "src": "propia"}, {"id": "M1-072", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Normativa", "q": "El concurso de ascenso procede en los niveles:", "o": ["Directivo y asesor únicamente.", "Asesor, profesional, técnico y asistencial.", "Solo en el nivel asistencial.", "Todos los niveles, incluido el directivo."], "k": 1, "e": "", "f": "C909 P40.", "n": "", "src": "prop
