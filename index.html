function startTimer(){ clearInterval(tick); tick=setInterval(()=>{ if(!S||S.done){clearInterval(tick);return;} const el=$("#timer"); if(!el) return; const el2=elapsed(); el.textContent=fmtT(S.limit?Math.max(0,S.limit-el2):el2); if(S.limit){ el.classList.toggle("low",S.limit-el2<60); if(el2>=S.limit){ finish(true); } } },1000); }
const elapsed=()=>Math.floor((Date.now()-S.t0)/1000);
const fmtT=s=>{const m=Math.floor(s/60),x=s%60; return `${m}:${String(x).padStart(2,"0")}`;};

function vSesion(){
  const q=S.qs[S.i]; const isP=S.modo==="practica"; const sel=S.ans[S.i];
  const answered=S.ans.filter(a=>a!==null).length;
  const correct=S.qs.reduce((n,qq,i)=>n+(S.ans[i]===qq.k?1:0),0);
  const tag=q.src==="ia"?'<span class="tag ia">Inédita · IA</span>':q.src==="original"?'<span class="tag orig">Pregunta del módulo</span>':'<span class="tag">Práctica adicional</span>';
  const opts=q.o.map((o,j)=>{
    let cls=""; if(isP&&S.revealed){ if(j===q.k) cls="ok"; else if(j===sel) cls="bad"; }
    return `<button class="opt ${cls}" data-opt="${j}" aria-pressed="${sel===j}" ${isP&&S.revealed?"disabled":""}><span class="L">${LET[j]}</span><span>${esc(o)}</span></button>`;}).join("");
  let fb="";
  if(isP&&S.revealed){
    const ok=sel===q.k;
    fb=`<div class="fb ${ok?"ok":"bad"}" role="status"><h3>${ok?"Correcto":"Incorrecto"}</h3>
      <p><b>Respuesta correcta: ${LET[q.k]}.</b> ${esc(q.o[q.k])}</p>
      ${!ok&&sel!==null?`<p>Marcaste ${LET[sel]}.</p>`:""}
      <p>${esc(q.e)}</p>
      ${q.n?`<p class="src">${esc(q.n)}</p>`:""}
      <p class="src">Fuente: ${esc(q.f)}</p></div>`;
  }
  const last=S.i===S.qs.length-1;
  const navP=`<div class="qnav"><button class="btn ghost" data-finish>Terminar práctica</button>${S.revealed?`<button class="btn primary" data-next>${last?"Ver resumen":"Siguiente pregunta"}</button>`:`<button class="btn primary" data-check ${sel===null?"disabled":""}>Responder</button>`}</div>`;
  const navS=`<div class="qnav"><div class="row"><button class="btn ghost" data-prev ${S.i===0?"disabled":""}>Anterior</button><button class="btn ghost" data-flag>${S.flag[S.i]?"Quitar marca":"Marcar para revisar"}</button></div><div class="row">${last?`<button class="btn primary" data-finish>Finalizar simulacro</button>`:`<button class="btn primary" data-nexts>Siguiente</button>`}</div></div>`;
  const grid=S.qs.map((x,j)=>`<button class="${S.ans[j]!==null?"ans":""} ${j===S.i?"cur":""} ${S.flag[j]?"flag":""}" data-jump="${j}" aria-label="Pregunta ${j+1}">${j+1}</button>`).join("");
  const side=isP?`<div class="panel"><div class="score-live"><span>Aciertos</span><b class="num">${correct}/${answered}</b></div><p class="note num">${answered?Math.round(correct/answered*100):0}% de aciertos en esta práctica</p></div><div class="panel kbd"><div class="lab">Atajos de teclado</div><span><kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd> <kbd>D</kbd> elegir opción</span><span><kbd>Enter</kbd> responder y continuar</span></div>`
    :`<div class="panel"><div class="lab note" style="margin-bottom:8px">Respondidas <b class="num">${answered}/${S.qs.length}</b></div><div class="grid-n">${grid}</div><div class="legend"><span>Dorado: respondida</span><span>Punto naranja: marcada para revisar</span></div></div><div class="panel kbd"><div class="lab">Atajos de teclado</div><span><kbd>A</kbd>–<kbd>D</kbd> elegir opción</span><span><kbd>←</kbd> <kbd>→</kbd> pregunta anterior / siguiente</span></div><button class="btn ghost" data-finish>Finalizar ahora</button>`;
  return `
  <section class="panel">
    <div class="sess-top"><div><div class="eyebrow">${isP?"Práctica":"Simulacro"} · ${S.fuente==="ia"?"Inéditas con IA":S.fuente==="original"?"Preguntas del módulo":S.fuente==="mixto"?"Todas las preguntas":S.fuente==="errores"?"Repetir errores":"Banco de práctica adicional"}</div><h2>Régimen del Empleo Público y Ética</h2></div>
    <div class="row"><span class="note num">Pregunta ${S.i+1} de ${S.qs.length}</span>${isP?"":`<span id="timer" class="timer num" aria-label="${S.limit?"Tiempo restante":"Tiempo transcurrido"}">${fmtT(S.limit?Math.max(0,S.limit-elapsed()):elapsed())}</span>`}</div></div>
    <div class="prog"><i style="width:${(isP?answered:S.i+1)/S.qs.length*100}%"></i></div>
    ${S.aviso?`<p class="note" style="margin-top:10px">${esc(S.aviso)}</p>`:""}
  </section>
  <div class="qwrap">
    <article class="panel qcard ruled">
      <div class="qnum"><span class="qbig num">${String(S.i+1).padStart(2,"0")}</span><span>de ${S.qs.length}</span></div>
      <div class="meta"><span class="tag">Tema ${q.tema} · ${esc(TEMAS[q.tema])}</span><span class="tag">${NIVEL[q.nivel]}</span>${tag}${q.src!=="ia"?`<span class="tag mono">${esc(q.id)}</span>`:""}</div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" role="group" aria-label="Opciones">${opts}</div>
      ${fb}
      ${isP?navP:navS}
    </article>
    <aside class="side">${side}</aside>
  </div>`;
}
function choose(j){
  if(S.modo==="practica"&&S.revealed) return;
  S.ans[S.i]=j; render();
}
function check(){ if(S.ans[S.i]===null) return; S.revealed=true; render(); persistPractice(); }
function next(){ if(S.i<S.qs.length-1){ S.i++; S.revealed=false; render(); window.scrollTo(0,0);} else finish(); }
let pWrite=Promise.resolve();
function persistPractice(){ const a=buildAttempt(); pWrite=pWrite.then(()=>saveAttempt(a)); }

function buildAttempt(){
  const r=S.qs.map((q,i)=>({id:q.id,s:S.ans[i],k:q.k}));
  const used=S.modo==="practica"? r.filter(x=>x.s!==null) : r;
  const correct=used.filter(x=>x.s===x.k).length;
  const total=used.length;
  const nota = total? Math.round(correct/total*1000)/10 : 0;
  const porTema={}; S.qs.forEach((q,i)=>{ if(S.modo==="practica"&&S.ans[i]===null) return; const t=porTema[q.tema]||(porTema[q.tema]={c:0,n:0}); t.n++; if(S.ans[i]===q.k) t.c++; });
  return {sid:S.sid, ts:S.t0, modo:S.modo, fuente:S.fuente, nivel:S.nivel, comp:"M1", total, respondidas:r.filter(x=>x.s!==null).length, correctas:correct, nota, porTema, seg:elapsed(), r, ia:S.qs.filter(q=>q.src==="ia"), uid:uid||null};
}
function finish(auto){
  if(S.done) return;
  if(!auto && S.modo!=="practica"){
    const sinR=S.ans.filter(a=>a===null).length, fl=S.flag.filter(Boolean).length;
    openDlg(`<h3 id="dlg-t">¿Finalizar el simulacro?</h3><p class="num">${sinR?`Tienes <b>${sinR}</b> pregunta${sinR>1?"s":""} sin responder; contarán como incorrectas.`:"Respondiste todas las preguntas."}${fl?` Hay ${fl} marcada${fl>1?"s":""} para revisar.`:""}</p><div class="row"><button class="btn ghost" data-close>Seguir respondiendo</button><button class="btn primary" data-confirmfinish>Finalizar y calificar</button></div>`);
    return;
  }
  doFinish(auto);
}
function doFinish(auto){
  closeDlg();
  if(S.modo==="practica" && !S.ans.some(a=>a!==null)){ S=null; clearInterval(tick); view="inicio"; render(); return; }
  S.done=true; S.auto=!!auto; clearInterval(tick);
  const prev=simulacros()[0]||null;
  S.result=buildAttempt(); S.prevNota= S.modo!=="practica" && prev && prev.sid!==S.sid ? prev.nota : null;
  pWrite=pWrite.then(()=>saveAttempt(S.result));
  view="resultados"; render(); window.scrollTo(0,0);
}

/* ---------- Resultados ---------- */
function gauge(n){ const r=82, c=2*Math.PI*r, ok=n>=60; return `<svg viewBox="0 0 190 190" width="190" height="190" aria-hidden="true"><circle cx="95" cy="95" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="10"/><circle class="arc" cx="95" cy="95" r="${r}" fill="none" stroke="${ok?"var(--ok)":"var(--bad)"}" stroke-width="10" stroke-linecap="${n>0?"round":"butt"}" stroke-dasharray="${c*n/100} ${c}" data-full="${c}" data-val="${c*n/100}"/><line x1="${95+r-14}" y1="95" x2="${95+r+14}" y2="95" stroke="var(--gold)" stroke-width="3" transform="rotate(${360*0.6} 95 95)"/></svg>`; }
function vResultados(){
  const R=S.result, isP=S.modo==="practica"; const ok=R.nota>=60;
  const inc=R.total-R.correctas;
  const temasRows=Object.entries(R.porTema).sort().map(([k,v])=>{ const p=Math.round(v.c/v.n*100); const col=p>=80?"var(--ok)":p>=60?"var(--gold)":"var(--bad)";
    return `<div class="dom-row"><span class="lbl"><b>${k}</b>${esc(TEMAS[k])}</span><div class="meter"><i style="width:${p}%;background:${col}"></i></div><span class="pct">${v.c}/${v.n}</span></div>`;}).join("");
  const debiles=Object.entries(R.porTema).filter(([k,v])=>v.c/v.n<0.6).map(([k])=>k);
  const recs=[];
  debiles.forEach(k=>recs.push(`Repasa el <b>Tema ${k}</b> (${esc(TEMAS[k])}) en el análisis del módulo y practícalo con filtro de tema.`));
  if(R.respondidas<R.total && !isP) recs.push(`Dejaste ${R.total-R.respondidas} sin responder: en el examen conviene contestar todas.`);
  const avanzadas=S.qs.filter((q,i)=>q.nivel==="A"); const avOk=avanzadas.filter(q=>S.ans[S.qs.indexOf(q)]===q.k).length;
  if(avanzadas.length>=3 && avOk/avanzadas.length<0.6) recs.push(`En las preguntas avanzadas acertaste ${avOk} de ${avanzadas.length}. Prueba el simulacro difícil después de repasar los casos de las cartillas.`);
  if(!recs.length) recs.push(ok?"Buen resultado. Sube la exigencia con el simulacro difícil o con preguntas inéditas con IA.":"Practica con retroalimentación los temas en rojo antes del próximo simulacro.");
  if(inc) recs.push(inc===1?"Usa “Repetir errores” para volver sobre la pregunta fallada.":`Usa “Repetir errores” para volver sobre las ${inc} preguntas falladas.`);
  const delta = S.prevNota!==null&&S.prevNota!==undefined ? Math.round((R.nota-S.prevNota)*10)/10 : null;
  const items=S.qs.map((q,i)=>({q,i,s:S.ans[i]})).filter(x=>isP?x.s!==null:true);
  const wrong=items.filter(x=>x.s!==x.q.k);
  const rv=x=>{ const st=x.s===null?"skip":x.s===x.q.k?"okk":""; return `<div class="rv ${st}"><h4>${x.i+1}. ${esc(x.q.q)}</h4><div class="meta"><span class="tag">Tema ${x.q.tema}</span><span class="tag">${NIVEL[x.q.nivel]}</span>${x.q.src!=="ia"?`<span class="tag mono">${esc(x.q.id)}</span>`:'<span class="tag ia">IA</span>'}</div>
    <div class="ans">${x.s===null?'<span class="y">Sin responder</span>':x.s!==x.q.k?`<span class="y">Tu respuesta: ${LET[x.s]}. ${esc(x.q.o[x.s])}</span>`:""}<span class="c">Correcta: ${LET[x.q.k]}. ${esc(x.q.o[x.q.k])}</span></div>
    <p>${esc(x.q.e)}</p>${x.q.n?`<p class="note">${esc(x.q.n)}</p>`:""}<p class="note">Fuente: ${esc(x.q.f)}</p></div>`; };
  return `
  <section class="panel ruled cert">
    <canvas class="guilloche" aria-hidden="true"></canvas>
    <div class="res-head">
      <div class="nota">${gauge(R.nota)}<div><b class="num" data-count="${R.nota}" data-dec="1">${String(R.nota).replace(".",",")}</b><span>de 100</span></div></div>
      <div>
        <div class="eyebrow">${isP?"Resumen de la práctica":"Resultado del simulacro"}${S.auto?" · tiempo agotado":""}</div>
        <div style="margin:8px 0"><span class="veredicto ${ok?"ok":"bad"}">${ok?"APROBADO":"NO APROBADO"}</span></div>
        <p class="muted" style="margin:0">Mínimo aprobatorio: 60/100. ${delta!==null?`Frente al simulacro anterior: <b class="num" style="color:${delta>=0?"var(--ok)":"var(--bad)"}">${delta>=0?"+":""}${String(delta).replace(".",",")}</b> puntos.`:""} Tiempo: <span class="num">${fmtT(R.seg)}</span>.</p>
        <div class="res-tiles">
          <div><b class="num">${R.respondidas}</b><span>respondidas</span></div>
          <div><b class="num" style="color:var(--ok)">${R.correctas}</b><span>correctas</span></div>
          <div><b class="num" style="color:var(--bad)">${inc}</b><span>incorrectas${!isP&&R.respondidas<R.total?" (incluye sin responder)":""}</span></div>
          <div><b class="num">${R.total?Math.round(R.correctas/R.total*100):0}%</b><span>de aciertos</span></div>
        </div>
      </div>
    </div>
  </section>
  <section class="two">
    <div class="panel"><div class="eyebrow">Desagregado</div><h2 style="font-size:24px;margin:4px 0 6px">Por componente y tema</h2>
      <p class="note" style="margin-bottom:14px">Régimen del Empleo Público y Ética: <b class="num">${R.correctas}/${R.total}</b> (${R.total?Math.round(R.correctas/R.total*100):0}%). Es el único componente cargado; no equivale al resultado global del examen.</p>
      <div class="dom">${temasRows}</div></div>
    <div class="panel"><div class="eyebrow">Diagnóstico</div><h2 style="font-size:24px;margin:4px 0 12px">Temas con dificultad y recomendaciones</h2>
      <p style="margin:0 0 10px">${debiles.length?`Por debajo del 60 %: ${debiles.map(k=>`<b>Tema ${k}</b>`).join(", ")}.`:"Ningún tema quedó por debajo del 60 %."}</p>
      <ul class="recs">${recs.map(r=>`<li>${r}</li>`).join("")}</ul></div>
  </section>
  <section class="panel">
    <div class="sec-h"><div><div class="eyebrow">Revisión</div><h2>${wrong.length?"Explicación de las respuestas incorrectas":"Todas las respuestas fueron correctas"}</h2></div>
      <div class="row"><button class="btn ghost" data-showall>${S.showAll?"Ver solo incorrectas":"Ver todas las preguntas"}</button></div></div>
    <div class="review">${(S.showAll?items:wrong).map(rv).join("")}</div>
    <div class="qnav"><button class="btn ghost" data-home>Volver al inicio</button><div class="row">${wrong.length?`<button class="btn ghost" data-retrywrong>Practicar estas ${wrong.length}</button>`:""}<button class="btn primary" data-again>Otro ${isP?"bloque de práctica":"simulacro"}</button></div></div>
  </section>`;
}

/* ---------- Casos de la guía ---------- */
const CV={tab:"casos", filtro:"todas", i:0, txt:{}, shown:{}, ia:{}, busy:null, fl:null, fshown:false};
const caseList=()=>CASOS.casos.filter(c=>CV.filtro==="todas"||c.g===CV.filtro);
const rapList=()=>CASOS.rapidas.filter(c=>CV.filtro==="todas"||c.g===CV.filtro);
const EV={bien:"La tenía bien",parcial:"Parcialmente",mal:"No la sabía"};
function vCasos(){
  const filtros=[["todas","Todas"],["30","Ley 30"],["909","Ley 909"],["disc","Disciplinario"],["vbg","Ac. 10/2019"],["mn","Marco normativo"]].map(([k,t])=>`<button data-cfil="${k}" aria-pressed="${CV.filtro===k}">${t}</button>`).join("");
  const nEval=Object.keys(prog.evals).length, nBien=Object.values(prog.evals).filter(e=>e.v==="bien").length;
  const nR=Object.keys(prog.rapidas).length, nRok=Object.values(prog.rapidas).filter(Boolean).length;
  let body="";
  if(CV.tab==="casos"){
    const L=caseList(); if(CV.i>=L.length) CV.i=0; const c=L[CV.i];
    const items=L.map((x,j)=>{ const e=prog.evals[x.id]; return `<button data-ci="${j}" aria-current="${j===CV.i}"><span class="st ${e?e.v:""}" title="${e?EV[e.v]:"Sin responder"}"></span><span>${esc(x.oficina)}<small>${esc(x.guia)}</small></span></button>`; }).join("");
    const shown=CV.shown[c.id], e=prog.evals[c.id], ia=CV.ia[c.id];
    const iaBlock = ia ? (ia.error?`<div class="warnbox" style="margin-top:14px">${esc(ia.error)}</div>`:`<div class="fb ${ia.veredicto==="correcta"?"ok":ia.veredicto==="incorrecta"?"bad":"neu"}"><h3>Evaluación con IA: ${esc({correcta:"respuesta correcta",parcial:"respuesta parcial",incorrecta:"respuesta incorrecta"}[ia.veredicto]||ia.veredicto)}</h3>${(ia.aciertos||[]).length?`<p><b>Lo que acertaste</b></p><ul>${ia.aciertos.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}${(ia.faltantes||[]).length?`<p><b>Lo que faltó o no es preciso</b></p><ul>${ia.faltantes.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}${ia.comentario?`<p>${esc(ia.comentario)}</p>`:""}<p class="src">Evaluación orientativa: compara tu texto con la respuesta de la guía.</p></div>`) : "";
    body=`<div class="cases">
      <div><div class="lab" style="margin-bottom:10px">${L.length} casos</div><div class="clist" role="list">${items}</div></div>
      <article class="panel ruled ccard">
        <div class="meta"><span class="tag gold">${esc(c.guia)}</span><span class="tag">Tema ${c.tema} · ${esc(TEMAS[c.tema])}</span><span class="tag mono">${esc(c.id)}</span></div>
        <div class="eyebrow">Caso ${CV.i+1} de ${L.length}</div>
        <h2 class="ofi">${esc(c.oficina)}</h2>
        <p class="qtext">${esc(c.q)}</p>
        <label class="lab" for="case-txt">Tu respuesta</label>
        <textarea id="case-txt" placeholder="Escribe tu respuesta citando las normas o sentencias que la sustentan…">${esc(CV.txt[c.id]||"")}</textarea>
        <div class="qnav" style="margin-top:14px">
          <div class="row">${sample?`<button class="btn ghost" data-iaeval ${CV.busy?"disabled":""}>${CV.busy===c.id?"Evaluando…":"Evaluar mi respuesta con IA"}</button>`:""}</div>
          <button class="btn primary" data-reveal>${shown?"Ocultar respuesta de la guía":"Ver respuesta de la guía"}</button>
        </div>
        ${iaBlock}
        ${shown?`<div class="fb neu"><h3>Respuesta de la guía</h3><p>${esc(c.r)}</p><p class="src">Fundamento: ${esc(c.f)}</p>${c.n?`<p class="src"><b>Ojo:</b> ${esc(c.n)}</p>`:""}
          <div class="lab" style="margin-top:14px">¿Cómo te fue?</div>
          <div class="selfeval seg">${Object.entries(EV).map(([k,t])=>`<button data-sev="${k}" aria-pressed="${e&&e.v===k}">${t}</button>`).join("")}</div></div>`:""}
        <div class="qnav"><button class="btn ghost" data-cprev ${CV.i===0?"disabled":""}>Caso anterior</button><button class="btn ghost" data-cnext ${CV.i===L.length-1?"disabled":""}>Siguiente caso</button></div>
      </article></div>`;
  } else {
    if(!CV.fl || CV.fl.f!==CV.filtro){ CV.fl={f:CV.filtro, order:shuffle(rapList().map(x=>x.id)), i:0}; CV.fshown=false; }
    const ids=CV.fl.order; const done=CV.fl.i>=ids.length;
    const r=done?null:CASOS.rapidas.find(x=>x.id===ids[CV.fl.i]);
    body= done ? `<div class="panel ruled flash"><div class="eyebrow">Ronda terminada</div><p class="fq">Repasaste ${ids.length} preguntas</p><p class="muted">Sabías ${ids.filter(id=>prog.rapidas[id]).length} de ${ids.length} en tu última respuesta a cada una.</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-fround>Nueva ronda</button>${ids.some(id=>!prog.rapidas[id])?`<button class="btn ghost" data-fwrong>Solo las que no sabía</button>`:""}</div></div>`
    : `<div class="panel ruled flash">
        <div class="eyebrow">Pregunta ${CV.fl.i+1} de ${ids.length} · ${esc(r.guia)}</div>
        <p class="fq">${esc(r.q)}</p>
        ${CV.fshown?`<p class="fa">${esc(r.r)}</p>${r.n?`<p class="note" style="text-align:center;margin-top:8px">${esc(r.n)}</p>`:""}
          <div class="row" style="justify-content:center;margin-top:20px"><button class="btn ghost" data-fk="0">No la sabía</button><button class="btn primary" data-fk="1">La sabía</button></div>`
        :`<div class="row" style="justify-content:center;margin-top:26px"><button class="btn primary" data-fshow>Mostrar respuesta</button></div>`}
        <div class="prog" style="max-width:420px;margin:26px auto 0;width:100%"><i style="width:${CV.fl.i/ids.length*100}%"></i></div>
      </div>`;
  }
  return `
  <section class="panel ruled">
    <div class="sec-h"><div><div class="eyebrow">Material de las cartillas</div><h2>Casos y preguntas de la guía</h2></div>
      <div class="seg" role="group" aria-label="Cartilla">${filtros}</div></div>
    <p class="note" style="margin-bottom:16px">Son los ejercicios, casos y preguntas abiertas tal como aparecen en las cartillas, con la respuesta que da cada guía. Si la cartilla no trae respuesta, se muestra una de referencia marcada como tal. Casos evaluados: <b class="num">${nEval}/${CASOS.casos.length}</b> (${nBien} bien) · Rápidas repasadas: <b class="num">${nR}/${CASOS.rapidas.length}</b> (${nRok} sabidas).</p>
    <div class="tabs" role="tablist"><button role="tab" data-ctab="casos" aria-selected="${CV.tab==="casos"}">Casos del puesto de trabajo (${CASOS.casos.length})</button><button role="tab" data-ctab="rapidas" aria-selected="${CV.tab==="rapidas"}">Respuesta rápida (${CASOS.rapidas.length})</button></div>
    ${body}
  </section>`;
}
async function iaEval(c){
  const txt=(CV.txt[c.id]||"").trim();
  if(txt.length<20){ CV.ia[c.id]={error:"Escribe una respuesta un poco más completa (al menos una o dos frases) para poder evaluarla."}; render(); return; }
  CV.busy=c.id; render();
  const prompt=`Eres un evaluador de pruebas de conocimientos para concursos de mérito en Colombia. Compara la respuesta del aspirante con la respuesta de referencia de la guía de estudio. Evalúa solo frente a la referencia y su fundamento; no agregues normas que no estén allí. Sé concreto y breve, en español.

CASO: ${c.q}

RESPUESTA DE REFERENCIA (guía): ${c.r}
FUNDAMENTO: ${c.f}

RESPUESTA DEL ASPIRANTE: ${txt}

Responde solo con JSON: {"veredicto":"correcta"|"parcial"|"incorrecta","aciertos":["..."],"faltantes":["..."],"comentario":"una o dos frases con lo que debe reforzar"}`;
  try{ const res=await sample.json(prompt,{modelTier:"quick"}); CV.ia[c.id]=res&&res.veredicto?res:{error:"La evaluación no tuvo el formato esperado. Intenta de nuevo."}; }
  catch(e){ CV.ia[c.id]={error: e&&e.code==="rate_limited"?"Se alcanzó el límite de solicitudes. Intenta en unos minutos.":e&&e.code==="not_granted"?"No se concedió el permiso para consultar a Claude.":"No se pudo evaluar la respuesta."}; }
  CV.busy=null; if(view==="casos") render();
}
function bindCasos(app){
  app.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{ CV.tab=b.dataset.ctab; render(); });
  app.querySelectorAll("[data-cfil]").forEach(b=>b.onclick=()=>{ CV.filtro=b.dataset.cfil; CV.i=0; render(); });
  app.querySelectorAll("[data-ci]").forEach(b=>b.onclick=()=>{ CV.i=+b.dataset.ci; render(); });
  const L=caseList(); const c=L[CV.i];
  const ta=$("#case-txt"); if(ta) ta.oninput=()=>{ CV.txt[c.id]=ta.value; };
  const rv=app.querySelector("[data-reveal]"); if(rv) rv.onclick=()=>{ CV.shown[c.id]=!CV.shown[c.id]; render(); };
  const ie=app.querySelector("[data-iaeval]"); if(ie) ie.onclick=()=>iaEval(c);
  app.querySelectorAll("[data-sev]").forEach(b=>b.onclick=()=>{ prog.evals[c.id]={v:b.dataset.sev,ts:Date.now()}; saveProg(); render(); });
  const cp=app.querySelector("[data-cprev]"); if(cp) cp.onclick=()=>{ CV.i--; render(); window.scrollTo(0,0); };
  const cn=app.querySelector("[data-cnext]"); if(cn) cn.onclick=()=>{ CV.i++; render(); window.scrollTo(0,0); };
  const fs=app.querySelector("[data-fshow]"); if(fs) fs.onclick=()=>{ CV.fshown=true; render(); };
  app.querySelectorAll("[data-fk]").forEach(b=>b.onclick=()=>{ prog.rapidas[CV.fl.order[CV.fl.i]]=b.dataset.fk==="1"; saveProg(); CV.fl.i++; CV.fshown=false; render(); });
  const fr=app.querySelector("[data-fround]"); if(fr) fr.onclick=()=>{ CV.fl=null; render(); };
  const fw=app.querySelector("[data-fwrong]"); if(fw) fw.onclick=()=>{ CV.fl={f:CV.filtro,order:shuffle(CV.fl.order.filter(id=>!prog.rapidas[id])),i:0}; CV.fshown=false; render(); };
}

/* ---------- Historial ---------- */
function vHistorial(){
  const sims=simulacros().slice().reverse();
  let chart="";
  if(sims.length){
    const W=680,H=200,pl=34,pr=12,pt=14,pb=26; const n=sims.length;
    const x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)); const y=v=>pt+(100-v)*(H-pt-pb)/100;
    const pts=sims.map((s,i)=>`${x(i)},${y(s.nota)}`).join(" ");
    const grid=[0,20,40,60,80,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===60?'stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"':""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
    const area=n>1?`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="var(--gold)" opacity=".10"/>`:"";
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de las calificaciones de los simulacros">${grid}${area}<polyline points="${pts}" fill="none" stroke="var(--gold-2)" stroke-width="2"/>${sims.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.nota)}" r="${i===n-1?5:3.5}" fill="${s.nota>=60?"var(--ok)":"var(--bad)"}"/>`).join("")}<text x="${W-pr}" y="${y(60)-6}" text-anchor="end">mínimo 60</text></svg>`;
  }
  const rows=history.map(h=>{ const d=new Date(h.ts); const fu={propia:"Práctica adicional",original:"Preguntas del módulo",mixto:"Todas",ia:"Inéditas IA",errores:"Repetir errores"}[h.fuente]||h.fuente;
    const res=h.modo==="practica"?'<span class="pill neu">Práctica</span>':`<span class="pill ${h.nota>=60?"ok":"bad"}">${h.nota>=60?"Aprobado":"No aprobado"}</span>`;
    return `<tr><td>${d.toLocaleDateString("es-CO",{day:"2-digit",month:"short"})} ${d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}</td><td>${h.modo==="practica"?"Práctica":"Simulacro"}</td><td>${esc(fu)}</td><td>${h.correctas}/${h.total}</td><td><b>${String(h.nota).replace(".",",")}</b></td><td>${res}</td></tr>`;}).join("");
  return `
  <section class="panel ruled">
    <div class="sec-h"><div><div class="eyebrow">Seguimiento</div><h2>Evolución de los simulacros</h2></div><span class="note">${esc(storeMsg)}</span></div>
    ${sims.length?chart:'<p class="muted">Aún no has presentado simulacros. Cuando termines el primero verás aquí tu evolución frente al mínimo de 60.</p>'}
  </section>
  <section class="panel">
    <div class="sec-h"><h2>Todos los intentos</h2><span class="note num">${history.length} registro${history.length===1?"":"s"}</span></div>
    ${history.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Modo</th><th>Origen</th><th>Correctas</th><th>Nota</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">Sin intentos registrados.</p>'}
  </section>`;
}

/* ---------- Diálogo ---------- */
function openDlg(html){ const d=$("#dlg"); d.innerHTML=`<div class="dialog">${html}</div>`; d.classList.remove("hide"); const b=d.querySelector("button"); if(b) b.focus(); bindDlg(); }
function closeDlg(){ const d=$("#dlg"); d.classList.add("hide"); d.innerHTML=""; }
function bindDlg(){ const d=$("#dlg");
  d.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeDlg);
  const lo=d.querySelector("[data-logout]"); if(lo) lo.onclick=doLogout;
  const cf=d.querySelector("[data-confirmfinish]"); if(cf) cf.onclick=()=>doFinish(false);
  const ab=d.querySelector("[data-abort]"); if(ab) ab.onclick=()=>{ if(genAbort) genAbort.abort(); closeDlg(); };
  const lv=d.querySelector("[data-leave]"); if(lv) lv.onclick=()=>{ const v=lv.dataset.leave; if(S&&S.modo==="practica"&&S.ans.some(a=>a!==null)){ S.done=true; } S=null; clearInterval(tick); closeDlg(); view=v; render(); };
}
function confirmLeave(v){ openDlg(`<h3 id="dlg-t">¿Salir de la sesión?</h3><p>${S.modo==="practica"?"Tus respuestas de esta práctica ya quedaron guardadas.":"El simulacro se perderá y no quedará calificado."}</p><div class="row"><button class="btn ghost" data-close>Seguir</button><button class="btn primary" data-leave="${v}">Salir</button></div>`); }

/* ---------- Eventos ---------- */
function bind(){
  const app=$("#app");
  if(view==="login"){ app.querySelectorAll("[data-user]").forEach(b=>b.onclick=()=>selectUser(b.dataset.user)); return; }
  if(view==="casos"){ bindCasos(app); return; }
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{
    const g=b.dataset.go;
    if(g==="practica"){ cfg.modo="practica"; setView("config"); }
    else if(g==="simulacro"){ cfg.modo="simulacro"; cfg.nivel="todos"; cfg.n=40; setView("config"); }
    else if(g==="dificil"){ cfg.modo="simulacro"; cfg.nivel="A"; cfg.fuente="mixto"; cfg.n=20; setView("config"); }
    else if(g==="casos"){ setView("casos"); }
    else if(g==="errores"){ const qs=shuffle(errorIds().map(id=>BYID[id]||iaCache[id]).filter(Boolean)); const pf=cfg.fuente; cfg.fuente="errores"; startSession(qs,"practica"); cfg.fuente=pf; }
  });
  app.querySelectorAll("[data-modo]").forEach(b=>b.onclick=()=>{ cfg.modo=b.dataset.modo; if(cfg.modo==="simulacro"&&cfg.n<20) cfg.n=40; render(); });
  app.querySelectorAll("[data-fuente]").forEach(b=>b.onclick=()=>{ cfg.fuente=b.dataset.fuente; render(); });
  app.querySelectorAll("[data-tema]").forEach(b=>b.onclick=()=>{ const k=b.dataset.tema; cfg.temas=cfg.temas.includes(k)?cfg.temas.filter(x=>x!==k):cfg.temas.concat(k).sort(); render(); });
  const at=app.querySelector("[data-alltemas]"); if(at) at.onclick=()=>{ cfg.temas=cfg.temas.length===9?[]:Object.keys(TEMAS); render(); };
  app.querySelectorAll("[data-nivel]").forEach(b=>b.onclick=()=>{ cfg.nivel=b.dataset.nivel; render(); });
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ cfg.n=+b.dataset.n; render(); });
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ cfg.tiempo=+b.dataset.t; render(); });
  const nc=$("#n-custom"); if(nc) nc.onchange=()=>{ const v=Math.max(1,Math.min(+nc.max||150,Math.round(+nc.value||1))); cfg.n=v; render(); };
  const st=app.querySelector("[data-start]"); if(st) st.onclick=begin;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>choose(+b.dataset.opt));
  const ck=app.querySelector("[data-check]"); if(ck) ck.onclick=check;
  const nx=app.querySelector("[data-next]"); if(nx) nx.onclick=next;
  const ns=app.querySelector("[data-nexts]"); if(ns) ns.onclick=()=>{ S.i++; render(); };
  const pv=app.querySelector("[data-prev]"); if(pv) pv.onclick=()=>{ S.i--; render(); };
  const fl=app.querySelector("[data-flag]"); if(fl) fl.onclick=()=>{ S.flag[S.i]=!S.flag[S.i]; render(); };
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ S.i=+b.dataset.jump; render(); });
  app.querySelectorAll("[data-finish]").forEach(b=>b.onclick=()=>finish(false));
  const sa=app.querySelector("[data-showall]"); if(sa) sa.onclick=()=>{ S.showAll=!S.showAll; render(); };
  const hm=app.querySelector("[data-home]"); if(hm) hm.onclick=()=>{ S=null; view="inicio"; render(); };
  const ag=app.querySelector("[data-again]"); if(ag) ag.onclick=()=>{ cfg.modo=S.modo==="practica"?"practica":"simulacro"; S=null; view="config"; render(); };
  const rw=app.querySelector("[data-retrywrong]"); if(rw) rw.onclick=()=>{ const qs=S.qs.filter((q,i)=>S.ans[i]!==q.k); const pf=cfg.fuente; cfg.fuente="errores"; startSession(shuffle(qs),"practica"); cfg.fuente=pf; };
}
document.addEventListener("keydown",e=>{
  if(view!=="sesion"||!S||S.done||!$("#dlg").classList.contains("hide")) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ choose(map[k]); e.preventDefault(); }
  else if(e.key==="Enter"){ if(S.modo==="practica"){ S.revealed?next():check(); } else if(S.i<S.qs.length-1){ S.i++; render(); } e.preventDefault(); }
  else if(e.key==="ArrowRight"&&S.modo!=="practica"&&S.i<S.qs.length-1){ S.i++; render(); }
  else if(e.key==="ArrowLeft"&&S.modo!=="practica"&&S.i>0){ S.i--; render(); }
});

/* Conserva la sesión activa si la página se actualiza */
function start(snap){
  if(snap && snap.S && snap.S.qs && pid){ S=snap.S; view=snap.view||"inicio"; cfg=snap.cfg||cfg; if(S && !S.done) startTimer(); }
  render();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(()=>({S,view,cfg})); }catch(e){} }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
