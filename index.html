B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Quién evalúa el desempeño de un funcionario de carrera?", "o": ["La Comisión de Personal", "El jefe inmediato", "El Rector"], "k": 1, "e": "Evalúa el jefe inmediato, sobre compromisos concertados.", "f": "Cartilla Marco normativo, Autoevaluación 2, pregunta 2.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A2-3", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · Verdadero/Falso", "q": "Verdadero o falso: el concurso abierto puede iniciarse antes de terminar el de ascenso.", "o": ["Verdadero", "Falso"], "k": 1, "e": "Falso: el concurso abierto se adelanta una vez concluido el de ascenso, para las vacantes que este no cubra.", "f": "Cartilla Marco normativo, Autoevaluación 2, pregunta 3.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A2-4", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "Un funcionario obtiene 82 %. ¿En qué nivel queda?", "o": ["Sobresaliente", "Satisfactorio", "No satisfactorio"], "k": 1, "e": "82 % está por encima de 60 % y por debajo de 85 %: satisfactorio.", "f": "Cartilla Marco normativo, Autoevaluación 2, pregunta 4.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A3-1", "tema": "O", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Quién coordina la promoción y difusión de la Política de Integridad y Buen Gobierno?", "o": ["Secretaría General", "Oficina Asesora de Planeación", "Talento Humano"], "k": 1, "e": "La Oficina Asesora de Planeación coordina la promoción y difusión de la Política.", "f": "Cartilla Marco normativo, Autoevaluación 3, pregunta 1.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A3-3", "tema": "O", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · Verdadero/Falso", "q": "Verdadero o falso: un jefe puede reasignar a un funcionario que denunció de buena fe una irregularidad, si lo justifica en necesidades del servicio.", "o": ["Verdadero", "Falso"], "k": 1, "e": "Falso: la Política prohíbe las represalias contra quien denuncia de buena fe; disfrazarlas de necesidad del servicio no las legitima.", "f": "Cartilla Marco normativo, Autoevaluación 3, pregunta 3.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A3-4", "tema": "O", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Cuál de estos NO es un valor del Código de Integridad Académica?", "o": ["Coraje", "Lealtad al jefe", "Confianza"], "k": 1, "e": "Los valores son honestidad, confianza, justicia, respeto, responsabilidad y coraje. La lealtad al jefe no figura.", "f": "Cartilla Marco normativo, Autoevaluación 3, pregunta 4.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "G2-01", "comp": "M2", "fix": 1, "tema": "P", "nivel": "B", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "Una servidora que acaba de llegar a la Oficina Asesora de Planeación necesita citar en un informe la norma que aprobó el Plan de Desarrollo 2020-2030. ¿Cuál debe citar?", "o": ["La Resolución Rectoral 909 de 2025.", "El Acuerdo Superior 06 de 2021.", "El Acuerdo Superior 23 de 2019."], "k": 1, "e": "El PDU se aprobó con el Acuerdo Superior 06 del 2 de julio de 2021. Patrón del distractor, confundir los instrumentos: la Resolución 909 adopta el Plan de Acción 2026 y el Acuerdo 23 de 2019 actualizó la política de integridad y buen gobierno.", "f": "Guía de estudio, Autoevaluación, ítem 1 (clave indicada por la guía: «El Acuerdo Superior 06 de 2021»); Clave razonada.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-02", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "En una reunión, un jefe afirma: «Como el Plan de Gobierno 2024-2028 ya fija sus propias metas, las metas del PDU dejaron de aplicar». ¿Cuál es la afirmación correcta?", "o": ["El Plan de Gobierno se organiza en los mismos cinco compromisos del PDU y acelera sus metas en el cuatrienio; las metas del PDU siguen vigentes.", "El Plan de Gobierno, por ser más reciente, sustituye las metas del PDU hasta 2028.", "Las metas del PDU solo obligan a las dependencias académicas, y las del Plan de Gobierno a las administrativas."], "k": 0, "e": "El Plan de Gobierno se estructura en los cinco compromisos del PDU y acelera sus metas; no las sustituye. Los distractores confunden los instrumentos o inventan una división que no existe en ninguna fuente.", "f": "Guía de estudio, Autoevaluación, ítem 2 (clave indicada por la guía: la primera afirmación); Clave razonada.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-03", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "En septiembre, una dependencia concluye que no alcanzará la meta 2026 de uno de sus indicadores. Según la Resolución 909 de 2025, ¿qué instancia puede modificar esa meta?", "o": ["El jefe de la dependencia responsable, mediante un oficio a la OAP.", "La Oficina Asesora de Planeación, al consolidar el informe trimestral.", "El Consejo de Planeación, en el seguimiento y la evaluación del plan."], "k": 2, "e": "El artículo 4 de la Resolución 909 faculta al Consejo de Planeación para crear, modificar o suprimir proyectos, indicadores y metas. Patrón del distractor, actuar fuera de la competencia: la dependencia reporta y propone; la OAP hace el seguimiento y publica (art. 5).", "f": "Guía de estudio, Autoevaluación, ítem 3 (clave indicada por la guía: «El Consejo de Planeación»); Clave razonada; Resolución 909 de 2025, arts. 4 y 5.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-04", "comp": "M2", "fix": 1, "tema": "R", "nivel": "A", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "A septiembre de 2026, el proyecto 41, Transformación Digital, tiene 79,8 % de avance de actividades y 61,0 % de ejecución presupuestal. Sus cinco sistemas de información, con meta 1 cada uno, están en 0,7; 0,8; 0,3; 0,8 y 0,85. ¿Qué conclusión es correcta?", "o": ["El proyecto está cumplido, porque su avance de actividades supera el 75 %.", "Ningún sistema está terminado y el que va en 0,3 es el más rezagado; el último trimestre debe priorizarlo.", "Como se ha ejecutado menos de dos tercios del presupuesto, el proyecto no ha avanzado."], "k": 1, "e": "Los cinco indicadores están por debajo de 1 y el de 0,3 es el más lejano de la meta. Los distractores confunden actividad con resultado (A) y gasto con avance (C).", "f": "Guía de estudio, Autoevaluación, ítem 4 (clave indicada por la guía: la segunda conclusión); Clave razonada; Seguimiento Plan de Acción, septiembre de 2026.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-05", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "La meta 2030 de la iniciativa 5.1.3 del PDU es que el 90 % de las solicitudes se atiendan satisfactoriamente para el usuario. El único indicador del plan de acción de su dependencia es «número de capacitaciones en atención al usuario». ¿Qué ajuste mejora la alineación?", "o": ["Agregar un indicador de porcentaje de solicitudes atendidas satisfactoriamente según el usuario, con su fórmula y su meta.", "Duplicar la meta de capacitaciones para compensar la falta de otros indicadores.", "Mantener el indicador, porque las capacitaciones siempre mejoran la atención."], "k": 0, "e": "La meta 2030 es de resultado; un indicador de actividad no muestra si la dependencia se acerca a ella. Los distractores confunden actividad con resultado.", "f": "Guía de estudio, Autoevaluación, ítem 5 (clave indicada por la guía: agregar el indicador de resultado); Clave razonada.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-06", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "El Decálogo del Plan de Gobierno se propone tener 100 trámites administrativos y académicos en ambientes digitales. ¿A qué iniciativa del PDU aporta principalmente esa meta?", "o": ["5.4.2 Cultura digital: 12 servicios soportados totalmente en ambientes digitales a 2030.", "5.3.9 Modernización de la infraestructura tecnológica y de servicios: 48 Gbps de ancho de banda a 2030.", "2.4.1 Programa de formación en competencias digitales para el personal docente."], "k": 0, "e": "Los trámites en ambientes digitales empujan la meta de servicios digitales de la iniciativa 5.4.2. Las otras dos opciones tienen relación temática, pero no aportan directamente a esa meta.", "f": "Guía de estudio, Autoevaluación, ítem 6 (clave indicada por la guía: 5.4.2 Cultura digital); Clave razonada.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-07", "comp": "M2", "fix": 1, "tema": "P", "nivel": "A", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "En su oficina se repiten las mismas preguntas de los usuarios sobre un trámite. ¿Qué actuación aplica mejor los principios de gestión del PDU?", "o": ["Publicar en la cartelera un aviso más visible con los requisitos del trámite.", "Preguntar a los usuarios en qué paso se confunden, rediseñar ese paso con ellos y medir después las solicitudes resueltas en el primer contacto.", "Contratar una consultoría externa para documentar el proceso completo antes de cambiar cualquier paso."], "k": 1, "e": "Aplica los principios «co-creando con la comunidad» y «gestión basada en resultados», y mide un resultado para el usuario. Los distractores olvidan al usuario (A) o prefieren una necesidad bien documentada a un problema resuelto (C).", "f": "Guía de estudio, Autoevaluación, ítem 7 (clave indicada por la guía: rediseñar el paso con los usuarios); Clave razonada.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "G2-08", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Autoevaluación · Guía de estudio del módulo 2", "q": "Su jefe le pide no incluir en el reporte trimestral un indicador que sigue en cero «porque ese informe se publica». ¿Qué debe hacer?", "o": ["Omitirlo en este trimestre y reportarlo en la evaluación anual, cuando haya avanzado.", "Reportarlo con el valor que se espera alcanzar al cierre, para no mostrar un cero.", "Reportar la medición real con su causa y las acciones previstas, porque la OAP debe publicar los informes trimestrales."], "k": 2, "e": "El artículo 5 de la Resolución 909 ordena publicar los informes trimestrales; el dato real permite corregir a tiempo. Los distractores ocultan o aplazan el problema (A) y maquillan el indicador (B).", "f": "Guía de estudio, Autoevaluación, ítem 8 (clave indicada por la guía: reportar la medición real); Clave razonada; Resolución 909 de 2025, art. 5.", "n": "", "src": "original", "grp": "Guía de estudio · Autoevaluación"}, {"id": "SB-01", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Storybook · Presentación Sesión 1 (virtual)", "q": "En el seguimiento trimestral del plan de acción de Admisiones, el indicador del proyecto es «número de reuniones de equipo realizadas» y está en 100 %, mientras las solicitudes respondidas a tiempo bajaron de 91 % a 78 % en tres trimestres. ¿Qué debe proponer la técnica administrativa a su coordinadora?", "o": ["Programar más reuniones de equipo para mantener el indicador en 100 % y mostrar compromiso con el plan.", "Proponer que el proyecto mida el resultado para el usuario —(solicitudes atendidas satisfactoriamente / solicitudes recibidas) × 100—, reportar el avance real con evidencias y plantear acciones de mejora.", "Mantener el reporte sin cambios y esperar a la próxima auditoría para que determine si existe un problema."], "k": 1, "e": "El indicador debe medir el resultado esperado, no solo el esfuerzo. La iniciativa 5.1.3 del PDU fija a 2030 el 90 % de solicitudes atendidas satisfactoriamente para el usuario; el seguimiento trimestral debe reflejar el avance real con evidencias y el autocontrol es responsabilidad de cada servidor. A confunde actividad con resultado (confusión de categorías). C traslada la responsabilidad al auditor y deja al usuario sin respuesta (desplazamiento de responsabilidad).", "f": "Presentación Sesión 1 virtual, SB-01 «Las reuniones de Luz» y rutina CLAVE (clave: B); Storybook SB-01.", "n": "", "src": "original", "grp": "Storybooks"}, {"id": "SB-02", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Storybook · Presentación Sesión 1 (virtual)", "q": "Una coordinadora recién designada ordena eliminar del plan de acción toda referencia al Plan de Desarrollo 2020-2030 porque, según ella, con el Plan de Gobierno 2024-2028 el PDU «dejó de aplicar». El proyecto de eficiencia energética de la dependencia está articulado con el Propósito 5 del PDU. ¿Cuál es la actuación adecuada del profesional responsable del proyecto?", "o": ["Eliminar las referencias al PDU, porque durante el cuatrienio solo son exigibles las metas del Plan de Gobierno.", "Mantener el plan de acción sin cambios e ignorar el Plan de Gobierno, porque el PDU tiene mayor jerarquía.", "Explicar que el Plan de Gobierno se organiza sobre los cinco compromisos del PDU y debe articularse con él, y proponer vincular el proyecto con ambos (Propósito 5 y la meta del Decálogo de reducir la huella de carbono) con apoyo de la Oficina Asesora de Planeación."], "k": 2, "e": "El art. 4 del Acuerdo Superior 06 de 2021 ordena que los planes de gobierno se articulen con el PDU y propendan por sus metas; el Plan de Gobierno 2024-2028 presenta sus estrategias basadas en los cinco compromisos del PDU, y el plan de acción ejecuta ambos. A invierte la jerarquía (el plan de cuatro años reemplaza al de diez). B es unilateral y desconoce que el Plan de Gobierno acelera las metas del PDU.", "f": "Presentación Sesión 1 virtual, SB-02 «Cuatro años, diez años» y rutina CLAVE (clave: C); Storybook SB-02.", "n": "", "src": "original", "grp": "Storybooks"}, {"id": "SB-03", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Storybook · Presentación Sesión 1 (virtual)", "q": "Un técnico de Servicios Generales es responsable de una meta del plan de acción: adecuar seis baterías sanitarias accesibles en la vigencia. Por retrasos en la contratación, al cierre del tercer trimestre solo hay una terminada y mañana vence el reporte de seguimiento. ¿Qué actuación corresponde al responsable de la meta?", "o": ["Reportar el avance real con evidencias, documentar la causa del retraso y solicitar a la jefatura la reprogramación concertada de la meta.", "Reportar 100 % de avance, porque el contrato firmado garantiza que la meta se cumplirá antes del cierre de la vigencia.", "Modificar la meta en el formato de seguimiento para que coincida con lo ejecutado y evitar un incumplimiento."], "k": 0, "e": "El seguimiento trimestral debe reflejar el avance real con evidencias (autocontrol del responsable); la reprogramación del plan de acción se concerta con la jefatura y las metas no se modifican por decisión unilateral de quien reporta. B es informalidad y falta de integridad: reporta lo que no ha ocurrido. C es unilateralidad e inversión de jerarquía: acomoda la meta a lo ejecutado.", "f": "Presentación Sesión 1 virtual, SB-03 «El trimestre que no alcanzó» y rutina CLAVE (clave: A); Storybook SB-03.", "n": "", "src": "original", "grp": "Storybooks"}, {"id": "BP-01", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Una profesional de la Vicerrectoría de Extensión debe decidir cuál de dos proyectos presentar a una convocatoria interna con recursos limitados: (1) un diplomado abierto a funcionarios de alcaldías del Magdalena, diseñado con ellos, sobre gestión de proyectos; (2) un evento protocolario de alto costo para visibilizar la marca institucional. ¿Qué criterio institucional debe primar para su recomendación?", "o": ["Elegir el evento, porque la visibilidad de la marca es el fin último de la misión institucional.", "Elegir el diplomado, porque la misión 2030 orienta la Universidad a contribuir a la transformación positiva y sostenible del territorio mediante formación pertinente y diálogo incluyente con los territorios.", "Presentar ambos proyectos y dejar que la convocatoria decida, pues la misión no establece prioridades entre actividades."], "k": 1, "e": "La Misión 2030 declara como fin «contribuir a la transformación positiva y sostenible del territorio» con programas pertinentes y en procesos de diálogo incluyente y constructivo con los territorios. El diplomado co-diseñado cumple fin, medio y modo. Distractores: A confunde un medio (visibilidad) con el fin. C evade la responsabilidad de aplicar los lineamientos al recomendar.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 1; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-02", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "La Oficina de Aseguramiento de la Calidad prepara el informe de autoevaluación y un jefe de grupo propone elaborar un plan de mejoramiento independiente del Plan de Desarrollo «para no mezclar acreditación con planeación». Según el modelo institucional, ¿qué es lo pertinente?", "o": ["Aceptar la propuesta, pues la acreditación es un proceso externo regido solo por el CNA.", "Elaborar el plan de mejoramiento pero sin indicadores, para no duplicar la matriz del PDU.", "Integrar las oportunidades de mejora de la autoevaluación con la planeación estratégica, porque SIEMBRA enlaza autoevaluación, autorregulación y mejoramiento con la planeación y el PDU funciona como plan de mejoramiento."], "k": 2, "e": "SIEMBRA Por Unimagdalena es el sistema integrador que enlaza los procesos de autoevaluación, autorregulación y mejoramiento continuo con los procesos de planeación estratégica. El Acuerdo 06 de 2021 señala que el PDU se convirtió en el plan de mejoramiento de la renovación de la acreditación. Distractores: A desconoce la integración del Propósito 1 (Universidad comprometida con la calidad). B elimina la medición, contraria al ciclo PHVA.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 2; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-03", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un aspirante pregunta en el curso por qué la Universidad realiza el concurso de ingreso a la planta administrativa. ¿Cuál respuesta articula correctamente los instrumentos de planeación?", "o": ["Porque lo ordenó una decisión judicial, de manera que el concurso es una obligación externa que no guarda relación con los instrumentos de planeación institucional.", "Porque desarrolla la iniciativa 5.1.4 del PDU (implementación de la carrera administrativa Unimagdalena) y la acción prioritaria del Plan de Gobierno 2024-2028 de implementar la carrera administrativa especial.", "Porque el Plan de Acción de cada dependencia puede crear empleos de carrera sin necesidad de articularse con el PDU."], "k": 1, "e": "Carrera administrativa especial Unimagdalena: meta del PDU 0 → 309 (2024) → 456 (2030) empleados en carrera, y acción prioritaria del Plan de Gobierno. Distractores: A desconoce la cadena estratégica. C viola el art. 4 del Acuerdo 06 de 2021 (articulación obligatoria).", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 3; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-04", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "La Oficina de Gestión Ambiental propone incluir en su plan de acción una meta de reducción de consumo energético y se le pregunta cómo justificarla estratégicamente. ¿Cuál justificación es la más sólida?", "o": ["La contribución a los ODS es meta superior del PDU y la sostenibilidad es principio institucional; la acción aporta al Propósito 5 (campus sostenible) y al compromiso de sostenibilidad del Plan de Gobierno.", "Las metas ambientales son voluntarias y no requieren justificación estratégica.", "La meta solo se justifica si la exige una autoridad ambiental externa."], "k": 0, "e": "Los ODS son meta superior del PDU; la Prioridad 5.5 es Patrimonio y campus sostenible, y el Decálogo del Compromiso por Unimagdalena incluye eficiencia energética y reducir 25 % la huella de carbono. Distractores: B ignora el deber de articulación. C reduce la gestión a cumplimiento externo.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 4; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-05", "comp": "M2", "fix": 1, "tema": "P", "nivel": "B", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Una comunicadora prepara una pieza sobre cómo se construyó el PDU 2020-2030. ¿Qué afirmación es fiel a las fuentes institucionales?", "o": ["Fue elaborado por una firma consultora y validado por el Consejo Académico.", "Se construyó colectivamente mediante los Diálogos SIEMBRA (8 encuentros, 4.598 participantes), talleres virtuales de planeación y sesiones de socialización, y se articuló con la autoevaluación institucional.", "Se construyó solo con los decanos, dado que el PDU es un documento académico."], "k": 1, "e": "Diálogos SIEMBRA y planeación participativa. Distractores: A y C contradicen el principio de participación y los datos del acuerdo.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 5; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-06", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "A", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un sindicato pregunta por qué la ampliación de la planta administrativa prevista en el PDU avanza de forma gradual. ¿Qué explicación es coherente con los instrumentos institucionales?", "o": ["Porque la planta solo puede crecer con recursos recurrentes adicionales (reforma al modelo de financiación, arts. 86-87 Ley 30); el Plan de Gobierno proyecta 25 empleos administrativos por vigencia financiados con transferencias de cierre de brechas.", "Porque el PDU prohíbe expresamente ampliar la planta administrativa antes de 2030, para no comprometer la sostenibilidad financiera de la institución.", "Porque la ampliación depende exclusivamente de la venta de servicios de cada dependencia, que debe autofinanciar los cargos que solicite."], "k": 0, "e": "Prioridad 5.1 (estructura organizacional y planta administrativa), propuesta de financiación del Plan de Gobierno y reforma a la Ley 30 y su financiación. Distractores: B es falsa. C confunde fuentes de gasto de funcionamiento recurrente con ingresos variables.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 6; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-07", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un funcionario afirma en un informe que la Universidad «ya está certificada en ISO 21001». Según las fuentes institucionales, ¿cuál es el estado correcto?", "o": ["Es correcto: ICONTEC otorgó la certificación ISO 21001 en 2022, junto con la certificación de los programas de formación para el trabajo del CREO.", "Es una meta del Plan de Gobierno 2024-2028; el sistema avanza en su articulación con ISO 9001:2015, que es la norma certificada por ICONTEC desde 2007.", "No es correcto, porque la Universidad no cuenta con ninguna certificación de sistemas de gestión: sus procesos se evalúan solo mediante acreditación."], "k": 1, "e": "Decálogo del Compromiso por Unimagdalena (C – Calidad: certificar ISO 21001); normas y modelos integrados en COGUI+; ISO 9001 y certificación ICONTEC. Distractores: A confunde con la triple certificación NTC de 2022. C desconoce la certificación ISO 9001.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 7; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-08", "comp": "M2", "fix": 1, "tema": "P", "nivel": "B", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Una decanatura no sabe a quién enviar su informe de avance de metas del PDU. Según el Acuerdo Superior 06 de 2021, el informe debe enviarse a:", "o": ["La Oficina de Control Interno, que como responsable de la evaluación independiente aprueba las metas y consolida los informes de avance del PDU.", "El Ministerio de Educación Nacional, directamente, porque ejerce la inspección y vigilancia sobre el cumplimiento de los planes de desarrollo.", "La Oficina Asesora de Planeación, que ejerce la Secretaría Técnica del PDU y consolida los informes para el Consejo de Planeación."], "k": 2, "e": "Art. 5: la Oficina Asesora de Planeación ejerce la Secretaría Técnica; vicerrectorías, decanaturas y oficinas le reportan con los instrumentos establecidos. Distractores: A confunde evaluación independiente con secretaría técnica. B salta la estructura interna.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 8; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-09", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Una jefa de grupo pregunta quién es responsable en primera instancia de monitorear los riesgos de su proceso. La respuesta correcta es:", "o": ["La Oficina de Control Interno, que es la primera línea de defensa.", "La Rectoría, porque es la alta dirección.", "Los líderes y responsables del proceso (primera línea); el Grupo Gestión de la Calidad es la segunda y Control Interno la tercera."], "k": 2, "e": "Administración del riesgo y líneas de defensa. Distractores: A invierte las líneas. B confunde la responsabilidad de la alta dirección con el monitoreo operativo.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 9; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-10", "comp": "M2", "fix": 1, "tema": "S", "nivel": "A", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Una petición de un aspirante lleva 13 días hábiles sin respuesta y la responsable del trámite está en vacaciones. ¿Cuál es la actuación correcta?", "o": ["Esperar el regreso de la responsable, ya que la competencia es personal.", "Reasignar de inmediato el trámite según el procedimiento, responder de fondo dentro del término y registrar la gestión para el seguimiento de oportunidad.", "Archivar la petición por vencimiento del término y pedir al aspirante que radique una nueva solicitud."], "k": 1, "e": "PQRSD y satisfacción de grupos de interés: criterios de prontitud, coherencia, claridad y satisfacción; seguimiento a la oportunidad por el Grupo Gestión de la Calidad. Distractores: A vulnera el derecho fundamental de petición (art. 23 de la Constitución), cuya respuesta no depende de la disponibilidad de una persona. C traslada al usuario la carga de la mora institucional. El banco aclara que el término legal de respuesta está en la Ley 1755 de 2015, que no hace parte del material del curso.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 10; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-11", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Cambia una norma externa que afecta un procedimiento de contratación y el formato vigente en el sistema quedó desactualizado. ¿Quién debe gestionar el cambio y cómo?", "o": ["El líder del proceso de Contratación, modificando procedimientos y formatos a través del sistema documental COGUI+ y socializando la actualización.", "Cada funcionario, ajustando el formato en su computador según su criterio.", "Nadie, hasta la próxima auditoría externa."], "k": 0, "e": "Gestión del cambio: los cambios los llevan a cabo los líderes de los procesos y se adoptan mediante la modificación de procedimientos, formatos y demás documentos (acciones correctivas y mejora continua); ISOlución es la plataforma documental de COGUI+. Distractores: B genera documentos no controlados. C es omisión.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 11; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-12", "comp": "M2", "fix": 1, "tema": "R", "nivel": "A", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Se pide a un participante construir la cadena para el objetivo de transformación digital. ¿Cuál secuencia es lógicamente impecable?", "o": ["Indicador «número de computadores comprados» → Prioridad 5.4 → Estrategia 2.3 PG.", "Prioridad PDU 5.4 (transformación digital) → Estrategia PG 5.4 (integración de sistemas de información y servicios en plataformas digitales) → acción del plan de acción de Admisiones: digitalizar la expedición de constancias → indicador: % de constancias expedidas en línea.", "Estrategia PG 3.4 (financiación de la investigación) → acción: publicar artículos → indicador: servicios digitales."], "k": 1, "e": "Cadena de valor y alineación vertical: objetivo del PDU → estrategia del Plan de Gobierno → acción del plan de acción → indicador coherente con el resultado. Distractores: A invierte la cadena y usa un indicador de insumo. C rompe la coherencia temática.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 12; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-13", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Por un recorte presupuestal, una meta 2030 del PDU resulta inalcanzable. ¿Cuál es el trámite previsto?", "o": ["La OAP presenta la modificación al Consejo de Planeación para su visto bueno y este la presenta al Consejo Superior para estudio y aprobación final.", "La dependencia responsable reduce la meta en su plan de acción y la reporta como cumplida.", "El Consejo Académico aprueba la modificación sin participación de la OAP."], "k": 0, "e": "Art. 7 del Acuerdo Superior 06 de 2021: reprogramación y ajuste de metas del PDU. Distractores: B falsea el reporte. C desconoce el procedimiento y las competencias.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 13; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-14", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Se pregunta quién presenta el Informe de Gestión Institucional y qué contiene. La respuesta correcta es:", "o": ["Lo presenta cada funcionario sobre las tareas de su cargo, y la suma de esos reportes individuales constituye el informe que se publica a la comunidad.", "Lo presenta la Contraloría Departamental sobre la ejecución presupuestal, como resultado de la auditoría fiscal anual a la Universidad.", "Lo presenta el Rector sobre el año inmediatamente anterior, con los logros relacionados con las metas e indicadores del PDU, y se difunde mediante la estrategia de participación ciudadana y rendición de cuentas."], "k": 2, "e": "Art. 6 del Acuerdo 06 de 2021: Informe de Gestión Institucional y rendición de cuentas. Distractores: A y B confunden instrumentos y responsables.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 14; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-15", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un auditor pide evidencia de cómo un objetivo de calidad se conecta con la planeación estratégica. ¿Qué documento institucional lo evidencia?", "o": ["La matriz de despliegue de objetivos de calidad, que relaciona cada objetivo con los proyectos del plan de acción y su articulación con la planeación estratégica.", "El manual de funciones de cada cargo.", "El calendario académico."], "k": 0, "e": "Matriz de despliegue de objetivos de calidad (Anexo 02 de la revisión por la dirección). Distractores: B y C son documentos reales, pero no cumplen esa función.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 15; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-16", "comp": "M2", "fix": 1, "tema": "R", "nivel": "A", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un aspirante debe proponer tres acciones para la Dirección de Talento Humano. ¿Qué conjunto está mejor justificado en los instrumentos de planeación?", "o": ["Celebrar fechas especiales, renovar el mobiliario y cambiar el logo de la dependencia.", "Reducir la planta para disminuir gastos, aunque contradiga las metas del PDU.", "(1) Plan de inducción con módulo COGUI+ para el personal que ingrese por carrera (5.1.4); (2) programa de formación en herramientas digitales (Estrategia 5.2 PG); (3) indicador de impacto de las capacitaciones con concepto del jefe inmediato (OM ICONTEC 2024)."], "k": 2, "e": "Rúbrica de nivel alto de la Evidencia 3 (propuesta operativa para una dependencia): justificación con la Prioridad 5.1 (estructura organizacional y planta administrativa), la Estrategia 5.2 del Plan de Gobierno (planta de personal administrativo) y los hallazgos de ICONTEC 2019-2025. Distractores: A son acciones genéricas (nivel bajo). B contradice el PDU.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 16; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-17", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "ICONTEC 2025 recomendó fortalecer la planeación operacional del sistema de gestión. ¿Cuál interpretación es correcta?", "o": ["Que se debe eliminar la planeación estratégica de largo plazo.", "Que la planeación operativa (planes de acción anuales) debe funcionar como puente entre las estrategias institucionales y la ejecución operativa diaria.", "Que cada funcionario debe formular su propio plan de desarrollo."], "k": 1, "e": "Hallazgos ICONTEC 2019-2025 y niveles de planeación institucional (estratégica, táctica y operativa). Distractores: A y C malinterpretan la recomendación.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 17; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-18", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "En un documento interno se lee que la acreditación institucional de alta calidad «puede otorgarse por 6 o 9 años». ¿Cuál es la corrección pertinente?", "o": ["Es correcto; así lo establece el Acuerdo CESU 01 de 2025.", "El modelo vigente (Acuerdo CESU 01 de 2025) establece temporalidades de 6, 8 o 10 años; la Universidad renovó en 2021 por 6 años (Res. MEN 01088) y su meta del cuatrienio es renovar por 8 o 10 años.", "La acreditación es permanente una vez otorgada."], "k": 1, "e": "Acreditación institucional de alta calidad y Acuerdo CESU 01 de 2025 (modelo de acreditación); meta en el Decálogo del Compromiso por Unimagdalena. Distractores: A reproduce un dato desactualizado de la web institucional. C contradice el carácter temporal.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 18; clave y justificación del banco (clave B).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-19", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Bienestar Universitario quiere justificar un programa de talleres sobre diversidad funcional dirigido a personal administrativo que atiende público. ¿Con qué elementos de la planeación se articula mejor?", "o": ["Con el Propósito 2 del PDU (inclusión, interculturalidad y pluridiversidad) y la Estrategia 2.2 del Plan de Gobierno, que prevé talleres de acompañamiento a la diversidad funcional para docentes, personal administrativo y monitores.", "Con el Propósito 3 (creación, investigación e innovación), porque los talleres generan conocimiento.", "No requiere articulación, porque es una actividad de bienestar."], "k": 0, "e": "Propósito 2 (inclusión, interculturalidad y pluridiversidad), Estrategia 2.2 del Plan de Gobierno (inclusión de estudiantes con discapacidad) y Compromiso 2 del Plan de Gobierno. Distractores: B fuerza una articulación débil. C desconoce el art. 4 del Acuerdo 06.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 19; clave y justificación del banco (clave A).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-20", "comp": "M2", "fix": 1, "tema": "P", "nivel": "A", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "La Vicerrectoría de Investigación pide a un profesional administrativo apoyar la gestión de convocatorias externas de financiación. ¿Qué elementos de la planeación sustentan esta función de apoyo?", "o": ["Ninguno; la investigación es una función exclusiva de los docentes, por lo que el apoyo administrativo no se articula con metas del PDU.", "Solo el Propósito 5, porque toda tarea del personal administrativo pertenece por definición al propósito de sostenibilidad y resiliencia organizacional.", "Propósito 3 del PDU, prioridad 3.5 (diversificación de la financiación, meta de recursos externos equivalentes a 2,5 veces el fondo interno) y prioridad 3.2 (competencias de profesores y administrativos para gestionar CTeI); Compromiso 3 del Plan de Gobierno, Estrategia 3.4."], "k": 2, "e": "Propósito 3 (creación, investigación e innovación), Prioridad 3.5 (financiación de la CTeI), Prioridad 3.2 (capacidades para la investigación) y Compromiso 3 del Plan de Gobierno. Distractores: A ignora la iniciativa 3.2.2. B supone erróneamente que la función administrativa solo aporta al Propósito 5.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 20; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "BP-21", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Banco de práctica libre · Aluna Criterio", "q": "Un auditor interno pregunta cómo se evidencia que la política de calidad de COGUI+ es coherente con la dirección estratégica. ¿Qué respuesta es la más precisa?", "o": ["La política de calidad no requiere coherencia con la misión porque responde solo a ISO 9001.", "La coherencia se evidencia con la firma del rector en cada procedimiento.", "La política retoma la misión 2030 («contribuye a la transformación positiva y sostenible del territorio») y se despliega en objetivos de calidad medidos con indicadores del plan de acción; se revisa anualmente."], "k": 2, "e": "Política y objetivos de calidad de COGUI+ y Misión 2030 (requisito 5.2 de ISO 9001: política apropiada al propósito y que apoya la dirección estratégica). Distractores: A desconoce el requisito de la norma. B confunde aprobación documental con coherencia estratégica.", "f": "Banco de práctica libre (21 ítems, aula virtual Aluna Criterio), pregunta 21; clave y justificación del banco (clave C).", "n": "", "src": "original", "grp": "Banco de práctica libre"}, {"id": "PE-01", "comp": "M2", "fix": 1, "tema": "P", "nivel": "B", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un funcionario nuevo pregunta qué instancia aprobó el PDU 2020-2030 y con qué fundamento. La respuesta correcta es:", "o": ["El Ministerio de Educación Nacional, mediante resolución, en ejercicio de la inspección y vigilancia.", "El Rector, mediante resolución rectoral, por ser el representante legal.", "El Consejo Superior, mediante el Acuerdo Superior 06 de 2021, a propuesta del Rector, en ejercicio de la autonomía universitaria (art. 69 C.P., Ley 30 de 1992) y del Estatuto General."], "k": 2, "e": "El PDU 2020-2030 lo aprobó el Consejo Superior con el Acuerdo Superior 06 del 2 de julio de 2021 (guía de estudio, glosario y fuentes). El Ministerio no aprueba los planes de la Universidad y el Rector propone, no aprueba.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-02", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un servidor considera que formular y hacer seguimiento a planes es una «práctica opcional» de la Universidad. ¿Qué norma, citada en el acto de aprobación del PDU, contradice esa idea?", "o": ["La Ley 1437 de 2011, que regula el procedimiento de acreditación.", "La Ley 152 de 1994, que establece la planeación como principio de funcionamiento de todas las entidades públicas y la planificación como actividad continua de formulación, aprobación, ejecución, seguimiento y evaluación.", "Ninguna; la autonomía universitaria exime a la Universidad de planear."], "k": 1, "e": "La Ley 152 de 1994 (Ley Orgánica del Plan de Desarrollo) aparece en el marco normativo de la Sesión 2. La Ley 1437 de 2011 es el código administrativo, no regula la acreditación, y la autonomía universitaria no exime de planear.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-03", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "En un taller de inducción, un auxiliar administrativo afirma que los cinco propósitos del PDU son: calidad; inclusión; investigación; presencia glocal; transformación positiva del territorio. ¿Cuál es la corrección adecuada según el Acuerdo Superior 06 de 2021?", "o": ["Los propósitos 4 y 5 son «Universidad expandida y comprometida con el territorio» y «Universidad comprometida con la sostenibilidad y la resiliencia organizacional»; la «presencia glocal» y la «transformación positiva» son componentes de la visión.", "La lista es correcta; los propósitos coinciden con los componentes de la visión 2030.", "Los propósitos son siete y coinciden con los valores institucionales."], "k": 0, "e": "El PDU tiene cinco propósitos: calidad, inclusión, investigación, Universidad expandida y comprometida con el territorio, y sostenibilidad y resiliencia organizacional. Confundir propósitos con componentes de la visión es el error de «confusión de categorías».", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-04", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un jefe de dependencia sostiene que, con la llegada del Plan de Gobierno 2024-2028, el PDU 2020-2030 «quedó sin efecto». ¿Cuál es la interpretación correcta?", "o": ["El Plan de Gobierno reemplaza al PDU durante el cuatrienio, porque recoge el programa del rector elegido y sus metas son las únicas exigibles en ese periodo.", "El Plan de Gobierno se organiza sobre los cinco compromisos del PDU y debe articularse con él (art. 4, Acuerdo 06 de 2021); acelera el cumplimiento de las metas 2030.", "Ambos planes son independientes: cada dependencia elige cuál seguir según la naturaleza de sus funciones y lo informa en su plan de acción."], "k": 1, "e": "El art. 4 del Acuerdo Superior 06 de 2021 ordena que los planes de gobierno se articulen con el PDU; el Plan de Gobierno acelera, no sustituye, las metas 2030 (guía de estudio, ítem 2; SB-02). A invierte la jerarquía y C es unilateral.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-05", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un técnico administrativo detecta que un formato que él mismo diligenció tiene un error que afecta un pago a un proveedor. ¿Qué actuación es coherente con el valor de Responsabilidad definido por la Universidad?", "o": ["Esperar a que el proveedor reclame, pues el error aún no ha sido detectado por otros.", "Corregir el valor directamente en el sistema sin dejar registro, para no generar alarma.", "Informar a su jefe, corregir el documento siguiendo el procedimiento y registrar la acción para evitar su repetición."], "k": 2, "e": "El PDU define la Responsabilidad como responsabilidad personal, predicar con el ejemplo y tomar medidas cuando algo está mal. A desplaza la responsabilidad y B es informalidad: actúa sin registro ni procedimiento.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-06", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Se pide ubicar la estrategia del Plan de Gobierno «Formación Avanzada para administrativos y jornadas de capacitación en herramientas digitales». ¿En qué compromiso del Plan de Gobierno y prioridad del PDU se ubica con mayor coherencia?", "o": ["Compromiso 5 (sostenibilidad y resiliencia organizacional), Estrategia 5.2 – Prioridades 5.1 y 5.2 (planta y cultura organizacional).", "Compromiso 1 (calidad) – Prioridad 1.4 (capacidades docentes).", "Compromiso 3 (investigación) – Prioridad 3.3 (formación de investigadores)."], "k": 0, "e": "La Formación Avanzada para el personal administrativo está en el Compromiso 5 del Plan de Gobierno, Estrategia 5.2 (planta de personal administrativo), coherente con las prioridades 5.1 y 5.2 del PDU. Las otras opciones se refieren a docentes e investigadores.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-07", "comp": "M2", "fix": 1, "tema": "R", "nivel": "B", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Una profesional formula por primera vez el plan de acción de su grupo de trabajo. ¿Qué elementos mínimos debe contener cada acción para permitir su seguimiento?", "o": ["Solo la descripción de la actividad y la firma del jefe.", "Articulación con la prioridad/estrategia, meta, actividades, responsable, plazo, recursos (presupuesto) e indicador con su fórmula.", "El listado de funciones del manual de funciones de cada cargo."], "k": 1, "e": "El Plan de Acción es el instrumento anual con proyectos, indicadores, metas, responsables y presupuesto (guía de estudio, glosario); la Sesión 2 lista proyecto, meta, actividades, responsable, recursos, plazo e indicador con fórmula, línea base y meta.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-08", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un grupo de estudiantes solicita información sobre el avance de las metas del Plan de Gobierno. ¿Qué estrategia del Plan de Gobierno orienta la respuesta institucional?", "o": ["La Estrategia 3.2, cultura de innovación y emprendimiento, porque las plataformas de conexión permiten intercambiar información con los estudiantes.", "Ninguna; la información sobre el avance de metas se considera reservada hasta el cierre del cuatrienio, cuando se presenta el informe final de gobierno.", "La Estrategia 5.5, transparencia y democracia participativa: gobierno abierto, acceso a la información de gestión y un sistema de monitoreo y evaluación que rinda cuentas a la comunidad."], "k": 2, "e": "El Plan de Gobierno incluye la estrategia de transparencia y democracia participativa (gobierno abierto, acceso a la información y rendición de cuentas). La información de gestión no es reservada.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-09", "comp": "M2", "fix": 1, "tema": "R", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Para la meta «90 % de solicitudes atendidas satisfactoriamente para el usuario», un grupo propone como indicador «número de capacitaciones realizadas sobre atención al usuario». ¿Qué observación técnica es pertinente?", "o": ["El indicador propuesto mide una actividad (gestión/proceso), no el resultado esperado; se requiere un indicador de resultado como (solicitudes atendidas satisfactoriamente / solicitudes recibidas) × 100.", "Es adecuado, porque toda capacitación mejora la atención.", "No se requiere indicador porque la meta ya está en el PDU."], "k": 0, "e": "La meta 2030 de la iniciativa 5.1.3 es de resultado; un indicador de actividad no muestra si la dependencia se acerca a ella (guía de estudio, ítem 5; SB-01).", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-10", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "La oficina de Admisiones propone digitalizar la expedición de constancias que hoy es presencial. ¿Con qué metas institucionales se articula mejor la iniciativa?", "o": ["Con la meta del Plan de Gobierno de fortalecer el modelo de residencias universitarias para 100 estudiantes de zonas rurales y vulnerables.", "Con la meta del Plan de Gobierno de 100 trámites administrativos y académicos en ambientes digitales y con la prioridad 5.4 del PDU (transformación digital).", "Con la estrategia de crear nuevos grupos de investigación en plurilingüismo y ciencias del deporte, porque toda digitalización produce conocimiento."], "k": 1, "e": "El Decálogo del Plan de Gobierno se propone 100 trámites en ambientes digitales, que aporta a la prioridad 5.4 (transformación digital) y a la iniciativa 5.4.2 del PDU (guía de estudio, ítem 6).", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-11", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "Un aspirante debe indicar qué dependencia lidera el proceso «Evaluación de la Gestión y Rendición de Cuentas» del Sistema COGUI+. La respuesta correcta es:", "o": ["La Secretaría General.", "La Oficina de Control Interno, que lidera el proceso de Evaluación Independiente.", "La Oficina Asesora de Planeación."], "k": 2, "e": "Según el mapa de procesos de la Universidad (justificación oficial de la prueba), el proceso 20, «Evaluación de la Gestión y Rendición de Cuentas», está a cargo de la Oficina Asesora de Planeación; Control Interno lidera el proceso 21, «Evaluación Independiente». La opción B confunde los dos procesos de evaluación y la A no corresponde.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre). Antes estaba por verificar; la clave oficial confirma la Oficina Asesora de Planeación.", "src": "original", "grp": "Prueba de entrada"}, {"id": "PE-12", "comp": "M2", "fix": 1, "tema": "R", "nivel": "B", "tipo": "Prueba de entrada · Presaberes · Aluna Criterio", "q": "En la sesión virtual se pide clasificar actividades institucionales según el ciclo PHVA: (1) formular el plan de acción; (2) ejecutar proyectos; (3) presentar la evaluación anual del plan al Consejo de Planeación; (4) reformular el plan del año siguiente con las mejoras propuestas. ¿Cuál clasificación es correcta?", "o": ["1-Planear, 2-Hacer, 3-Verificar, 4-Actuar.", "1-Hacer, 2-Planear, 3-Actuar, 4-Verificar.", "1-Verificar, 2-Hacer, 3-Planear, 4-Actuar."], "k": 0, "e": "Presentación Sesión 2 (seguimiento, ajuste y mejora): Planear = formular el plan de acción anual; Hacer = ejecutar los proyectos; Verificar = seguimiento trimestral y evaluación; Actuar = mejoras y reformulación del siguiente plan.", "f": "Prueba de entrada · Presaberes (12 ítems, aula virtual Aluna Criterio), con clave y justificación oficial.", "n": "Clave oficial: confirmada con la retroalimentación del aula virtual (Presaberes, respuestas publicadas el 22 de noviembre).", "src": "original", "grp": "Prueba de entrada"}, {"id": "SC-01", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Simulacro tipo CNSC · Aluna Criterio", "q": "Un coordinador de Servicios Generales recibe reportes repetidos de fallas de iluminación en un bloque de aulas. Su equipo propone elaborar primero un diagnóstico documental exhaustivo de tres meses antes de intervenir. Aplicando los principios generales de gestión del PDU, la actuación más adecuada es:", "o": ["Esperar el diagnóstico completo, porque una necesidad bien documentada es preferible a una solución parcial.", "Resolver de inmediato las fallas críticas con entregas pequeñas y verificables, y documentar en paralelo lo necesario para la mejora del proceso.", "Trasladar el caso a la Rectoría, porque los principios de gestión solo aplican a directivos."], "k": 1, "e": "Los principios generales de gestión ágil establecen: «preferimos un problema resuelto sobre una necesidad bien documentada» y «pequeñas entregas de resultados sobre grandes proyectos». Distractores: A invierte literalmente el principio. C desconoce que la política aplica a toda la comunidad.", "f": "Simulacro tipo CNSC (15 ítems, sesión presencial, aula virtual Aluna Criterio), pregunta 1; clave y justificación publicadas por el aula (clave B).", "n": "", "src": "original", "grp": "Simulacro CNSC"}, {"id": "SC-02", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", "tipo": "Simulacro tipo CNSC · Aluna Criterio", "q": "La Dirección de Talento Humano debe rediseñar el procedimiento de solicitud de vacaciones. Un directivo sugiere contratar una consultora externa; otro propone talleres cortos con funcionarios y jefes que usan el trámite. ¿Qué decisión es coherente con los principios del PDU?", "o": ["Realizar los talleres con los usuarios del trámite, documentar la mejora en el sistema de gestión y medir su efecto.", "Contratar la consultora, porque garantiza objetividad frente a los usuarios internos.", "Mantener el procedimiento actual hasta que la Oficina Asesora de Planeación lo cambie de oficio."], "k": 0, "e": "Principio «co-creando con la comunidad»: «consultamos a nuestros empleados y usuarios para mejorar nuestros servicios por encima de grandes firmas consultoras»; los cambios los adoptan los líderes de proceso modificando procedimientos (acciones correctivas y mejora continua). Distractores: B contradice el principio. C traslada indebidamente una responsabilidad que es del líder de proceso.", "f": "Simulacro tipo CNSC (15 ítems, sesión presencial, aula virtual Aluna Criterio), pregunta 2; clave y justificación publicadas por el aula (clave A).", "n": "", "src": "original", "grp": "Simulacro CNSC"}, {"id": "SC-03", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "A", "tipo": "Simulacro tipo CNSC · Aluna Criterio", "q": "La Rectoría anuncia el rediseño de la Oficina de Aseguramiento de la Calidad como Oficina de Gestión de la excelencia institucional. ¿Qué cadena de planeación sustenta la decisión?", "o": ["Plan de Gobierno, Estrategia 4.3 (deporte, arte y cultura) → PDU, Prioridad 4.6 (sistema cultural y museográfico), porque la excelencia incluye la visibilidad cultural.", "Se trata de una decisión administrativa autónoma de la Rectoría, que por su naturaleza organizacional no requiere sustento en los instrumentos de planeación.", "Plan de Gobierno, Estrategia 1.1 (línea II) → PDU, Prioridad 1.1 (iniciativa 1.1.2: capacidades técnicas de la Oficina de Gestión para la excelencia institucional)."], "k": 2, "e": "Estrategia 1.1 del Plan de Gobierno (calidad educativa e innovación tecnológica) → Prioridad 1.1 del PDU (arquitectura integrada para la excelencia institucional). Distractores: A es incoherente temáticamente. B ignora el art. 4 del Acuerdo 06.", "f": "Simulacro tipo CNSC (15 ítems, sesión presencial, aula virtual Aluna Criterio), pregunta 3; clave y justificación publicadas por el aula (clave C).", "n": "", "src": "original", "grp": "Simulacro CNSC"}, {"id": "SC-04", "comp": "M2", "fix": 1, "tema": "Q", "nivel": "A", "tipo": "Simulacro tipo CNSC · Aluna Criterio", "q": "Al construir la matriz de coherencia, un equipo encuentra una meta del Plan de Gobierno sin prioridad equivalente en el PDU. ¿Cuál es el tratamiento metodológico adecuado?", "o": ["Eliminar la meta del Plan de Gobierno porque no está en el PDU.", "Registrarla como brecha, analizar a qué propósito aporta y, si se requiere ajustar metas del PDU, seguir la ruta del art. 7: propuesta de la OAP, visto bueno del Consejo de Planeación y aprobación del Consejo Superior.", "Incorporarla directamente al PDU mediante una circular de la dependencia."], "k": 1, "e": "Matriz de coherencia PDU – Plan de Gobierno (paso 4) y reprogramación y ajuste de metas (art. 7 del Acuerdo 06 de 2021). Distractores: A es una decisión que no corresponde al analista. C vulnera la competencia del Consejo Superior.", "f": "Simulacro tipo CNSC (15 ítems, sesión presencial, aula virtual Aluna Criterio), pregunta 4; clave y justificación publicadas por el aula (clave B).", "n": "", "src": "original", "grp": "Simulacro CNSC"}, {"id": "SC-05", "comp": "M2", "fix": 1, "tema": "S", "nivel": "I", "tipo": "Simulacro tipo CNSC · Aluna Criterio", "q": "Ante una no conformidad de auditoría interna, una dependencia propone como única acción «capacitar al personal», sin análisis de causas; seis meses después la acción sigue abierta. ¿Qué orientación es la correcta?", "o": ["Realizar el análisis de causa raíz, definir acciones que eliminen la causa con responsables y fechas, y verificar su eficacia; ICONTEC ha recomendado profundizar el análisis de causas.", "Mantener la acción, porque la capacitación siempre es eficaz.", "Cerrar la no conformidad como eficaz, ya que pasó el tiempo de seguimiento."], "k": 0, "e": "Acciones correctivas y mejora continua; hallazgos ICONTEC 2019-2025 (2019, 2023-2025); meta de cierre en seis meses (Decálogo del Compromiso por Unimagdalena). Distractores: B confunde actividad con eficacia. C cierra sin evidencia.", "f": "Simulacro tipo CNSC (15 ítems, sesión presencial, aula virtual Aluna Criterio), pregunta 5; clave y justificación publicadas por el aula (clave A).", "n": "", "src": "original", "grp": "Simulacro CNSC"}, {"id": "SC-06", "comp": "M2", "fix": 1, "tema": "P", "nivel": "I", | C30 | Cartilla Ley 30 de 1992 (36 págs.) | 58 preguntas-respuesta (P1–P58), ejercicios, cuestionario A1–A31, simulacro de 10 preguntas con clave |

## 1. Idea central del módulo

El servidor administrativo de una universidad oficial vive en un **sistema dual**: es servidor público (art. 123 C.P.) sometido al mérito (art. 125) y a los principios de la función administrativa (art. 209), pero dentro de un **régimen especial** derivado de la autonomía universitaria (art. 69 C.P. y Ley 30 de 1992). Consecuencia: **primero el estatuto de la universidad; la Ley 909 solo llena vacíos (art. 3, num. 2)**.

Los tres resultados de aprendizaje (PPT d.7; C909 p.2):
1. Ubicar a la Universidad del Magdalena **fuera de la Rama Ejecutiva**, como ente universitario autónomo equiparado a órgano autónomo (C-589/97).
2. Distinguir clases de servidores y de empleos (carrera, LNyR, período fijo, temporal, provisional) y diferenciarlos del trabajador oficial y del contratista.
3. Explicar por qué la Ley 909 opera **supletoriamente** frente al estatuto expedido por el Consejo Superior.

---

## 2. Mapa temático

### Tema A. Estructura del Estado y ubicación de la universidad
- Art. 113 C.P.: tres ramas + órganos de control + organización electoral + órganos autónomos e independientes (Banco de la República, CNSC, CAR, entes universitarios autónomos). [C909 P1, P8; PPT d.9–10]
- Rama Ejecutiva: sector central (Presidencia, ministerios, departamentos administrativos, superintendencias y UAE **sin** personería) y sector descentralizado (establecimientos públicos, EICE, superintendencias y UAE **con** personería, ESE, etc.). [C909 P3–P4]
- Descentralización / desconcentración / delegación (y delegación de firma). [C909 P5]
- Establecimiento público vs ente universitario autónomo (cuadro comparativo). [C909 P9]
- Universidades: **no** son establecimientos públicos ni hacen parte de la administración central o descentralizada (C-220/97, C-589/97, C-560/00). Sin control de tutela; vínculo con el MEN solo en **políticas y planeación del sector**. [PPT d.11; C30 P31]
- Autonomía ≠ ausencia de controles: inspección y vigilancia, control fiscal. [PPT d.32–33; C30 P2]

### Tema B. Fundamento constitucional
- Art. 6 (responsabilidad), 121 (legalidad/competencia), 122 (funciones detalladas; planta y apropiación), 123 (servidores), 124 (responsabilidad disciplinaria por ley), 125 (carrera y mérito), 126 (nepotismo), 128 (doble asignación), 129 (honores de gobiernos extranjeros), 130 (CNSC), 209 (principios), 211 (delegación). [C909 P2, P10–P17]
- Educación: arts. 27 y 71 (libertades), 67 (derecho y servicio público con función social), 68 (particulares), 69 (autonomía), 189 y 211 (inspección y vigilancia), 350 y 366 (gasto social). [C30 P1–P9]

### Tema C. Servidores públicos y empleos
- Tres clases de servidores (art. 123): miembros de corporaciones públicas, empleados públicos, trabajadores oficiales. [C909 P11; PPT d.19]
- Empleado público (legal y reglamentario) vs trabajador oficial (contrato de trabajo) vs contratista (no es servidor; sin subordinación). [C909 P13; C-154/97]
- Tipos de empleo (Ley 909, art. 1): carrera, LNyR, período fijo, temporal. **Encargo y provisionalidad NO son tipos de empleo**: son mecanismos para proveer vacantes. [PPT d.20]
- Estabilidad: carrera = reforzada; LNyR = mínima (retiro discrecional no motivado); provisional = intermedia (acto motivado; cede ante el ganador). [C909 P12]
- Docentes (Ley 30, arts. 71–74): exclusiva, tiempo completo (40 h), medio tiempo = empleados públicos de régimen especial, no LNyR (salvo período de prueba); cátedra = contrato de prestación de servicios por períodos académicos; ocasionales = < 1 año, por resolución. C-006/96: cátedra y ocasionales tienen relación subordinada y prestaciones proporcionales. [C30 P41–P42; PPT d.21, 36]

### Tema D. Ley 909: objeto, principios y campo de aplicación
- Objeto: regular el sistema de empleo público y los principios de la gerencia pública. [C909 P19]
- Principios (art. 2, mod. Ley 2418/2024): igualdad, mérito, accesibilidad universal, moralidad, eficacia, economía, imparcialidad, transparencia, celeridad y publicidad. [C909 P21]
- Tres criterios: profesionalización; flexibilidad sin detrimento de la estabilidad; responsabilidad (evaluación y acuerdos de gestión). [C909 P22]
- Aplicación **integral** (art. 3, num. 1): Rama Ejecutiva nacional y territorial, IES **no** organizadas como entes autónomos, etc. Aplicación **supletoria** (art. 3, num. 2): carreras especiales, incluidos los entes universitarios autónomos. [C909 P23–P24]
- Carrera general (Ley 909; CNSC) / específica (origen legal: DIAN, Inpec…; vigila la CNSC) / especial (origen constitucional: Rama Judicial, Fiscalía, Procuraduría, contralorías, universidades estatales; fuera de la CNSC). [C909 P25–P26]
- Lo que no aplica o aplica distinto en la universidad: CNSC, Comisión de Personal, art. 46 (aprobación DAFP de plantas), gerencia pública, LNyR definidos por el estatuto. [C909 P27; PPT d.22–23]

### Tema E. Ley 909: clasificación, planeación y provisión
- Regla: carrera. Excepciones taxativas: elección popular, período fijo, trabajadores oficiales, comunidades indígenas, LNyR del art. 5. [C909 P28]
- Criterios de LNyR (art. 5): dirección/conducción/orientación; especial confianza; manejo directo de bienes, dineros o valores; escoltas; asesores de mesas directivas de asambleas y concejos. Importan las funciones, no el nombre (C-405/95). Ley no puede declarar LNyR a rector, vicerrector, decano (C-195/94). [C909 P29]
- Cambio de naturaleza del empleo (art. 6). [C909 P30]
- Empleo temporal (art. 21): excepcional; consultoría máx. 12 meses; ingreso con listas vigentes o evaluación de capacidades; no genera carrera (C-288/14). [C909 P32]
- Jornada: regla tiempo completo (art. 22). [C909 P33]
- Provisión (arts. 23–25), encargo (requisitos y duración), provisionalidad, comisión para LNyR o período (art. 26). [C909 P34–P38]

### Tema F. Carrera, concursos, evaluación y permanencia
- Carrera: sistema técnico de administración de personal; principios del art. 28. [C909 P39]
- Concurso de ascenso: 30 % ascenso / 70 % abierto; niveles asesor, profesional, técnico y asistencial. [C909 P40]
- Reserva de 7 % para personas con discapacidad, con ajuste hacia arriba. [C909 P41]
- No hay ingreso a carrera sin concurso (C-588/09); la convocatoria es la norma del concurso (SU-446/11). [C909 P42; PPT d.18]
- Permanencia (art. 37), evaluación del desempeño (arts. 38–40), capacitación (art. 36). [C909 P43–P46]

### Tema G. Retiro, protecciones y situaciones administrativas
- Causales de retiro (art. 41); carrera = reglado y motivado; LNyR = discrecional y no motivado (no arbitrario). [C909 P47–P48; PPT d.25]

## 3. Diferencias que más se confunden

| Par de conceptos | Clave para no confundirlos |
|---|---|
| Servidor público vs empleo | Art. 123 identifica a la **persona**; art. 125 clasifica el **cargo** (PPT d.19). |
| Tipo de empleo vs forma de provisión | Carrera, LNyR, período fijo, temporal son tipos; encargo y provisionalidad son mecanismos de provisión (PPT d.20–21). |
| Empleado público vs trabajador oficial vs contratista | Legal y reglamentario / contrato de trabajo / prestación de servicios sin subordinación (C909 P13). |
| Descentralización vs desconcentración vs delegación | Otra persona jurídica con tutela / dependencia de la misma entidad / transferencia del ejercicio con ley previa y acto escrito, reasumible (C909 P5). |
| Delegación de funciones vs delegación de firma | En la de firma no hay traslado de competencia (C-727/00). |
| Establecimiento público vs ente universitario autónomo | Rama Ejecutiva y tutela / fuera de la Rama Ejecutiva, solo vinculado al MEN en políticas y planeación (C909 P9). |
| Carrera general vs específica vs especial | Ley 909 + CNSC / origen legal, vigila CNSC / origen constitucional, fuera de la CNSC (C909 P26). |
| Aplicación integral vs supletoria de la Ley 909 | Art. 3 num. 1 vs art. 3 num. 2 (C909 P23–P24). |
| Encargo vs comisión | Encargo: cubrir vacante, 3+3 meses, no pierde carrera. Comisión: ejercer LNyR o período, 3+3 años (tope 6), conserva carrera; sin comisión, pierde derechos (C909 P38). |
| Retiro de carrera vs de LNyR | Reglado y motivado / discrecional, no motivado, no arbitrario (C909 P48). |
| Carácter académico vs origen de las IES | "Universidad" es carácter académico; "economía solidaria" es origen (PPT d.30). |
| Consejo Superior vs Consejo Académico | Máximo órgano de dirección y gobierno / máxima autoridad académica, presidida por el Rector (C30 P35–P39). |
| Art. 86 vs art. 87 (Ley 30) | 86: aportes base que crecen mínimo ICES (o IPC si es mayor); 87: aporte adicional ≥ 70 % del crecimiento real del PIB, que **no** hace parte de la base (C30 P48–P49). |

## 8. Contradicciones e imprecisiones detectadas entre documentos

No las resuelvo por suposición; las señalo para que sepas qué versión sustenta cada documento.

1. **Principios del art. 209 C.P.** La PPT (d.18) atribuye al art. 209 "igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y **transparencia**". La C909 (P2) da la lista del art. 209 con **publicidad** (no transparencia) y explica que transparencia, mérito y accesibilidad universal los agrega la Ley 909 (art. 2, mod. Ley 2418/2024). Además, la PPT (d.6) dice "igualdad, moralidad, celeridad y **mérito** (Art. 209)", cuando el mérito está en el art. 125. → En las preguntas del banco sigo la C909, que es la que cita el texto.
2. **Estabilidad del provisional.** La PPT (d.18) dice que su desvinculación "solo cede ante el ganador del concurso". La C909 (P12, P49; C-640/12) precisa que también puede ser retirado por causas disciplinarias, baja calificación o razones del servicio, siempre con acto motivado. → La PPT es incompleta.
3. **Docentes de cátedra y ocasionales.** La PPT (d.21) los presenta como "contratista; no es empleado público ni trabajador oficial" (cátedra) y "no es empleado público ni trabajador oficial" (ocasional). La C30 (P42) recuerda que la C-006/96 declaró inexequible el aparte del art. 73 que calificaba a los de cátedra como simples contratistas y reconoció relación subordinada y prestaciones proporcionales. La propia PPT (d.36) advierte que deben leerse con la jurisprudencia. → La forma de vinculación (contrato por períodos académicos / resolución) sí es coincidente; la calificación de "contratista" es la que la Corte matizó.
4. **Presidencia del CSU.** La PPT (d.35) solo menciona Ministro (nacional) y Gobernador (departamental). La C30 (P36) añade el **alcalde** en las universidades distritales y municipales. → Omisión, no contradicción.
5. **Errata interna de la C30.** La clave del Ejercicio 1 (Anexo A) responde un "Caso 4" que no aparece en el ejercicio (solo hay 3 casos).
6. **Advertencias de las propias cartillas.** Ambas declaran que los artículos de la Constitución, la Ley 489 y algunos condicionamientos de sentencias (C-073/06, C-175/07, C-1230/05, C-220/97) se citan sin verificar el texto oficial o la parte resolutiva. Las preguntas del banco evitan exigir esos condicionamientos exactos.
