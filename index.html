## 2. Mapa de temas

**J. Régimen disciplinario (Leyes 1952 de 2019 y 2094 de 2021)**
- Finalidad: proteger la función pública y exigir deberes, con garantías. No repara daños ni reemplaza lo penal.
- Constitución: art. 6 (servidores responden por omisión o extralimitación), 29, 123, 124, 209, 269, 277.
- Autonomía de la acción disciplinaria: objeto y elementos propios; coexiste con penal y fiscal.
- C-030 de 2023: funciones disciplinarias de la Procuraduría son **administrativas, no jurisdiccionales**.
- Vigencia general del código reformado: **29 de marzo de 2022** (con excepciones). Decreto 1656 de 2021 corrigió yerros de la Ley 2094.
- Destinatarios: servidores públicos y particulares en los supuestos de ley (arts. 25 y 70): función pública, recursos públicos.
- Principios: presunción de inocencia, investigación integral, culpabilidad (prohibida la responsabilidad objetiva), separación entre instrucción y juzgamiento.
- Ilicitud sustancial: afectación sustancial del deber funcional sin justificación; no basta lo formal ni se exige daño económico.
- Culpabilidad: dolo; culpa gravísima y grave. **La culpa leve no es sancionable** (art. 29).
- Faltas: gravísimas (catálogo legal), graves y leves (criterios).
- Sanciones: destitución e inhabilidad general; suspensión e inhabilidad especial; multa; amonestación escrita (C-461 de 2023). Un llamado de atención informal no es sanción.
- Extinción (art. 32): muerte, caducidad, prescripción. **El desistimiento del quejoso no extingue la acción.**
- Prescripción (art. 33): 5 años (12 para faltas del art. 52); se interrumpe con la notificación del fallo de primera instancia; luego 2 años (3 para art. 52) para notificar la segunda.
- Mapa procesal: indagación previa máximo 6 meses no prorrogable; investigación 6 a 18 meses (términos perentorios no preclusivos); imputación (pliego de cargos con imputación fáctica y jurídica); juicio ordinario o verbal; confesión y aceptación de cargos; nulidad por falta de defensa técnica; recursos de reposición y apelación.
- Esquema de la cartilla: noticia → evaluación inicial → indagación/investigación → cierre → cargos o terminación → juzgamiento → fallo → recursos → ejecución y registro.

**K. Acoso sexual y violencias de género (Ley 2365 de 2024 y Ac. Sup. 10 de 2019)**
- Ley 2365, art. 2: acoso sexual en relaciones de poder **vertical u horizontal**, una o varias veces, en el contexto laboral y en IES.
- Art. 11 (empleadores): política interna; garantizar derechos; informar sobre la Fiscalía; remitir quejas; publicación **semestral** anonimizada y reporte al Sivige en los **últimos 10 días** del semestre. Par. 3: si el acosador es el superior jerárquico, la queja va a la **inspección de trabajo**.
- Art. 13: garantías (traslado, teletrabajo, no interacción, terminar contrato sin preaviso, confidencialidad, no confrontación); medidas 3 a 6 en **5 días hábiles**.
- Art. 14: el despido dentro de los **6 meses** siguientes a la queja carece de efecto y se presume retaliación; multa de 1 a 5000 SMLDV.
- Art. 15: la queja ante el empleador no es requisito de procedibilidad para la denuncia penal ni la queja disciplinaria.
- Arts. 18–19: modifican el CGD (art. 53.5 falta gravísima; art. 160A enfoque diferencial e interseccional en la prueba).
- Ac. Sup. 10 de 2019: Bienestar Universitario coordina el **GAV**; protege a estudiantes, docentes, egresados, administrativos y contratistas personas naturales; ruta de 6 momentos (reporte, atención inicial, orientación y atención, medidas preventivas y de cuidado, seguimiento, cierre); menores de 18: reporte inmediato al **ICBF**; el cierre del GAV no extingue otras actuaciones; Res. 316 de 2024 regula el procedimiento sancionatorio para cátedra, ocasionales y contratistas.

**L. Convivencia laboral (Res. 3461 de 2025)**
- Deroga las Res. 652 y 1356 de 2012. Fundamentos: Convenio 190 OIT, Ley 1010 de 2006, Ley 2209 de 2022 (caducidad de 3 años), Ley 2466 de 2025.
- Conformación: menos de 5 trabajadores, 1 y 1; más de 5 y menos de 20, 1 y 1 con suplentes; más de 20, 2 y 2 con suplentes. Siempre en igual número. No pueden integrarlo quienes tuvieron queja en contra o fueron víctimas en el año anterior.
- Periodo: **2 años**. Reglamento propio con acuerdos de confidencialidad.
- Rol: preventivo, orientador, conciliador y canalizador; **no determina si hay acoso**.
- Términos: recibir queja 5 días calendario; examinar 5 (ampliable 10, máximo 15); remitir en máximo 15 días calendario; informes trimestrales y anual; procedimiento completo máximo **65 días calendario**.
- Acoso sexual: **el comité no es competente** (no conciliable).
- Sector público sin acuerdo: remisión a Procuraduría o Personería. Sector privado: informa a la alta dirección y cierra; el trabajador acude al inspector o al juez.
- Reuniones ordinarias mensuales (quórum mitad más uno); extraordinarias con cada queja. ARL reporta mensualmente al Ministerio.

**M. Estatuto General (Ac. Sup. 16 de 2023)**
- Ente universitario autónomo del orden departamental. Ley 909 supletoria.
- CSU: lo preside el Gobernador; 10 integrantes (Rector con voz y sin voto); sesiona al menos 1 vez al mes; 5 miembros para deliberar y **5 votos** para decidir; presupuesto a más tardar el **15 de diciembre**; miembros no son servidores públicos (art. 34); abstención solo por conflicto, impedimento o ausencia en la discusión (art. 31); actos: Acuerdos, Resoluciones, Circulares, Comunicados (art. 32).
- Consejo Académico: al menos 2 veces al mes; mitad más uno para deliberar.
- Rector: 4 años, reelegible hasta 2 periodos más; vacancia temporal: Vicerrector Académico y luego Investigación, Extensión y Administrativo; terna con al menos 20 % del censo de cada estamento; contra sus actos particulares solo reposición (art. 138).
- 40 % de mujeres en cargos directivos de libre nombramiento; 4 principios de gobernanza (art. 9): primero la gente, gestión basada en resultados, adaptación dinámica al cambio, co-creando con la comunidad.

**N. Estatuto de Personal (Ac. Sup. 07 de 2026)**
- Comisión de Carrera: Rector, VR Administrativo, Director de Talento Humano y 3 representantes. Comisión de Personal: 2 del Rector y 2 de los funcionarios.
- Concursos: ascenso hasta 30 % (primero), abierto 70 %; 13 etapas; recursos contra resultados en 5 días hábiles (apelación ante Comisión de Carrera); lista de elegibles 2 años; desierto si nadie supera 60 %.
- Nombramiento: aceptar en 10 días; posesión en 10 días hábiles (+90); periodo de prueba 6 meses; sin calificación = superado con máxima.
- Desempeño: sobresaliente ≥ 85 %; satisfactorio > 60 % y < 85 %; no satisfactorio ≤ 60 % (2 periodos continuos = insubsistencia); concertación en 15 días hábiles; evalúa el jefe inmediato; recursos: reposición ante el evaluador y apelación ante la Comisión de Personal (art. 103).
- Situaciones: licencia no remunerada 60 + 30 días hábiles; encargo 3 + 3 meses (art. 134: puntaje; empate por antigüedad); comisión para cargo de libre nombramiento hasta 3 años prorrogables, máximo 6; desconexión laboral en trabajo a distancia (art. 122).
- Retiro: renuncia aceptada en máximo 30 días hábiles (art. 127); protecciones (art. 130); retén social (art. 156); prohibido asesorar en asuntos del cargo hasta 2 años después de dejarlo.
- Concurso especial transitorio: convocatoria en máximo 12 meses; curso de formación institucional certificable (art. 153).

**O. Política de Integridad y Buen Gobierno (Ac. Sup. 23 de 2019)**
- 6 valores: honestidad, confianza, justicia, respeto, responsabilidad, coraje.
- 6 preguntas para decidir; ante un "no", hablar. Canal VOCES: conducto regular o ciudadano@unimagdalena.edu.co / PQR. Cero represalias.
- Coordina su difusión la Oficina Asesora de Planeación. Rendición de cuentas: deber ético, parte del PAAC, audiencia pública en CSU ampliado.
- Órganos colegiados: impedimento (me aparto yo; el órgano decide de inmediato por mayoría simple) y recusación (otro pide que me aparte; causales art. 11 Ley 1437; se resuelve antes del fondo).
- Respaldo en el Estatuto de Personal: denunciar (art. 16 num. 11), no recibir dádivas (art. 17 num. 3), declararse impedido (art. 19).

## 3. Contradicciones e inconsistencias (no resueltas por suposición)

1. **Estatuto de Personal, art. 75 vs. art. 130 num. 5.** Embarazo en periodo de prueba: el art. 75 dice que el periodo se *suspende* y continúa; el art. 130 num. 5, que se *interrumpe* y se reinicia. La propia cartilla recomienda consultar a Talento Humano y a la Oficina Jurídica.
2. **Ley 2365, art. 2 vs. CGD art. 53.5.** La definición de acoso sexual incluye relaciones de poder vertical u horizontal; la falta gravísima del art. 53.5 (modificado por la misma ley) habla solo de relaciones verticales.
3. **Política de Integridad 2019 vs. Estatuto General 2023** (por ejemplo, honorarios de los consejeros). La cartilla resuelve que prevalece el Estatuto General.
4. **Res. 3461, art. 3.** Fija reglas para menos de 5, para más de 5 y menos de 20 y para más de 20 trabajadores: no dice expresamente qué pasa con exactamente 5 o exactamente 20.
5. **Claves de la cartilla del marco normativo.** No existen en el documento; las del portal están derivadas del texto y marcadas como tales.
6. **Mapa procesal**: aparece "Acoso laboral (conciliación obligatoria)" como procedimiento especial; la Res. 3461 presenta al comité como instancia conciliadora pero excluye el acoso sexual. Conviene no confundir acoso laboral con acoso sexual.
