<script id="casos" type="application/json">{"casos": [{"id": "C30-E1-1", "guia": "Cartilla Ley 30 · Ejercicio 1", "tema": "B", "oficina": "Oficina de Admisiones y Registro", "q": "Un aspirante no fue admitido y reclama que, como la educación es un derecho, la universidad no puede aplicar sus propios criterios de selección. El jefe de la oficina le pide proyectar la respuesta. ¿Qué artículos de la Constitución explican que la universidad pueda adoptar criterios objetivos de admisión y cuál es el límite de esa autonomía?", "r": "El artículo 69 garantiza la autonomía universitaria (darse directivas y regirse por sus estatutos) y el artículo 67 reconoce la educación como derecho y servicio público con función social. La universidad puede admitir a sus alumnos con criterios objetivos (Ley 30, art. 28; C-337/96), pero la autonomía se ejerce “de acuerdo con la ley”: no es absoluta.", "f": "C.P. arts. 67 y 69; Ley 30 art. 28; C-337/96. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E1-2", "guia": "Cartilla Ley 30 · Ejercicio 1", "tema": "B", "oficina": "Gestión de Talento Humano", "q": "Un compañero de la planta administrativa afirma que será ascendido a un cargo de carrera porque “el rector lo conoce”. Otro funcionario pregunta si, por trabajar en la universidad, ambos son servidores públicos. ¿Qué responde usted con base en los artículos 123 y 125 de la Constitución?", "r": "El artículo 123 considera servidores públicos a los empleados y trabajadores del Estado y de sus entidades descentralizadas; por tanto, quienes están en la planta de una universidad estatal lo son. El artículo 125 establece que los empleos son de carrera y que el ingreso y el ascenso se hacen por mérito: la sola recomendación del rector no basta, salvo las excepciones constitucionales y legales (por ejemplo, libre nombramiento y remoción).", "f": "C.P. arts. 123 y 125. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E1-3", "guia": "Cartilla Ley 30 · Ejercicio 1", "tema": "H", "oficina": "Secretaría General", "q": "Llega un oficio que anuncia una visita de inspección y vigilancia a la universidad. La Secretaria General le pide verificar quién tiene constitucionalmente esa función y si puede delegarla. ¿Qué le responde?", "r": "La inspección y vigilancia de la educación corresponde constitucionalmente al Presidente de la República (art. 189), quien puede delegarla (art. 211), por ejemplo en el Ministro de Educación Nacional (Ley 30, arts. 31 y 33).", "f": "C.P. arts. 189 y 211; Ley 30 arts. 31 y 33. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E2-1", "guia": "Cartilla Ley 30 · Ejercicio 2", "tema": "I", "oficina": "Secretaría del Consejo Superior", "q": "Usted proyecta el acta de la primera sesión del año de una universidad estatal del orden departamental. Debe indicar quién preside el Consejo Superior, si el Rector vota las decisiones y qué órgano designó al Rector. ¿Qué escribe en el acta y con qué artículos?", "r": "Preside el Gobernador, porque es una universidad departamental; el Rector asiste con voz y sin voto (art. 64); y el Rector es designado por el Consejo Superior Universitario (art. 66).", "f": "Ley 30 arts. 64 y 66. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E2-2", "guia": "Cartilla Ley 30 · Ejercicio 2", "tema": "I", "oficina": "Gestión de Talento Humano", "q": "Un funcionario administrativo pregunta dónde están regulados sus derechos, obligaciones, situaciones administrativas y régimen disciplinario, y si la universidad puede definir libremente las faltas por las que podría sancionarlo. ¿Qué le responde?", "r": "En el estatuto general de la universidad, que debe contener derechos, obligaciones, inhabilidades, situaciones administrativas y régimen disciplinario del personal administrativo, de acuerdo con las normas de función pública (Ley 30, art. 79; Ley 909 de 2004). La universidad no puede definir libremente las faltas: sus elementos estructurales están reservados a la ley y el procedimiento debe respetar el debido proceso, la defensa y la proporcionalidad (C-829/02).", "f": "Ley 30 art. 79; Ley 909; C-829/02. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E2-3", "guia": "Cartilla Ley 30 · Ejercicio 2", "tema": "I", "oficina": "Oficina de Contratación", "q": "Una dependencia pide pagar el mantenimiento de unos equipos a un proveedor que ya prestó el servicio, pero el contrato no tiene registro presupuestal. ¿Qué régimen rige los contratos de la universidad y qué requisitos de validez faltan?", "r": "Salvo las excepciones de la ley, los contratos se rigen por el derecho privado (art. 93). Para su validez se exigen además aprobación y registro presupuestal, que los pagos se ajusten a las apropiaciones, publicación en el Diario Oficial y pago del impuesto de timbre cuando proceda (art. 94). Falta el registro presupuestal; verifique también el estatuto de contratación de la universidad.", "f": "Ley 30 arts. 93 y 94. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E2-4", "guia": "Cartilla Ley 30 · Ejercicio 2", "tema": "I", "oficina": "Dirección de Bienestar Universitario", "q": "Al preparar el presupuesto, el área financiera propone destinar el 1 % del presupuesto de funcionamiento a bienestar y dirigirlo solo a los estudiantes. ¿Es correcta la propuesta?", "r": "No. Cada institución debe destinar por lo menos el 2 % de su presupuesto de funcionamiento a bienestar (art. 118), y el bienestar cubre a estudiantes, docentes y personal administrativo (art. 117, modificado por la Ley 1503 de 2011).", "f": "Ley 30 arts. 117 y 118. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-E2-5", "guia": "Cartilla Ley 30 · Ejercicio 2", "tema": "C", "oficina": "Oficina de Contratación", "q": "Un profesor de cátedra lleva varios años vinculado por contratos sucesivos de prestación de servicios y reclama prestaciones. Su jefe le pide revisar qué dicen la ley y la Corte. ¿Qué artículos de la Ley 30 y qué sentencia son pertinentes?", "r": "Arts. 71 a 74 de la Ley 30 (clases de profesores y vinculación de los de cátedra y ocasionales) y la sentencia C-006/96, que reconoce la relación subordinada y las prestaciones proporcionales al tiempo servido (primacía de la realidad).", "f": "Ley 30 arts. 71 a 74; C-006/96. Cartilla Ley 30, Anexo A.1.", "g": "30"}, {"id": "C30-A29", "guia": "Cartilla Ley 30 · Pregunta de análisis", "tema": "A", "oficina": "Alcance de la autonomía universitaria", "q": "¿Hasta dónde llega la autonomía universitaria según la Corte? Prepare una respuesta de cinco a diez líneas.", "r": "Llega hasta donde se afecte el núcleo de la libertad académica y de gobierno. La Corte ha dicho que es una garantía institucional (no absoluta), que está subordinada a la ley y al control del Estado, pero que el legislador no puede vaciarla de contenido. Los ejemplos son C-337/96 (selección de alumnos), C-589/97 (composición del Consejo Superior), C-829/02 (disciplinario) y C-926/05 (presupuesto).", "f": "C-337/96, C-589/97, C-829/02, C-926/05. Cartilla Ley 30, Anexo A.2.", "g": "30"}, {"id": "C30-A30", "guia": "Cartilla Ley 30 · Pregunta de análisis", "tema": "I", "oficina": "Recursos condicionados a resultados", "q": "¿Puede el Estado condicionar los recursos de las universidades a resultados? Prepare una respuesta de cinco a diez líneas.", "r": "La sentencia C-926/05 dejó claro que no puede hacerlo de forma que sustituya las decisiones de la universidad ni sin ley previa. La Ley 2568 de 2026 incluye en el artículo 86 planes indicativos con indicadores, pero con una cláusula expresa: deben respetar la autonomía y no menoscabar la libertad académica, administrativa y de autogobierno. Ese equilibrio puede generar nuevas discusiones.", "f": "C-926/05; Ley 30 art. 86 par. 2 (Ley 2568 de 2026). Cartilla Ley 30, Anexo A.2.", "g": "30"}, {"id": "C30-A31", "guia": "Cartilla Ley 30 · Pregunta de análisis", "tema": "I", "oficina": "Lecciones de la jurisprudencia", "q": "¿Qué enseñanza deja la jurisprudencia para quien trabaja en la administración de una universidad? Prepare una respuesta de cinco a diez líneas.", "r": "Tres ideas: (1) la universidad puede organizarse y regular su personal, pero dentro de la ley; (2) la forma del contrato no cambia la realidad de la relación laboral; (3) las normas disciplinarias internas deben respetar el debido proceso. En la práctica: lea el estatuto de la universidad junto con la ley general y la Constitución.", "f": "C-006/96, C-829/02. Cartilla Ley 30, Anexo A.2.", "g": "30"}, {"id": "C909-E1-1", "guia": "Cartilla Ley 909 · Ejercicio 1", "tema": "A", "oficina": "Oficina de Planeación", "q": "Un funcionario nuevo afirma que, como la Universidad del Magdalena recibe orientaciones del Ministerio de Educación, hace parte de la Rama Ejecutiva y está bajo su control de tutela. ¿Es correcto? ¿Qué es la universidad y cómo se relaciona con el Ministerio?", "r": "No es correcto. La Universidad del Magdalena es un ente universitario autónomo, con régimen especial de origen constitucional, equiparado a un órgano autónomo; no hace parte de la Rama Ejecutiva ni tiene control de tutela. Solo está vinculada al Ministerio de Educación en lo que se refiere a las políticas y la planeación del sector.", "f": "C.P. art. 69; Ley 30 art. 57; C-589/97; C-220/97. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E1-2", "guia": "Cartilla Ley 909 · Ejercicio 1", "tema": "A", "oficina": "Secretaría General", "q": "El rector delega en el director de Talento Humano la firma de las certificaciones laborales. Un compañero dice que, desde ese momento, el director de Talento Humano tiene la competencia para expedirlas y que el rector ya no puede intervenir. ¿Qué debe responder? ¿Qué requisitos tiene una delegación?", "r": "Es una delegación de firma, en la que no hay traslado de competencias (C-727/00). En general, la delegación requiere autorización legal previa y acto escrito, y el delegante sigue siendo el titular y puede reasumir la función.", "f": "C.P. art. 211; Ley 489 de 1998; C-561/99; C-727/00. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E1-3", "guia": "Cartilla Ley 909 · Ejercicio 1", "tema": "C", "oficina": "Gestión de Talento Humano", "q": "Debe clasificar a cuatro personas: (a) un profesional universitario de planta de la oficina de tesorería de la universidad; (b) un obrero vinculado por contrato de trabajo a una empresa industrial y comercial del Estado; (c) un concejal del Distrito de Santa Marta; (d) una persona contratada por prestación de servicios que cumple el horario de la planta, recibe órdenes diarias y lleva años en la misma actividad permanente. ¿Qué clase de servidor o de vinculación corresponde a cada una?", "r": "(a) Empleado público; (b) trabajador oficial; (c) miembro de una corporación pública; (d) formalmente es contratista de prestación de servicios, pero si se acreditan los elementos de una relación laboral, en especial la subordinación, prevalece la realidad sobre las formas.", "f": "C.P. art. 123; Ley 80 art. 32 num. 3; C-154/97; C-484/95. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E1-4", "guia": "Cartilla Ley 909 · Ejercicio 1", "tema": "B", "oficina": "Oficina de Contratación", "q": "Un auxiliar administrativo recibe del jefe la instrucción de ordenar un gasto de la universidad por su cuenta, “para adelantar trabajo”, aunque ninguna norma le asigna esa función. ¿Puede hacerlo? ¿Qué reglas se lo impiden y qué documentos cumplen en la universidad el papel de reglamento?", "r": "No. Ninguna autoridad puede ejercer funciones distintas de las que le atribuyen la Constitución y la ley (art. 121); no hay empleo sin funciones detalladas en la ley o el reglamento (art. 122) y los servidores responden por extralimitación (art. 6). En la universidad, el estatuto general y el manual de funciones cumplen el papel de reglamento (Ley 30, art. 79). Para ordenar el gasto por delegación del rector se necesita un acto escrito y una norma que lo autorice.", "f": "C.P. arts. 6, 121 y 122; Ley 30 art. 79. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E1-5", "guia": "Cartilla Ley 909 · Ejercicio 1", "tema": "B", "oficina": "Dirección Administrativa", "q": "Un jefe le pide “agilizar” el trámite de un conocido suyo y publicar el cronograma de un proceso solo entre algunos interesados. ¿Qué principios de la función administrativa se afectan y dónde están consagrados?", "r": "Se afectan la igualdad y la imparcialidad (las mismas reglas para todos los usuarios y aspirantes), la publicidad (dar a conocer las reglas y decisiones de los procesos) y la moralidad. Están en el artículo 209 de la Constitución y en el artículo 2 de la Ley 909 de 2004.", "f": "C.P. art. 209; Ley 909 art. 2. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-1", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "F", "oficina": "Gestión de Talento Humano", "q": "Un directivo entrega a un técnico de talento humano la hoja de vida de un conocido “recomendado” para un cargo de carrera y le pide incluirla sin pasar por el concurso. ¿Qué debe hacer el técnico y en qué se apoya?", "r": "No puede alterar el proceso. El ingreso a la carrera es por concurso público de méritos y la recomendación no sustituye el mérito (C.P., art. 125; Ley 909, arts. 27 y 28). El mérito y la igualdad orientan el ingreso (C-588/09).", "f": "C.P. art. 125; Ley 909 arts. 27 y 28; C-588/09. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-2", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "F", "oficina": "Oficina de Personal", "q": "Un auxiliar administrativo lleva diez años como provisional en un cargo de carrera y pide que lo inscriban en carrera por antigüedad. Se realiza el concurso y gana otra persona. ¿Tiene derecho a la inscripción? ¿Qué ocurre con su nombramiento?", "r": "No. Haber ocupado el cargo en provisionalidad, aun por mucho tiempo, no da derecho a inscripción en carrera (C-588/09). Su estabilidad es intermedia: cuando asume el ganador del concurso, el nombramiento provisional termina mediante acto motivado (Ley 909, arts. 24 y 25; SU-446/11; C-640/12).", "f": "C-588/09; Ley 909 arts. 24 y 25; SU-446/11; C-640/12. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-3", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "E", "oficina": "Dirección de Recursos Humanos", "q": "Un cargo profesional de carrera queda vacante de forma definitiva mientras se surte el concurso. En el cargo inmediatamente inferior hay tres técnicos de carrera: A, con evaluación sobresaliente y sin sanciones; B, con evaluación satisfactoria; y C, con evaluación sobresaliente, pero sancionado disciplinariamente hace seis meses. ¿Quién tiene derecho al encargo, cuánto puede durar y qué debe hacerse al vencer el plazo?", "r": "Tiene derecho el técnico A, que acredita los requisitos, tiene evaluación sobresaliente y no ha sido sancionado en el último año. C no cumple porque fue sancionado hace menos de un año; B solo entraría si no hubiera empleados con evaluación sobresaliente. En vacancia definitiva el encargo dura hasta tres meses, prorrogables por tres más; vencido el plazo, el empleo debe proveerse de forma definitiva. Antes de encargar, el nominador informa la vacante a la CNSC; en la universidad, esta regla se rige por el estatuto y la convocatoria.", "f": "Ley 909 art. 24. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-4", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "E", "oficina": "Dependencia administrativa", "q": "Un técnico de carrera con evaluación sobresaliente es llamado a ocupar un cargo de libre nombramiento y remoción en la dirección administrativa y quiere hacerlo sin perder su cargo de carrera. ¿Qué figura debe solicitar, por cuánto tiempo y qué pasa si se posesiona sin ella?", "r": "La comisión. Dura hasta tres años (continuos o discontinuos), prorrogables por un término igual, sin que la comisión o la suma de ellas supere seis años. Al terminar, o si renuncia o es retirado del cargo de libre nombramiento, debe asumir el empleo de carrera. Si se posesiona sin haber mediado la comisión, pierde los derechos de carrera.", "f": "Ley 909 arts. 26 y 42; C-175/07; C-182/07. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-5", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "E", "oficina": "Jefatura de una oficina", "q": "La jefa de una oficina afirma que el técnico que digita la nómina ocupa un cargo “de confianza” y que, por eso, puede retirarlo sin motivar la decisión. ¿Tiene razón?", "r": "No. Un cargo es de libre nombramiento solo si cumple los criterios del artículo 5 (dirección, conducción y orientación institucional, o especial confianza con las funciones que la ley señala); no basta con que el jefe lo llame “de confianza”, porque importan las funciones y no la denominación (C-405/95). Quien digita la nómina ocupa un cargo de carrera y solo puede ser retirado por una causal legal, mediante acto motivado (Ley 909, art. 41, par. 2; C-479/92).", "f": "Ley 909 arts. 5 y 41; C-405/95; C-479/92. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-E2-6", "guia": "Cartilla Ley 909 · Ejercicio 2", "tema": "F", "oficina": "Oficina de Concursos", "q": "La universidad ofertará 10 plazas de técnico administrativo de la misma planta y se cumplen las condiciones para convocar un concurso de ascenso entre servidores de carrera. ¿Cuántas plazas se convocan a ascenso y cuántas a concurso abierto? ¿Cuántas, como mínimo, se reservan para personas con discapacidad en el concurso abierto?", "r": "El 30 % de las vacantes se convoca a concurso de ascenso (3 plazas) y el 70 % restante a concurso abierto (7 plazas). La reserva es de al menos el 7 % de las plazas de cada concurso, con ajuste positivo (hacia arriba): el 7 % de 7 plazas es 0,49, que se ajusta a 1 plaza como mínimo. Si no se inscribe un número igual de servidores de carrera por empleo, el concurso de ascenso se declara desierto y la provisión se hace por concurso abierto. En la universidad, verifique el estatuto y la convocatoria.", "f": "Ley 909 art. 29. Cartilla Ley 909, Anexo A.1.", "g": "909"}, {"id": "C909-CA", "guia": "Cartilla Ley 909 · Caso de análisis A", "tema": "F", "oficina": "Concurso especial de incorporación", "q": "La universidad abre un concurso especial de incorporación a la carrera de su personal administrativo. Un servidor con doce años como provisional reclama que lo inscriban directamente en carrera y otro sostiene que puede ignorar las reglas de la convocatoria porque la Ley 909 dice algo distinto. ¿Qué normas y sentencias resuelven ambas posiciones?", "r": "El ingreso a la carrera es por mérito mediante concurso público (C.P., art. 125). La inscripción extraordinaria sin concurso de quienes están en provisionalidad o encargo fue declarada inexequible (C-588/09), y la estabilidad del provisional es relativa y cede ante quienes ganan el concurso (SU-446/11; C-640/12). La convocatoria es la norma del concurso, obliga a la administración y a los participantes y sus reglas son invariables (SU-446/11). En la universidad, el concurso se rige por el estatuto y la convocatoria; la Ley 909 solo se aplica de manera supletoria (art. 3, num. 2; C-175/06).", "f": "C.P. art. 125; C-588/09; SU-446/11; C-640/12; Ley 909 art. 3; C-175/06. Cartilla Ley 909, Anexo A.2.", "g": "909"}, {"id": "C909-CB", "guia": "Cartilla Ley 909 · Caso de análisis B", "tema": "E", "oficina": "Empleo temporal", "q": "Una dependencia solicita crear un empleo temporal por ocho meses para ejecutar un proyecto y propone nombrar sin concurso a un conocido del jefe. ¿Cuándo puede crearse un empleo temporal, cómo se ingresa a él y qué derechos genera?", "r": "El empleo temporal es excepcional y se crea, entre otros casos, para programas o proyectos de duración determinada, con motivación técnica y disponibilidad presupuestal. El ingreso se hace con las listas de elegibles vigentes de empleos permanentes o, si no es posible, con un proceso de evaluación de capacidades y competencias, no por designación directa. El empleo temporal es una categoría distinta de la carrera y no genera derechos de carrera (Ley 909, art. 21; C-288/14). Nombrar a un conocido sin proceso afecta los principios de igualdad, moralidad e imparcialidad.", "f": "Ley 909 art. 21; C-288/14. Cartilla Ley 909, Anexo A.2.", "g": "909"}, {"id": "C909-CC", "guia": "Cartilla Ley 909 · Caso de análisis C", "tema": "G", "oficina": "Reforma de la planta administrativa", "q": "El rector estudia reformar la planta administrativa de la universidad. El jefe de planeación pregunta si debe pedir la aprobación del Departamento Administrativo de la Función Pública (DAFP) y qué requisitos mínimos debe cumplir la reforma. ¿Qué responde?", "r": "El artículo 46, que exige la aprobación del DAFP, se refiere a la Rama Ejecutiva nacional y, según el Concepto DAFP 066291 de 2021 (que cita la C-220/97), no aplica a los entes universitarios autónomos. Aun así, toda reforma debe motivarse, fundarse en necesidades del servicio o en razones de modernización y apoyarse en estudios técnicos (art. 46); y los empleados de carrera cuyo cargo se suprime tienen derecho preferencial a ser incorporados en empleos iguales o equivalentes (arts. 44 y 45). Verifique el estatuto de la universidad.", "f": "Ley 909 arts. 44 a 46; Concepto DAFP 066291/2021; C-220/97. Cartilla Ley 909, Anexo A.2.", "g": "909"}, {"id": "CDD-C1", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Taller de casos", "tema": "J", "oficina": "Caso 1. El expediente que desapareció", "q": "Una profesional recibe una solicitud de un estudiante y, por alta carga laboral, deja el expediente sobre su escritorio. Días después no aparece. Ella informa a su jefe, busca en los registros y pide reconstruir la documentación. Un compañero afirma que “seguramente lo perdió” y propone reportarla como responsable. ¿Qué hechos están comprobados y cuáles son suposiciones? ¿Qué deberes de custodia documental están en juego? ¿Qué acciones inmediatas protegen al estudiante y al expediente? ¿Qué debe examinarse antes de atribuir responsabilidad?", "r": "Orientación de la cartilla: valorar trazabilidad, protocolos de archivo, accesos, registros, carga laboral, aviso oportuno y acciones de recuperación. La pérdida material no demuestra por sí sola dolo o culpa.", "f": "Cartilla Derecho Disciplinario, Taller: estudio de casos, Caso 1 (orientación para el facilitador)."}, {"id": "CDD-C2", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Taller de casos", "tema": "J", "oficina": "Caso 2. El proveedor conocido", "q": "Un profesional participa en la evaluación técnica de cotizaciones. Una de las empresas pertenece a un familiar cercano. Él cree que puede evaluar objetivamente porque conoce el mercado y no informa la relación a su superior. ¿Qué riesgo de conflicto de intereses aparece? ¿Por qué informar el vínculo antes de intervenir? ¿Qué debe hacer la persona y qué la autoridad? ¿Qué controles protegen la transparencia?", "r": "Orientación de la cartilla: la respuesta preventiva es revelar la situación y tramitar el impedimento según las normas aplicables. No se debe presumir automáticamente que hubo favorecimiento; debe examinarse la intervención y sus efectos.", "f": "Cartilla Derecho Disciplinario, Caso 2 (orientación para el facilitador); conflicto de intereses, Ley 1952 art. 44 y Estatuto de Personal art. 19."}, {"id": "CDD-C3", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Taller de casos", "tema": "J", "oficina": "Caso 3. La clave compartida", "q": "Una funcionaria comparte su usuario y contraseña con un compañero para que descargue reportes durante su ausencia. El compañero consulta datos personales de estudiantes que no necesita y reenvía un archivo a su correo personal. ¿Qué riesgos hay para la seguridad de la información y los datos personales? ¿Qué deberes compromete cada persona? ¿Qué hacer al conocer el incidente? ¿Cómo evitar que se repita?", "r": "Orientación de la cartilla: revisar controles de acceso, trazabilidad, necesidad funcional, protocolos de seguridad, reporte al área competente y medidas de contención. Diferenciar la conducta de quien comparte credenciales de la de quien consulta y divulga información.", "f": "Cartilla Derecho Disciplinario, Caso 3 (orientación para el facilitador)."}, {"id": "CDD-C4", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Taller de casos", "tema": "L", "oficina": "Caso 4. El trato humillante", "q": "Un jefe corrige públicamente a una profesional, la insulta de manera reiterada, le asigna tareas imposibles como castigo y le advierte que no renueve su contrato si presenta una queja. Ella teme acudir a Talento Humano. ¿Qué señales de posible acoso laboral o abuso de autoridad hay? ¿Qué medidas de protección y canales deben activarse? ¿Cómo proteger la confidencialidad y evitar represalias?", "r": "Orientación de la cartilla: activar las rutas institucionales y las medidas previstas en la Ley 1010 de 2006 y demás normas aplicables. La calificación jurídica depende de la verificación de los hechos y del régimen de vinculación. Complemento (Res. 3461/2025): el Comité de Convivencia Laboral recibe la queja y su rol es preventivo, orientador, conciliador y canalizador; no declara si hubo acoso.", "f": "Cartilla Derecho Disciplinario, Caso 4; Resolución 3461 de 2025, art. 6."}, {"id": "CDD-C5", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Taller de casos", "tema": "J", "oficina": "Caso 5. Certificación sin verificación", "q": "Un supervisor firma el recibido a satisfacción de un mantenimiento sin visitar las instalaciones ni verificar soportes, porque el proveedor le asegura por teléfono que todo está terminado y necesita cerrar el informe mensual. ¿Qué función cumple la supervisión? ¿Qué riesgos presupuestales, contractuales y disciplinarios surgen? ¿Qué soportes debió verificar? ¿Qué debe hacer si descubre que firmó sin evidencia suficiente?", "r": "Orientación de la cartilla: verificar contrato, obligaciones, informes, actas, evidencias y deberes de supervisión. La firma puede tener consecuencias, pero deben analizarse competencia, deber concreto, circunstancias y culpabilidad.", "f": "Cartilla Derecho Disciplinario, Caso 5 (orientación para el facilitador)."}, {"id": "CDD-C6", "g": "disc", "guia": "Cartilla Derecho Disciplinario · Evaluación 3", "tema": "J", "oficina": "Evaluación 3. Compras y pareja", "q": "Una funcionaria de compras participa en la evaluación de una oferta de una empresa cuyo representante legal es su pareja. No informa la relación y la propuesta resulta adjudicataria. No se ha acreditado pago ni detrimento patrimonial. ¿Qué hechos adicionales deben probarse? ¿Qué deberes y reglas de conflicto de intereses se examinan? ¿La ausencia de detrimento descarta la relevancia disciplinaria? ¿Qué permite establecer dolo o culpa?", "r": "Deben probarse el vínculo (compañera permanente o pareja), su conocimiento del interés, su intervención efectiva en la evaluación y la incidencia en la adjudicación. Se examinan el deber de declararse impedida (Ley 1952 art. 44; Estatuto de Personal art. 19) y la ilicitud sustancial: la falta no exige daño económico, basta la afectación sustancial del deber funcional sin justificación. El dolo o la culpa se infieren de que conocía la relación y aun así intervino sin informarla; no cabe responsabilidad objetiva.", "f": "Cartilla Derecho Disciplinario, Evaluación 3 y capítulos sobre ilicitud sustancial y culpabilidad.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "VBG-C1", "g": "vbg", "guia": "Presentación Ac. Superior 10 de 2019", "tema": "K", "oficina": "Reporte indirecto ante un docente", "q": "Una estudiante informa a un docente que recibe mensajes sexuales no consentidos y amenazas de publicar fotografías privadas por parte de otro integrante de la comunidad universitaria. ¿Puede el docente recibir el reporte indirecto? ¿Qué deber de confidencialidad tiene? ¿A qué dependencia orienta? ¿Qué medidas de cuidado podrían solicitarse? ¿Qué rutas internas y externas pueden activarse?", "r": "Clave de la presentación: orientar de inmediato hacia el GAV, preservar la reserva, evitar interrogatorios o juicios, informar sobre atención y medidas, y respetar la decisión de la persona sobre las acciones que puede solicitar.", "f": "Presentación Acuerdo Superior 10 de 2019, diapositiva 17 (clave de respuesta)."}, {"id": "VBG-C2", "g": "vbg", "guia": "Presentación Ac. Superior 10 de 2019", "tema": "K", "oficina": "Docente que acosa a una estudiante", "q": "Una estudiante informa que un docente le envía mensajes sexuales no consentidos y amenaza con divulgar fotografías privadas. Teme represalias y no sabe si presentar una queja formal. ¿Qué derechos están comprometidos? ¿Qué normas la protegen? ¿Qué pasos del protocolo se activan? ¿Qué medidas de cuidado pueden solicitarse? ¿Cómo se protege la confidencialidad y se evita la revictimización?", "r": "Criterios de la presentación: escuchar sin juzgar; orientar hacia el GAV; preservar la reserva; informar sobre las rutas internas y externas; valorar medidas de protección; respetar el debido proceso y las competencias de cada autoridad.", "f": "Presentación Acuerdo Superior 10 de 2019, diapositiva 29 (criterios para la respuesta)."}, {"id": "CMN-C1", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "N", "oficina": "Caso 1. El encargo del sobrino", "q": "Se abre una vacante definitiva de profesional en la Vicerrectoría Administrativa. La jefa quiere encargar a Andrés, de carrera con evaluación satisfactoria, sobrino de un miembro de la Comisión de Personal. Luisa, también de carrera, tiene evaluación sobresaliente, 8 años de antigüedad y un diplomado reciente. ¿A quién corresponde el encargo y qué debe hacer el miembro de la Comisión?", "r": "El encargo no es discrecional de la jefa: la Comisión de Personal calcula el puntaje del art. 134 (sobresaliente 5 puntos, satisfactoria 4; 1 por año de antigüedad; diplomados 2 puntos) y el art. 116 da prelación a la evaluación sobresaliente. Con esos criterios Luisa supera a Andrés. El tío de Andrés debe declararse impedido (art. 19: parientes hasta el cuarto grado de consanguinidad); si no lo hace, puede ser recusado. El encargo dura 3 meses prorrogables por 3. Valor en juego: justicia.", "f": "Cartilla Marco normativo. Estatuto de Personal arts. 19, 116 y 134; Política de Integridad.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C2", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "N", "oficina": "Caso 2. Seis meses y sin calificación", "q": "Marta ganó el concurso abierto, aceptó y se posesionó. A los cuatro meses informó por escrito su embarazo y tomó licencia de maternidad. Al regresar, su jefe le dice que el periodo de prueba “ya se venció” y que, como no fue evaluada, debe salir. ¿Tiene razón el jefe?", "r": "No. La licencia de maternidad no consume el periodo de prueba: según el art. 75 se suspende y continúa al terminar la licencia (el art. 130 num. 5 habla de interrumpirlo y reiniciarlo; la cartilla recomienda consultar a Talento Humano y a la Oficina Jurídica por esa diferencia). Además, si vencidos los 6 meses no hay calificación, el periodo se entiende superado con la máxima calificación. Marta avisó por escrito, así que goza de la protección reforzada (art. 130). No puede ser retirada.", "f": "Cartilla Marco normativo. Estatuto de Personal arts. 73–75 y 130.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C3", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "N", "oficina": "Caso 3. La calificación que no convence", "q": "Jorge, técnico de carrera, recibe 58 % en su evaluación anual. Asegura que nunca concertó compromisos y que su jefe lo calificó sin seguimiento. El año anterior obtuvo 59 %. ¿Qué puede hacer y qué está en riesgo?", "r": "58 % es no satisfactorio (60 % o menos); dos periodos continuos no satisfactorios llevan a la insubsistencia (art. 125 num. 7), por eso está en riesgo su permanencia. Puede interponer reposición ante el evaluador y apelación ante la Comisión de Personal (art. 103), alegando que no hubo concertación de compromisos (que debía hacerse en 15 días hábiles; si el evaluador la omite, el evaluado envía su propuesta) ni seguimiento. Debe cumplirse un plan de mejoramiento.", "f": "Cartilla Marco normativo. Estatuto de Personal arts. 93, 103 y 125.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C4", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "O", "oficina": "Caso 4. El detalle por agilizar", "q": "Un proveedor que participa en un proceso de contratación invita a almorzar a la profesional que revisa las propuestas y le ofrece un bono de regalo “por la paciencia”. Ella duda y lo comenta con un compañero, que le aconseja no decir nada. ¿Qué debe hacer?", "r": "Rechazar la invitación y el bono: solicitar o recibir dádivas está prohibido (Estatuto de Personal art. 17 num. 3). Debe reportarlo por el conducto regular o por ciudadano@unimagdalena.edu.co / PQR, porque denunciar irregularidades es un deber (art. 16 num. 11). El consejo del compañero contraría la Política; aplicando las 6 preguntas (¿es legal?, ¿querría verlo publicado?) la respuesta es “no”, entonces debe hablar. Valores: honestidad y coraje.", "f": "Cartilla Marco normativo. Estatuto de Personal arts. 16 y 17; Política de Integridad (VOCES).", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C5", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "M", "oficina": "Caso 5. El consejero con intereses", "q": "El Consejo Superior va a votar la creación de una spin-off con una empresa en la que el representante del sector productivo es miembro de junta directiva. No lo ha dicho. Un representante estudiantil se entera dos horas antes de la sesión. ¿Qué debe ocurrir en la sesión?", "r": "El consejero debe declararse impedido y sustentarlo; el órgano decide de inmediato por mayoría simple. Si no lo hace, el representante estudiantil puede recusarlo (causales del art. 11 de la Ley 1437 de 2011), y la recusación se resuelve antes del asunto de fondo. Solo puede abstenerse quien declare conflicto de interés o impedimento (art. 31). Impedido = me aparto yo; recusado = otro pide que me aparte.", "f": "Cartilla Marco normativo. Estatuto General art. 31; Política de Integridad, manual de órganos colegiados.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C6", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "N", "oficina": "Caso 6. La renuncia y el nuevo empleo", "q": "Pedro, profesional de carrera, presenta su renuncia el 1 de marzo porque consiguió trabajo en una firma que asesora a contratistas de la Universidad. Deja de ir a la oficina al día siguiente. La firma le pide que asesore un contrato que él mismo supervisó. ¿Qué errores hay?", "r": "La renuncia debe aceptarse en máximo 30 días hábiles y antes no puede abandonar las funciones (art. 127): dejar de ir configura abandono del cargo, que es causal de retiro (art. 125). Además, el Estatuto prohíbe asesorar en asuntos relacionados con las funciones del cargo hasta 2 años después de dejarlo, respecto de la dependencia donde prestó servicios: no puede asesorar el contrato que supervisó.", "f": "Cartilla Marco normativo. Estatuto de Personal arts. 125 y 127, y prohibiciones (num. 14).", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "CMN-C7", "g": "mn", "guia": "Cartilla Marco normativo · Casos de simulación", "tema": "O", "oficina": "Caso 7. Represalia disfrazada", "q": "Carolina reportó por ciudadano@unimagdalena.edu.co que en su dependencia se alteran las fechas de radicación de PQR. Una semana después, su coordinador la traslada a otra sede y le retira el permiso de estudio de 2 horas diarias que tenía aprobado. ¿Cómo se analiza?", "r": "Es una represalia: la Política prohíbe degradar, reducir el salario, despedir, reasignar o negar beneficios a quien reporta de buena fe, y justificarlo en necesidades del servicio no lo legitima. Carolina cumplió un deber (art. 16 num. 11). Debe reportarlo a Talento Humano y al Comité de Ética para el Buen Gobierno; la conducta del coordinador y la alteración de fechas pueden tener relevancia disciplinaria.", "f": "Cartilla Marco normativo. Política de Integridad (cero represalias); Estatuto de Personal art. 16; Estatuto General, Comité de Ética.", "n": "Respuesta de referencia elaborada por el preparador con el texto de la cartilla: la cartilla no trae solución para este caso."}, {"id": "SB-H1", "g": "m2", "story": 1, "guia": "Storybooks · Módulo 2", "tema": "R", "oficina": "Storybook SB-01 · Las reuniones de Luz", "q": "Página 1. Lunes, 7:00 a. m. El sol del Caribe ya calienta el campus. Luz Marina abre la ventanilla de Admisiones y, como cada inicio de semestre, la fila llega hasta el pasillo.\n\nPágina 2. La primera en llegar es Daniela, egresada. «Hace doce días pedí mi certificado de notas y nadie me responde. El viernes debo entregarlo para posesionarme», dice con la voz quebrada.\n\nPágina 3. A las 10:00 a. m. Carmen reúne al equipo para preparar el seguimiento trimestral del plan de acción. En la pantalla brilla un número: «Reuniones de equipo realizadas: 4 de 4. Cumplimiento: 100 %».\n\nPágina 4. Luz abre el reporte de peticiones del trimestre. Las solicitudes respondidas a tiempo bajaron de un trimestre a otro: 91 %, 84 %, 78 % (cifras del caso).\n\nPágina 5. Andrés sonríe: «Si el indicador está en 100 %, cumplimos. Hagamos dos reuniones más y el próximo trimestre quedamos todavía mejor».\n\nPágina 6. Luz recuerda lo que leyó en el Plan de Desarrollo 2020-2030: la meta a 2030 es que el 90 % de las solicitudes se atiendan satisfactoriamente para el usuario. Y el Plan de Gobierno impulsa trámites en ambientes digitales.\n\nPágina 7. Luz mira por la ventana. Daniela sigue sentada en la banca, revisando el celular. «Detrás de cada cifra hay una persona», piensa.\n\nPágina 8. Carmen pide propuestas antes de cerrar el reporte del trimestre en el sistema de seguimiento: «Necesito saber qué vamos a decir y qué vamos a hacer».\n\nPágina 9. Luz ve tres caminos. A: hacer más reuniones para que el indicador siga en 100 %. B: proponer a Carmen que el proyecto mida el resultado para el usuario, reportar el avance real con evidencias y plantear acciones de mejora. C: dejar el reporte como está y esperar a que la auditoría diga si hay un problema.\n\nPágina 10. Luz respira hondo. Todos la miran. ¿Qué debería proponer?\n\nAplica la rutina CLAVE y decide: ¿qué camino elegirías?", "r": "Clave: B. Proponer a Carmen que el proyecto mida el resultado para el usuario —(solicitudes atendidas satisfactoriamente / solicitudes recibidas) × 100—, reportar el avance real con evidencias y plantear acciones de mejora.\n\nRutina CLAVE. Lineamiento: el indicador debe medir el resultado esperado, no solo el esfuerzo; la iniciativa 5.1.3 del PDU fija a 2030 el 90 % de solicitudes atendidas satisfactoriamente; el seguimiento trimestral refleja el avance real con evidencias y el autocontrol es de cada servidor. Actor: el responsable directo, concertando con su jefatura. Validar: A confunde actividad con resultado; C traslada la responsabilidad al auditor y deja al usuario sin respuesta.\n\nEpílogo: Carmen acepta. El equipo reporta el 78 % con su análisis de causas, prioriza las solicitudes con fecha límite y pide habilitar la solicitud en línea. Tres meses después la cifra sube al 86 %. Daniela recibe su certificado el jueves.", "f": "Storybook SB-01 (PDF del aula virtual) y Presentación Sesión 1 virtual, rutina CLAVE y epílogo."}, {"id": "SB-H2", "g": "m2", "story": 1, "guia": "Storybooks · Módulo 2", "tema": "Q", "oficina": "Storybook SB-02 · Cuatro años, diez años", "q": "Página 1. Jorge llega temprano al taller de Planta Física. Sobre su escritorio, el plano del proyecto que lo ilusiona: cambiar luminarias y equipos para que el campus consuma menos energía.\n\nPágina 2. Ese proyecto nació en el plan de acción alineado con el Propósito 5 del Plan de Desarrollo, «Universidad comprometida con la sostenibilidad y la resiliencia organizacional», y con su prioridad de patrimonio y campus sostenible.\n\nPágina 3. Llega Patricia, la nueva coordinadora, con una carpeta bajo el brazo. «Equipo, ahora mandan las metas del Plan de Gobierno 2024-2028».\n\nPágina 4. «El Plan de Desarrollo ya no aplica», continúa. «Borren del plan de acción todo lo que diga PDU y formulen solo con el Plan de Gobierno».\n\nPágina 5. Yesenia, que reporta el avance cada trimestre, se queda inmóvil: si borran la articulación, ¿a qué meta le van a reportar?\n\nPágina 6. Jorge abre en el computador el Plan de Gobierno. Lee el título de sus estrategias: «Estrategias basadas en los cinco compromisos del Plan de Desarrollo».\n\nPágina 7. Encuentra el Decálogo del Compromiso por Unimagdalena. En la letra S, sostenibilidad y resiliencia, aparece un plan de eficiencia energética y la meta de reducir 25 % la huella de carbono.\n\nPágina 8. Jorge piensa en los diez años del PDU y en los cuatro de cada gobierno. «Si cada coordinador empieza de cero, ¿quién garantiza la continuidad?».\n\nPágina 9. Jorge ve tres caminos. A: obedecer y borrar toda referencia al PDU. B: dejar el plan como está e ignorar el Plan de Gobierno. C: explicar que el Plan de Gobierno se organiza sobre los compromisos del PDU y proponer articular el proyecto con ambos instrumentos, apoyándose en la Oficina Asesora de Planeación.\n\nPágina 10. Patricia lo mira esperando respuesta. ¿Qué debería decir Jorge?\n\nAplica la rutina CLAVE y decide: ¿qué camino elegirías?", "r": "Clave: C. Explicar que el Plan de Gobierno se organiza sobre los compromisos del PDU y proponer articular el proyecto con ambos instrumentos (Propósito 5 y la meta del Decálogo de reducir la huella de carbono), apoyándose en la Oficina Asesora de Planeación.\n\nRutina CLAVE. Lineamiento: el art. 4 del Acuerdo Superior 06 de 2021 ordena que los planes de gobierno se articulen con el PDU y propendan por sus metas; el Plan de Gobierno presenta sus estrategias basadas en los cinco compromisos del PDU y el plan de acción ejecuta ambos. Validar: A invierte la jerarquía (el plan de cuatro años reemplaza al de diez); B es unilateral y desconoce que el Plan de Gobierno acelera las metas del PDU.\n\nEpílogo: Patricia escucha, revisan juntos la matriz de coherencia y el proyecto queda vinculado al Propósito 5 y a la meta de huella de carbono. Ahora reporta a dos instrumentos con un solo esfuerzo.", "f": "Storybook SB-02 (PDF del aula virtual) y Presentación Sesión 1 virtual, rutina CLAVE y epílogo."}, {"id": "SB-H3", "g": "m2", "story": 1, "guia": "Storybooks · Módulo 2", "tema": "R", "oficina": "Storybook SB-03 · El trimestre que no alcanzó", "q": "Página 1. Martín, estudiante de primer semestre, recorre el campus en su silla de ruedas. Frente al bloque de aulas, se detiene: el baño accesible más cercano está a dos edificios.\n\nPágina 2. En Servicios Generales, Rafael revisa el plan de acción. Su proyecto: adecuar seis baterías sanitarias accesibles en la vigencia, articulado con el compromiso de inclusión del Plan de Gobierno.\n\nPágina 3. El problema: la contratación se retrasó tres meses. Al cierre del tercer trimestre solo hay una batería terminada.\n\nPágina 4. Mañana vence el reporte trimestral. Rafael mira el formato: «Avance de la meta: ___ %».\n\nPágina 5. Yuli se acerca con su taza de café: «Pon 100 %. El contrato ya está firmado; eso se termina seguro».\n\nPágina 6. Luego agrega: «O mejor, cambia la meta a una batería en el formato y quedas al día. Nadie se va a dar cuenta».\n\nPágina 7. Rafael recuerda a Martín frente al bloque de aulas. Si el reporte dice «cumplido», nadie va a acelerar las obras que faltan.\n\nPágina 8. También recuerda que cada servidor ejerce autocontrol sobre las metas a su cargo y que el plan de acción se reprograma de forma concertada, no en solitario.\n\nPágina 9. Rafael ve tres caminos. A: reportar el avance real con evidencias, explicar la causa del retraso y solicitar a la jefatura la reprogramación concertada. B: reportar 100 % porque el contrato está firmado. C: cambiar él mismo la meta en el formato para que coincida con lo logrado.\n\nPágina 10. Son las 5:00 p. m. El formato sigue en blanco. ¿Qué debería reportar Rafael?\n\nAplica la rutina CLAVE y decide: ¿qué camino elegirías?", "r": "Clave: A. Reportar el avance real con evidencias, explicar la causa del retraso y solicitar a la jefatura la reprogramación concertada de la meta.\n\nRutina CLAVE. Lineamiento: el seguimiento trimestral refleja el avance real con evidencias (autocontrol del responsable); la reprogramación se concerta con la jefatura y las metas no se modifican por decisión unilateral de quien reporta. Validar: B es informalidad y falta de integridad, porque reporta lo que no ha ocurrido; C es unilateralidad e inversión de jerarquía, porque acomoda la meta a lo ejecutado.\n\nEpílogo: la jefatura revisa el caso, se concerta un nuevo cronograma y se prioriza la batería del bloque de aulas. En el cuarto trimestre se entregan cuatro más y queda documentada la lección para la siguiente contratación.", "f": "Storybook SB-03 (PDF del aula virtual) y Presentación Sesión 1 virtual, rutina CLAVE y epílogo."}, {"id": "M2-C1", "g": "m2", "guia": "Presentación Sesión 1 (virtual) · Dilema", "tema": "R", "oficina": "Dilema: ¿cumplió o no cumplió?", "q": "Una dependencia cerró el año con el 98 % de las actividades ejecutadas y el 55 % de las metas cumplidas. ¿La dependencia cumplió su plan de acción? (En la sesión se votó entre: A. Sí, ejecutó casi todo; B. No, sus metas no se alcanzaron; C. Depende de qué mida el plan.)", "r": "La presentación lo plantea como encuesta y no da clave. Lo que el material sí dice: la evaluación anual mira actividades, metas y presupuesto, y una ejecución alta con metas bajas es una brecha que obliga a revisar el diseño. Ejecutar las actividades no equivale a cumplir el plan: hay que mirar si se alcanzaron las metas y qué mide cada indicador (actividad o resultado).", "f": "Presentación Sesión 1, «Dilema: ¿cumplió o no cumplió?»; Presentación Sesión 2, «El termómetro de supuestos», afirmación 2.", "n": "Respuesta de referencia: la encuesta no trae clave; se arma con el termómetro de supuestos de la Sesión 2."}], "rapidas": [{"id": "R30-A1", "guia": "Ley 30", "q": "¿Cómo debe organizarse una universidad estatal u oficial?", "r": "Como ente universitario autónomo, con régimen especial, vinculado al MEN en políticas y planeación (art. 57).", "g": "30"}, {"id": "R30-A2", "guia": "Ley 30", "q": "¿Qué libertades enmarcan la educación superior?", "r": "Enseñanza, aprendizaje, investigación y cátedra (art. 4). La P12 de la cartilla agrega pensamiento y pluralismo ideológico.", "g": "30"}, {"id": "R30-A3", "guia": "Ley 30", "q": "¿Quién puede ofrecer doctorados?", "r": "Universidades que cumplan los arts. 19 y 20 y obtengan autorización del MEN con concepto del CESU (art. 21).", "g": "30"}, {"id": "R30-A4", "guia": "Ley 30", "q": "¿Qué requisito exige el ingreso a pregrado además del título de bachiller?", "r": "Haber presentado el Examen de Estado (art. 14).", "g": "30"}, {"id": "R30-A5", "guia": "Ley 30", "q": "¿Quién ejerce la suprema inspección y vigilancia?", "r": "El Gobierno Nacional, con asesoría del CESU; delegable en el Ministro de Educación (art. 33).", "g": "30"}, {"id": "R30-A6", "guia": "Ley 30", "q": "¿Qué es el CESU?", "r": "Organismo vinculado al MEN para coordinación, planificación, recomendación y asesoría (art. 34).", "g": "30"}, {"id": "R30-A7", "guia": "Ley 30", "q": "¿Quién preside el CESU?", "r": "El Ministro de Educación Nacional (art. 35).", "g": "30"}, {"id": "R30-A8", "guia": "Ley 30", "q": "¿La acreditación es obligatoria?", "r": "No, es voluntaria y temporal (art. 53).", "g": "30"}, {"id": "R30-A9", "guia": "Ley 30", "q": "¿Quién preside el Consejo Superior de una universidad departamental?", "r": "El Gobernador (art. 64).", "g": "30"}, {"id": "R30-A10", "guia": "Ley 30", "q": "¿El Rector tiene voto en el Consejo Superior?", "r": "No, asiste con voz y sin voto (art. 64).", "g": "30"}, {"id": "R30-A11", "guia": "Ley 30", "q": "¿Quién designa al Rector de una universidad estatal?", "r": "El Consejo Superior Universitario (art. 66).", "g": "30"}, {"id": "R30-A12", "guia": "Ley 30", "q": "¿Quién preside el Consejo Académico?", "r": "El Rector (art. 68).", "g": "30"}, {"id": "R30-A13", "guia": "Ley 30", "q": "¿Cuál es la dedicación del profesor de tiempo completo?", "r": "Cuarenta horas laborales semanales (art. 71).", "g": "30"}, {"id": "R30-A14", "guia": "Ley 30", "q": "¿Cómo se vinculan los profesores de cátedra?", "r": "Por contrato de prestación de servicios por períodos académicos (art. 73); la Corte exigió prestaciones proporcionales (C-006/96).", "g": "30"}, {"id": "R30-A15", "guia": "Ley 30", "q": "¿Qué debe contener el estatuto general respecto del personal administrativo?", "r": "Derechos, obligaciones, inhabilidades, situaciones administrativas y régimen disciplinario (art. 79).", "g": "30"}, {"id": "R30-A16", "guia": "Ley 30", "q": "¿Cuánto deben aumentar como mínimo los aportes anuales según el art. 86?", "r": "Al menos el ICES; si es inferior al IPC, el IPC (art. 86 y par. 1, Ley 2568/26).", "g": "30"}, {"id": "R30-A17", "guia": "Ley 30", "q": "¿Qué porcentaje del incremento real del PIB fija el art. 87?", "r": "No inferior al 70 % (art. 87, Ley 2568/26).", "g": "30"}, {"id": "R30-A18", "guia": "Ley 30", "q": "¿Qué porcentaje del presupuesto de funcionamiento destina cada institución a bienestar?", "r": "Por lo menos el 2 % (art. 118).", "g": "30"}, {"id": "R30-A19", "guia": "Ley 30", "q": "¿Qué dispuso la Ley 1740 de 2014 en sanciones?", "r": "Derogó los arts. 48 a 50 y modificó el 51 (art. 25).", "g": "30"}, {"id": "R30-A20", "guia": "Ley 30", "q": "¿Qué ley agregó el multilingüismo a la Ley 30?", "r": "La Ley 2630 de 2026 (arts. 6, 9, 17, 18 y 19).", "g": "30"}, {"id": "R30-A21", "guia": "Ley 30", "q": "¿Cuántos días tiene la institución para rendir descargos tras el pliego de cargos?", "r": "Treinta días (art. 51, modificado por la Ley 1740 de 2014).", "g": "30"}, {"id": "R30-A22", "guia": "Ley 30", "q": "¿En cuánto tiempo caducan la acción y la sanción administrativa?", "r": "En tres años contados desde el último acto constitutivo de la falta (art. 52).", "g": "30"}, {"id": "R30-A23", "guia": "Ley 30", "q": "¿Qué respondió la Corte sobre la facultad de la universidad de admitir a sus alumnos?", "r": "Que es exequible: la autonomía permite fijar cupos y criterios objetivos de selección (C-337/96).", "g": "30"}, {"id": "R30-A24", "guia": "Ley 30", "q": "¿Qué decidió la Corte sobre la participación del Estado en el Consejo Superior?", "r": "Que no viola la autonomía mientras no sea un control mayoritario o absoluto (C-589/97).", "g": "30"}, {"id": "R30-A25", "guia": "Ley 30", "q": "¿Qué significa que una sentencia sea “condicionada”? Dé el ejemplo del art. 27, lit. b).", "r": "La norma se mantiene, pero solo con la interpretación fijada por la Corte; el art. 27, lit. b), no aplica a egresados de programas nunca aprobados o registrados (C-1093/03). (Dato que solo aparece en la clave de la cartilla: requiere verificación.)", "g": "30"}, {"id": "R30-A26", "guia": "Ley 30", "q": "¿Por qué cayó el Decreto 1122 de 1999 que reformaba la Ley 30?", "r": "Porque la ley de facultades en que se apoyaba ya había sido retirada del ordenamiento (C-923/99 y C-954/99). (Dato que solo aparece en la clave de la cartilla: requiere verificación.)", "g": "30"}, {"id": "R30-A27", "guia": "Ley 30", "q": "¿Qué exige la Corte para el régimen disciplinario interno de las universidades?", "r": "Que respete el debido proceso, la defensa y la proporcionalidad, y que los elementos estructurales de las faltas estén en la ley (C-829/02).", "g": "30"}, {"id": "R30-A28", "guia": "Ley 30", "q": "¿Qué hizo la Corte en C-552 de 2015 respecto de la Ley 1740 de 2014?", "r": "Se declaró inhibida: los cargos por autonomía universitaria y reserva de ley estatutaria no cumplían los requisitos de aptitud.", "g": "30"}, {"id": "R909-1", "guia": "Ley 909", "q": "¿Cuántos tipos de servidores públicos distingue el artículo 123 de la Constitución?", "r": "Tres: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales (C.P., art. 123; C-484/95).", "g": "909"}, {"id": "R909-2", "guia": "Ley 909", "q": "¿Qué diferencia hay entre descentralización y desconcentración?", "r": "En la descentralización la función pasa a otra persona jurídica con autonomía (control de tutela); en la desconcentración pasa a una dependencia de la misma entidad (Ley 489, arts. 8 y ss.; C-561/99).", "g": "909"}, {"id": "R909-3", "guia": "Ley 909", "q": "¿Qué debe existir para que haya delegación?", "r": "Autorización legal y acto escrito del delegante, que conserva la titularidad y puede reasumir la función (C.P., art. 211; C-561/99).", "g": "909"}, {"id": "R909-4", "guia": "Ley 909", "q": "Un rector delega en el secretario general la firma de certificaciones. ¿Se transfiere competencia?", "r": "No: es delegación de firma; no hay traslado de competencias (C-727/00).", "g": "909"}, {"id": "R909-5", "guia": "Ley 909", "q": "¿Pertenece la Universidad del Magdalena a la Rama Ejecutiva?", "r": "No. Es un ente universitario autónomo, equiparado a un órgano autónomo (Ley 30, art. 57; C-589/97; C-220/97).", "g": "909"}, {"id": "R909-6", "guia": "Ley 909", "q": "¿Quién administra la carrera administrativa de una universidad estatal?", "r": "La propia universidad conforme a su estatuto; la CNSC no la administra, y la vigilancia corresponde al Consejo Superior (C-746/99; C-560/00; Concepto CE 1906/08).", "g": "909"}, {"id": "R909-7", "guia": "Ley 909", "q": "¿Cómo se aplica la Ley 909 a un ente universitario autónomo?", "r": "De manera supletoria, ante vacíos de su normativa propia (Ley 909, art. 3, num. 2; C-175/06).", "g": "909"}, {"id": "R909-8", "guia": "Ley 909", "q": "¿Qué clase de carrera es la de la DIAN y quién la vigila?", "r": "Carrera específica de origen legal; la vigila la CNSC (Ley 909, art. 4; C-1230/05).", "g": "909"}, {"id": "R909-9", "guia": "Ley 909", "q": "¿Cómo se ingresa a un empleo de carrera?", "r": "Por concurso público de méritos, lista de elegibles y período de prueba (C.P., art. 125; Ley 909, art. 31).", "g": "909"}, {"id": "R909-10", "guia": "Ley 909", "q": "¿Cómo se retira un empleado de libre nombramiento y remoción?", "r": "Por insubsistencia, discrecional y mediante acto no motivado, sin que sea arbitraria (Ley 909, art. 41, par. 2; C-479/92).", "g": "909"}, {"id": "R909-11", "guia": "Ley 909", "q": "¿Qué estabilidad tiene un provisional en vacante definitiva?", "r": "Intermedia: solo se retira con acto motivado y cede ante el ganador del concurso (C-640/12; SU-446/11).", "g": "909"}, {"id": "R909-12", "guia": "Ley 909", "q": "¿Qué distingue un contrato de prestación de servicios de uno de trabajo?", "r": "La subordinación; si hay subordinación prevalece la realidad sobre la forma (Ley 80, art. 32 num. 3; C-154/97).", "g": "909"}, {"id": "R909-13", "guia": "Ley 909", "q": "¿Puede una ley catalogar a los rectores y decanos de una universidad pública como de libre nombramiento y remoción?", "r": "No: la Corte declaró inexequible esa clasificación por afectar la autonomía universitaria (C-195/94).", "g": "909"}, {"id": "R909-14", "guia": "Ley 909", "q": "¿El nombramiento en provisionalidad da derecho a ingresar a carrera sin concurso?", "r": "No (Acto Legislativo 01/2008, art. 1, inexequible: C-588/09).", "g": "909"}, {"id": "R909-15", "guia": "Ley 909", "q": "¿Qué naturaleza tiene la convocatoria?", "r": "Es la norma reguladora de todo concurso y obliga a la administración, a las entidades contratadas y a los participantes (Ley 909, art. 31; SU-446/11).", "g": "909"}, {"id": "R909-16", "guia": "Ley 909", "q": "¿Cuánto dura el encargo en vacancia definitiva?", "r": "Tres meses, prorrogables por tres más (Ley 909, art. 24).", "g": "909"}, {"id": "R909-17", "guia": "Ley 909", "q": "¿Qué porcentaje se reserva para personas con discapacidad en los concursos?", "r": "7 % en concursos abiertos y 7 % en los de ascenso, con ajuste positivo (Ley 909, art. 29).", "g": "909"}, {"id": "R909-18", "guia": "Ley 909", "q": "¿Cuántos años puede durar la comisión para un empleo de libre nombramiento?", "r": "Hasta 3 años, prorrogables por igual término; tope de 6 años (Ley 909, art. 26).", "g": "909"}, {"id": "R909-19", "guia": "Ley 909", "q": "¿Cómo se reparten las vacantes si hay concurso de ascenso?", "r": "30 % ascenso y 70 % abierto (Ley 909, art. 29).", "g": "909"}, {"id": "R909-20", "guia": "Ley 909", "q": "¿Qué artículo de la Constitución garantiza la autonomía universitaria?", "r": "El art. 69.", "g": "909"}, {"id": "R909-21", "guia": "Ley 909", "q": "¿Aplica el art. 46 (aprobación del DAFP de las plantas) a un ente universitario autónomo?", "r": "No: se refiere a la Rama Ejecutiva y el DAFP ha conceptuado que no aplica a los entes universitarios autónomos (Concepto DAFP 066291/2021).", "g": "909"}, {"id": "R909-22", "guia": "Ley 909", "q": "¿Qué sentencia declaró inexequible la inscripción extraordinaria en carrera sin concurso?", "r": "La C-588 de 2009, sobre el art. 1 del Acto Legislativo 01 de 2008.", "g": "909"}, {"id": "RMN-A1-6", "g": "mn", "guia": "Marco normativo", "q": "¿Cuáles son los cuatro principios del modelo de gobernanza de la Universidad? Menciona al menos dos.", "r": "Primero la gente; gestión basada en resultados; adaptación dinámica al cambio; co-creando con la comunidad (Estatuto General, art. 9).", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-A2-5", "g": "mn", "guia": "Marco normativo", "q": "¿Qué debe hacer un servidor cuyo primo hermano participa en un proceso que él tramita?", "r": "Declararse impedido (art. 19): el primo hermano es pariente en cuarto grado de consanguinidad, dentro del límite del artículo.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-A2-6", "g": "mn", "guia": "Marco normativo", "q": "¿Cuánto tiempo tiene la Universidad para aceptar una renuncia?", "r": "Máximo 30 días hábiles (art. 127). Si no se pronuncia, el servidor puede separarse del cargo sin que haya abandono.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-A3-2", "g": "mn", "guia": "Marco normativo", "q": "¿Cuál es la diferencia entre impedimento y recusación?", "r": "Impedimento: el propio servidor o consejero declara su conflicto y se aparta. Recusación: otra persona pide que se aparte porque no lo declaró.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-A3-5", "g": "mn", "guia": "Marco normativo", "q": "¿Qué dice la Política sobre la rendición de cuentas?", "r": "Que es un deber ético y no un simple trámite; hace parte del Plan Anticorrupción y de Atención al Ciudadano y se realiza en audiencia pública ante el Consejo Superior ampliado.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-P1", "g": "mn", "guia": "Marco normativo", "q": "¿Por qué la Universidad puede tener su propio régimen de carrera y no se rige directamente por la Ley 909?", "r": "Por la autonomía universitaria (C.P. art. 69) y el régimen especial de los entes universitarios autónomos (Ley 30, arts. 57 y 28). La Ley 909 se aplica solo de forma supletoria.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-P3", "g": "mn", "guia": "Marco normativo", "q": "¿En qué se diferencian un empleado de carrera, un provisional y un contratista en ingreso y estabilidad?", "r": "Carrera: ingresa por concurso y tiene estabilidad propia del mérito. Provisional: nombrado sin concurso de manera transitoria; su retiro debe motivarse. Contratista: no es servidor, se vincula por contrato de prestación de servicios y no tiene estabilidad laboral.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-P4", "g": "mn", "guia": "Marco normativo", "q": "¿Cómo se relacionan la evaluación del desempeño, los encargos y la permanencia en la carrera?", "r": "La evaluación sobresaliente da prelación y puntaje para encargos (arts. 116 y 134); la no satisfactoria en dos periodos continuos lleva a la insubsistencia y hace perder el encargo.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-P5", "g": "mn", "guia": "Marco normativo", "q": "¿Qué busca el concurso especial transitorio de incorporación y qué garantías debe cumplir?", "r": "Armonizar el mérito con la situación de quienes hoy están en provisionalidad. Se convoca en máximo 12 meses, incluye un curso de formación institucional con evaluación certificable (art. 153) y lo acompaña una comisión transitoria (art. 154).", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "RMN-P8", "g": "mn", "guia": "Marco normativo", "q": "Si la Política de 2019 y el Estatuto General de 2023 regulan el mismo asunto de forma distinta, ¿cuál prevalece?", "r": "El Estatuto General de 2023: es la norma de mayor jerarquía interna y posterior.", "n": "Respuesta de referencia elaborada por el preparador con la cartilla (la cartilla no trae clave)."}, {"id": "M2-R1", "g": "m2", "guia": "Módulo 2 · Termómetro de supuestos", "q": "«El Plan de Desarrollo es un asunto de los directivos; mi trabajo es cumplir las funciones de mi cargo.» ¿De acuerdo o en desacuerdo?", "r": "En desacuerdo. El PDU se ejecuta a través de los proyectos del plan de acción anual de cada dependencia; cada servidor ejerce autocontrol sobre las metas a su cargo (art. 4, Acuerdo Superior 06 de 2021)."}, {"id": "M2-R2", "g": "m2", "guia": "Módulo 2 · Termómetro de supuestos", "q": "«Si una dependencia ejecutó todas sus actividades, cumplió su plan de acción.» ¿De acuerdo o en desacuerdo?", "r": "En desacuerdo. La evaluación anual mira actividades, metas y presupuesto; una ejecución alta con metas bajas es una brecha que obliga a revisar el diseño."}, {"id": "M2-R3", "g": "m2", "guia": "Módulo 2 · Termómetro de supuestos", "q": "«Cuando una meta resulta inalcanzable, lo razonable es que la dependencia la ajuste para reflejar lo que sí puede lograr.» ¿De acuerdo o en desacuerdo?", "r": "En desacuerdo. Las metas del PDU se revisan por la ruta del art. 7 (OAP → Consejo de Planeación → Consejo Superior); el plan de acción se reprograma de forma concertada con la jefatura."}, {"id": "M2-R4", "g": "m2", "guia": "Módulo 2 · Termómetro de supuestos", "q": "«Para aprobar la prueba basta con memorizar los datos de los planes.» ¿De acuerdo o en desacuerdo?", "r": "En desacuerdo. La mayoría de los ítems piden relacionar, aplicar o analizar: se aprueba decidiendo con criterio, no recitando."}, {"id": "M2-R5", "g": "m2", "guia": "Módulo 2 · Laboratorio relámpago", "q": "En el trimestre, un grupo recibió 1.500 solicitudes y 1.170 fueron atendidas satisfactoriamente para el usuario. Calcule el indicador, diga qué tipo de indicador es y compárelo con la meta 2030 (90 %).", "r": "1.170 / 1.500 × 100 = 78 %. Es un indicador de resultado (cambio en el usuario). Está 12 puntos por debajo de la meta 2030 del 90 % (iniciativa 5.1.3): hay que reportar el dato real y plantear acciones de mejora.", "n": "Respuesta de referencia: la presentación plantea el ejercicio sin resolverlo; el cálculo y la clasificación salen de la misma diapositiva."}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById("bank").textContent);
const CTX = document.getElementById("ctx").textContent;
const CASOS = JSON.parse(document.getElementById("casos").textContent);
const Q = DATA.preguntas;
const TEMAS = DATA.temas;
const LET = ["A","B","C","D"];
const NIVEL = {B:"Básico", I:"Intermedio", A:"Avanzado"};
const COMPONENTES = [
  {id:"M1", n:"Régimen del Empleo Público y Ética", p:25, estado:"parcial"},
  {id:"M2", n:"Procesos de Gestión Institucional", p:35, estado:"parcial"},
  {id:"M3", n:"Atención al Usuario", p:15, estado:"pend"},
  {id:"M4", n:"Inteligencia Artificial Aplicada y Sistemas Institucionales", p:25, estado:"pend"}
];
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const BYID = Object.fromEntries(Q.map(q=>[q.id,q]));
const TC = DATA.temaComp||{};
const compOf = t => TC[t]||"M1";
const LOADED = COMPONENTES.filter(c=>Q.some(q=>q.comp===c.id));
const temasDe = m => Object.keys(TEMAS).filter(k=>(m==="todos"||compOf(k)===m)&&DATA.preguntas.some(q=>q.tema===k));
const compN = id => (COMPONENTES.find(c=>c.id===id)||{}).n||id;
const modNum = id => id.replace("M","");
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Estado ---------- */
let view = "inicio";
let history = [];          // intentos guardados
let iaCache = {};          // preguntas IA vistas (para repetir errores)
let db = null, sample = null, uid = null, storeOK = false, storeMsg = "Cargando historial…";
let cfg = {modo:"practica", nPer:20, grps:[], mod:"M1", fuente:"original", temas:temasDe("M1"), nivel:"todos", n:10, tiempo:0};
let S = null;              // sesión activa
let tick = null;

/* ---------- Persistencia ---------- */
const PARTICIPANTES=[
  {id:"amir-rodriguez",n:"Amir Rodríguez"},
  {id:"genny-ruiz",n:"Genny Ruiz"},
  {id:"gustavo-cotes",n:"Gustavo Cotes"},
  {id:"javier-jimenez",n:"Javier Jiménez"},
  {id:"luis-duran",n:"Luis Durán"},
  {id:"manuel-rodriguez",n:"Manuel Rodríguez"},
  {id:"yeline-granados",n:"Yeline Granados"}
];
let pid=(function(){ try{ const v=localStorage.getItem("pc-user"); return PARTICIPANTES.some(p=>p.id===v)?v:null; }catch(e){ return null; } })();
const pName=()=>{ const p=PARTICIPANTES.find(x=>x.id===pid); return p?p.n:""; };
const initials=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2);
function lsGet(){ if(!pid) return []; try{ return JSON.parse(localStorage.getItem("pc-hist-"+pid)||"[]"); }catch(e){ return []; } }
function lsSet(){ if(!pid) return; try{ localStorage.setItem("pc-hist-"+pid, JSON.stringify(history.slice(0,200))); }catch(e){} }
history = lsGet();
if(pid){ let m="M1"; try{ m=localStorage.getItem("pc-mod-"+pid)||"M1"; }catch(e){} if(m==="todos"||LOADED.some(c=>c.id===m)){ cfg.mod=m; cfg.temas=temasDe(m); } }
let loadSeq=0;
/* ---------- Conexión con Supabase ---------- */
const SB_URL="https://shkxearcsvmonrytzahb.supabase.co";
const SB_KEY="sb_publishable_s0ig_7G4EI7B8Dr11pCJWA_RUY8Y8jr";
const SBH={apikey:SB_KEY,"Content-Type":"application/json"};
async function sbFetch(path,opt){ const r=await fetch(SB_URL+"/rest/v1/"+path,Object.assign({headers:SBH},opt||{})); if(!r.ok){ const e=new Error("HTTP "+r.status); e.code=r.status===413?"quota_exceeded":"unavailable"; throw e; } return r.status===204?null:r.json().catch(()=>null); }
function sbUpsert(table,row){ return sbFetch(table+"?on_conflict="+(table==="intentos"?"sid":"participante"),{method:"POST",headers:Object.assign({},SBH,{Prefer:"resolution=merge-duplicates,return=minimal"}),body:JSON.stringify(row)}); }
const SBDB={
  collection(){ return {
    where(f,op,v){ return { limit(n){ return { async get(){ const rows=await sbFetch(`intentos?participante=eq.${encodeURIComponent(v)}&select=sid,datos&order=ts.desc&limit=${n}`); return {docs:(rows||[]).map(x=>({id:x.sid,data:()=>x.datos}))}; } }; } }; },
    doc(sid){ return { async set(a){ await sbUpsert("intentos",{sid, participante:a.p, ts:a.ts, modo:a.modo==="practica"?"practica":"simulacro", nota:a.nota, datos:a}); } }; }
  }; },
  doc(path){ const id=path.split("/")[1]; return {
    async get(){ const rows=await sbFetch(`progreso?participante=eq.${encodeURIComponent(id)}&select=datos`); const d=rows&&rows[0]; return {exists:!!d, data:()=>d&&d.datos}; },
    async set(d){ await sbUpsert("progreso",{participante:id, datos:d, actualizado:new Date().toISOString()}); }
  }; }
};
async function initStore(){
  db=SBDB; storeMsg="Conectando con la base de datos…"; setTimeout(loadRemote,0);
}
async function loadRemote(){
  if(!db||!pid) return;
  const me=++loadSeq, who=pid;
  let done=false;
  const timer = setTimeout(()=>{ if(!done&&me===loadSeq){ storeMsg="No se pudo cargar el avance en línea; se muestra la copia de este navegador."; render(); }}, 10000);
  try{
    const snap = await db.collection("intentos").where("p","==",who).limit(500).get();
    done=true; clearTimeout(timer); if(me!==loadSeq) return;
    const remote = snap.docs.map(d=>({...d.data(), _id:d.id}));
    const seen = new Set(remote.map(r=>r.sid));
    history = remote.concat(history.filter(h=>!seen.has(h.sid))).sort((a,b)=>b.ts-a.ts);
    remote.forEach(r=>(r.ia||[]).forEach(q=>iaCache[q.id]=q));
    storeOK = true; storeMsg = "Avance sincronizado en la base de datos."; lsSet();
    await loadProg(); render();
  }catch(e){ done=true; clearTimeout(timer); if(me===loadSeq){ storeMsg = "Avance guardado en este navegador."; render(); } }
}
function selectUser(id){
  pid=id; try{ localStorage.setItem("pc-user",id); }catch(e){}
  history=lsGet(); prog=lsProg(); iaCache={}; S=null; clearInterval(tick);
  cfg={modo:"practica", nPer:20, grps:[], mod:"M1", fuente:"original", temas:temasDe("M1"), nivel:"todos", n:10, tiempo:0};
  { let m="M1"; try{ m=localStorage.getItem("pc-mod-"+id)||"M1"; }catch(e){} if(m!=="todos"&&!LOADED.some(c=>c.id===m)) m="M1"; cfg.mod=m; cfg.temas=temasDe(m); if(cfg.fuente==="ia"&&m!=="M1") cfg.fuente="original"; }
  CV.txt={}; CV.shown={}; CV.ia={}; CV.fl=null; CV.i=0;
  view="inicio"; lastView=null; render(); loadRemote();
}
function logout(){ if(S&&!S.done&&S.modo!=="practica"){ openDlg(`<h3 id="dlg-t">¿Cambiar de participante?</h3><p>El simulacro en curso se perderá y no quedará calificado.</p><div class="row"><button class="btn ghost" data-close>Seguir</button><button class="btn primary" data-logout>Cambiar</button></div>`); return; } doLogout(); }
function doLogout(){ closeDlg(); pid=null; try{ localStorage.removeItem("pc-user"); }catch(e){} S=null; clearInterval(tick); history=[]; view="login"; render(); }
async function saveAttempt(a){
  if(!pid) return; a.p=pid; a.nombre=pName();
  history = [a].concat(history.filter(h=>h.sid!==a.sid));
  lsSet();
  if(db){
    try{ await db.collection("intentos").doc(a.sid).set(a); storeOK=true; }
    catch(e){ if(e && e.code==="quota_exceeded") storeMsg="El almacenamiento en línea está lleno; el intento quedó en este navegador."; }
  }
}
function lsProg(){ if(!pid) return {evals:{},rapidas:{}}; try{ return JSON.parse(localStorage.getItem("pc-prog-"+pid)||"null")||{evals:{},rapidas:{}}; }catch(e){ return {evals:{},rapidas:{}}; } }
let prog = lsProg();
let progW = Promise.resolve();
function saveProg(){ if(!pid) return; try{ localStorage.setItem("pc-prog-"+pid, JSON.stringify(prog)); }catch(e){} if(db){ const snapP=Object.assign(JSON.parse(JSON.stringify(prog)),{p:pid,nombre:pName()}); const who=pid; progW=progW.then(()=>db.doc("progreso/"+who).set(snapP)).catch(()=>{}); } }
async function loadProg(){ if(!db||!pid) return; try{ const who=pid; const d=await db.doc("progreso/"+who).get(); if(who!==pid) return; if(d.exists){ const r=d.data(); prog={evals:Object.assign({},prog.evals,r.evals||{}),rapidas:Object.assign({},prog.rapidas,r.rapidas||{})}; render(); } }catch(e){} }
function initSample(){ claude.use("sample").then(s=>{ sample=s; render(); }).catch(()=>{}); }
initStore(); if(window.claude && claude.use){ initSample(); }

/* ---------- Análisis del historial ---------- */
function lastOutcome(){ // id -> {ok, ts}
  const m={};
  [...history].sort((a,b)=>a.ts-b.ts).forEach(h=>(h.r||[]).forEach(r=>{ if(r.s!==null && r.s!==undefined) m[r.id]={ok:r.s===r.k}; else if(h.modo!=="practica") m[r.id]={ok:false}; }));
  return m;
}
function errorIds(){ const m=lastOutcome(); return Object.keys(m).filter(id=>!m[id].ok && (BYID[id]||iaCache[id])); }
function dominio(){
  const t={}; Object.keys(TEMAS).forEach(k=>t[k]={c:0,n:0});
  history.forEach(h=>(h.r||[]).forEach(r=>{ const q=BYID[r.id]||iaCache[r.id]; if(!q||!t[q.tema]) return; if(r.s===null&&h.modo==="practica") return; t[q.tema].n++; if(r.s===r.k) t[q.tema].c++; }));
  return t;
}
const simulacros = ()=>history.filter(h=>h.modo!=="practica");

/* ---------- Render ---------- */
function setView(v){
  if(S && !S.done && v!==view && (view==="sesion")){ confirmLeave(v); return; }
  view=v; render(); window.scrollTo(0,0);
}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
  if(!pid) return;

/* Patrón de guilloché (estilo diploma/billete) en los encabezados */
function drawGuilloche(animate){
  document.querySelectorAll("canvas.guilloche").forEach(cv=>{
    const r=cv.getBoundingClientRect(); if(!r.width) return;
    const dpr=Math.min(2,window.devicePixelRatio||1); cv.width=r.width*dpr; cv.height=r.height*dpr;
    const g=cv.getContext("2d"); g.scale(dpr,dpr);
    const gold=getComputedStyle(document.documentElement).getPropertyValue("--gold").trim()||"#b48a2e";
    g.strokeStyle=gold; g.lineWidth=.6;
    const cx=r.width*.82, cy=r.height*.5, R=Math.min(r.width,r.height)*.62;
    const drawK=k=>{
      g.globalAlpha=.10+.012*k; g.beginPath();
      for(let t=0;t<=Math.PI*2+.01;t+=Math.PI/360){
        const rr=R*(.55+.012*k)+R*.12*Math.sin(9*t+k*.24)+R*.05*Math.cos(23*t);
        const x=cx+rr*Math.cos(t), y=cy+rr*Math.sin(t)*.82;
        t===0?g.moveTo(x,y):g.lineTo(x,y);
      }
      g.stroke();
    };
    if(animate && !RM){ let k=0; const tickG=()=>{ if(k<26){ drawK(k++); setTimeout(()=>requestAnimationFrame(tickG),38); } }; tickG(); }
    else for(let k=0;k<26;k++) drawK(k);
    g.globalAlpha=.08;
    for(let k=0;k<14;k++){ g.beginPath(); for(let x=0;x<=r.width;x+=4){ const y=r.height-18-k*5+6*Math.sin(x/38+k*.5); x===0?g.moveTo(x,y):g.lineTo(x,y);} g.stroke(); }
  });
}

/* GSAP: un solo momento de autor en Inicio y en Resultados (conteo, arco y veredicto) */
function gsapEnter(app){
  const fmt=(v,dec)=>(dec?(Math.round(v*10)/10):Math.round(v)).toString().replace(".",",");
  app.querySelectorAll("[data-count]").forEach(el=>{
    const to=+el.dataset.count, dec=el.dataset.dec?1:0; if(!isFinite(to)||to===0) return;
    const o={v:0}; el.textContent=fmt(0,dec);
    gsap.to(o,{v:to,duration:0.9,ease:"expo.out",delay:0.08,onUpdate:()=>{ el.textContent=fmt(o.v,dec); },onComplete:()=>{ el.textContent=fmt(to,dec); }});
  });
  app.querySelectorAll("circle.arc").forEach(c=>{
    const full=+c.dataset.full, val=+c.dataset.val; c.style.transition="none";
    const o={v:0}; c.setAttribute("stroke-dasharray",`0 ${full}`);
    gsap.to(o,{v:val,duration:0.9,ease:"expo.out",delay:0.08,onUpdate:()=>c.setAttribute("stroke-dasharray",`${o.v} ${full}`)});
  });
  const ver=app.querySelector(".veredicto");
  if(ver) gsap.fromTo(ver,{opacity:0,scale:0.96,filter:"blur(8px)"},{opacity:1,scale:1,filter:"blur(0px)",duration:0.5,ease:"expo.out",delay:0.55,clearProps:"filter,transform,opacity"});
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function mixOpts(q){ if(q.src!=="original"||q.o.length<3||q._mix||q.fix) return q; const ord=shuffle(q.o.map((_,j)=>j)); return {...q, o:ord.map(j=>q.o[j]), k:ord.indexOf(q.k), _mix:1}; }
function startSession(qs, modo, extra){
  qs=qs.map(mixOpts);
  S={sid:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), modo, fuente:cfg.fuente, nivel:cfg.nivel, qs, ans:qs.map(()=>null), flag:qs.map(()=>false), i:0, revealed:false, t0:Date.now(), limit:(modo!=="practica"&&cfg.tiempo)?Math.round(cfg.tiempo*60*qs.length):0, done:false, ...extra};
  view="sesion"; startTimer(); render(); window.scrollTo(0,0);
}
/* Integral: igual número por módulo; primero el módulo 1, luego el 2…; aleatorio dentro de cada módulo */
function pickQs(){
  const pool=poolFor(cfg);
  if(cfg.mod!=="todos") return shuffle(pool).slice(0,cfg.n);
  let out=[];
  LOADED.forEach(c=>{ out=out.concat(shuffle(pool.filter(q=>q.comp===c.id)).slice(0,cfg.nPer)); });
  return out;
}
async function begin(){
  const modo = cfg.modo;
  if(cfg.fuente==="ia"){ return generateIA(cfg.n, modo); }
  startSession(pickQs(), modo);
}

${out.map(q=>"- "+q.q).join("\n")}

Responde solo con JSON: {"preguntas":[{"tema":"A","nivel":"I","tipo":"Caso","q":"enunciado","o":["opción 1","opción 2","opción 3","opción 4"],"k":0,"e":"explicación","f":"fuente"}]} donde "k" es el índice (0 a 3) de la opción correcta.

MATERIAL DE ESTUDIO:
${CTX}`;

function buildAttempt(){
  const r=S.qs.map((q,i)=>({id:q.id,s:S.ans[i],k:q.k}));

  const total=used.length;
  const nota = total? Math.round(correct/total*1000)/10 : 0;
  const porTema={}; S.qs.forEach((q,i)=>{ if(S.modo==="practica"&&S.ans[i]===null) return; const t=porTema[q.tema]||(porTema[q.tema]={c:0,n:0}); t.n++; if(S.ans[i]===q.k) t.c++; });

}
