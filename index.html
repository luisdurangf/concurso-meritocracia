const CV={tab:"casos", filtro:"todas", i:0, txt:{}, shown:{}, ia:{}, busy:null, fl:null, fshown:false};
const caseList=()=>CASOS.casos.filter(c=>CV.filtro==="todas"||c.g===CV.filtro);
const rapList=()=>CASOS.rapidas.filter(c=>CV.filtro==="todas"||c.g===CV.filtro);
const EV={bien:"La tenía bien",parcial:"Parcialmente",mal:"No la sabía"};
function vCasos(){
  const filtros=[["todas","Todas"],["30","Ley 30"],["909","Ley 909"],["disc","Disciplinario"],["vbg","Ac. 10/2019"],["mn","Marco normativo"],["m2","Módulo 2"]].map(([k,t])=>`<button data-cfil="${k}" aria-pressed="${CV.filtro===k}">${t}</button>`).join("");
  const nEval=Object.keys(prog.evals).length, nBien=Object.values(prog.evals).filter(e=>e.v==="bien").length;
  const nR=Object.keys(prog.rapidas).length, nRok=Object.values(prog.rapidas).filter(Boolean).length;
  let body="";
  if(CV.tab==="casos"){
    const L=caseList(); if(CV.i>=L.length) CV.i=0; const c=L[CV.i];
    const items=L.map((x,j)=>{ const e=prog.evals[x.id]; return `<button data-ci="${j}" aria-current="${j===CV.i}"><span class="st ${e?e.v:""}" title="${e?EV[e.v]:"Sin responder"}"></span><span>${esc(x.oficina)}<small>${esc(x.guia)}</small></span></button>`; }).join("");
    const shown=CV.shown[c.id], e=prog.evals[c.id], ia=CV.ia[c.id];
    const iaBlock = ia ? (ia.error?`<div class="warnbox" style="margin-top:14px">${esc(ia.error)}</div>`:`<div class="fb ${ia.veredicto==="correcta"?"ok":ia.veredicto==="incorrecta"?"bad":"neu"}"><h3>Evaluación con IA: ${esc({correcta:"respuesta correcta",parcial:"respuesta parcial",incorrecta:"respuesta incorrecta"}[ia.veredicto]||ia.veredicto)}</h3>${(ia.aciertos||[]).length?`<p><b>Lo que acertaste</b></p><ul>${ia.aciertos.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}${(ia.faltantes||[]).length?`<p><b>Lo que faltó o no es preciso</b></p><ul>${ia.faltantes.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}${ia.comentario?`<p>${esc(ia.comentario)}</p>`:""}<p class="src">Evaluación orientativa: compara tu texto con la respuesta de la guía.</p></div>`) : "";
    body=`<div class="cases">
      <div><div class="lab" style="margin-bottom:10px">${L.length} casos</div><div class="clist" role="list">${items}</div></div>
      <article class="panel ruled ccard">
        <div class="meta"><span class="tag gold">${esc(c.guia)}</span><span class="tag">Tema ${c.tema} · ${esc(TEMAS[c.tema])}</span><span class="tag mono">${esc(c.id)}</span></div>
        <div class="eyebrow">Caso ${CV.i+1} de ${L.length}</div>
        <h2 class="ofi">${esc(c.oficina)}</h2>
        <p class="qtext" style="white-space:pre-line${c.story?";font-size:16px;line-height:1.6":""}">${esc(c.q)}</p>
        <label class="lab" for="case-txt">Tu respuesta</label>
        <textarea id="case-txt" placeholder="Escribe tu respuesta citando las normas o sentencias que la sustentan…">${esc(CV.txt[c.id]||"")}</textarea>
        <div class="qnav" style="margin-top:14px">
          <div class="row">${sample?`<button class="btn ghost" data-iaeval ${CV.busy?"disabled":""}>${CV.busy===c.id?"Evaluando…":"Evaluar mi respuesta con IA"}</button>`:""}</div>
          <button class="btn primary" data-reveal>${shown?"Ocultar respuesta de la guía":"Ver respuesta de la guía"}</button>
        </div>
        ${iaBlock}
        ${shown?`<div class="fb neu"><h3>Respuesta de la guía</h3><p style="white-space:pre-line">${esc(c.r)}</p><p class="src">Fundamento: ${esc(c.f)}</p>${c.n?`<p class="src"><b>Ojo:</b> ${esc(c.n)}</p>`:""}
          <div class="lab" style="margin-top:14px">¿Cómo te fue?</div>
          <div class="selfeval seg">${Object.entries(EV).map(([k,t])=>`<button data-sev="${k}" aria-pressed="${e&&e.v===k}">${t}</button>`).join("")}</div></div>`:""}
        <div class="qnav"><button class="btn ghost" data-cprev ${CV.i===0?"disabled":""}>Caso anterior</button><button class="btn ghost" data-cnext ${CV.i===L.length-1?"disabled":""}>Siguiente caso</button></div>
      </article></div>`;
  } else {
    if(!CV.fl || CV.fl.f!==CV.filtro){ CV.fl={f:CV.filtro, order:shuffle(rapList().map(x=>x.id)), i:0}; CV.fshown=false; }
    const ids=CV.fl.order; const done=CV.fl.i>=ids.length;
    const r=done?null:CASOS.rapidas.find(x=>x.id===ids[CV.fl.i]);
    body= done ? `<div class="panel ruled flash"><div class="eyebrow">Ronda terminada</div><p class="fq">Repasaste ${ids.length} preguntas</p><p class="muted">Sabías ${ids.filter(id=>prog.rapidas[id]).length} de ${ids.length} en tu última respuesta a cada una.</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" data-fround>Nueva ronda</button>${ids.some(id=>!prog.rapidas[id])?`<button class="btn ghost" data-fwrong>Solo las que no sabía</button>`:""}</div></div>`
    : `<div class="panel ruled flash">

        :`<div class="row" style="justify-content:center;margin-top:26px"><button class="btn primary" data-fshow>Mostrar respuesta</button></div>`}
        <div class="prog" style="max-width:420px;margin:26px auto 0;width:100%"><i style="width:${CV.fl.i/ids.length*100}%"></i></div>
      </div>`;
  }
  return `
  <section class="panel ruled">
    <div class="sec-h"><div><h2>Casos y preguntas de la guía</h2></div>
      <div class="seg" role="group" aria-label="Cartilla">${filtros}</div></div>
    <p class="note" style="margin-bottom:16px">Son los ejercicios, casos y preguntas abiertas tal como aparecen en las cartillas, con la respuesta que da cada guía. Si la cartilla no trae respuesta, se muestra una de referencia marcada como tal. Casos evaluados: <b class="num">${nEval}/${CASOS.casos.length}</b> (${nBien} bien) · Rápidas repasadas: <b class="num">${nR}/${CASOS.rapidas.length}</b> (${nRok} sabidas).</p>
    <div class="tabs" role="tablist"><button role="tab" data-ctab="casos" aria-selected="${CV.tab==="casos"}">Casos del puesto de trabajo (${CASOS.casos.length})</button><button role="tab" data-ctab="rapidas" aria-selected="${CV.tab==="rapidas"}">Respuesta rápida (${CASOS.rapidas.length})</button></div>
    ${body}
  </section>`;
}
async function iaEval(c){
  const txt=(CV.txt[c.id]||"").trim();
  if(txt.length<20){ CV.ia[c.id]={error:"Escribe una respuesta un poco más completa (al menos una o dos frases) para poder evaluarla."}; render(); return; }
  CV.busy=c.id; render();
  const prompt=`Eres un evaluador de pruebas de conocimientos para concursos de mérito en Colombia. Compara la respuesta del aspirante con la respuesta de referencia de la guía de estudio. Evalúa solo frente a la referencia y su fundamento; no agregues normas que no estén allí. Sé concreto y breve, en español.

CASO: ${c.q}

RESPUESTA DE REFERENCIA (guía): ${c.r}
FUNDAMENTO: ${c.f}

RESPUESTA DEL ASPIRANTE: ${txt}

Responde solo con JSON: {"veredicto":"correcta"|"parcial"|"incorrecta","aciertos":["..."],"faltantes":["..."],"comentario":"una o dos frases con lo que debe reforzar"}`;
  try{ const res=await sample.json(prompt,{modelTier:"quick"}); CV.ia[c.id]=res&&res.veredicto?res:{error:"La evaluación no tuvo el formato esperado. Intenta de nuevo."}; }
  catch(e){ CV.ia[c.id]={error: e&&e.code==="rate_limited"?"Se alcanzó el límite de solicitudes. Intenta en unos minutos.":e&&e.code==="not_granted"?"No se concedió el permiso para consultar a Claude.":"No se pudo evaluar la respuesta."}; }
  CV.busy=null; if(view==="casos") render();
}
function bindCasos(app){

/* ---------- Historial ---------- */
function vHistorial(){
  const sims=simulacros().slice().reverse();
  let chart="";
  if(sims.length){
    const W=680,H=200,pl=34,pr=12,pt=14,pb=26; const n=sims.length;
    const x=i=>pl+(n===1?(W-pl-pr)/2:i*(W-pl-pr)/(n-1)); const y=v=>pt+(100-v)*(H-pt-pb)/100;
    const pts=sims.map((s,i)=>`${x(i)},${y(s.nota)}`).join(" ");
    const grid=[0,20,40,60,80,100].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===60?'stroke="var(--gold)" stroke-dasharray="4 4" stroke-width="1.5"':""}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join("");
    const area=n>1?`<polygon points="${x(0)},${y(0)} ${pts} ${x(n-1)},${y(0)}" fill="var(--gold)" opacity=".10"/>`:"";
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de las calificaciones de los simulacros">${grid}${area}<polyline points="${pts}" fill="none" stroke="var(--gold-2)" stroke-width="2"/>${sims.map((s,i)=>`<circle cx="${x(i)}" cy="${y(s.nota)}" r="${i===n-1?5:3.5}" fill="${s.nota>=60?"var(--ok)":"var(--bad)"}"/>`).join("")}<text x="${W-pr}" y="${y(60)-6}" text-anchor="end">mínimo 60</text></svg>`;
  }
  const rows=history.map(h=>{ const d=new Date(h.ts); const fu={propia:"Práctica adicional",original:"Preguntas del módulo",mixto:"Todas",ia:"Inéditas IA",errores:"Repetir errores"}[h.fuente]||h.fuente;
    const res=h.modo==="practica"?'<span class="pill neu">Práctica</span>':`<span class="pill ${h.nota>=60?"ok":"bad"}">${h.nota>=60?"Aprobado":"No aprobado"}</span>`;
    return `<tr><td>${d.toLocaleDateString("es-CO",{day:"2-digit",month:"short"})} ${d.toLocaleTimeString("es-CO",{hour:"2-digit",minute:"2-digit"})}</td><td>${h.modo==="practica"?"Práctica":"Simulacro"}</td><td>${esc(fu)}</td><td>${h.correctas}/${h.total}</td><td><b>${String(h.nota).replace(".",",")}</b></td><td>${res}</td></tr>`;}).join("");
  return `
  <section class="panel ruled">
    <div class="sec-h"><div><h2>Evolución de los simulacros</h2></div><span class="note">${esc(storeMsg)}</span></div>
    ${sims.length?chart:'<p class="muted">Aún no has presentado simulacros. Cuando termines el primero verás aquí tu evolución frente al mínimo de 60.</p>'}
  </section>
  <section class="panel">
    <div class="sec-h"><h2>Todos los intentos</h2><span class="note num">${history.length} registro${history.length===1?"":"s"}</span></div>
    ${history.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Modo</th><th>Origen</th><th>Correctas</th><th>Nota</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<p class="muted">Sin intentos registrados.</p>'}
  </section>`;
}

  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ if(cfg.mod==="todos"){ cfg.nPer=+b.dataset.n; render(); return; } cfg.n=+b.dataset.n; render(); });
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{ cfg.tiempo=+b.dataset.t; render(); });
  const nc=$("#n-custom"); if(nc) nc.onchange=()=>{ const v=Math.max(1,Math.min(+nc.max||150,Math.round(+nc.value||1))); if(cfg.mod==="todos") cfg.nPer=v; else cfg.n=v; render(); };
  const st=app.querySelector("[data-start]"); if(st) st.onclick=begin;
  app.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>choose(+b.dataset.opt));
  const ck=app.querySelector("[data-check]"); if(ck) ck.onclick=check;
  const nx=app.querySelector("[data-next]"); if(nx) nx.onclick=next;
  const ns=app.querySelector("[data-nexts]"); if(ns) ns.onclick=()=>{ S.i++; render(); };
  const pv=app.querySelector("[data-prev]"); if(pv) pv.onclick=()=>{ S.i--; render(); };
  const fl=app.querySelector("[data-flag]"); if(fl) fl.onclick=()=>{ S.flag[S.i]=!S.flag[S.i]; render(); };
  app.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{ S.i=+b.dataset.jump; render(); });
  app.querySelectorAll("[data-finish]").forEach(b=>b.onclick=()=>finish(false));
  const sa=app.querySelector("[data-showall]"); if(sa) sa.onclick=()=>{ S.showAll=!S.showAll; render(); };
  const hm=app.querySelector("[data-home]"); if(hm) hm.onclick=()=>{ S=null; view="inicio"; render(); };
  const ag=app.querySelector("[data-again]"); if(ag) ag.onclick=()=>{ cfg.modo=S.modo==="practica"?"practica":"simulacro"; S=null; view="config"; render(); };
  const rw=app.querySelector("[data-retrywrong]"); if(rw) rw.onclick=()=>{ const qs=S.qs.filter((q,i)=>S.ans[i]!==q.k); const pf=cfg.fuente; cfg.fuente="errores"; startSession(shuffle(qs),"practica"); cfg.fuente=pf; };
}
document.addEventListener("keydown",e=>{
  if(view!=="sesion"||!S||S.done||!$("#dlg").classList.contains("hide")) return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
  const k=e.key.toUpperCase(); const map={A:0,B:1,C:2,D:3,"1":0,"2":1,"3":2,"4":3};
  if(k in map){ choose(map[k]); e.preventDefault(); }
  else if(e.key==="Enter"){ if(S.modo==="practica"){ S.revealed?next():check(); } else if(S.i<S.qs.length-1){ S.i++; render(); } e.preventDefault(); }
  else if(e.key==="ArrowRight"&&S.modo!=="practica"&&S.i<S.qs.length-1){ S.i++; render(); }
  else if(e.key==="ArrowLeft"&&S.modo!=="practica"&&S.i>0){ S.i--; render(); }
});

/* Conserva la sesión activa si la página se actualiza */
function start(snap){
  if(snap && snap.S && snap.S.qs && pid){ S=snap.S; view=snap.view||"inicio"; cfg=snap.cfg||cfg; if(S && !S.done) startTimer(); }
  render();
}
if(window.claude && window.claude.hot){ try{ window.claude.hot.snapshot(()=>({S,view,cfg})); }catch(e){} }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
