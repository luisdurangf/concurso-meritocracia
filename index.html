<!DOCTYPE html>
<html lang="es" data-mode="light">
<script>try{var m=localStorage.getItem("pc-mode");if(m==="dark"||m==="light")document.documentElement.setAttribute("data-mode",m);}catch(e){}</script>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1a33">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Meritocracia">
<title>Preparador Concurso de Meritocracia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: aplicación de escritorio. Barra lateral fija de 264px + área de trabajo fluida (máx. 1320px). Modo claro por defecto; modo oscuro opcional con [data-mode="dark"]. */
:root{
  --bg:#f4f5f8;
  --surface:#ffffff;
  --surface-2:#f8f9fb;
  --glass:#ffffff;
  --glass-2:#fbfbfd;
  --track:#e7eaf0;
  --line:#e2d6b8;
  --line-2:#e3e7ee;
  --ink:#121a2b;
  --ink-2:#2b3550;
  --muted:#667189;
  --gold:#a7822f;
  --gold-2:#c9a24f;
  --gold-3:#7d6020;
  --gold-text:#8a6a22;
  --tint:#f6efdd;
  --navy:#0f2347;
  --navy-2:#1a3a6e;
  --ok:#1f7a50; --ok-bg:#e8f4ee;
  --bad:#b4372c; --bad-bg:#fbecea;
  --warn:#9a5f0c; --warn-bg:#fcf1df;
  --side:#0d1a33;
  --shadow:0 1px 2px rgba(18,26,43,.04),0 10px 30px -18px rgba(18,26,43,.25);
  --shadow-h:0 2px 6px rgba(18,26,43,.06),0 22px 44px -22px rgba(18,26,43,.35);
  --glow:rgba(201,162,79,.12);
  --sel-ink:#1a1405;
  --font-display:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --font-body:"Geist","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
:root[data-mode="dark"]{
  --bg:#060b17;
  --surface:#0d1628;
  --surface-2:#0a1222;
  --glass:rgba(255,255,255,.035);
  --glass-2:rgba(255,255,255,.06);
  --track:rgba(255,255,255,.08);
  --line:rgba(212,175,95,.22);
  --line-2:rgba(255,255,255,.08);
  --ink:#e9edf5;
  --ink-2:#c3cbdb;
  --muted:#8f9bb2;
  --gold:#d4af5f;
  --gold-2:#f1d68f;
  --gold-3:#9c7a33;
  --gold-text:#f1d68f;
  --tint:rgba(212,175,95,.10);
  --ok:#5cc792; --ok-bg:rgba(92,199,146,.10);
  --bad:#ef8176; --bad-bg:rgba(239,129,118,.10);
  --warn:#e8b25a; --warn-bg:rgba(232,178,90,.10);
  --side:#050a15;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.8);
  --shadow-h:0 1px 0 rgba(255,255,255,.05) inset,0 26px 50px -24px rgba(0,0,0,.9);
  --glow:rgba(241,214,143,.08);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15.5px;line-height:1.6;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.08;letter-spacing:-.012em;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.mono{font-family:var(--font-mono);font-size:.8em;letter-spacing:.03em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide{display:none!important}
.foil{background:linear-gradient(170deg,#f3dca0 0%,var(--gold-2) 30%,var(--gold) 62%,var(--gold-3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
:root:not([data-mode="dark"]) .panel .foil,:root:not([data-mode="dark"]) .qbig{background:linear-gradient(170deg,#c9a24f 0%,#a7822f 55%,#6e5219 100%);-webkit-background-clip:text;background-clip:text}

/* Fondo: aurora suave + grano */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:radial-gradient(40% 35% at 25% 20%,rgba(201,162,79,.10),transparent 70%),radial-gradient(35% 40% at 85% 75%,rgba(40,80,160,.10),transparent 70%);
  filter:blur(30px)}
:root[data-mode="dark"] body::before{background:radial-gradient(40% 35% at 25% 20%,rgba(212,175,95,.10),transparent 70%),radial-gradient(35% 40% at 85% 75%,rgba(40,80,160,.22),transparent 70%)}
@keyframes aurora{0%{transform:translate3d(0,0,0) rotate(0)}50%{transform:translate3d(-3%,2%,0) rotate(6deg)}100%{transform:translate3d(2%,-2%,0) rotate(-5deg)}}
body::after{content:"";position:fixed;inset:0;z-index:30;pointer-events:none;opacity:.05;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
:root[data-mode="dark"] body::after{opacity:.07;mix-blend-mode:overlay}

/* Estructura de escritorio */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--side);color:#e9edf5;display:flex;flex-direction:column;padding:26px 18px 20px;border-right:1px solid rgba(212,175,95,.25);overflow:auto}
.sidebar::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 50% at 0% 0%,rgba(212,175,95,.12),transparent 60%)}
.sb-brand{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;padding:0 8px 24px;border-bottom:1px solid rgba(255,255,255,.08);position:relative}
.seal{position:relative;width:48px;height:48px;color:#d4af5f;display:grid;place-items:center}
.seal svg{position:absolute;inset:0}
.seal span{font-family:var(--font-display);font-size:19px;letter-spacing:.04em;background:linear-gradient(170deg,#f1d68f,#d4af5f 60%,#9c7a33);-webkit-background-clip:text;background-clip:text;color:transparent}
.sb-brand b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;line-height:1.02;letter-spacing:-.01em}
.sb-brand small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#8f9bb2;margin-top:6px;line-height:1.5}
.nav{display:grid;gap:4px;padding:22px 0;position:relative}
.nav .nav-lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6f7b93;padding:0 12px 8px}
.nav button{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;text-align:left;background:transparent;border:0;color:#aab4c7;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:500;font-size:14.5px;transition:background .2s,color .2s}
.nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav button[aria-current="page"]{color:#f1d68f;background:linear-gradient(90deg,rgba(212,175,95,.16),rgba(212,175,95,.04));box-shadow:inset 2px 0 0 #d4af5f}
.nav .badge{font-family:var(--font-mono);font-size:11px;color:#8f9bb2}
.sb-foot{margin-top:auto;display:grid;gap:14px;position:relative}
.sb-mode{display:grid;grid-template-columns:1fr 1fr;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:4px}
.sb-mode button{border:0;background:transparent;color:#aab4c7;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center;justify-content:center}
.sb-mode button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.sb-mode button[aria-pressed="true"]{background:#f1d68f;color:#1a1405}
.sb-note{font-size:11.5px;color:#6f7b93;line-height:1.5;padding:0 6px}
.sb-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sb-meta div{border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.sb-meta b{display:block;font-family:var(--font-display);font-weight:400;font-size:28px;line-height:1;color:#f1d68f}
.sb-meta span{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8f9bb2}

.content{min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1320px;margin:0 auto;padding:34px 44px 40px;display:grid;gap:22px}
footer{width:100%;max-width:1320px;margin:0 auto;padding:16px 44px 30px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line-2)}

.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:18px;padding:26px 28px;box-shadow:var(--shadow)}
.panel.ruled{position:relative;overflow:hidden}
.panel.ruled::before{content:"";position:absolute;left:26px;right:26px;top:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold-2) 50%,var(--gold) 80%,transparent);transform-origin:left}
.eyebrow,.lab,.field>label,.field>.lab{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.eyebrow{color:var(--gold-text)}
.lab,.field>label,.field>.lab{color:var(--muted)}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}
.sec-h h2{font-size:38px}
.note{font-size:13.5px;color:var(--muted);margin:0}
.page-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.page-h h1{font-size:46px}
.page-h p{margin:6px 0 0;color:var(--muted);max-width:70ch}

/* Portada */
.ficha{position:relative;isolation:isolate;display:grid;grid-template-columns:1.2fr 1fr;border-radius:22px;overflow:hidden;border:1px solid rgba(212,175,95,.35);background:linear-gradient(140deg,#0a1630 0%,#10244a 55%,#0b1934 100%);color:#e9edf5;box-shadow:var(--shadow-h)}
.ficha::before{content:"";position:absolute;inset:12px;border:1px solid rgba(212,175,95,.22);border-radius:14px;pointer-events:none;z-index:1}
.guilloche{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.7;pointer-events:none}
.ficha-l,.ficha-r{position:relative;z-index:2}
.ficha-l{padding:38px 42px 32px}
.ficha .eyebrow{color:#e2c27a}
.hero-h{font-size:66px;line-height:.98;letter-spacing:-.025em;margin:14px 0 16px}
.hero-h span{display:block}
.hero-h em{font-style:italic;padding-right:.06em}
.ficha-l p{margin:0 0 20px;color:#c3cbdb;max-width:52ch;font-weight:300}
.minimo{display:flex;align-items:center;gap:16px;border-top:1px solid rgba(212,175,95,.25);padding-top:18px}
.minimo .big{font-family:var(--font-display);font-size:84px;line-height:.9;letter-spacing:-.03em}
.minimo span:last-child{font-size:14px;color:#c3cbdb}
.ficha-r{padding:34px 38px;display:grid;gap:16px;align-content:center;border-left:1px solid rgba(212,175,95,.22)}
.comp{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.comp-n{font-size:14.5px;font-weight:500}
.comp-p{font-family:var(--font-display);font-size:32px;letter-spacing:-.02em}
.comp-bar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.comp-bar i{display:block;height:100%;background:linear-gradient(90deg,#9c7a33,#f1d68f);transform-origin:left}
.chip{display:inline-flex;align-items:center;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap;margin-left:6px;vertical-align:2px}
.chip.parcial{color:#f1d68f}.chip.pend{color:#8f9bb2}

.dash{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;left:20px;top:0;width:30px;height:2px;background:var(--gold-2);transform-origin:left}
.tile b{display:block;font-family:var(--font-display);font-weight:400;font-size:50px;letter-spacing:-.03em;line-height:1}
.tile span{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.act{position:relative;overflow:hidden;isolation:isolate;text-align:left;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:20px;cursor:pointer;display:grid;gap:8px;align-content:start;box-shadow:var(--shadow);transition:border-color .2s,transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.act:hover{border-color:var(--gold-2);transform:translateY(-3px);box-shadow:var(--shadow-h)}
.act strong{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:-.015em;line-height:1.05}
.act span{font-size:13.5px;color:var(--muted)}
.act .k{font-family:var(--font-mono);font-size:10.5px;color:var(--gold-text);letter-spacing:.1em}
.act.featured{background:linear-gradient(155deg,#0f2347,#1a3a6e);border-color:rgba(212,175,95,.55);color:#f5f7fb}
.act.featured strong{color:#f1d68f}
.act.featured span{color:#c3cbdb}
.act.featured .k{color:#e2c27a}
.act.featured::before{content:"";position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 70%,rgba(241,214,143,.28) 80%,transparent 90%);opacity:0;z-index:-1}
@keyframes orbit{to{transform:rotate(360deg)}}
.act[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--shadow)}

/* Dominio */
.dom{display:grid;gap:11px}
.dom-row{display:grid;grid-template-columns:minmax(0,1fr) 160px 50px;gap:14px;align-items:center;font-size:14px}
.dom-row .lbl b{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--gold-text);margin-right:10px}
.meter{position:relative;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:3px;transform-origin:left}
.meter::after{content:"";position:absolute;left:60%;top:-3px;bottom:-3px;width:1.5px;background:var(--gold);opacity:.8}
.pct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* Configuración */
.cfg{display:grid;grid-template-columns:1fr 1fr;gap:24px 34px}
.field{display:grid;gap:10px;align-content:start}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line-2);background:var(--surface);padding:10px 15px;border-radius:12px;cursor:pointer;font-size:14.5px;text-align:left;transition:border-color .15s,background .15s}
.seg button:hover:not([disabled]){border-color:var(--gold-2)}
.seg button small{display:block;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:var(--tint);color:var(--gold-text);box-shadow:inset 0 0 0 1px var(--gold)}
.seg button[aria-pressed="true"] small{color:var(--gold-text);opacity:.8}
.seg button[disabled]{opacity:.4;cursor:not-allowed}
.seg .rec{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-text);margin-left:6px}
.temas{display:flex;flex-wrap:wrap;gap:8px}
.temas button{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer}
.temas button b{font-family:var(--font-mono);font-weight:500;font-size:11px;color:var(--gold-text);margin-right:6px}
.temas button[aria-pressed="true"]{border-color:var(--gold-2)}
.temas button[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=number]{width:90px;padding:9px 11px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface)}
textarea{width:100%;min-height:140px;resize:vertical;padding:14px 16px;border:1px solid var(--line-2);border-radius:14px;background:var(--surface-2);line-height:1.55}
textarea:focus{border-color:var(--gold);outline:none}
.warnbox{background:var(--warn-bg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:12px;padding:11px 15px;font-size:13.5px}
.cfg-foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line-2);padding-top:20px}
.btn{position:relative;overflow:hidden;border:0;border-radius:12px;padding:12px 24px;font-weight:600;cursor:pointer;font-size:14.5px;letter-spacing:.01em;transition:filter .15s,border-color .15s,transform .15s,color .15s}
.btn.primary{background:linear-gradient(170deg,#f1d68f,#d4af5f 55%,#9c7a33);color:#1a1405;box-shadow:0 10px 24px -12px rgba(167,130,47,.8)}
.btn.primary::after{display:none;content:"";position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);transition:left .7s cubic-bezier(.2,.7,.2,1)}
.btn.primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn.primary:hover::after{left:120%}
.btn.ghost{background:var(--surface);border:1px solid var(--line-2)}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-text)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;filter:none}

/* Brillo que sigue al cursor */
.panel,.tile,.act,.opt,.clist button,.seg button{background-image:radial-gradient(420px circle at var(--mx,-500px) var(--my,-500px),var(--glow),transparent 42%)}
.act::after,.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:radial-gradient(240px circle at var(--mx,-500px) var(--my,-500px),rgba(201,162,79,.75),transparent 60%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

/* Sesión */
.sess-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.sess-top h2{font-size:30px}
.prog{height:3px;background:var(--track);border-radius:2px;overflow:hidden;margin-top:16px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-3),var(--gold-2));transition:width var(--duration-slow) var(--ease-smooth-out);box-shadow:0 0 12px rgba(201,162,79,.6)}
.timer{font-family:var(--font-mono);font-size:17px;padding:6px 13px;border:1px solid var(--line);border-radius:10px;color:var(--gold-text)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.qcard{padding:32px 38px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tag{font-size:11.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-weight:500}
.tag.ia{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.tag.orig{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.tag.gold{color:var(--gold-text);border-color:var(--line)}
.qnum{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;color:var(--muted)}
.qnum span:last-child{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.qbig{font-family:var(--font-display);font-size:64px;line-height:1;letter-spacing:-.03em;background:linear-gradient(170deg,#fff1c4,#f1d68f 30%,#d4af5f 65%,#9c7a33);-webkit-background-clip:text;background-clip:text;color:transparent}
.qtext{font-size:21px;line-height:1.5;letter-spacing:-.01em;margin:0 0 24px;max-width:74ch}
.opts{display:grid;gap:11px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:14px;align-items:start;text-align:left;border:1px solid var(--line-2);background-color:var(--surface);border-radius:14px;padding:14px 18px;cursor:pointer;font-size:16px;line-height:1.5;transition:border-color var(--duration-quick) var(--ease-out),background-color var(--duration-quick) var(--ease-out)}
.opt:hover:not([disabled]){border-color:var(--gold-2)}
.opt .L{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-2);display:grid;place-items:center;font-family:var(--font-display);font-style:italic;font-size:21px;color:var(--gold-text)}
.opt[aria-pressed="true"]{border-color:var(--gold);background-color:var(--tint)}
.opt[aria-pressed="true"] .L{background:linear-gradient(170deg,#f1d68f,#d4af5f);color:var(--sel-ink);border-color:var(--gold)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.opt.ok{border-color:var(--ok);background-color:var(--ok-bg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background-color:var(--bad-bg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.fb{margin-top:22px;border-radius:16px;padding:20px 24px;border:1px solid;animation:fbIn var(--duration-slow) var(--ease-smooth-out)}
@keyframes fbIn{from{transform:translateY(var(--distance-base));opacity:0;filter:blur(var(--blur-small))}to{transform:none;opacity:1;filter:none}}
.fb.ok{background:var(--ok-bg);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--bad-bg);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.fb.neu{background:var(--tint);border-color:var(--line)}
.fb h3{font-size:30px;margin-bottom:6px}
.fb.ok h3{color:var(--ok)}.fb.bad h3{color:var(--bad)}.fb.neu h3{color:var(--gold-text)}
.fb p{margin:7px 0}
.fb ul{margin:6px 0;padding-left:20px}
.src{font-size:13px;color:var(--muted)}
.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.side{display:grid;gap:14px;position:sticky;top:24px}
.side .panel{padding:20px}
.grid-n{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid-n button{aspect-ratio:1;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);cursor:pointer;font-size:12.5px;font-variant-numeric:tabular-nums;position:relative;padding:0}
.grid-n button.ans{background:var(--tint);border-color:var(--gold-2);color:var(--gold-text);font-weight:600}
.grid-n button.cur{outline:2px solid var(--gold);outline-offset:1px}
.grid-n button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.legend{display:grid;gap:4px;font-size:12px;color:var(--muted);margin-top:12px}
.score-live{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.score-live b{font-family:var(--font-display);font-weight:400;font-size:46px;color:var(--gold-text)}
.kbd{display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.kbd kbd{font-family:var(--font-mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface-2);color:var(--ink)}

/* Resultados */
.cert{isolation:isolate}
.cert .guilloche{opacity:.22}
.cert>.res-head{position:relative;z-index:1}
.res-head{display:grid;grid-template-columns:auto 1fr;gap:38px;align-items:center}
.nota{width:200px;height:200px;position:relative;display:grid;place-items:center}
.nota svg{position:absolute;inset:0;transform:rotate(-90deg)}
.nota div{text-align:center}
.nota b{font-family:var(--font-display);font-weight:400;font-size:88px;letter-spacing:-.04em;line-height:1;display:block}
.nota span{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.veredicto{display:inline-block;font-weight:700;letter-spacing:.18em;font-size:12.5px;padding:7px 18px;border-radius:999px;border:1px solid}
.veredicto.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent);background:var(--ok-bg)}
.veredicto.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-bg)}
.res-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.res-tiles div{border:1px solid var(--line-2);border-radius:14px;padding:12px 16px;background:var(--surface-2)}
.res-tiles b{display:block;font-family:var(--font-display);font-weight:400;font-size:40px;line-height:1.1}
.res-tiles span{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
ul.recs{margin:0;padding-left:18px;display:grid;gap:9px}
ul.recs li::marker{color:var(--gold)}
.review{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rv{border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;border-left:3px solid var(--bad);background:var(--surface-2)}
.rv.okk{border-left-color:var(--ok)}
.rv.skip{border-left-color:var(--warn)}
.rv h4{margin:0 0 8px;font-size:15.5px;font-weight:600}
.rv .ans{display:grid;gap:4px;font-size:14px;margin:8px 0}
.rv .ans .y{color:var(--bad)}.rv .ans .c{color:var(--ok)}
.rv p{margin:6px 0;font-size:14px}

/* Casos */
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line-2);margin-bottom:20px}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 4px;margin-right:22px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--gold-text);border-bottom-color:var(--gold)}
.cases{display:grid;grid-template-columns:320px minmax(0,1fr);gap:22px;align-items:start}
.clist{display:grid;gap:6px;max-height:calc(100vh - 300px);min-height:420px;overflow:auto;padding-right:4px;position:sticky;top:24px}
.clist button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;text-align:left;border:1px solid var(--line-2);background-color:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer;font-size:13.5px;line-height:1.4}
.clist button:hover{border-color:var(--gold-2)}
.clist button[aria-current="true"]{border-color:var(--gold);background-color:var(--tint)}
.clist .st{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--track)}
.clist .st.bien{background:var(--ok)}.clist .st.parcial{background:var(--warn)}.clist .st.mal{background:var(--bad)}
.clist small{display:block;color:var(--muted);font-size:11.5px}
.ccard{padding:30px 36px}
.ccard .ofi{font-size:36px;margin:6px 0 14px}
.selfeval{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.flash{min-height:340px;display:grid;align-content:center;text-align:center;padding:44px 40px}
.flash .fq{font-family:var(--font-display);font-size:38px;line-height:1.2;max-width:32ch;margin:10px auto 0}
.flash .fa{margin:22px auto 0;max-width:64ch;font-size:17px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:20px}

/* Historial */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{text-align:left;font-family:var(--font-mono);font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.pill.neu{color:var(--muted);border-color:var(--line-2)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}

/* Diálogo */
.overlay{position:fixed;inset:0;background:rgba(6,11,23,.55);backdrop-filter:blur(5px);display:grid;place-items:center;padding:20px;z-index:40}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:480px;width:100%;padding:30px;display:grid;gap:12px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.dialog h3{font-size:32px}
.dialog .row{justify-content:flex-end}
.gen{display:grid;gap:12px;justify-items:start}
.spinner{width:30px;height:30px;border-radius:50%;border:2px solid var(--track);border-top-color:var(--gold);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Entrada de cada vista (solo al cambiar de sección) */
#app.enter>*{animation:rise var(--duration-fast) var(--ease-smooth-out) both}
#app.enter>*:nth-child(2){animation-delay:40ms}#app.enter>*:nth-child(3){animation-delay:80ms}#app.enter>*:nth-child(4){animation-delay:120ms}#app.enter>*:nth-child(5){animation-delay:.32s}
@keyframes rise{from{transform:translateY(var(--distance-base));opacity:0;filter:blur(var(--blur-medium))}to{transform:none;opacity:1;filter:none}}
#app.enter .hero-h span{animation:lineUp var(--duration-very-slow) var(--ease-smooth-out) both}
#app.enter .hero-h span:nth-child(2){animation-delay:var(--duration-stagger)}
@keyframes lineUp{from{transform:translateY(var(--distance-medium));opacity:0;filter:blur(var(--blur-medium))}to{transform:none;opacity:1;filter:none}}
#app.enter .panel.ruled::before,#app.enter .tile::before{animation:hair var(--duration-very-slow) var(--ease-smooth-out) 80ms both}
@keyframes hair{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.enter .comp-bar i,#app.enter .meter i{animation:bar var(--duration-very-slow) var(--ease-smooth-out) 120ms both}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#app.enter .opts .opt{animation:none}
#app.enter .opts .opt:nth-child(2){animation-delay:.05s}#app.enter .opts .opt:nth-child(3){animation-delay:.1s}#app.enter .opts .opt:nth-child(4){animation-delay:.15s}
::view-transition-old(root){animation:vtOut var(--duration-quick) var(--ease-smooth-out) both}
::view-transition-new(root){animation:vtIn var(--duration-fast) var(--ease-smooth-out) both}
@keyframes vtOut{to{opacity:0;filter:blur(var(--blur-medium))}}
@keyframes vtIn{from{opacity:0;filter:blur(var(--blur-medium))}}

/* Pantallas de portátil (1280–1440 px) */
@media (max-width:1440px){
  main{padding:28px 34px 34px}
  footer{padding:14px 34px 26px}
  .hero-h{font-size:56px}
  .minimo .big{font-size:72px}
  .tile b{font-size:44px}
  .act strong{font-size:25px}
  .qbig{font-size:56px}
}
@media (max-width:1180px){
  .shell{grid-template-columns:220px minmax(0,1fr)}
  .actions{grid-template-columns:repeat(3,1fr)}
  .dash{grid-template-columns:1fr}
  .qwrap{grid-template-columns:minmax(0,1fr) 250px}
  .review{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}}

/* Acceso por participante */
body.is-login .shell{grid-template-columns:1fr}
body.is-login .sidebar{display:none}
body.is-login footer{display:none}
.login{position:relative;isolation:isolate;min-height:calc(100vh - 68px);display:grid;place-items:center;border-radius:26px;overflow:hidden;background:linear-gradient(140deg,#0a1630 0%,#10244a 55%,#0b1934 100%);color:#e9edf5;border:1px solid rgba(212,175,95,.35);box-shadow:var(--shadow-h)}
.login::before{content:"";position:absolute;inset:14px;border:1px solid rgba(212,175,95,.22);border-radius:18px;pointer-events:none}
.login .guilloche{opacity:.55}
.login-in{position:relative;z-index:1;width:min(720px,90%);padding:56px 0;display:grid;justify-items:center;text-align:center;gap:14px}
.login .eyebrow{color:#e2c27a}
.login .hero-h{font-size:72px;margin:6px 0 4px}
.login p{color:#c3cbdb;max-width:52ch;margin:0 0 18px;font-weight:300}
.big-seal{width:64px;height:64px}.big-seal svg{width:64px;height:64px}.big-seal span{font-size:24px}
.who-list{display:grid;gap:10px;width:100%;max-width:560px}
.who{display:grid;grid-template-columns:48px 1fr auto 20px;gap:16px;align-items:center;text-align:left;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px 18px 12px 12px;cursor:pointer;color:#e9edf5;transition:border-color .2s,background .2s,transform .25s cubic-bezier(.2,.8,.2,1);animation:rise var(--duration-medium) var(--ease-smooth-out) both;animation-delay:calc(var(--i)*var(--duration-stagger) + 80ms)}
.who:hover{border-color:rgba(241,214,143,.6);background:rgba(212,175,95,.08);transform:translateX(4px)}
.who .av,.sb-user .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;color:#1a1405;background:linear-gradient(170deg,#f1d68f,#d4af5f 60%,#9c7a33)}
.who-n{font-family:var(--font-display);font-size:26px;letter-spacing:-.01em}
.who-s{font-size:12.5px;color:#8f9bb2}
.who svg{width:18px;height:18px;stroke:#d4af5f;fill:none;stroke-width:1.8}
.sb-user{display:grid;grid-template-columns:40px 1fr 32px;gap:10px;align-items:center;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px}
.sb-user:empty{display:none}
.sb-user .av{width:40px;height:40px;font-size:17px}
.sb-user small{display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#8f9bb2}
.sb-user b{display:block;font-weight:500;font-size:14px;color:#fff;line-height:1.3}
.sb-user button{width:32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.1);background:transparent;cursor:pointer;display:grid;place-items:center;color:#aab4c7}
.sb-user button:hover{color:#f1d68f;border-color:rgba(241,214,143,.5)}
.sb-user button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7}
@media (prefers-reduced-motion:reduce){.who{animation:none}}

/* Acceso: la lista completa cabe sin desplazarse */
.login{min-height:calc(100vh - 80px)}
.login-in{width:min(900px,92%);padding:30px 0;gap:10px}
.login .hero-h{font-size:54px;margin:2px 0 0}
.login .hero-h span{display:inline}.login .hero-h span+span{margin-left:.24em}
.login p{margin:0 0 8px}
.who-list{grid-template-columns:1fr 1fr;gap:10px;max-width:860px}
.who{grid-template-columns:44px 1fr 18px;grid-template-areas:"av n ar" "av s ar";column-gap:14px;row-gap:1px;padding:10px 16px 10px 10px}
.who .av{grid-area:av;width:42px;height:42px;font-size:18px}
.who-n{grid-area:n;font-size:23px;line-height:1.15}
.who-s{grid-area:s;line-height:1.3}
.who svg{grid-area:ar}
.who:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 5px)}
@media (max-height:760px){.ulogo.big{width:76px;height:76px}.login .hero-h{font-size:46px}.login-in{padding:20px 0;gap:8px}.who{padding:8px 14px 8px 8px}.who .av{width:38px;height:38px}.who-n{font-size:21px}}

/* ================= Versión móvil (≤ 820 px) ================= */
.m-acct,.m-scrim,.m-handle,.m-exit,.m-only{display:none}
@media (max-width:820px){
  :root{--tabh:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
  html{-webkit-text-size-adjust:100%}
  body{font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
  .dsk{display:none!important}
  .m-only{display:inline}
  body::before{filter:blur(24px);animation:none}

  /* Estructura: barra superior + pestañas inferiores */
  .shell{display:block;min-height:100svh}
  body:not(.is-login) .sidebar{display:contents}
  .sidebar::before{display:none}
  .sb-brand{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;padding:calc(10px + var(--safe-t)) 14px 10px;border-bottom:1px solid rgba(212,175,95,.22);background:color-mix(in srgb,var(--side) 92%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);color:#e9edf5}
  .sb-brand .ulogo{width:38px;height:38px}
  .sb-brand>div:not(.ulogo){flex:1;min-width:0}
  .sb-brand b{font-size:19px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-brand small{font-size:8.5px;margin-top:3px;letter-spacing:.18em}
  .m-acct{display:grid;place-items:center;flex:none;width:40px;height:40px;padding:0;border-radius:50%;border:1px solid rgba(212,175,95,.45);background:transparent;cursor:pointer}
  .m-acct .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:16px;color:#1a1405;background:linear-gradient(170deg,#f1d68f,#d4af5f 60%,#9c7a33)}
  .m-acct:empty{display:none}

  .nav{position:fixed;left:0;right:0;bottom:0;z-index:22;display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:6px 6px calc(6px + var(--safe-b));background:color-mix(in srgb,var(--side) 94%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid rgba(212,175,95,.22)}
  .nav .nav-lab{display:none}
  .nav button{position:relative;grid-template-columns:1fr;justify-items:center;gap:3px;padding:7px 2px 5px;border-radius:12px;font-size:10.5px;font-weight:500;letter-spacing:.01em;color:#8f9bb2;min-height:52px;text-align:center}
  .nav button svg{width:22px;height:22px}
  .nav button:hover{background:transparent;color:#8f9bb2}
  .nav button[aria-current="page"]{color:#f1d68f;background:transparent;box-shadow:none}
  .nav button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:28%;right:28%;height:2px;border-radius:0 0 2px 2px;background:linear-gradient(90deg,#9c7a33,#f1d68f,#9c7a33)}
  .nav button[aria-current="page"] svg{filter:drop-shadow(0 0 8px rgba(241,214,143,.45))}
  .nav button:active{transform:scale(.94)}

  /* Hoja inferior de perfil y apariencia */
  .sb-foot{position:fixed;left:0;right:0;bottom:0;z-index:31;margin:0;padding:10px 18px calc(22px + var(--safe-b));gap:14px;background:var(--side);color:#e9edf5;border-radius:22px 22px 0 0;border-top:1px solid rgba(212,175,95,.35);box-shadow:0 -24px 60px rgba(0,0,0,.45);transform:translateY(110%);transition:transform .38s cubic-bezier(.2,.9,.2,1);visibility:hidden}
  body.sheet .sb-foot{transform:none;visibility:visible}
  .m-handle{display:block;width:42px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);margin:0 auto 4px}
  .m-scrim{display:block;position:fixed;inset:0;z-index:30;background:rgba(6,11,23,.5);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s}
  body.sheet .m-scrim{opacity:1;pointer-events:auto}
  .sb-user{padding:12px}
  .sb-user button{width:44px;height:44px}
  .sb-mode button{padding:12px 6px;font-size:14px}
  .sb-meta b{font-size:30px}

  /* Contenido */

/* ===== Pulido con Impeccable, transitions.dev, GSAP y Make Interfaces Feel Better ===== */
:root{
  --duration-stagger:40ms;--duration-micro:80ms;--duration-quick:150ms;--duration-fast:250ms;
  --duration-medium:350ms;--duration-slow:400ms;--duration-very-slow:500ms;
  --ease-smooth-out:cubic-bezier(0.22,1,0.36,1);--ease-in-out:ease-in-out;--ease-out:ease-out;
  --ease-bounce:cubic-bezier(0.34,1.36,0.64,1);
  --distance-micro:4px;--distance-small:6px;--distance-base:8px;--distance-medium:12px;
  --blur-small:2px;--blur-medium:3px;
  --shake-distance:6px;--shake-overshoot:4px;--shake-dur-a:80ms;--shake-dur-b:60ms;
}
::selection{background:color-mix(in srgb,var(--gold) 32%,transparent);color:inherit}
input,textarea{caret-color:var(--gold)}
p,li{text-wrap:pretty}
.qtext,.rv h4,.fb h3{text-wrap:pretty}
body.in-sess .qcard,body.in-sess .side,.sidebar{scrollbar-color:color-mix(in srgb,var(--gold) 35%,transparent) transparent}
/* Presión táctil en botones (scale 0.96) */
.btn,.seg button,.grid-n button,.chip,.nav button,.who{transition-property:background-color,border-color,color,filter,transform;transition-duration:var(--duration-quick);transition-timing-function:var(--ease-out)}
.btn:active:not([disabled]),.seg button:active,.grid-n button:active,.chip:active{transform:scale(.96)}
.opt:active:not([disabled]){background-color:var(--tint)}
.opt .L{transition:background-color var(--duration-quick) var(--ease-out),color var(--duration-quick) var(--ease-out),border-color var(--duration-quick) var(--ease-out)}
/* Cambio de pregunta: página lado a lado (transitions.dev 08) */
.qcard.t-next>*:not(.fb){animation:tPageNext var(--duration-fast) var(--ease-smooth-out) both}
.qcard.t-prev>*:not(.fb){animation:tPagePrev var(--duration-fast) var(--ease-smooth-out) both}
@keyframes tPageNext{from{opacity:0;transform:translateX(var(--distance-base));filter:blur(var(--blur-medium))}to{opacity:1;transform:none;filter:none}}
@keyframes tPagePrev{from{opacity:0;transform:translateX(calc(var(--distance-base)*-1));filter:blur(var(--blur-medium))}to{opacity:1;transform:none;filter:none}}
/* Aviso de cambio de módulo: texto en escalera (transitions.dev 18), solo al llegar a la pregunta */
.qcard.t-next .modchg>*,.qcard.t-prev .modchg>*,#app.enter .modchg>*{animation:tStagger var(--duration-very-slow) var(--ease-smooth-out) both}
.modchg>*:nth-child(2){animation-delay:var(--duration-stagger)!important}
.modchg>*:nth-child(3){animation-delay:calc(var(--duration-stagger)*2)!important}
@keyframes tStagger{from{opacity:0;transform:translateY(var(--distance-medium));filter:blur(var(--blur-medium))}to{opacity:1;transform:none;filter:none}}
/* Respuesta revisada: error con sacudida (transitions.dev 12) y acierto con salto corto */
.opt.t-shake{animation:tShake calc(var(--shake-dur-a)*2 + var(--shake-dur-b)*2) linear}
@keyframes tShake{0%{transform:translateX(0);animation-timing-function:var(--ease-smooth-out)}28.57%{transform:translateX(var(--shake-distance));animation-timing-function:var(--ease-smooth-out)}57.14%{transform:translateX(calc(var(--shake-distance)*-1));animation-timing-function:var(--ease-smooth-out)}78.57%{transform:translateX(var(--shake-overshoot))}100%{transform:translateX(0)}}
.opt.t-ok .L{animation:tPop var(--duration-very-slow) var(--ease-bounce)}
@keyframes tPop{0%{transform:scale(.7);filter:blur(var(--blur-small))}60%{filter:none}100%{transform:scale(1)}}

io original · Cartilla Ley 30", "q": "Según la sentencia C-589 de 1997, la presencia del Estado en el Consejo Superior es válida mientras:", "o": ["Tenga control mayoritario o absoluto", "No sea un control mayoritario o absoluto", "El Rector la autorice", "Solo participe el MEN"], "k": 1, "e": "La participación del Estado no viola la autonomía mientras no sea un control mayoritario o absoluto (C-589/97).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 9; C30 P36.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 30"}, {"id": "L30-10", "tema": "H", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "¿En cuánto tiempo caducan la acción y la sanción administrativa según el artículo 52?", "o": ["Seis meses", "Un año", "Tres años", "Diez años"], "k": 2, "e": "Caducan en tres años contados desde el último acto constitutivo de la falta (art. 52 de la Ley 30).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 10; C30 P27.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 30"}, {"id": "L909-01", "tema": "C", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuántos tipos de servidores públicos distingue el artículo 123 de la Constitución?", "o": ["Dos: empleados públicos y contratistas", "Tres: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales", "Cuatro: incluye a los contratistas", "Cinco: incluye los empleos temporales"], "k": 1, "e": "Tres clases: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales (C.P., art. 123; C-484/95).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 1; C909 P11.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-02", "tema": "D", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cómo se aplica la Ley 909 al personal administrativo de la Universidad del Magdalena?", "o": ["En su integridad, igual que a una alcaldía", "Solo en los concursos de ascenso", "De manera supletoria, ante vacíos de su normativa propia", "No se aplica en ningún caso"], "k": 2, "e": "De manera supletoria, ante vacíos de su normativa propia (Ley 909, art. 3, num. 2; C-175/06).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 2; C909 P24.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-03", "tema": "F", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué naturaleza tiene la convocatoria de un concurso?", "o": ["Es la norma reguladora del concurso y obliga a la administración y a los participantes", "Es un acto informativo que la entidad puede modificar en cualquier momento", "Es una recomendación de la CNSC", "Es el resultado final del concurso"], "k": 0, "e": "La convocatoria es la norma reguladora del concurso y obliga a la administración y a los participantes (Ley 909, art. 31; SU-446/11).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 3; C909 P21.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-04", "tema": "F", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "Un auxiliar lleva diez años como provisional en un cargo de carrera. Según la sentencia C-588 de 2009:", "o": ["Debe inscribirse en carrera por su antigüedad", "Pasa automáticamente a libre nombramiento y remoción", "Queda inscrito si obtiene evaluación sobresaliente", "No tiene derecho a inscribirse en carrera sin concurso"], "k": 3, "e": "No tiene derecho a inscribirse en carrera sin concurso; el art. 1 del Acto Legislativo 01 de 2008 fue declarado inexequible (C-588/09).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 4; C909 P42.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-05", "tema": "E", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuánto dura el encargo en una vacancia definitiva?", "o": ["Un mes, sin prórroga", "Hasta tres meses, prorrogables por tres más", "Un año, prorrogable por otro año", "El tiempo que dure el concurso, sin límite"], "k": 1, "e": "Hasta tres meses, prorrogables por tres más (Ley 909, art. 24).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 5; C909 P35.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-06", "tema": "F", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué porcentaje de las plazas de los concursos se reserva para personas con discapacidad?", "o": ["El 3 %", "El 5 %", "Al menos el 7 %", "El 10 %"], "k": 2, "e": "Al menos el 7 % en concursos abiertos y de ascenso, con ajuste positivo (Ley 909, art. 29).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 6; C909 P41.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-07", "tema": "E", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuál es el tope total de la comisión para desempeñar un empleo de libre nombramiento y remoción?", "o": ["Seis años, sumando la comisión y su prórroga", "Tres años, sin prórroga", "Cuatro años", "Diez años"], "k": 0, "e": "Hasta tres años prorrogables por un término igual; la comisión o la suma de ellas no puede superar seis años (Ley 909, art. 26).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 7; C909 P37.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-08", "tema": "G", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "La insubsistencia de un empleado de carrera por calificación no satisfactoria debe declararse:", "o": ["Por acto no motivado, como en el libre nombramiento", "Verbalmente, por el jefe inmediato", "Sin recurso alguno", "De forma motivada, y contra ella procede el recurso de reposición"], "k": 3, "e": "De forma motivada, y contra ella procede el recurso de reposición (Ley 909, art. 43).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 8; C909 P51.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-09", "tema": "D", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué clase de carrera tiene la DIAN y quién la vigila?", "o": ["Carrera general, administrada por la CNSC", "Carrera específica de origen legal, vigilada por la CNSC", "Carrera especial de origen constitucional, fuera de la competencia de la CNSC", "Carrera docente, vigilada por la propia entidad"], "k": 1, "e": "Carrera específica de origen legal, vigilada por la CNSC (Ley 909, art. 4; C-1230/05).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 9; C909 P25.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "L909-10", "tema": "E", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "Un técnico de carrera acepta un cargo de libre nombramiento y remoción y se posesiona sin haber pedido comisión. ¿Qué ocurre?", "o": ["Conserva los derechos de carrera de forma indefinida", "Queda encargado de manera automática", "Pierde los derechos de carrera", "Se inscribe en carrera en el nuevo cargo"], "k": 2, "e": "Pierde los derechos de carrera (Ley 909, art. 42).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 10; C909 P50.", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Ley 909"}, {"id": "CDD-E1", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La finalidad central del derecho disciplinario es:", "o": ["Reparar todo daño patrimonial.", "Asegurar el cumplimiento de deberes funcionales y la correcta función pública.", "Reemplazar el proceso penal.", "Resolver controversias laborales."], "k": 1, "e": "El derecho disciplinario protege la función pública exigiendo el cumplimiento de los deberes funcionales. Reparar el daño es materia fiscal o civil; no reemplaza el proceso penal ni resuelve conflictos laborales.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 1 (clave indicada por la cartilla: «Asegurar el cumplimiento de deberes funcionales y la correcta función pública»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E2", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La autonomía de la acción disciplinaria significa que:", "o": ["Depende siempre del fallo penal.", "No requiere prueba.", "Tiene objeto y elementos propios.", "Excluye otras acciones."], "k": 2, "e": "La acción disciplinaria tiene objeto, elementos y finalidad propios, por eso coexiste con la penal, la fiscal y otras sin depender de ellas ni excluirlas. Siempre requiere prueba.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 2 (clave indicada por la cartilla: «Tiene objeto y elementos propios»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E3", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La presunción de inocencia implica que:", "o": ["El investigado prueba su inocencia.", "La queja acredita responsabilidad.", "El Estado debe acreditar la falta y la culpabilidad.", "La duda se resuelve contra el investigado."], "k": 2, "e": "La carga de la prueba es del Estado: debe demostrar la falta y la culpabilidad. La queja no prueba nada por sí sola y la duda razonable se resuelve a favor del investigado (in dubio pro disciplinado).", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 3 (clave indicada por la cartilla: «El Estado debe acreditar la falta y la culpabilidad»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E4", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La ilicitud sustancial exige:", "o": ["Daño económico en todos los casos.", "Afectación sustancial del deber funcional sin justificación.", "Incumplimiento meramente formal.", "Sanción automática."], "k": 1, "e": "Una conducta es ilícita cuando afecta sustancialmente el deber funcional sin justificación. No basta el incumplimiento formal y no se exige daño económico.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 4 (clave indicada por la cartilla: «Afectación sustancial del deber funcional sin justificación»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E5", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La separación entre instrucción y juzgamiento busca principalmente:", "o": ["Acelerar el trámite sin garantías.", "Asegurar imparcialidad.", "Eliminar la doble instancia.", "Impedir la defensa técnica."], "k": 1, "e": "Introducida por la Ley 2094 de 2021: quien investiga no es quien juzga, para garantizar la imparcialidad del fallador. No suprime la doble instancia ni la defensa.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 5 (clave indicada por la cartilla: «Asegurar imparcialidad»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E6", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La culpabilidad proscribe:", "o": ["La responsabilidad objetiva.", "La valoración probatoria.", "La defensa material.", "La favorabilidad."], "k": 0, "e": "En materia disciplinaria está proscrita toda forma de responsabilidad objetiva: las faltas solo se sancionan a título de dolo o culpa.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 6 (clave indicada por la cartilla: «La responsabilidad objetiva»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E7", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La formulación de cargos debe:", "o": ["Ser genérica.", "Citar principios sin hechos.", "Precisar hechos y normas para permitir defensa.", "Anticipar el fallo definitivo."], "k": 2, "e": "El pliego de cargos debe concretar los hechos y las normas presuntamente infringidas (imputación fáctica y jurídica) para que el investigado pueda defenderse. No anticipa el fallo.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 7 (clave indicada por la cartilla: «Precisar hechos y normas para permitir defensa»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-E8", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Una entrevista penal incorporada a un expediente disciplinario:", "o": ["Demuestra automáticamente la falta.", "Nunca puede considerarse.", "Requiere examinar legalidad, naturaleza y contradicción.", "Reemplaza toda prueba."], "k": 2, "e": "La prueba trasladada puede valorarse, pero el operador disciplinario debe examinar su legalidad, su naturaleza y si se garantizó la contradicción; la valoración es autónoma.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 8 (clave indicada por la cartilla: «Requiere examinar legalidad, naturaleza y contradicción»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A01", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Cuál es la finalidad principal del derecho disciplinario?", "o": ["Castigar cualquier error cometido en el trabajo.", "Proteger el correcto ejercicio de la función pública y exigir el cumplimiento de deberes, con garantías.", "Reemplazar la evaluación del desempeño.", "Resolver todos los conflictos personales."], "k": 1, "e": "Protege la función pública y exige deberes, siempre con garantías. No castiga cualquier error ni sustituye la evaluación del desempeño.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 1 (clave indicada por la cartilla: «Proteger el correcto ejercicio de la función pública y exigir el cumplimiento de deberes, con garantías»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A02", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué establece el artículo 6 de la Constitución?", "o": ["Que los servidores públicos solo responden por delitos.", "Que los servidores públicos responden por omisión o extralimitación en el ejercicio de sus funciones.", "Que los empleados públicos no tienen deberes.", "Que toda falla genera sanción automática."], "k": 1, "e": "El art. 6 C.P.: los particulares responden por infringir la Constitución y las leyes; los servidores públicos, además, por omisión o extralimitación en el ejercicio de sus funciones.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 2 (clave indicada por la cartilla: «Que los servidores públicos responden por omisión o extralimitación en el ejercicio de sus funciones»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A03", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Una persona es investigada. ¿Qué principio exige tratarla como no responsable mientras no exista decisión ejecutoriada?", "o": ["Publicidad.", "Presunción de inocencia.", "Economía.", "Jerarquía."], "k": 1, "e": "La presunción de inocencia rige hasta que exista fallo ejecutoriado que declare la responsabilidad.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 3 (clave indicada por la cartilla: «Presunción de inocencia»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A04", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Un profesional advierte que su familiar participa en un proceso que debe evaluar. ¿Qué debe hacer?", "o": ["Continuar si cree que será imparcial.", "Ocultar la relación.", "Informar y tramitar el impedimento según las reglas aplicables.", "Pedir al familiar que retire la propuesta."], "k": 2, "e": "Ante un conflicto de intereses, lo correcto es revelarlo y declararse impedido. Creerse imparcial no basta y pedir el retiro de la propuesta sería una intervención indebida.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 4 (clave indicada por la cartilla: «Informar y tramitar el impedimento según las reglas aplicables»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A05", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Compartir una contraseña institucional es una práctica segura?", "o": ["Sí, si se trata de un compañero.", "Sí, cuando hay urgencia.", "No; deben utilizarse mecanismos autorizados y trazables.", "Solo está prohibido para directivos."], "k": 2, "e": "Las credenciales son personales; para delegar accesos se usan mecanismos autorizados y trazables. La urgencia o la confianza no lo justifican.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 5 (clave indicada por la cartilla: «No; deben utilizarse mecanismos autorizados y trazables»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A06", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿La autonomía universitaria permite desconocer el debido proceso?", "o": ["Sí, porque cada universidad decide libremente.", "No; está limitada por la Constitución y la ley.", "Sí, cuando se trata de personal administrativo.", "Depende de la opinión del jefe."], "k": 1, "e": "La autonomía universitaria (art. 69 C.P.) se ejerce dentro de la Constitución y la ley; el debido proceso (art. 29) es un límite.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 6 (clave indicada por la cartilla: «No; está limitada por la Constitución y la ley»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A07", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Un contratista siempre es sujeto disciplinable por el solo hecho de tener contrato estatal?", "o": ["Sí, en todos los casos.", "No; deben verificarse los supuestos legales, como el ejercicio de función pública o la administración de recursos públicos.", "Nunca.", "Solo si trabaja dentro del campus."], "k": 1, "e": "Los particulares responden disciplinariamente solo en los supuestos de ley (arts. 25 y 70 CGD): cuando cumplen funciones públicas o administran recursos públicos, entre otros. No es automático ni está excluido.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 7 (clave indicada por la cartilla: «No; deben verificarse los supuestos legales, como el ejercicio de función pública o la administración de recursos públicos»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A08", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué debe hacer la autoridad al valorar pruebas?", "o": ["Considerar solo las pruebas en contra.", "Investigar con igual rigor lo que compromete y lo que favorece.", "Decidir según rumores.", "Prescindir de la defensa."], "k": 1, "e": "Principio de investigación integral: se investiga con igual rigor lo desfavorable y lo favorable al investigado.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 8 (clave indicada por la cartilla: «Investigar con igual rigor lo que compromete y lo que favorece»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A09", "tema": "L", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué debe hacer una persona que conoce un posible acoso en el entorno laboral?", "o": ["Difundirlo por redes sociales.", "Ignorarlo siempre.", "Orientar hacia los canales institucionales y proteger la confidencialidad.", "Confrontar públicamente a las personas."], "k": 2, "e": "Se orienta a los canales institucionales y se protege la confidencialidad; difundir o confrontar públicamente revictimiza y entorpece el trámite.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 9 (clave indicada por la cartilla: «Orientar hacia los canales institucionales y proteger la confidencialidad»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CDD-A10", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Todo retraso en un trámite es automáticamente una falta disciplinaria?", "o": ["Sí.", "No; deben examinarse deber funcional, afectación sustancial, culpabilidad, justificación y pruebas.", "Sí, si existe una queja.", "Solo si el usuario insiste."], "k": 1, "e": "No hay responsabilidad automática: se examinan el deber funcional, la ilicitud sustancial, la culpabilidad, las causales de justificación y la prueba.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 10 (clave indicada por la cartilla: «No; deben examinarse deber funcional, afectación sustancial, culpabilidad, justificación y pruebas»).", "n": "", "src": "original", "comp": "M1", "grp": "Cartilla Derecho Disciplinario"}, {"id": "CMN-S01", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La Universidad del Magdalena es jurídicamente…", "o": ["Un establecimiento público del orden nacional.", "Un ente universitario autónomo del orden departamental.", "Una empresa industrial y comercial del Estado.", "Una entidad descentralizada del Distrito."], "k": 1, "e": "Es un ente universitario autónomo del orden departamental, con régimen especial (Ley 30, art. 57; Estatuto General).", "f": "Cartilla Marco normativo, Módulo 1 (naturaleza jurídica). Simulacro, pregunta 1.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S02", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El artículo de la Constitución que garantiza la autonomía universitaria es el…", "o": ["67", "69", "125", "209"], "k": 1, "e": "El art. 69 garantiza la autonomía universitaria. El 67 trata la educación como derecho, el 125 la carrera y el 209 los principios de la función administrativa.", "f": "Cartilla Marco normativo, Módulo 1. Simulacro, pregunta 2.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S03", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "En la Universidad, la Ley 909 de 2004 se aplica…", "o": ["De preferencia sobre el Estatuto de Personal.", "Nunca.", "De manera supletoria, para llenar vacíos.", "Solo a los docentes."], "k": 2, "e": "La Universidad tiene régimen propio; la Ley 909 se aplica de forma supletoria para llenar los vacíos del estatuto (Ley 909, art. 3).", "f": "Cartilla Marco normativo, introducción y Módulo 2. Simulacro, pregunta 3.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S04", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El Consejo Superior Universitario lo preside…", "o": ["El Rector.", "El Ministro de Educación.", "El Gobernador del Magdalena.", "El Secretario General."], "k": 2, "e": "El CSU lo preside el Gobernador del Magdalena (o su delegado). El Rector asiste con voz pero sin voto.", "f": "Cartilla Marco normativo, Módulo 1 (Consejo Superior). Simulacro, pregunta 4.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S05", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para decidir, el Consejo Superior requiere…", "o": ["La mayoría de los presentes.", "Cinco votos favorables de miembros con derecho a voto.", "Tres votos favorables.", "Unanimidad."], "k": 1, "e": "El Estatuto General exige cinco votos favorables de miembros con derecho a voto para las decisiones del CSU.", "f": "Cartilla Marco normativo, Módulo 1 (Para recordar). Simulacro, pregunta 5.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S06", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El periodo del Rector es de…", "o": ["3 años", "4 años", "5 años", "6 años"], "k": 1, "e": "El Rector tiene un periodo de 4 años y puede ser reelegido hasta por dos periodos más.", "f": "Cartilla Marco normativo, Módulo 1 (Rector). Simulacro, pregunta 6.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S07", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "En vacancia temporal del Rector lo reemplaza…", "o": ["El Secretario General.", "El Vicerrector Académico.", "El decano más antiguo.", "El Vicerrector Administrativo."], "k": 1, "e": "En la vacancia temporal, el Vicerrector Académico asume las funciones del Rector.", "f": "Cartilla Marco normativo, Módulo 1 (Rector). Simulacro, pregunta 7.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S08", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para integrar la terna a Rector, un aspirante debe obtener al menos el…", "o": ["10 % del censo de cada estamento", "15 %", "20 %", "30 %"], "k": 2, "e": "Para integrar la terna se exige al menos el 20 % del censo electoral de cada estamento.", "f": "Cartilla Marco normativo, Módulo 1 (designación del Rector). Simulacro, pregunta 8.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S09", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El acto del Consejo Superior que regula situaciones generales e impersonales es…", "o": ["La Resolución.", "El Acuerdo Superior.", "La Circular.", "El Comunicado."], "k": 1, "e": "El Acuerdo Superior es el acto general e impersonal del CSU; la resolución es típica de actos particulares o de otras autoridades.", "f": "Cartilla Marco normativo, Glosario y Módulo 1 (actos). Simulacro, pregunta 9.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S10", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El concurso de ascenso puede cubrir hasta el…", "o": ["20 % de los cargos", "30 % de los cargos", "50 % de los cargos", "70 % de los cargos"], "k": 1, "e": "El concurso de ascenso puede cubrir hasta el 30 % de las vacantes; el 70 % restante se provee por concurso abierto.", "f": "Cartilla Marco normativo, Módulo 2 (concursos). Simulacro, pregunta 10.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S11", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La lista de elegibles tiene una vigencia de…", "o": ["1 año", "2 años", "3 años", "4 años"], "k": 1, "e": "La lista de elegibles rige por 2 años.", "f": "Cartilla Marco normativo, Módulo 2 (Para recordar). Simulacro, pregunta 11.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S12", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Si ningún concursante supera el 60 % de la prueba eliminatoria, la vacante…", "o": ["Se provee con el mejor puntaje.", "Se declara desierta.", "Se provee en provisionalidad sin concurso.", "Se asigna por antigüedad."], "k": 1, "e": "Si nadie supera el mínimo del 60 %, el concurso se declara desierto para esa vacante.", "f": "Cartilla Marco normativo, Módulo 2 (concursos). Simulacro, pregunta 12.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S13", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para aceptar un nombramiento, la persona tiene…", "o": ["5 días", "10 días", "15 días", "30 días"], "k": 1, "e": "Hay 10 días desde la comunicación para aceptar; luego 10 días hábiles para posesionarse, prorrogables hasta 90 días hábiles más (art. 71).", "f": "Cartilla Marco normativo, Módulo 2 (del nombramiento a la carrera). Simulacro, pregunta 13.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S14", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Una calificación del desempeño es sobresaliente cuando es…", "o": ["Igual o superior al 85 %.", "Igual o superior al 90 %.", "Superior al 75 %.", "Igual o superior al 80 %."], "k": 0, "e": "Sobresaliente: 85 % o más. Satisfactorio: más de 60 % y menos de 85 %. No satisfactorio: 60 % o menos.", "f": "Cartilla Marco normativo, Módulo 2 (evaluación del desempeño). Simulacro, pregunta 14.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S15", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Los compromisos de evaluación se concertan dentro de…", "o": ["5 días hábiles", "10 días hábiles", "15 días hábiles", "30 días hábiles"], "k": 2, "e": "La concertación de compromisos se hace dentro de los 15 días hábiles; si el evaluador omite concertar, el evaluado envía su propuesta.", "f": "Cartilla Marco normativo, Módulo 2 (Para recordar). Simulacro, pregunta 15.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S16", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El encargo en una vacante definitiva se otorga por…", "o": ["3 meses, prorrogables por 3 más.", "6 meses.", "1 año.", "Tiempo indefinido."], "k": 0, "e": "El encargo en vacante definitiva es por 3 meses prorrogables por 3 más.", "f": "Cartilla Marco normativo, Módulo 2 (situaciones administrativas). Simulacro, pregunta 16.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S17", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La licencia no remunerada puede concederse hasta por…", "o": ["30 días hábiles", "60 días hábiles", "90 días hábiles", "120 días hábiles"], "k": 1, "e": "La licencia no remunerada se concede hasta por 60 días hábiles, prorrogables por 30 más.", "f": "Cartilla Marco normativo, Módulo 2 (situaciones administrativas). Simulacro, pregunta 17.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S18", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La desconexión laboral es un derecho expreso de…", "o": ["Los trabajadores oficiales.", "Los servidores en modalidades de trabajo a distancia.", "Los contratistas.", "Solo los directivos."], "k": 1, "e": "El art. 122 del Estatuto de Personal reconoce la desconexión laboral a los servidores en teletrabajo, trabajo en casa y modalidades a distancia.", "f": "Cartilla Marco normativo, Módulo 2 (trabajo a distancia, arts. 120–124). Simulacro, pregunta 18.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S19", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Es un componente del concurso especial transitorio de incorporación…", "o": ["Una entrevista psicológica.", "Un curso de formación institucional con evaluación certificable.", "Un sorteo entre aspirantes.", "La antigüedad como único criterio."], "k": 1, "e": "El concurso especial transitorio incluye un curso de formación institucional con evaluación certificable (art. 153) y se convoca en máximo 12 meses.", "f": "Cartilla Marco normativo, Módulo 2 (Para recordar). Simulacro, pregunta 19.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-S20", "tema": "O", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El valor que consiste en defender los principios frente a la presión es…", "o": ["La honestidad.", "El coraje.", "La confianza.", "El respeto."], "k": 1, "e": "En el Código de Integridad Académica, el coraje es defender los principios aun bajo presión.", "f": "Cartilla Marco normativo, Módulo 3 (valores). Simulacro, pregunta 20.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A1-1", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Cuál es el máximo órgano de dirección y gobierno de la Universidad?", "o": ["El Rector", "El Consejo Académico", "El Consejo Superior"], "k": 2, "e": "El Consejo Superior Universitario es el máximo órgano de dirección y gobierno.", "f": "Cartilla Marco normativo, Autoevaluación 1, pregunta 1.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A1-2", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Cuántos votos favorables necesita el CSU para aprobar una decisión?", "o": ["3", "5", "La mitad más uno de los presentes"], "k": 1, "e": "Se requieren 5 votos favorables de miembros con derecho a voto.", "f": "Cartilla Marco normativo, Autoevaluación 1, pregunta 2.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A1-3", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · Verdadero/Falso", "q": "Verdadero o falso: los miembros del Consejo Superior adquieren la calidad de servidores públicos.", "o": ["Verdadero", "Falso"], "k": 1, "e": "Falso: el art. 34 del Estatuto General señala que los miembros del CSU no adquieren por ese hecho la calidad de servidores públicos.", "f": "Cartilla Marco normativo, Autoevaluación 1, pregunta 3.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A1-4", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Qué recurso procede contra un acto administrativo particular del Rector?", "o": ["Apelación", "Reposición", "Queja"], "k": 1, "e": "Procede el recurso de reposición (art. 138 del Estatuto General): el Rector no tiene superior jerárquico ante quien apelar.", "f": "Cartilla Marco normativo, Autoevaluación 1, pregunta 4.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A1-5", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Qué porcentaje mínimo de cargos directivos de libre nombramiento debe estar ocupado por mujeres?", "o": ["30 %", "40 %", "50 %"], "k": 1, "e": "El Estatuto General fija un mínimo del 40 % de mujeres en los cargos directivos de libre nombramiento y remoción.", "f": "Cartilla Marco normativo, Autoevaluación 1, pregunta 5.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A2-1", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional · 3 opciones", "q": "¿Cuánto dura el periodo de prueba?", "o": ["3 meses", "6 meses", "1 año"], "k": 1, "e": "El periodo de prueba dura 6 meses.", "f": "Cartilla Marco normativo, Autoevaluación 2, pregunta 1.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1", "grp": "Cartilla Marco normativo"}, {"id": "CMN-A2-2", "tema": "N", "nivel": "
