ia"}, {"id": "M1-073", "comp": "M1", "tema": "F", "nivel": "A", "tipo": "Caso numérico", "q": "Se ofertan 20 vacantes de la misma planta y se cumplen las condiciones para convocar concurso de ascenso. ¿Cómo se distribuyen?", "o": ["10 por ascenso y 10 por concurso abierto.", "Las 20 por concurso abierto.", "14 por ascenso y 6 por concurso abierto.", "6 por ascenso y 14 por concurso abierto."], "k": 3, "e": "30 % ascenso (6) y 70 % abierto (14). C invierte los porcentajes.", "f": "C909 P40.", "n": "", "src": "propia"}, {"id": "M1-074", "comp": "M1", "tema": "F", "nivel": "A", "tipo": "Caso numérico", "q": "En un concurso abierto se proveerán 14 plazas. ¿Cuántas, como mínimo, se reservan para personas con discapacidad?", "o": ["Ninguna, porque el 7 % de 14 no llega a una plaza entera.", "7 plazas.", "2 plazas.", "1 plaza, porque el 7 % (0,98) se ajusta siempre hacia arriba."], "k": 3, "e": "Al menos el 7 %, con ajuste positivo.", "f": "C909 P41; C909 Ej. 2 caso 6.", "n": "", "src": "propia"}, {"id": "M1-075", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Procedimiento", "q": "Si en un concurso de ascenso no se inscribe un número igual de servidores de carrera por empleo a proveer:", "o": ["Se declara desierto y la provisión se hace por concurso abierto, sin nueva inscripción de quienes ya estaban inscritos.", "Se amplía el plazo de inscripción indefinidamente.", "Se nombra a los inscritos sin pruebas.", "Se proveen los cargos por encargo de forma permanente."], "k": 0, "e": "", "f": "C909 P40.", "n": "", "src": "propia"}, {"id": "M1-076", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Normativa", "q": "Sobre la evaluación del desempeño de los empleados de carrera, es correcto que:", "o": ["Corresponde a un período semestral sin evaluaciones parciales.", "Solo la realiza la CNSC.", "No admite recursos.", "La calificación es anual, los reglamentos deben incluir dos evaluaciones parciales y contra la evaluación definitiva proceden reposición y apelación."], "k": 3, "e": "Art. 38; el jefe puede ordenar por escrito una evaluación inmediata si recibe información soportada de desempeño deficiente.", "f": "C909 P44.", "n": "", "src": "propia"}, {"id": "M1-077", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Normativa", "q": "¿Qué consecuencia tiene que el responsable de evaluar no lo haga en los términos del reglamento?", "o": ["Ninguna.", "Se entiende que el evaluado obtuvo calificación sobresaliente.", "Incurre en falta disciplinaria grave.", "El evaluado pierde los derechos de carrera."], "k": 2, "e": "Art. 40; entre los evaluadores siempre debe haber un funcionario de LNyR.", "f": "C909 P45.", "n": "", "src": "propia"}, {"id": "M1-078", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Identificar la incorrecta", "q": "¿Cuál NO es un principio que orienta la permanencia en el servicio (art. 37)?", "o": ["Mérito.", "Cumplimiento.", "Antigüedad.", "Promoción de lo público."], "k": 2, "e": "Los principios son mérito, cumplimiento, evaluación y promoción de lo público.", "f": "C909 P43.", "n": "", "src": "propia"}, {"id": "M1-079", "comp": "M1", "tema": "F", "nivel": "A", "tipo": "Jurisprudencia", "q": "¿Por qué la Corte declaró inexequible el artículo 1 del Acto Legislativo 01 de 2008 (sentencia C-588 de 2009)?", "o": ["Porque vulneraba la autonomía universitaria.", "Porque permitía inscribir en carrera sin concurso a servidores en provisionalidad o encargo, lo que sustituía parcialmente la Constitución: el mérito y el concurso son un eje definitorio de su identidad.", "Porque eliminaba el período de prueba.", "Porque creaba nuevos cargos de libre nombramiento."], "k": 1, "e": "La Corte ordenó reanudar los concursos y dejó sin efecto las inscripciones extraordinarias.", "f": "C909 P21, P42; PPT d.18.", "n": "", "src": "propia"}, {"id": "M1-080", "comp": "M1", "tema": "F", "nivel": "I", "tipo": "Jurisprudencia", "q": "Según la SU-446 de 2011, la lista de elegibles:", "o": ["Puede usarse libremente para cualquier cargo de la entidad.", "Es una recomendación que la entidad puede ignorar.", "Genera un derecho frente a las plazas ofertadas en la convocatoria que la originó y tiene vigencia temporal.", "No genera ningún derecho."], "k": 2, "e": "Solo podría usarse para otros cargos si la convocatoria o la ley lo permiten y son de la misma naturaleza y perfil.", "f": "C909 P21, P42.", "n": "", "src": "propia"}, {"id": "M1-081", "comp": "M1", "tema": "F", "nivel": "A", "tipo": "Caso", "q": "En el concurso especial de incorporación de la universidad, un participante sostiene que puede desconocer una regla de la convocatoria porque la Ley 909 dice algo distinto. ¿Qué es correcto?", "o": ["Tiene razón: la Ley 909 siempre prevalece sobre la convocatoria.", "No tiene razón, porque las reglas de la convocatoria pueden cambiarse cuando la universidad lo considere.", "Tiene razón si obtiene el primer puesto.", "No tiene razón: la convocatoria es la norma del concurso, obliga a la administración y a los participantes, y en la universidad la Ley 909 solo se aplica supletoriamente."], "k": 3, "e": "B contradice la invariabilidad de las reglas (SU-446/11).", "f": "C909 caso A; PPT d.18.", "n": "", "src": "propia"}, {"id": "M1-082", "comp": "M1", "tema": "F", "nivel": "B", "tipo": "Normativa", "q": "Los objetivos de la capacitación según la Ley 909 son:", "o": ["Desarrollar las capacidades, destrezas, habilidades, valores y competencias de los empleados para mejorar la eficacia personal, grupal y organizacional.", "Sustituir la evaluación del desempeño.", "Otorgar derechos de carrera sin concurso.", "Financiar posgrados a todos los servidores sin requisitos."], "k": 0, "e": "Art. 36.", "f": "C909 P46.", "n": "", "src": "propia"}, {"id": "M1-083", "comp": "M1", "tema": "G", "nivel": "B", "tipo": "Normativa", "q": "¿Qué causal de retiro procede únicamente para los empleos de libre nombramiento y remoción?", "o": ["Renuncia regularmente aceptada.", "Declaratoria de insubsistencia discrecional del nombramiento, mediante acto no motivado.", "Muerte.", "Supresión del empleo."], "k": 1, "e": "A, C y D aplican a cualquier empleado.", "f": "C909 P47–P48; PPT d.25.", "n": "", "src": "propia"}, {"id": "M1-084", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Diferencias", "q": "Sobre la competencia para retirar empleados, es correcto que:", "o": ["En carrera es discrecional y en LNyR es reglada.", "En carrera es reglada y requiere acto motivado; en LNyR es discrecional, por acto no motivado, sin que pueda ser arbitraria.", "En ambos casos basta la voluntad del nominador.", "En ambos casos se requiere concurso."], "k": 1, "e": "Art. 41 par. 2; C-479/92.", "f": "C909 P48.", "n": "", "src": "propia"}, {"id": "M1-085", "comp": "M1", "tema": "G", "nivel": "A", "tipo": "Procedimiento", "q": "Se declara insubsistente a un empleado de carrera por calificación no satisfactoria y este interpone reposición. Si la administración no se pronuncia dentro de los 45 días calendario siguientes:", "o": ["Queda en firme la insubsistencia.", "La decisión se entiende revocada y la calificación se considera satisfactoria en el puntaje mínimo.", "El empleado pasa a provisionalidad.", "Debe acudir a la CNSC para que decida."], "k": 1, "e": "El funcionario que no resuelva a tiempo es sancionable disciplinariamente.", "f": "C909 P51.", "n": "", "src": "propia"}, {"id": "M1-086", "comp": "M1", "tema": "G", "nivel": "A", "tipo": "Caso numérico", "q": "A un empleado de carrera con tres años de servicio continuo le suprimen el cargo y opta por la indemnización. Según el art. 45, ¿cuántos días de salario le corresponden?", "o": ["45 días.", "75 días.", "90 días.", "105 días."], "k": 1, "e": "De uno a menos de cinco años: 45 días por el primer año y 15 por cada año adicional → 45 + (2 × 15) = 75.", "f": "C909 P52.", "n": "", "src": "propia"}, {"id": "M1-087", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Normativa", "q": "¿Qué derecho tiene en primer lugar el empleado de carrera cuyo cargo se suprime?", "o": ["Pensión anticipada.", "Derecho preferencial a ser incorporado en un empleo igual o equivalente de la nueva planta.", "Ingreso automático a un cargo de libre nombramiento.", "Ningún derecho."], "k": 1, "e": "Si no es posible, puede optar por la reincorporación o la indemnización.", "f": "C909 P52.", "n": "", "src": "propia"}, {"id": "M1-088", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Normativa", "q": "Protección por maternidad (art. 51): la insubsistencia por evaluación no satisfactoria de una empleada que estuvo en licencia de maternidad se produce:", "o": ["Durante la licencia.", "Dentro de los 8 días calendario siguientes al vencimiento de la licencia.", "Un año después de la licencia.", "No puede producirse nunca."], "k": 1, "e": "Además, el período de prueba se interrumpe durante la licencia.", "f": "C909 P54.", "n": "", "src": "propia"}, {"id": "M1-089", "comp": "M1", "tema": "G", "nivel": "B", "tipo": "Normativa", "q": "En caso de empate entre elegibles de un concurso, la Ley 909 (art. 52) prefiere a:", "o": ["La persona de mayor edad.", "Quien haya presentado primero la inscripción.", "Quien tenga más antigüedad en provisionalidad.", "La persona con discapacidad."], "k": 3, "e": "", "f": "C909 P54.", "n": "", "src": "propia"}, {"id": "M1-090", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Normativa", "q": "Según la presentación, la clasificación vigente de las situaciones administrativas del empleado público se encuentra en:", "o": ["La Ley 909 de 2004, art. 41.", "La Ley 30 de 1992, art. 79.", "El Decreto 1083 de 2015, art. 2.2.5.5.1, modificado por el Decreto 648 de 2017.", "La Constitución, art. 125."], "k": 2, "e": "\"No en un listado autónomo de la Ley 909\".", "f": "PPT d.24.", "n": "", "src": "propia"}, {"id": "M1-091", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Diferencias", "q": "De acuerdo con la presentación, ¿cuáles licencias son NO remuneradas?", "o": ["Enfermedad y maternidad.", "Ordinaria y para estudios.", "Paternidad y luto.", "Deportivas y parentales."], "k": 1, "e": "Las de A, C y D son remuneradas, según requisitos legales.", "f": "PPT d.24.", "n": "", "src": "propia"}, {"id": "M1-092", "comp": "M1", "tema": "G", "nivel": "I", "tipo": "Diferencias", "q": "En la clasificación de situaciones administrativas de la presentación, ¿qué diferencia hay entre comisión y encargo?", "o": ["En la comisión se cumplen actividades oficiales fuera del ejercicio ordinario del empleo; en el encargo se asumen temporalmente las funciones de otro empleo.", "Son lo mismo.", "La comisión es una sanción y el encargo un premio.", "El encargo solo aplica a trabajadores oficiales."], "k": 0, "e": "", "f": "PPT d.24.", "n": "", "src": "propia"}, {"id": "M1-093", "comp": "M1", "tema": "G", "nivel": "A", "tipo": "Identificar la incorrecta", "q": "Sobre el retiro del personal en una universidad estatal, ¿cuál afirmación es INCORRECTA?", "o": ["La Ley 30 enumera en un solo artículo todas las causales de retiro para todo el personal universitario.", "El estatuto profesoral debe regular el retiro de los docentes (art. 75).", "El estatuto general debe regular las situaciones administrativas y el régimen disciplinario del personal administrativo (art. 79).", "El art. 41 de la Ley 909 se aplica supletoriamente y no debe trasladarse automáticamente sin revisar el estatuto."], "k": 0, "e": "La Ley 30 no enumera causales generales de retiro: su regulación se desarrolla en los estatutos.", "f": "PPT d.25.", "n": "", "src": "propia"}, {"id": "M1-094", "comp": "M1", "tema": "G", "nivel": "A", "tipo": "Caso", "q": "En un concurso se proveen diez cargos de técnico administrativo ocupados por provisionales en vacancia definitiva. Cuando se posesionan los ganadores:", "o": ["Los provisionales conservan sus cargos por su antigüedad.", "Terminan los nombramientos provisionales mediante actos motivados, con el orden y las protecciones que fija la jurisprudencia (madres y padres cabeza de familia, prepensionados, personas con discapacidad).", "Los provisionales quedan inscritos en carrera en otros cargos.", "Los provisionales pueden ser retirados verbalmente."], "k": 1, "e": "C-640/12: trato preferente sin derecho indefinido al cargo.", "f": "C909 P49.", "n": "", "src": "propia"}, {"id": "M1-095", "comp": "M1", "tema": "H", "nivel": "B", "tipo": "Conceptual", "q": "Según los artículos 1 y 2 de la Ley 30, la educación superior es:", "o": ["Un servicio público cultural inherente a la finalidad social del Estado.", "Un servicio privado regulado por el mercado.", "Una función exclusiva de las universidades estatales.", "Un servicio de la Rama Ejecutiva sujeto a control de tutela."], "k": 0, "e": "", "f": "C30 P10; C30 P3.", "n": "", "src": "propia"}, {"id": "M1-096", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Identificar la incorrecta", "q": "¿Cuál de los siguientes NO es un campo de acción de la educación superior según la Ley 30?", "o": ["La técnica.", "La ciencia y la tecnología.", "Las humanidades, el arte y la filosofía.", "La administración de empresas industriales del Estado."], "k": 3, "e": "Los campos son la técnica, la ciencia, la tecnología, las humanidades, el arte y la filosofía.", "f": "C30 P15.", "n": "", "src": "propia"}, {"id": "M1-097", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Diferencias", "q": "Sobre los programas de posgrado, es CORRECTO que:", "o": ["La maestría es condición obligatoria para ingresar al doctorado.", "La especialización tiene la investigación como fundamento y culmina con tesis.", "La maestría y el doctorado tienen la investigación como fundamento; la maestría no es condición para ingresar al doctorado y el doctorado culmina con una tesis.", "Los posdoctorados solo los ofrecen las instituciones técnicas profesionales."], "k": 2, "e": "Arts. 10 a 13.", "f": "C30 P17.", "n": "", "src": "propia"}, {"id": "M1-098", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Diferencias", "q": "\"Universidad\" y \"economía solidaria\" en la Ley 30 son:", "o": ["Clasificaciones distintas: \"universidad\" describe el carácter académico y \"economía solidaria\" el origen o forma de organización.", "Dos categorías del mismo criterio de clasificación.", "Sinónimos.", "Formas de organización de las universidades estatales."], "k": 0, "e": "La economía solidaria no es una cuarta categoría de carácter académico.", "f": "PPT d.30; C30 P21.", "n": "", "src": "propia"}, {"id": "M1-099", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "Por su carácter académico, las instituciones de educación superior son:", "o": ["Instituciones técnicas profesionales, instituciones universitarias o escuelas tecnológicas, y universidades.", "Estatales, privadas y de economía solidaria.", "Nacionales, departamentales y municipales.", "Corporaciones y fundaciones."], "k": 0, "e": "B es la clasificación por origen (art. 23).", "f": "C30 P18; PPT d.28.", "n": "", "src": "propia"}, {"id": "M1-100", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "¿Qué tipo de institución puede adelantar programas de maestría, doctorado y posdoctorado?", "o": ["Las instituciones técnicas profesionales.", "Las instituciones universitarias o escuelas tecnológicas.", "Las universidades, de conformidad con la ley.", "Cualquier IES, sin autorización."], "k": 2, "e": "Art. 19 (modificado por la Ley 2630 de 2026).", "f": "C30 P19; PPT d.28.", "n": "", "src": "propia"}, {"id": "M1-101", "comp": "M1", "tema": "H", "nivel": "A", "tipo": "Identificar la incorrecta", "q": "¿Cuál de las siguientes NO hace parte de la autonomía universitaria del artículo 28 de la Ley 30?", "o": ["Darse y modificar sus estatutos.", "Seleccionar a sus profesores y admitir a sus alumnos.", "Definir libremente los elementos estructurales de las faltas disciplinarias, sin sujeción a la ley.", "Establecer, arbitrar y aplicar sus recursos."], "k": 2, "e": "La C-829/02 precisó que los elementos estructurales del régimen disciplinario están reservados a la ley.", "f": "C30 P22, P45.", "n": "", "src": "propia"}, {"id": "M1-102", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "Para las instituciones universitarias y técnicas profesionales (art. 29), ¿qué actos requieren notificación al Ministro de Educación?", "o": ["Modificar sus estatutos y seleccionar y vincular docentes.", "Admitir alumnos y otorgar títulos.", "Aprobar el presupuesto.", "Designar al rector."], "k": 0, "e": "", "f": "C30 P23.", "n": "", "src": "propia"}, {"id": "M1-103", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Jurisprudencia", "q": "Un aspirante no admitido reclama que, como la educación es un derecho, la universidad no puede aplicar sus criterios de selección. Según la C-337 de 1996:", "o": ["Tiene razón: la universidad debe admitir a todos.", "La admisión la decide el MEN.", "La universidad puede escoger libremente, incluso por criterios subjetivos.", "La autonomía permite fijar cupos y criterios objetivos de selección, sin decisiones arbitrarias ni discriminatorias."], "k": 3, "e": "", "f": "C30 P24; C30 Ej. 1 caso 1.", "n": "", "src": "propia"}, {"id": "M1-104", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "En el procedimiento sancionatorio del art. 51 de la Ley 30 (modificado por la Ley 1740 de 2014), ¿quién formula el pliego de cargos?", "o": ["Un investigador designado por el Ministro de Educación.", "El Consejo Superior de la universidad.", "La Procuraduría.", "El CESU."], "k": 0, "e": "La institución tiene 30 días para descargos y el investigador rinde informe al Ministro sugiriendo sanción o archivo.", "f": "C30 P27.", "n": "", "src": "propia"}, {"id": "M1-105", "comp": "M1", "tema": "H", "nivel": "B", "tipo": "Normativa", "q": "¿Qué es el CESU y quién lo preside?", "o": ["Un organismo vinculado al MEN para coordinación, planificación, recomendación y asesoría, presidido por el Ministro de Educación.", "Un órgano de control fiscal, presidido por el Contralor.", "El órgano de gobierno de cada universidad, presidido por el Rector.", "Un tribunal de la Rama Judicial."], "k": 0, "e": "Arts. 34 y 35.", "f": "C30 A6–A7 (cuestionario).", "n": "", "src": "propia"}, {"id": "M1-106", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "Sobre el Sistema Nacional de Acreditación, es correcto que:", "o": ["Es obligatorio y permanente.", "Acogerse es voluntario, la acreditación es temporal y la autoevaluación institucional es una tarea permanente; el Consejo Nacional de Acreditación depende del CESU.", "Lo administra la CNSC.", "Solo aplica a las instituciones privadas."], "k": 1, "e": "Arts. 53 a 55.", "f": "C30 P28–P29; PPT d.37.", "n": "", "src": "propia"}, {"id": "M1-107", "comp": "M1", "tema": "H", "nivel": "I", "tipo": "Normativa", "q": "¿Qué agregó la Ley 2630 de 2026 a los objetivos de la educación superior (art. 6, lit. k)?", "o": ["La gratuidad total de la matrícula.", "Desarrollar las habilidades comunicativas para leer, escribir, escuchar, hablar e interpretar en cualquier lengua: nativa, Lengua de Señas Colombiana o extranjera.", "La obligación de acreditarse.", "El régimen de financiación progresiva."], "k": 1, "e": "D corresponde a la Ley 2568 de 2026.", "f": "C30 P13.", "n": "", "src": "propia"}, {"id": "M1-108", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Procedimiento", "q": "¿Qué se requiere para crear una universidad estatal?", "o": ["Un decreto del Presidente de la República.", "Un acuerdo del CESU.", "Decisión del Congreso, una asamblea o un concejo, con estudio de factibilidad aprobado por el Ministro de Educación previo concepto favorable del CESU, y convenio Nación–entidad territorial sobre aportes.", "Una resolución del Ministerio de Hacienda."], "k": 2, "e": "Arts. 58 a 60.", "f": "C30 P7, P33.", "n": "", "src": "propia"}, {"id": "M1-109", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Normativa", "q": "Según el artículo 61 de la Ley 30, las disposiciones de la ley sobre instituciones estatales:", "o": ["Son normas supletorias del estatuto general.", "Constituyen el estatuto básico u orgánico; el estatuto general debe ajustarse a ellas y establecer cuáles de sus actos son administrativos y qué recursos proceden.", "Solo aplican a las instituciones que no son universidades.", "Pueden ser modificadas por el Consejo Superior."], "k": 1, "e": "", "f": "C30 P34.", "n": "", "src": "propia"}, {"id": "M1-110", "comp": "M1", "tema": "I", "nivel": "B", "tipo": "Normativa", "q": "¿Cuáles son los órganos de dirección de una universidad estatal?", "o": ["El Rector, el Consejo Directivo y el Consejo Académico.", "La Asamblea de egresados y el Rector.", "El CESU, el MEN y el Rector.", "El Consejo Superior Universitario, el Consejo Académico y el Rector."], "k": 3, "e": "A corresponde a las demás instituciones estatales que no son universidades.", "f": "C30 P35; PPT d.31, d.34.", "n": "", "src": "propia"}, {"id": "M1-111", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Caso", "q": "Usted proyecta el acta de la primera sesión del año del Consejo Superior de una universidad estatal del orden departamental. ¿Qué debe registrar?", "o": ["Preside el Ministro de Educación; el Rector vota; al Rector lo designó el Gobernador.", "Preside el representante del Presidente de la República; el Rector vota.", "Preside el Gobernador; el Rector asiste con voz y sin voto; al Rector lo designó el Consejo Superior.", "Preside el Rector; el Gobernador asiste con voz y sin voto."], "k": 2, "e": "Arts. 64 y 66. B confunde la representación presidencial con la presidencia del Consejo (advertencia expresa de PPT d.35).", "f": "C30 Ej. 2 caso 1; PPT d.35.", "n": "", "src": "propia"}, {"id": "M1-112", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "En una universidad estatal del orden municipal o distrital, ¿quién preside el Consejo Superior, según la cartilla de la Ley 30?", "o": ["El alcalde.", "El Gobernador.", "El Ministro de Educación.", "El Rector."], "k": 0, "e": "Art. 64.", "f": "C30 P36.", "n": "La PPT d.35 solo menciona Ministro y Gobernador; dato tomado de la C30.", "src": "propia"}, {"id": "M1-113", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Jurisprudencia", "q": "Según la C-589 de 1997, la presencia de representantes del Estado en el Consejo Superior Universitario es válida mientras:", "o": ["El Estado tenga mayoría de votos.", "No constituya un control mayoritario o absoluto del Estado.", "El Rector la apruebe.", "Solo participe el Ministro de Educación."], "k": 1, "e": "", "f": "C30 P36; C30 P2.", "n": "", "src": "propia"}, {"id": "M1-114", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Diferencias", "q": "¿Cuál de las siguientes funciones corresponde al Consejo Académico y NO al Consejo Superior?", "o": ["Designar y remover al Rector.", "Aprobar el presupuesto.", "Expedir o modificar los estatutos.", "Decidir sobre el desarrollo académico en docencia, programas, investigación, extensión y bienestar."], "k": 3, "e": "A, B y C son funciones del Consejo Superior (art. 65).", "f": "C30 P37, P39; PPT d.34.", "n": "", "src": "propia"}, {"id": "M1-115", "comp": "M1", "tema": "I", "nivel": "B", "tipo": "Normativa", "q": "¿Quién preside el Consejo Académico de una universidad estatal?", "o": ["El Gobernador.", "El Rector.", "El decano más antiguo.", "El representante de los profesores."], "k": 1, "e": "Art. 68.", "f": "C30 P39.", "n": "", "src": "propia"}, {"id": "M1-116", "comp": "M1", "tema": "I", "nivel": "B", "tipo": "Normativa", "q": "El Rector de una universidad estatal es:", "o": ["El máximo órgano de dirección y gobierno.", "La máxima autoridad académica.", "Un empleado de libre nombramiento del Ministro de Educación.", "El representante legal y la primera autoridad ejecutiva, designado por el Consejo Superior."], "k": 3, "e": "A es el Consejo Superior; B el Consejo Académico; C contradice la autonomía y la C-195/94.", "f": "C30 P38; PPT d.34.", "n": "", "src": "propia"}, {"id": "M1-117", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "Según el artículo 67 de la Ley 30, ¿quiénes responden por las decisiones del Consejo Superior?", "o": ["Solo el Rector.", "Solo el presidente del Consejo.", "Todos sus integrantes.", "Nadie, por tratarse de un órgano colegiado."], "k": 2, "e": "Además, los miembros que sean empleados públicos y el Rector están sujetos a impedimentos, inhabilidades e incompatibilidades.", "f": "C30 P38; PPT d.35.", "n": "", "src": "propia"}, {"id": "M1-118", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "¿Qué se requiere, como mínimo, para ser profesor de una universidad estatal y cómo se ingresa?", "o": ["Título de maestría e ingreso por libre nombramiento.", "Título de bachiller e ingreso por contrato de trabajo.", "Título de doctorado e ingreso por invitación del Rector.", "Título profesional universitario e ingreso por concurso público de méritos reglamentado por el Consejo Superior."], "k": 3, "e": "Art. 70; el Consejo Superior puede reglamentar excepciones al título por aportes significativos.", "f": "C30 P40; PPT d.36.", "n": "", "src": "propia"}, {"id": "M1-119", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "El escalafón docente de la Ley 30 (art. 76) tiene las categorías:", "o": ["Auxiliar, Asistente, Asociado y Titular.", "Junior, Senior y Máster.", "Instructor, Auxiliar y Titular.", "Técnico, Profesional y Asesor."], "k": 0, "e": "Para ascender a Asociado y a Titular se exige, además del tiempo, un trabajo sustentado ante homólogos de otras instituciones.", "f": "C30 P43.", "n": "", "src": "propia"}, {"id": "M1-120", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Identificar la incorrecta", "q": "¿Cuál de los siguientes NO es un contenido mínimo que el artículo 79 exige al estatuto general respecto del personal administrativo?", "o": ["Derechos y obligaciones.", "Inhabilidades y situaciones administrativas.", "Régimen disciplinario.", "El escalafón de cuatro categorías: auxiliar, asistente, asociado y titular."], "k": 3, "e": "El escalafón es del personal docente (art. 76). El art. 79 exige derechos, obligaciones, inhabilidades, situaciones administrativas y régimen disciplinario.", "f": "C30 P44; PPT d.36.", "n": "", "src": "propia"}, {"id": "M1-121", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Caso", "q": "Un funcionario administrativo pregunta si la universidad puede definir libremente las faltas por las que podría sancionarlo. ¿Qué responde?", "o": ["No: la C-829 de 2002 admite el régimen disciplinario interno, pero los elementos estructurales de las faltas están reservados a la ley y deben respetarse el debido proceso, la defensa y la proporcionalidad.", "Sí, por la autonomía universitaria.", "Sí, siempre que lo apruebe el Consejo Académico.", "No, porque la universidad no puede tener ningún régimen disciplinario propio."], "k": 0, "e": "D es incorrecta porque la Corte declaró exequibles los arts. 75 lit. d y 79.", "f": "C30 P45; C30 Ej. 2 caso 2.", "n": "", "src": "propia"}, {"id": "M1-122", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "El artículo 86 de la Ley 30, modificado por la Ley 2568 de 2026, dispone que los aportes a las universidades estatales se incrementan cada año como mínimo en:", "o": ["El Índice de Costos de la Educación Superior (ICES) del DANE; si el ICES es inferior al IPC, el aumento se ajusta con el IPC.", "El IPC, sin excepción.", "El 70 % del incremento real del PIB.", "El salario mínimo."], "k": 0, "e": "C es el aporte adicional del art. 87.", "f": "C30 P48.", "n": "", "src": "propia"}, {"id": "M1-123", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Diferencias", "q": "Sobre el aporte adicional del artículo 87 (Ley 2568 de 2026), ¿cuál afirmación es CORRECTA?", "o": ["Es no inferior al 70 % del incremento real del PIB y esos recursos no hacen parte de la base presupuestal.", "Es igual al ICES y hace parte de la base.", "Si el PIB crece más del doble del año anterior, el incremento sube al 100 %.", "Lo distribuye cada universidad según su criterio."], "k": 0, "e": "En C el porcentaje es 30 %; D: la metodología la define el MEN con criterios de equidad y cierre de brechas.", "f": "C30 P49.", "n": "", "src": "propia"}, {"id": "M1-124", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Normativa", "q": "¿Qué estableció la Ley 2568 de 2026 con el artículo 87B de la Ley 30?", "o": ["La base presupuestal de las instituciones técnicas.", "La meta de llegar al 1 % del PIB.", "La posibilidad de constituir veedurías ciudadanas, con acompañamiento de la Contraloría General y publicación anual de informes consolidados.", "La exención del IVA."], "k": 2, "e": "A es el 86A; B el 87A; D el art. 92.", "f": "C30 P50, P52.", "n": "", "src": "propia"}, {"id": "M1-125", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Caso", "q": "Una dependencia pide pagar el mantenimiento de unos equipos a un proveedor que ya prestó el servicio, pero el contrato no tiene registro presupuestal. ¿Qué responde la Oficina de Contratación?", "o": ["Que se pague, porque los contratos de la universidad se rigen solo por el derecho privado.", "Que los contratos se rigen por el derecho privado salvo excepciones legales, pero para su validez se exigen además aprobación y registro presupuestal, sujeción de los pagos a las apropiaciones, publicación en el Diario Oficial y timbre cuando proceda; falta el registro presupuestal.", "Que el contrato es válido porque el servicio ya se prestó.", "Que debe aplicarse íntegramente la Ley 909."], "k": 1, "e": "Arts. 93 y 94; verificar el estatuto de contratación.", "f": "C30 P51; C30 Ej. 2 caso 3.", "n": "", "src": "propia"}, {"id": "M1-126", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Caso", "q": "El área financiera propone destinar el 1 % del presupuesto de funcionamiento a bienestar y dirigirlo solo a estudiantes. ¿Es correcta la propuesta?", "o": ["Sí, porque el bienestar es exclusivo de los estudiantes.", "No: debe destinarse al menos el 2 % del presupuesto de funcionamiento, y el bienestar cubre a estudiantes, docentes y personal administrativo.", "No, porque debe ser el 10 % de las matrículas.", "Sí, siempre que lo apruebe el Consejo Académico."], "k": 1, "e": "Arts. 117 (mod. Ley 1503/2011) y 118.", "f": "C30 P54; C30 Ej. 2 caso 4.", "n": "", "src": "propia"}, {"id": "M1-127", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "Los derechos complementarios que pueden exigir las instituciones estatales no pueden exceder:", "o": ["El 2 % del presupuesto de funcionamiento.", "El 20 % del valor de la matrícula.", "El 70 % del PIB.", "Un salario mínimo."], "k": 1, "e": "Art. 122.", "f": "C30 P56.", "n": "", "src": "propia"}, {"id": "M1-128", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "¿De qué se compone el patrimonio de una universidad estatal (art. 85)?", "o": ["Solo de los aportes de la Nación.", "De las partidas de los presupuestos nacional y territoriales; sus bienes muebles e inmuebles y sus frutos; las rentas por matrículas, inscripciones y demás derechos; y los bienes que adquiera a cualquier título.", "Solo de las rentas propias por matrículas.", "De los aportes de las empresas privadas que contrata."], "k": 1, "e": "", "f": "C30 P47; PPT d.38.", "n": "", "src": "propia"}, {"id": "M1-129", "comp": "M1", "tema": "I", "nivel": "A", "tipo": "Jurisprudencia", "q": "¿Qué declaró inexequible la sentencia C-926 de 2005?", "o": ["La concertación con rectores y la redistribución de hasta un 12 % de las transferencias según indicadores de gestión, por intervenir indebidamente en la autonomía presupuestal y por reserva de ley.", "La composición del Consejo Superior.", "La facultad de admitir alumnos.", "El régimen de los profesores de cátedra."], "k": 0, "e": "", "f": "C30 P8, P48.", "n": "", "src": "propia"}, {"id": "M1-130", "comp": "M1", "tema": "I", "nivel": "I", "tipo": "Normativa", "q": "¿Qué busca el Sistema de Universidades Estatales u Oficiales (art. 81)?", "o": ["Sustituir a los consejos superiores.", "Racionalizar y optimizar recursos, facilitar la transferencia de estudiantes y el intercambio de docentes, programas conjuntos y crear condiciones para la evaluación.", "Administrar la carrera administrativa de las universidades.", "Fijar el valor de las matrículas."], "k": 1, "e": "El Ministro lo reglamenta según recomendaciones del CESU.", "f": "C30 P46; PPT d.37.\n\n---", "n": "", "src": "propia"}, {"id": "M1-131", "comp": "M1", "tema": "J", "nivel": "B", "tipo": "Normativa", "q": "Según la Sentencia C-030 de 2023, las funciones disciplinarias de la Procuraduría General de la Nación son:", "o": ["Jurisdiccionales, equiparables a las de un juez.", "De naturaleza administrativa y no jurisdiccional.", "De naturaleza penal especial.", "Legislativas delegadas por el Congreso."], "k": 1, "e": "La C-030/2023 precisó que esas funciones son administrativas y no jurisdiccionales, y por eso sus decisiones tienen control judicial contencioso-administrativo.", "f": "CDD cap. 1 (Ley 2094 de 2021) y cap. 3 (control judicial).", "n": "", "src": "propia"}, {"id": "M1-132", "comp": "M1", "tema": "J", "nivel": "B", "tipo": "Normativa", "q": "La regla general de vigencia del Código General Disciplinario reformado se consolidó a partir del:", "o": ["28 de enero de 2019.", "29 de junio de 2021.", "1 de julio de 2021.", "29 de marzo de 2022."], "k": 3, "e": "La cartilla señala el 29 de marzo de 2022 como regla general, con excepciones y fechas específicas. El 28 de enero de 2019 es la fecha de expedición de la Ley 1952 y el 29 de junio de 2021 la publicación de la Ley 2094.", "f": "CDD, Vigencia y derecho transitorio.", "n": "", "src": "propia"}, {"id": "M1-133", "comp": "M1", "tema": "J", "nivel": "I", "tipo": "Diferencia entre conceptos", "q": "Según el artículo 29 de la Ley 1952 de 2019 (modificado por la Ley 2094 de 2021), ¿qué modalidad de culpa NO es sancionable disciplinariamente?", "o": ["La culpa gravísima.", "La culpa grave.", "La culpa leve.", "Ninguna: toda culpa es sancionable."], "k": 2, "e": "La culpa sancionable puede ser gravísima o grave; la culpa leve no es sancionable en materia disciplinaria.", "f": "Ley 1952, art. 29.", "n": "", "src": "propia"}, {"id": "M1-134", "comp": "M1", "tema": "J", "nivel": "I", "tipo": "Normativa", "q": "La acción disciplinaria prescribe, por regla general, en:", "o": ["Cinco años; doce años para las faltas del artículo 52 del Código.", "Tres años en todos los casos.", "Diez años para las faltas gravísimas y cinco para las demás.", "No prescribe mientras exista queja."], "k": 0, "e": "Art. 33: cinco años, contados según el tipo de falta (instantánea, permanente u omisiva); para las faltas del art. 52, doce años. Se interrumpe con la notificación del fallo de primera instancia.", "f": "Ley 1952, art. 33.", "n": "", "src": "propia"}, {"id": "M1-135", "comp": "M1", "tema": "J", "nivel": "A", "tipo": "Caso práctico", "q": "Una funcionaria presentó una queja disciplinaria contra un compañero y, dos meses después, presenta un escrito en el que desiste de ella. ¿Qué efecto tiene ese desistimiento?", "o": ["Extingue la acción disciplinaria.", "Obliga a archivar el expediente.", "Ninguno sobre la acción: el desistimiento del quejoso no la extingue.", "Suspende los términos hasta que la quejosa ratifique."], "k": 2, "e": "Las causales de extinción son la muerte del disciplinable, la caducidad y la prescripción; el parágrafo del art. 32 dice que el desistimiento del quejoso no extingue la acción.", "f": "Ley 1952, art. 32.", "n": "", "src": "propia"}, {"id": "M1-136", "comp": "M1", "tema": "J", "nivel": "I", "tipo": "Identificar la opción incorrecta", "q": "¿Cuál de las siguientes NO es una sanción disciplinaria del Código General Disciplinario?", "o": ["Destitución e inhabilidad general.", "Suspensión e inhabilidad especial.", "Multa.", "El llamado de atención informal para preservar el orden interno."], "k": 3, "e": "Las sanciones son destitución e inhabilidad general, suspensión e inhabilidad especial, multa y amonestación escrita. La cartilla aclara que la sanción no se confunde con el llamado de atención informal.", "f": "CDD, Sanciones y graduación.", "n": "", "src": "propia"}, {"id": "M1-137", "comp": "M1", "tema": "J", "nivel": "A", "tipo": "Caso práctico", "q": "Un servidor entrega un informe con dos días de retraso por una falla general del sistema, avisa oportunamente a su superior y el trámite no se afecta. ¿Qué puede afirmarse?", "o": ["Hay ilicitud sustancial automática porque se incumplió un término.", "Es una falta gravísima por omisión.", "Debe sancionarse con amonestación escrita sin más análisis.", "No puede afirmarse automáticamente la ilicitud sustancial: debe valorarse la justificación y si hubo afectación sustancial del deber."], "k": 3, "e": "La ilicitud sustancial exige afectación sustancial del deber funcional sin justificación; un incumplimiento formal justificado no basta, y no hay sanción automática.", "f": "CDD cap. 2 (caso sobre ilicitud sustancial).", "n": "", "src": "propia"}, {"id": "M1-138", "comp": "M1", "tema": "J", "nivel": "B", "tipo": "Procedimiento", "q": "De acuerdo con el Mapa de Derecho Procesal Disciplinario, la indagación previa:", "o": ["Dura como máximo 6 meses y no es prorrogable.", "Dura entre 6 y 18 meses.", "Puede prorrogarse tantas veces como se necesite.", "Termina con el pliego de cargos."], "k": 0, "e": "El mapa indica para la indagación previa una duración máxima de 6 meses no prorrogable; los términos de 6 a 18 meses corresponden a la investigación disciplinaria.", "f": "Mapa de Derecho Procesal Disciplinario (Etapas del procedimiento).", "n": "", "src": "propia"}, {"id": "M1-139", "comp": "M1", "tema": "J", "nivel": "I", "tipo": "Relación entre conceptos", "q": "En el procedimiento disciplinario, el pliego de cargos:", "o": ["Se dicta al recibir la queja.", "Exige imputación fáctica y jurídica, de modo que el investigado conozca los hechos y las normas para defenderse.", "Puede ser genérico si la falta es gravísima.", "Sustituye el fallo de primera instancia."], "k": 1, "e": "La imputación concreta hechos y normas para permitir la defensa; el mapa la ubica en la etapa de imputación, previa al juicio.", "f": "CDD, Evaluación 2 (pregunta 7); Mapa de Derecho Procesal Disciplinario.", "n": "", "src": "propia"}, {"id": "M1-140", "comp": "M1", "tema": "K", "nivel": "B", "tipo": "Conceptual", "q": "Según el artículo 2 de la Ley 2365 de 2024, el acoso sexual se manifiesta en relaciones de poder de orden:", "o": ["Exclusivamente vertical.", "Vertical u horizontal.", "Exclusivamente horizontal.", "Únicamente contractual."], "k": 1, "e": "La ley define el acoso sexual como persecución, hostigamiento o asedio de connotación sexual en relaciones de poder vertical u horizontal, que se dé una o varias veces.", "f": "Ley 2365 de 2024, art. 2.", "n": "Nota: la falta gravísima del art. 53.5 del CGD, modificado por la misma ley, habla solo de relaciones de poder vertical.", "src": "propia"}, {"id": "M1-141", "comp": "M1", "tema": "K", "nivel": "I", "tipo": "Normativa", "q": "Una servidora víctima de acoso sexual pide traslado de área y evitar toda interacción con el investigado. Según la Ley 2365 de 2024, ¿en qué término debe adoptar estas medidas el empleador?", "o": ["En un término no superior a cinco días hábiles.", "Dentro de los quince días calendario.", "Dentro de los treinta días hábiles.", "Cuando termine la investigación disciplinaria."], "k": 0, "e": "Las medidas de los numerales 3 a 6 del art. 13 (traslado, teletrabajo, evitar interacción, terminación del vínculo) se adoptan a solicitud de la víctima en máximo 5 días hábiles.", "f": "Ley 2365 de 2024, art. 13.", "n": "", "src": "propia"}, {"id": "M1-142", "comp": "M1", "tema": "K", "nivel": "A", "tipo": "Caso práctico", "q": "Un trabajador denunció acoso sexual y, cuatro meses después, el empleador lo despide alegando bajo rendimiento. Según la Ley 2365 de 2024:", "o": ["El despido es válido si el empleador prueba el bajo rendimiento.", "El despido solo genera una amonestación al empleador.", "El despido requiere concepto previo del Comité de Convivencia Laboral.", "El despido carece de efecto por producirse dentro de los seis meses siguientes a la queja y se presume retaliación."], "k": 3, "e": "Art. 14: la terminación dentro de los 6 meses siguientes a la queja carece de todo efecto y se presume retaliación, con multa de 1 a 5000 SMLDV (salvo las excepciones del propio artículo).", "f": "Ley 2365 de 2024, art. 14.", "n": "", "src": "propia"}, {"id": "M1-143", "comp": "M1", "tema": "K", "nivel": "I", "tipo": "Procedimiento", "q": "Si el presunto acosador es el superior jerárquico de la entidad, la queja por acoso sexual debe presentarse ante:", "o": ["El propio superior jerárquico.", "El Comité de Convivencia Laboral.", "La inspección de trabajo.", "La Administradora de Riesgos Laborales."], "k": 2, "e": "El parágrafo 3 del art. 11 asigna la queja a la inspección de trabajo, que hace seguimiento y compulsa copias si encuentra méritos.", "f": "Ley 2365 de 2024, art. 11, par. 3.", "n": "", "src": "propia"}, {"id": "M1-144", "comp": "M1", "tema": "K", "nivel": "I", "tipo": "Normativa", "q": "Sobre la publicación de quejas por acoso sexual, la Ley 2365 de 2024 obliga a los empleadores a:", "o": ["Publicar cada año los nombres de los investigados.", "Publicar semestralmente, de forma anonimizada, el número de quejas tramitadas y sanciones, y remitirlas al Sivige dentro de los últimos 10 días del semestre.", "No publicar ninguna información por reserva.", "Enviarlas trimestralmente a la Procuraduría."], "k": 1, "e": "Art. 11 num. 7: publicación semestral anonimizada y reporte al Sistema Integrado de Información de Violencias de Género (Sivige) en los últimos 10 días del semestre.", "f": "Ley 2365 de 2024, art. 11.", "n": "", "src": "propia"}, {"id": "M1-145", "comp": "M1", "tema": "K", "nivel": "B", "tipo": "Institucional", "q": "En la Universidad del Magdalena, ¿qué dependencia es responsable del protocolo de violencias basadas en género y coordina el Grupo de Atención de Casos (GAV)?", "o": ["Secretaría General.", "Oficina de Control Interno Disciplinario.", "Dirección de Talento Humano.", "Dirección de Bienestar Universitario."], "k": 3, "e": "El Acuerdo Superior 10 de 2019 asigna a Bienestar Universitario la aplicación y socialización del protocolo y la coordinación del GAV.", "f": "P10, diapositiva 9.", "n": "", "src": "propia"}, {"id": "M1-146", "comp": "M1", "tema": "K", "nivel": "I", "tipo": "Procedimiento", "q": "Según el protocolo del Acuerdo Superior 10 de 2019, cuando la persona afectada es menor de 18 años la Universidad debe:", "o": ["Reportar el caso de manera inmediata al ICBF.", "Esperar la autorización de los padres para actuar.", "Remitir el caso al Comité de Convivencia Laboral.", "Cerrar la atención institucional."], "k": 0, "e": "Ante menores de edad se reporta de inmediato al ICBF y se articula con los protocolos de restablecimiento de derechos.", "f": "P10, diapositiva 15.", "n": "", "src": "propia"}, {"id": "M1-147", "comp": "M1", "tema": "K", "nivel": "A", "tipo": "Identificar la opción incorrecta", "q": "Sobre la ruta del Acuerdo Superior 10 de 2019, ¿cuál afirmación es INCORRECTA?", "o": ["Un tercero puede reportar el caso.", "La ausencia de contacto físico no excluye la violencia.", "El cierre de la atención del GAV extingue los procesos ante otras entidades.", "La persona afectada puede escoger el sexo del profesional que la acompaña."], "k": 2, "e": "Es falsa: el cierre institucional no extingue otras actuaciones, que siguen hasta su culminación. Las demás afirmaciones están en el protocolo.", "f": "P10, diapositivas 5, 7, 11 y 15.", "n": "", "src": "propia"}, {"id": "M1-148", "comp": "M1", "tema": "K", "nivel": "I", "tipo": "Interpretación", "q": "La ruta del protocolo tiene seis momentos. ¿Cuál es el orden correcto?", "o": ["Atención inicial, reporte, medidas, orientación, cierre, seguimiento.", "Reporte, orientación, atención inicial, seguimiento, medidas, cierre.", "Reporte, medidas preventivas, atención inicial, cierre, orientación, seguimiento.", "Reporte, atención inicial, orientación y atención, medidas preventivas y de cuidado, seguimiento, cierre."], "k": 3, "e": "Así aparecen los seis momentos en la presentación del Acuerdo; la confidencialidad y la no revictimización atraviesan todas las etapas.", "f": "P10, diapositiva 10.", "n": "", "src": "propia"}, {"id": "M1-149", "comp": "M1", "tema": "L", "nivel": "B", "tipo": "Normativa", "q": "La Resolución 3461 de 2025 del Ministerio del Trabajo derogó:", "o": ["La Ley 1010 de 2006.", "Las Resoluciones 652 y 1356 de 2012.", "La Resolución 2646 de 2008.", "La Ley 2365 de 2024."], "k": 1, "e": "Su objeto es fijar la conformación y el funcionamiento del Comité de Convivencia Laboral y deroga las Resoluciones 652 y 1356 de 2012 (art. 16).", "f": "Resolución 3461 de 2025, arts. 1 y 16.", "n": "", "src": "propia"}, {"id": "M1-150", "comp": "M1", "tema": "L", "nivel": "I", "tipo": "Normativa", "q": "Una entidad pública con 300 trabajadores debe conformar su Comité de Convivencia Laboral con:", "o": ["Dos representantes de los trabajadores y dos del empleador, con sus suplentes.", "Un representante de cada parte, sin suplentes.", "Tres representantes del empleador y uno de los trabajadores.", "Solo representantes del nivel directivo."], "k": 0, "e": "Con más de 20 trabajadores: 4 integrantes (2 y 2) con suplentes; se pueden designar más, pero siempre en igual número por parte. Los del empleador no tienen que ser directivos.", "f": "Resolución 3461 de 2025, art. 3.", "n": "", "src": "propia"}, {"id": "M1-151", "comp": "M1", "tema": "L", "nivel": "B", "tipo": "Normativa", "q": "El periodo del Comité de Convivencia Laboral es de:", "o": ["Un año.", "Tres años.", "Dos años, contados desde la comunicación de la elección o designación.", "Cuatro años."], "k": 2, "e": "Art. 5: dos años desde la comunicación de la elección o designación; si el principal se retira, asume el suplente sin nuevas elecciones.", "f": "Resolución 3461 de 2025, art. 5.", "n": "", "src": "propia"}, {"id": "M1-152", "comp": "M1", "tema": "L", "nivel": "I", "tipo": "Conceptual", "q": "¿Cuál es el rol del Comité de Convivencia Laboral según la Resolución 3461 de 2025?", "o": ["Determinar si hubo acoso laboral e imponer la sanción.", "Adelantar la investigación disciplinaria.", "Reemplazar a la inspección de trabajo.", "Preventivo, orientador, conciliador y canalizador; no determina si hay acoso laboral."], "k": 3, "e": "El art. 6 lo define como instancia preventiva independiente; expresamente no determina si hay acoso.", "f": "Resolución 3461 de 2025, art. 6.", "n": "", "src": "propia"}, {"id": "M1-153", "comp": "M1", "tema": "L", "nivel": "A", "tipo": "Caso práctico", "q": "Una trabajadora presenta ante el Comité de Convivencia Laboral una queja por presunto acoso sexual de un compañero. ¿Qué corresponde?", "o": ["El Comité no es competente porque estas conductas no son conciliables; la alta dirección o el jefe de talento humano debe tener el procedimiento para recibirlas.", "El Comité cita a las partes para conciliar.", "El Comité archiva la queja por falta de pruebas.", "El Comité declara la existencia del acoso y sanciona."], "k": 0, "e": "El parágrafo 1 del art. 6 excluye el acoso sexual (Ley 2365 de 2024) de la competencia del Comité, por no ser conciliable.", "f": "Resolución 3461 de 2025, art. 6, par. 1.", "n": "", "src": "propia"}, {"id": "M1-154", "comp": "M1", "tema": "L", "nivel": "I", "tipo": "Normativa", "q": "El procedimiento preventivo para resolver una queja de acoso laboral no puede extenderse por más de:", "o": ["15 días calendario.", "30 días hábiles.", "90 días calendario.", "65 días calendario desde la recepción de la queja formal."], "k": 3, "e": "Parágrafo 2 del art. 6: máximo 65 días calendario; los tiempos de cada función no son acumulativos y el seguimiento mensual no se cuenta.", "f": "Resolución 3461 de 2025, art. 6, pars. 2 y 3.", "n": "", "src": "propia"}, {"id": "M1-155", "comp": "M1", "tema": "L", "nivel": "A", "tipo": "Procedimiento", "q": "En una entidad pública no hubo acuerdo entre las partes y la conducta de presunto acoso laboral persiste. El Comité debe:", "o": ["Cerrar el caso e informar al trabajador que demande ante el juez.", "Remitir la queja a la Procuraduría General de la Nación o a la Personería, según la circunscripción, en máximo 15 días calendario.", "Trasladar el caso a la ARL.", "Imponer una multa al presunto acosador."], "k": 1, "e": "En el sector público la remisión es a la Procuraduría o a las Personerías; cerrar el caso e informar a la alta dirección es la regla del sector privado.", "f": "Resolución 3461 de 2025, art. 6 (función 6) y art. 11.", "n": "", "src": "propia"}, {"id": "M1-156", "comp": "M1", "tema": "L", "nivel": "I", "tipo": "Identificar la opción correcta", "q": "¿Quiénes NO pueden integrar el Comité de Convivencia Laboral al momento de su conformación?", "o": ["Los trabajadores de nivel operativo.", "Los representantes del empleador que no sean directivos.", "Los suplentes elegidos por votación secreta.", "Quienes en el año anterior hayan tenido una queja de acoso laboral en su contra o hayan sido víctimas de acoso laboral."], "k": 3, "e": "El art. 3 excluye a esas personas; además aclara que los del empleador no tienen que ser directivos ni los de los trabajadores operativos.", "f": "Resolución 3461 de 2025, art. 3.", "n": "", "src": "propia"}, {"id": "M1-157", "comp": "M1", "tema": "L", "nivel": "B", "tipo": "Procedimiento", "q": "El Comité de Convivencia Laboral se reúne ordinariamente:", "o": ["Cada mes, y sesiona con la mitad más uno de sus integrantes.", "Cada trimestre, con todos sus integrantes.", "Solo cuando recibe quejas.", "Cada semestre, con mayoría simple."], "k": 0, "e": "Art. 9: reuniones ordinarias mensuales con quórum de la mitad más uno; las extraordinarias se convocan cada vez que llega una queja (art. 10).", "f": "Resolución 3461 de 2025, arts. 9 y 10.", "n": "", "src": "propia"}, {"id": "M1-158", "comp": "M1", "tema": "M", "nivel": "B", "tipo": "Institucional", "q": "¿Con qué frecuencia mínima sesiona ordinariamente el Consejo Superior Universitario?", "o": ["Dos veces al mes.", "Una vez al mes.", "Una vez por trimestre.", "Una vez por semestre."], "k": 1, "e": "El CSU sesiona al menos una vez al mes; el Consejo Académico, al menos dos veces al mes.", "f": "CMN Módulo 1 (art. 29 del Estatuto General y cuadro comparativo).", "n": "", "src": "propia"}, {"id": "M1-159", "comp": "M1", "tema": "M", "nivel": "I", "tipo": "Diferencia entre conceptos", "q": "En el Consejo Superior, ¿qué tipo de acto se usa para las directrices técnicas o de procedimiento?", "o": ["El Acuerdo Superior.", "La Resolución.", "La Circular.", "El Comunicado."], "k": 2, "e": "Art. 32: Acuerdos (situaciones generales), Resoluciones (particulares), Circulares (directrices técnicas o de procedimiento) y Comunicados (posición del Consejo).", "f": "CMN Módulo 1 (art. 32).", "n": "", "src": "propia"}, {"id": "M1-160", "comp": "M1", "tema": "M", "nivel": "I", "tipo": "Normativa", "q": "En las votaciones del Consejo Superior, ¿quién puede abstenerse?", "o": ["Cualquier miembro, sin justificar.", "Solo el presidente del Consejo.", "Quien declare conflicto de interés o impedimento, o no haya estado en la discusión.", "Solo los representantes de los estamentos."], "k": 2, "e": "Art. 31: la abstención solo procede por conflicto de interés, impedimento o no haber estado en la discusión.", "f": "CMN Módulo 1 (art. 31).", "n": "", "src": "propia"}, {"id": "M1-161", "comp": "M1", "tema": "M", "nivel": "B", "tipo": "Institucional", "q": "¿Por cuánto tiempo puede ser reelegido el Rector?", "o": ["No puede ser reelegido.", "Hasta por 2 periodos adicionales de 4 años.", "Por un único periodo de 2 años.", "Indefinidamente."], "k": 1, "e": "Periodo de 4 años, reelegible hasta por 2 periodos adicionales.", "f": "CMN Módulo 1 (cuadro de órganos).", "n": "", "src": "propia"}, {"id": "M1-162", "comp": "M1", "tema": "M", "nivel": "A", "tipo": "Caso práctico", "q": "El Rector sale en comisión y el Vicerrector Académico también está ausente. ¿Quién asume las funciones de rectoría en esta vacancia temporal?", "o": ["El Secretario General.", "El decano más antiguo.", "El Vicerrector Administrativo, en primer lugar.", "El Vicerrector de Investigación, porque sigue en el orden fijado."], "k": 3, "e": "En la vacancia temporal reemplaza el Vicerrector Académico y, si no puede, los vicerrectores de Investigación, de Extensión y Administrativo, en ese orden.", "f": "CMN Módulo 1 (arts. 50–53).", "n": "", "src": "propia"}, {"id": "M1-163", "comp": "M1", "tema": "M", "nivel": "B", "tipo": "Normativa", "q": "El Consejo Superior debe aprobar el presupuesto de la Universidad a más tardar:", "o": ["El 15 de diciembre.", "El 31 de diciembre.", "El 30 de noviembre.", "El 31 de enero del año siguiente."], "k": 0, "e": "Es una de las funciones del CSU (art. 33).", "f": "CMN Módulo 1 (funciones del CSU).", "n": "", "src": "propia"}, {"id": "M1-164", "comp": "M1", "tema": "M", "nivel": "I", "tipo": "Normativa", "q": "¿Quiénes pueden convocar a sesiones extraordinarias del Consejo Superior?", "o": ["Solo el Rector.", "Solo el Gobernador.", "Cualquier miembro, con voz o sin ella.", "El Presidente, el Rector o al menos 5 miembros con voto, y solo para los temas de la convocatoria."], "k": 3, "e": "Art. 29 del Estatuto General.", "f": "CMN Módulo 1 (sesiones).", "n": "", "src": "propia"}, {"id": "M1-165", "comp": "M1", "tema": "N", "nivel": "B", "tipo": "Institucional", "q": "¿Cómo está integrada la Comisión de Personal?", "o": ["Por 2 representantes del Rector (uno es el Director de Talento Humano) y 2 de los funcionarios.", "Por el Rector, el Vicerrector Administrativo, el Director de Talento Humano y 3 representantes.", "Por los decanos.", "Por 3 representantes de los funcionarios de carrera, sin participación del Rector."], "k": 0, "e": "La opción B describe la Comisión de Carrera Administrativa Especial; no deben confundirse.", "f": "CMN Módulo 2 (arts. 25–30).", "n": "", "src": "propia"}, {"id": "M1-166", "comp": "M1", "tema": "N", "nivel": "I", "tipo": "Diferencia entre conceptos", "q": "¿Ante quién se apela el resultado de las pruebas de un concurso y en qué plazo?", "o": ["Ante la Comisión de Personal, en 10 días hábiles.", "Ante la Comisión de Carrera, en subsidio de la reposición, dentro de los 5 días hábiles siguientes.", "Ante el Rector, en 30 días.", "Ante el jefe inmediato, en 3 días."], "k": 1, "e": "Etapa 11 del concurso (art. 40): reposición y, en subsidio, apelación ante la Comisión de Carrera dentro de 5 días hábiles. La Comisión de Personal es la segunda instancia de la evaluación del desempeño.", "f": "CMN Módulo 2 (13 etapas).", "n": "", "src": "propia"}, {"id": "M1-167", "comp": "M1", "tema": "N", "nivel": "B", "tipo": "Normativa", "q": "Una persona aceptó el nombramiento pero no reside en el lugar del empleo. ¿Cuánto tiempo tiene para posesionarse?", "o": ["5 días hábiles, sin prórroga.", "30 días calendario.", "10 días hábiles, prorrogables hasta 90 días hábiles más.", "6 meses."], "k": 2, "e": "Art. 71: 10 días hábiles, prorrogables hasta 90 días hábiles más si no reside en el lugar del empleo o por causa justificada.", "f": "CMN Módulo 2 (del nombramiento a la carrera).", "n": "", "src": "propia"}, {"id": "M1-168", "comp": "M1", "tema": "N", "nivel": "I", "tipo": "Caso práctico", "q": "Han pasado los 6 meses del periodo de prueba y el jefe no evaluó al servidor. ¿Qué ocurre?", "o": ["El nombramiento se declara insubsistente.", "Se prorroga el periodo de prueba otros 6 meses.", "Se entiende superado con la máxima calificación.", "Se repite el concurso."], "k": 2, "e": "Sin calificación a los 6 meses, el periodo se entiende superado con la máxima calificación.", "f": "CMN Módulo 2 (periodo de prueba).", "n": "", "src": "propia"}, {"id": "M1-169", "comp": "M1", "tema": "N", "nivel": "A", "tipo": "Caso práctico", "q": "Dos funcionarios de carrera empatan en el puntaje para un encargo (art. 134). ¿Cómo se define?", "o": ["Por sorteo con balotas.", "Por la antigüedad.", "Por decisión libre del jefe del área.", "Por la mejor nota del concurso de ingreso."], "k": 1, "e": "En empate decide la antigüedad; el puntaje lo calcula la Comisión de Personal (sobresaliente 5, satisfactoria 4, 1 por año de antigüedad, 3 por año de experiencia relacionada, diplomados 2 y cursos 1).", "f": "CMN Módulo 2 (art. 134).", "n": "", "src": "propia"}, {"id": "M1-170", "comp": "M1", "tema": "N", "nivel": "I", "tipo": "Normativa", "q": "Un servidor de carrera recibe comisión para ejercer un cargo de libre nombramiento. ¿Cuál es su duración?", "o": ["Hasta 1 año improrrogable.", "Hasta 6 meses.", "Indefinida mientras ocupe el cargo.", "Hasta 3 años, prorrogables por igual término, sin superar 6 años en total."], "k": 3, "e": "Art. 114 del Estatuto de Personal; coincide con la regla de la Ley 909 (art. 26).", "f": "CMN Módulo 2 (comisiones).", "n": "", "src": "propia"}, {"id": "M1-171", "comp": "M1", "tema": "N", "nivel": "A", "tipo": "Caso práctico", "q": "Un servidor presentó su renuncia y la Universidad no se ha pronunciado después de 30 días hábiles. ¿Qué puede hacer?", "o": ["Debe seguir esperando; de lo contrario incurre en abandono del cargo.", "Puede desistir o separarse del cargo sin que se configure abandono.", "Su renuncia se entiende rechazada.", "Debe presentar una nueva renuncia."], "k": 1, "e": "Art. 127: la renuncia se acepta en máximo 30 días hábiles; vencido ese plazo sin pronunciamiento, el servidor puede desistir o separarse sin abandono. Antes del plazo no puede dejar sus funciones.", "f": "CMN Módulo 2 (retiro).", "n": "", "src": "propia"}, {"id": "M1-172", "comp": "M1", "tema": "N", "nivel": "I", "tipo": "Procedimiento", "q": "Contra la calificación de la evaluación del desempeño proceden:", "o": ["Reposición ante el evaluador y apelación ante la Comisión de Personal.", "Solo apelación ante el Rector.", "Revocatoria directa ante la Comisión de Carrera.", "Ningún recurso."], "k": 0, "e": "Art. 103 del Estatuto de Personal.", "f": "CMN Módulo 2 (evaluación del desempeño).", "n": "", "src": "propia"}, {"id": "M1-173", "comp": "M1", "tema": "N", "nivel": "I", "tipo": "Normativa", "q": "En una reestructuración, el retén social del art. 156 protege, entre otros, a:", "o": ["Todos los servidores con más de 10 años de antigüedad.", "Los servidores con evaluación sobresaliente.", "Las personas con discapacidad, cabezas de familia, prepensionados y a quienes les falten 3 años para pensionarse.", "Solo a los representantes sindicales."], "k": 2, "e": "Art. 156 del Estatuto de Personal; el fuero sindical tiene su propia regla (art. 131).", "f": "CMN Módulo 2 (retiro y protecciones).", "n": "", "src": "propia"}, {"id": "M1-174", "comp": "M1", "tema": "N", "nivel": "A", "tipo": "Identificar la opción incorrecta", "q": "Sobre el periodo de prueba y el embarazo, ¿cuál afirmación es INCORRECTA según la cartilla?", "o": ["La servidora debe informar por escrito su embarazo para activar la protección.", "El art. 75 dice que el periodo se suspende y continúa al vencer la licencia.", "El art. 130 num. 5 habla de interrumpirlo y reiniciarlo al terminar la licencia.", "Ambos artículos usan la misma redacción, por lo que no hay nada que consultar."], "k": 3, "e": "La cartilla advierte una diferencia de redacción entre los arts. 75 y 130 num. 5 y recomienda consultar a Talento Humano y a la Oficina Jurídica antes de decidir.", "f": "CMN Módulo 2 (periodo de prueba).", "n": "", "src": "propia"}, {"id": "M1-175", "comp": "M1", "tema": "O", "nivel": "B", "tipo": "Conceptual", "q": "¿Cuáles son los seis valores de la Política de Integridad y Buen Gobierno?", "o": ["Honestidad, confianza, justicia, respeto, responsabilidad y coraje.", "Honestidad, lealtad, diligencia, respeto, compromiso y justicia.", "Transparencia, eficiencia, eficacia, economía, celeridad y publicidad.", "Respeto, compromiso, diligencia, justicia, honestidad y lealtad institucional."], "k": 0, "e": "Los seis valores del Código de Integridad Académica. La opción C mezcla principios de la función administrativa.", "f": "CMN Módulo 3 (Para recordar).", "n": "", "src": "propia"}, {"id": "M1-176", "comp": "M1", "tema": "O", "nivel": "I", "tipo": "Procedimiento", "q": "Un servidor quiere reportar una irregularidad, pero no se siente cómodo hablando con su jefe. Según la Política (VOCES Unimagdalena), ¿qué puede hacer?", "o": ["Solo puede acudir al conducto regular.", "Debe esperar a la audiencia de rendición de cuentas.", "Usar el correo ciudadano@unimagdalena.edu.co o el buzón de PQR.", "Publicarlo en redes sociales."], "k": 2, "e": "Primero el conducto regular; si no es cómodo, el correo ciudadano@unimagdalena.edu.co o el buzón de PQR, con cero represalias.", "f": "CMN Módulo 3 (Házte oír — VOCES).", "n": "", "src": "propia"}, {"id": "M1-177", "comp": "M1", "tema": "O", "nivel": "A", "tipo": "Interpretación", "q": "Si la Política de Integridad de 2019 y el Estatuto General de 2023 regulan el mismo asunto de forma distinta, ¿cuál se aplica?", "o": ["La Política, por ser especial.", "Ambas, a elección del servidor.", "Ninguna hasta que el CSU aclare.", "El Estatuto General de 2023."], "k": 3, "e": "El Estatuto General es la norma de mayor jerarquía interna y además posterior. Ejemplo: honorarios de los consejeros.", "f": "CMN Parte III, pregunta de análisis 8; Módulo 1 (art. 27).", "n": "", "src": "propia"}, {"id": "M1-178", "comp": "M1", "tema": "O", "nivel": "I", "tipo": "Conceptual", "q": "Según la Política, la rendición de cuentas:", "o": ["Es un deber ético que se integra al Plan Anticorrupción y de Atención al Ciudadano e incluye audiencia pública en Consejo Superior ampliado.", "Es un trámite opcional del Rector.", "Solo se hace ante la Contraloría.", "Se limita a publicar los estados financieros."], "k": 0, "e": "", "f": "CMN Módulo 3 (rendición de cuentas).", "n": "", "src": "propia"}, {"id": "M1-179", "comp": "M1", "tema": "O", "nivel": "I", "tipo": "Diferencia entre conceptos", "q": "En los órganos colegiados, ¿cuándo procede la recusación?", "o": ["Cuando el consejero se declara impedido.", "Cuando el consejero no declara su impedimento; se resuelve antes de decidir el asunto de fondo.", "Solo después de aprobada la decisión.", "Cuando el consejero se ausenta de la sesión."], "k": 1, "e": "Impedido = me aparto yo; recusado = otro pide que me aparte. La recusación procede por las causales del art. 11 de la Ley 1437 de 2011.", "f": "CMN Módulo 3 (manual de órganos colegiados).", "n": "", "src": "propia"}, {"id": "M1-180", "comp": "M1", "tema": "O", "nivel": "B", "tipo": "Conceptual", "q": "La Política propone seis preguntas para decidir (¿es correcto?, ¿es legal?, ¿estoy autorizado?…). Si la respuesta a alguna es “no”, ¿qué se debe hacer?", "o": ["Continuar si el jefe lo autoriza.", "Consultarlo solo con un compañero de confianza.", "Hablar: reportarlo o pedir orientación por los canales institucionales.", "Esperar a que otro lo reporte."], "k": 2, "e": "", "f": "Política de Integridad (“Si tienes dudas, ¡pregunta!”); CMN Módulo 3.", "n": "", "src": "propia"}, {"id": "M1-181", "comp": "M1", "tema": "O", "nivel": "A", "tipo": "Caso práctico", "q": "Una funcionaria denunció de buena fe una irregularidad. Su jefe le reduce funciones y le niega un ascenso “por necesidades del servicio”. Según la Política:", "o": ["Es válido si el jefe documenta la necesidad del servicio.", "Es una represalia prohibida: no se puede degradar, reasignar ni negar promociones a quien reporta de buena fe.", "Solo es irregular si hay reducción de salario.", "La funcionaria debe aceptar la decisión y apelar ante el CSU."], "k": 1, "e": "La Política tiene cero tolerancia con las represalias contra quien reporta de buena fe o participa en una investigación.", "f": "CMN Módulo 3.", "n": "", "src": "propia"}, {"id": "M1-182", "comp": "M1", "tema": "O", "nivel": "I", "tipo": "Relación entre conceptos", "q": "¿Qué deber concreto del Estatuto de Personal respalda el valor de la honestidad frente a un regalo de un proveedor?", "o": ["El deber de desconexión laboral.", "El derecho a permisos de estudio.", "La prohibición de solicitar o recibir dádivas, regalos o beneficios.", "El deber de concertar compromisos."], "k": 2, "e": "Los valores de la Política tienen respaldo en el Estatuto de Personal: denunciar (art. 16 num. 11), no recibir dádivas (art. 17 num. 3) y declararse impedido (art. 19).", "f": "CMN Módulo 3 (De los valores a los deberes).", "n": "", "src": "propia"}, {"id": "L30-01", "tema": "I", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "¿Quién designa al Rector de una universidad estatal u oficial?", "o": ["El Presidente de la República", "El Ministro de Educación Nacional", "El Consejo Superior Universitario", "El Consejo Académico"], "k": 2, "e": "El Consejo Superior Universitario designa al Rector, según el art. 66 de la Ley 30.", "f": "Cartilla Ley 30, Anexo A.3, pregunta 1; C30 P38.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-02", "tema": "I", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "La máxima autoridad académica de la universidad es:", "o": ["El Rector", "El Consejo Académico", "El Consejo Superior Universitario", "El CESU"], "k": 1, "e": "El Consejo Académico es la máxima autoridad académica (art. 68 de la Ley 30). El Consejo Superior es el máximo órgano de dirección y gobierno.", "f": "Cartilla Ley 30, Anexo A.3, pregunta 2; C30 P39.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-03", "tema": "H", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "Según el artículo 53, el Sistema Nacional de Acreditación es:", "o": ["Obligatorio y permanente", "Obligatorio y temporal", "Voluntario y temporal", "Voluntario y permanente"], "k": 2, "e": "Acogerse al sistema es voluntario y la acreditación es temporal (art. 53 de la Ley 30).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 3; C30 P28.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-04", "tema": "I", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "El artículo 87 fija un aporte adicional de la Nación no inferior a:", "o": ["El 20 % del incremento real del PIB", "El 50 % del incremento real del PIB", "El 70 % del incremento real del PIB", "El 100 % del IPC"], "k": 2, "e": "El art. 87, modificado por la Ley 2568 de 2026, fija un aporte adicional no inferior al 70 % del incremento real del PIB; esos recursos no hacen parte de la base presupuestal.", "f": "Cartilla Ley 30, Anexo A.3, pregunta 4; C30 P49.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-05", "tema": "I", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "Cada institución debe destinar a bienestar universitario por lo menos:", "o": ["El 1 % del presupuesto de funcionamiento", "El 2 % del presupuesto de funcionamiento", "El 5 % del presupuesto de inversión", "El 10 % de las matrículas"], "k": 1, "e": "Por lo menos el 2 % del presupuesto de funcionamiento (art. 118 de la Ley 30).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 5; C30 P54.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-06", "tema": "H", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "La suprema inspección y vigilancia de la educación superior corresponde:", "o": ["Al Gobierno Nacional, con posibilidad de delegar en el Ministro de Educación", "Al Consejo Superior de cada universidad", "Al ICFES de forma exclusiva", "A las gobernaciones"], "k": 0, "e": "La ejerce el Gobierno Nacional con la asesoría del CESU, y el Presidente puede delegarla en el Ministro de Educación (art. 33 de la Ley 30 y art. 211 de la Constitución).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 6; C30 P26.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-07", "tema": "H", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "¿Qué artículos de la Ley 30 fueron derogados por la Ley 1740 de 2014?", "o": ["Los artículos 28 a 30", "Los artículos 48 a 50", "Los artículos 62 a 64", "Los artículos 117 a 119"], "k": 1, "e": "El art. 25 de la Ley 1740 de 2014 derogó los arts. 48 a 50 y modificó el art. 51.", "f": "Cartilla Ley 30, Anexo A.3, pregunta 7; C30 P27.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-08", "tema": "C", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "Según la sentencia C-006 de 1996, los profesores de cátedra y ocasionales:", "o": ["No tienen derecho a prestaciones", "Son siempre contratistas", "Tienen una relación subordinada y derecho a prestaciones proporcionales", "Solo tienen derecho a seguridad social"], "k": 2, "e": "La C-006/96 reconoció la relación subordinada y las prestaciones proporcionales al tiempo servido, por primacía de la realidad.", "f": "Cartilla Ley 30, Anexo A.3, pregunta 8; C30 P42.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-09", "tema": "I", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "Según la sentencia C-589 de 1997, la presencia del Estado en el Consejo Superior es válida mientras:", "o": ["Tenga control mayoritario o absoluto", "No sea un control mayoritario o absoluto", "El Rector la autorice", "Solo participe el MEN"], "k": 1, "e": "La participación del Estado no viola la autonomía mientras no sea un control mayoritario o absoluto (C-589/97).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 9; C30 P36.", "n": "", "src": "original", "comp": "M1"}, {"id": "L30-10", "tema": "H", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 30", "q": "¿En cuánto tiempo caducan la acción y la sanción administrativa según el artículo 52?", "o": ["Seis meses", "Un año", "Tres años", "Diez años"], "k": 2, "e": "Caducan en tres años contados desde el último acto constitutivo de la falta (art. 52 de la Ley 30).", "f": "Cartilla Ley 30, Anexo A.3, pregunta 10; C30 P27.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-01", "tema": "C", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuántos tipos de servidores públicos distingue el artículo 123 de la Constitución?", "o": ["Dos: empleados públicos y contratistas", "Tres: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales", "Cuatro: incluye a los contratistas", "Cinco: incluye los empleos temporales"], "k": 1, "e": "Tres clases: miembros de corporaciones públicas, empleados públicos y trabajadores oficiales (C.P., art. 123; C-484/95).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 1; C909 P11.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-02", "tema": "D", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cómo se aplica la Ley 909 al personal administrativo de la Universidad del Magdalena?", "o": ["En su integridad, igual que a una alcaldía", "Solo en los concursos de ascenso", "De manera supletoria, ante vacíos de su normativa propia", "No se aplica en ningún caso"], "k": 2, "e": "De manera supletoria, ante vacíos de su normativa propia (Ley 909, art. 3, num. 2; C-175/06).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 2; C909 P24.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-03", "tema": "F", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué naturaleza tiene la convocatoria de un concurso?", "o": ["Es la norma reguladora del concurso y obliga a la administración y a los participantes", "Es un acto informativo que la entidad puede modificar en cualquier momento", "Es una recomendación de la CNSC", "Es el resultado final del concurso"], "k": 0, "e": "La convocatoria es la norma reguladora del concurso y obliga a la administración y a los participantes (Ley 909, art. 31; SU-446/11).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 3; C909 P21.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-04", "tema": "F", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "Un auxiliar lleva diez años como provisional en un cargo de carrera. Según la sentencia C-588 de 2009:", "o": ["Debe inscribirse en carrera por su antigüedad", "Pasa automáticamente a libre nombramiento y remoción", "Queda inscrito si obtiene evaluación sobresaliente", "No tiene derecho a inscribirse en carrera sin concurso"], "k": 3, "e": "No tiene derecho a inscribirse en carrera sin concurso; el art. 1 del Acto Legislativo 01 de 2008 fue declarado inexequible (C-588/09).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 4; C909 P42.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-05", "tema": "E", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuánto dura el encargo en una vacancia definitiva?", "o": ["Un mes, sin prórroga", "Hasta tres meses, prorrogables por tres más", "Un año, prorrogable por otro año", "El tiempo que dure el concurso, sin límite"], "k": 1, "e": "Hasta tres meses, prorrogables por tres más (Ley 909, art. 24).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 5; C909 P35.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-06", "tema": "F", "nivel": "B", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué porcentaje de las plazas de los concursos se reserva para personas con discapacidad?", "o": ["El 3 %", "El 5 %", "Al menos el 7 %", "El 10 %"], "k": 2, "e": "Al menos el 7 % en concursos abiertos y de ascenso, con ajuste positivo (Ley 909, art. 29).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 6; C909 P41.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-07", "tema": "E", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Cuál es el tope total de la comisión para desempeñar un empleo de libre nombramiento y remoción?", "o": ["Seis años, sumando la comisión y su prórroga", "Tres años, sin prórroga", "Cuatro años", "Diez años"], "k": 0, "e": "Hasta tres años prorrogables por un término igual; la comisión o la suma de ellas no puede superar seis años (Ley 909, art. 26).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 7; C909 P37.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-08", "tema": "G", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "La insubsistencia de un empleado de carrera por calificación no satisfactoria debe declararse:", "o": ["Por acto no motivado, como en el libre nombramiento", "Verbalmente, por el jefe inmediato", "Sin recurso alguno", "De forma motivada, y contra ella procede el recurso de reposición"], "k": 3, "e": "De forma motivada, y contra ella procede el recurso de reposición (Ley 909, art. 43).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 8; C909 P51.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-09", "tema": "D", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "¿Qué clase de carrera tiene la DIAN y quién la vigila?", "o": ["Carrera general, administrada por la CNSC", "Carrera específica de origen legal, vigilada por la CNSC", "Carrera especial de origen constitucional, fuera de la competencia de la CNSC", "Carrera docente, vigilada por la propia entidad"], "k": 1, "e": "Carrera específica de origen legal, vigilada por la CNSC (Ley 909, art. 4; C-1230/05).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 9; C909 P25.", "n": "", "src": "original", "comp": "M1"}, {"id": "L909-10", "tema": "E", "nivel": "I", "tipo": "Cuestionario original · Cartilla Ley 909", "q": "Un técnico de carrera acepta un cargo de libre nombramiento y remoción y se posesiona sin haber pedido comisión. ¿Qué ocurre?", "o": ["Conserva los derechos de carrera de forma indefinida", "Queda encargado de manera automática", "Pierde los derechos de carrera", "Se inscribe en carrera en el nuevo cargo"], "k": 2, "e": "Pierde los derechos de carrera (Ley 909, art. 42).", "f": "Cartilla Ley 909, Anexo A.3, pregunta 10; C909 P50.", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E1", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La finalidad central del derecho disciplinario es:", "o": ["Reparar todo daño patrimonial.", "Asegurar el cumplimiento de deberes funcionales y la correcta función pública.", "Reemplazar el proceso penal.", "Resolver controversias laborales."], "k": 1, "e": "El derecho disciplinario protege la función pública exigiendo el cumplimiento de los deberes funcionales. Reparar el daño es materia fiscal o civil; no reemplaza el proceso penal ni resuelve conflictos laborales.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 1 (clave indicada por la cartilla: «Asegurar el cumplimiento de deberes funcionales y la correcta función pública»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E2", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La autonomía de la acción disciplinaria significa que:", "o": ["Depende siempre del fallo penal.", "No requiere prueba.", "Tiene objeto y elementos propios.", "Excluye otras acciones."], "k": 2, "e": "La acción disciplinaria tiene objeto, elementos y finalidad propios, por eso coexiste con la penal, la fiscal y otras sin depender de ellas ni excluirlas. Siempre requiere prueba.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 2 (clave indicada por la cartilla: «Tiene objeto y elementos propios»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E3", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La presunción de inocencia implica que:", "o": ["El investigado prueba su inocencia.", "La queja acredita responsabilidad.", "El Estado debe acreditar la falta y la culpabilidad.", "La duda se resuelve contra el investigado."], "k": 2, "e": "La carga de la prueba es del Estado: debe demostrar la falta y la culpabilidad. La queja no prueba nada por sí sola y la duda razonable se resuelve a favor del investigado (in dubio pro disciplinado).", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 3 (clave indicada por la cartilla: «El Estado debe acreditar la falta y la culpabilidad»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E4", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La ilicitud sustancial exige:", "o": ["Daño económico en todos los casos.", "Afectación sustancial del deber funcional sin justificación.", "Incumplimiento meramente formal.", "Sanción automática."], "k": 1, "e": "Una conducta es ilícita cuando afecta sustancialmente el deber funcional sin justificación. No basta el incumplimiento formal y no se exige daño económico.", "f": "Cartilla Derecho Disciplinario, Evaluación 1, pregunta 4 (clave indicada por la cartilla: «Afectación sustancial del deber funcional sin justificación»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E5", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La separación entre instrucción y juzgamiento busca principalmente:", "o": ["Acelerar el trámite sin garantías.", "Asegurar imparcialidad.", "Eliminar la doble instancia.", "Impedir la defensa técnica."], "k": 1, "e": "Introducida por la Ley 2094 de 2021: quien investiga no es quien juzga, para garantizar la imparcialidad del fallador. No suprime la doble instancia ni la defensa.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 5 (clave indicada por la cartilla: «Asegurar imparcialidad»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E6", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La culpabilidad proscribe:", "o": ["La responsabilidad objetiva.", "La valoración probatoria.", "La defensa material.", "La favorabilidad."], "k": 0, "e": "En materia disciplinaria está proscrita toda forma de responsabilidad objetiva: las faltas solo se sancionan a título de
