 dolo o culpa.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 6 (clave indicada por la cartilla: «La responsabilidad objetiva»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E7", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "La formulación de cargos debe:", "o": ["Ser genérica.", "Citar principios sin hechos.", "Precisar hechos y normas para permitir defensa.", "Anticipar el fallo definitivo."], "k": 2, "e": "El pliego de cargos debe concretar los hechos y las normas presuntamente infringidas (imputación fáctica y jurídica) para que el investigado pueda defenderse. No anticipa el fallo.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 7 (clave indicada por la cartilla: «Precisar hechos y normas para permitir defensa»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-E8", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Una entrevista penal incorporada a un expediente disciplinario:", "o": ["Demuestra automáticamente la falta.", "Nunca puede considerarse.", "Requiere examinar legalidad, naturaleza y contradicción.", "Reemplaza toda prueba."], "k": 2, "e": "La prueba trasladada puede valorarse, pero el operador disciplinario debe examinar su legalidad, su naturaleza y si se garantizó la contradicción; la valoración es autónoma.", "f": "Cartilla Derecho Disciplinario, Evaluación 2, pregunta 8 (clave indicada por la cartilla: «Requiere examinar legalidad, naturaleza y contradicción»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A01", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Cuál es la finalidad principal del derecho disciplinario?", "o": ["Castigar cualquier error cometido en el trabajo.", "Proteger el correcto ejercicio de la función pública y exigir el cumplimiento de deberes, con garantías.", "Reemplazar la evaluación del desempeño.", "Resolver todos los conflictos personales."], "k": 1, "e": "Protege la función pública y exige deberes, siempre con garantías. No castiga cualquier error ni sustituye la evaluación del desempeño.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 1 (clave indicada por la cartilla: «Proteger el correcto ejercicio de la función pública y exigir el cumplimiento de deberes, con garantías»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A02", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué establece el artículo 6 de la Constitución?", "o": ["Que los servidores públicos solo responden por delitos.", "Que los servidores públicos responden por omisión o extralimitación en el ejercicio de sus funciones.", "Que los empleados públicos no tienen deberes.", "Que toda falla genera sanción automática."], "k": 1, "e": "El art. 6 C.P.: los particulares responden por infringir la Constitución y las leyes; los servidores públicos, además, por omisión o extralimitación en el ejercicio de sus funciones.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 2 (clave indicada por la cartilla: «Que los servidores públicos responden por omisión o extralimitación en el ejercicio de sus funciones»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A03", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Una persona es investigada. ¿Qué principio exige tratarla como no responsable mientras no exista decisión ejecutoriada?", "o": ["Publicidad.", "Presunción de inocencia.", "Economía.", "Jerarquía."], "k": 1, "e": "La presunción de inocencia rige hasta que exista fallo ejecutoriado que declare la responsabilidad.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 3 (clave indicada por la cartilla: «Presunción de inocencia»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A04", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "Un profesional advierte que su familiar participa en un proceso que debe evaluar. ¿Qué debe hacer?", "o": ["Continuar si cree que será imparcial.", "Ocultar la relación.", "Informar y tramitar el impedimento según las reglas aplicables.", "Pedir al familiar que retire la propuesta."], "k": 2, "e": "Ante un conflicto de intereses, lo correcto es revelarlo y declararse impedido. Creerse imparcial no basta y pedir el retiro de la propuesta sería una intervención indebida.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 4 (clave indicada por la cartilla: «Informar y tramitar el impedimento según las reglas aplicables»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A05", "tema": "J", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Compartir una contraseña institucional es una práctica segura?", "o": ["Sí, si se trata de un compañero.", "Sí, cuando hay urgencia.", "No; deben utilizarse mecanismos autorizados y trazables.", "Solo está prohibido para directivos."], "k": 2, "e": "Las credenciales son personales; para delegar accesos se usan mecanismos autorizados y trazables. La urgencia o la confianza no lo justifican.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 5 (clave indicada por la cartilla: «No; deben utilizarse mecanismos autorizados y trazables»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A06", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿La autonomía universitaria permite desconocer el debido proceso?", "o": ["Sí, porque cada universidad decide libremente.", "No; está limitada por la Constitución y la ley.", "Sí, cuando se trata de personal administrativo.", "Depende de la opinión del jefe."], "k": 1, "e": "La autonomía universitaria (art. 69 C.P.) se ejerce dentro de la Constitución y la ley; el debido proceso (art. 29) es un límite.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 6 (clave indicada por la cartilla: «No; está limitada por la Constitución y la ley»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A07", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Un contratista siempre es sujeto disciplinable por el solo hecho de tener contrato estatal?", "o": ["Sí, en todos los casos.", "No; deben verificarse los supuestos legales, como el ejercicio de función pública o la administración de recursos públicos.", "Nunca.", "Solo si trabaja dentro del campus."], "k": 1, "e": "Los particulares responden disciplinariamente solo en los supuestos de ley (arts. 25 y 70 CGD): cuando cumplen funciones públicas o administran recursos públicos, entre otros. No es automático ni está excluido.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 7 (clave indicada por la cartilla: «No; deben verificarse los supuestos legales, como el ejercicio de función pública o la administración de recursos públicos»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A08", "tema": "J", "nivel": "I", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué debe hacer la autoridad al valorar pruebas?", "o": ["Considerar solo las pruebas en contra.", "Investigar con igual rigor lo que compromete y lo que favorece.", "Decidir según rumores.", "Prescindir de la defensa."], "k": 1, "e": "Principio de investigación integral: se investiga con igual rigor lo desfavorable y lo favorable al investigado.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 8 (clave indicada por la cartilla: «Investigar con igual rigor lo que compromete y lo que favorece»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A09", "tema": "L", "nivel": "B", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Qué debe hacer una persona que conoce un posible acoso en el entorno laboral?", "o": ["Difundirlo por redes sociales.", "Ignorarlo siempre.", "Orientar hacia los canales institucionales y proteger la confidencialidad.", "Confrontar públicamente a las personas."], "k": 2, "e": "Se orienta a los canales institucionales y se protege la confidencialidad; difundir o confrontar públicamente revictimiza y entorpece el trámite.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 9 (clave indicada por la cartilla: «Orientar hacia los canales institucionales y proteger la confidencialidad»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CDD-A10", "tema": "J", "nivel": "A", "tipo": "Cuestionario original · Cartilla Derecho Disciplinario", "q": "¿Todo retraso en un trámite es automáticamente una falta disciplinaria?", "o": ["Sí.", "No; deben examinarse deber funcional, afectación sustancial, culpabilidad, justificación y pruebas.", "Sí, si existe una queja.", "Solo si el usuario insiste."], "k": 1, "e": "No hay responsabilidad automática: se examinan el deber funcional, la ilicitud sustancial, la culpabilidad, las causales de justificación y la prueba.", "f": "Cartilla Derecho Disciplinario, Preguntas de aprendizaje y autoevaluación, pregunta 10 (clave indicada por la cartilla: «No; deben examinarse deber funcional, afectación sustancial, culpabilidad, justificación y pruebas»).", "n": "", "src": "original", "comp": "M1"}, {"id": "CMN-S01", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La Universidad del Magdalena es jurídicamente…", "o": ["Un establecimiento público del orden nacional.", "Un ente universitario autónomo del orden departamental.", "Una empresa industrial y comercial del Estado.", "Una entidad descentralizada del Distrito."], "k": 1, "e": "Es un ente universitario autónomo del orden departamental, con régimen especial (Ley 30, art. 57; Estatuto General).", "f": "Cartilla Marco normativo, Módulo 1 (naturaleza jurídica). Simulacro, pregunta 1.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S02", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El artículo de la Constitución que garantiza la autonomía universitaria es el…", "o": ["67", "69", "125", "209"], "k": 1, "e": "El art. 69 garantiza la autonomía universitaria. El 67 trata la educación como derecho, el 125 la carrera y el 209 los principios de la función administrativa.", "f": "Cartilla Marco normativo, Módulo 1. Simulacro, pregunta 2.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S03", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "En la Universidad, la Ley 909 de 2004 se aplica…", "o": ["De preferencia sobre el Estatuto de Personal.", "Nunca.", "De manera supletoria, para llenar vacíos.", "Solo a los docentes."], "k": 2, "e": "La Universidad tiene régimen propio; la Ley 909 se aplica de forma supletoria para llenar los vacíos del estatuto (Ley 909, art. 3).", "f": "Cartilla Marco normativo, introducción y Módulo 2. Simulacro, pregunta 3.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S04", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El Consejo Superior Universitario lo preside…", "o": ["El Rector.", "El Ministro de Educación.", "El Gobernador del Magdalena.", "El Secretario General."], "k": 2, "e": "El CSU lo preside el Gobernador del Magdalena (o su delegado). El Rector asiste con voz pero sin voto.", "f": "Cartilla Marco normativo, Módulo 1 (Consejo Superior). Simulacro, pregunta 4.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S05", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para decidir, el Consejo Superior requiere…", "o": ["La mayoría de los presentes.", "Cinco votos favorables de miembros con derecho a voto.", "Tres votos favorables.", "Unanimidad."], "k": 1, "e": "El Estatuto General exige cinco votos favorables de miembros con derecho a voto para las decisiones del CSU.", "f": "Cartilla Marco normativo, Módulo 1 (Para recordar). Simulacro, pregunta 5.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S06", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El periodo del Rector es de…", "o": ["3 años", "4 años", "5 años", "6 años"], "k": 1, "e": "El Rector tiene un periodo de 4 años y puede ser reelegido hasta por dos periodos más.", "f": "Cartilla Marco normativo, Módulo 1 (Rector). Simulacro, pregunta 6.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S07", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "En vacancia temporal del Rector lo reemplaza…", "o": ["El Secretario General.", "El Vicerrector Académico.", "El decano más antiguo.", "El Vicerrector Administrativo."], "k": 1, "e": "En la vacancia temporal, el Vicerrector Académico asume las funciones del Rector.", "f": "Cartilla Marco normativo, Módulo 1 (Rector). Simulacro, pregunta 7.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S08", "tema": "M", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para integrar la terna a Rector, un aspirante debe obtener al menos el…", "o": ["10 % del censo de cada estamento", "15 %", "20 %", "30 %"], "k": 2, "e": "Para integrar la terna se exige al menos el 20 % del censo electoral de cada estamento.", "f": "Cartilla Marco normativo, Módulo 1 (designación del Rector). Simulacro, pregunta 8.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S09", "tema": "M", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El acto del Consejo Superior que regula situaciones generales e impersonales es…", "o": ["La Resolución.", "El Acuerdo Superior.", "La Circular.", "El Comunicado."], "k": 1, "e": "El Acuerdo Superior es el acto general e impersonal del CSU; la resolución es típica de actos particulares o de otras autoridades.", "f": "Cartilla Marco normativo, Glosario y Módulo 1 (actos). Simulacro, pregunta 9.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S10", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El concurso de ascenso puede cubrir hasta el…", "o": ["20 % de los cargos", "30 % de los cargos", "50 % de los cargos", "70 % de los cargos"], "k": 1, "e": "El concurso de ascenso puede cubrir hasta el 30 % de las vacantes; el 70 % restante se provee por concurso abierto.", "f": "Cartilla Marco normativo, Módulo 2 (concursos). Simulacro, pregunta 10.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S11", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La lista de elegibles tiene una vigencia de…", "o": ["1 año", "2 años", "3 años", "4 años"], "k": 1, "e": "La lista de elegibles rige por 2 años.", "f": "Cartilla Marco normativo, Módulo 2 (Para recordar). Simulacro, pregunta 11.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S12", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Si ningún concursante supera el 60 % de la prueba eliminatoria, la vacante…", "o": ["Se provee con el mejor puntaje.", "Se declara desierta.", "Se provee en provisionalidad sin concurso.", "Se asigna por antigüedad."], "k": 1, "e": "Si nadie supera el mínimo del 60 %, el concurso se declara desierto para esa vacante.", "f": "Cartilla Marco normativo, Módulo 2 (concursos). Simulacro, pregunta 12.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S13", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Para aceptar un nombramiento, la persona tiene…", "o": ["5 días", "10 días", "15 días", "30 días"], "k": 1, "e": "Hay 10 días desde la comunicación para aceptar; luego 10 días hábiles para posesionarse, prorrogables hasta 90 días hábiles más (art. 71).", "f": "Cartilla Marco normativo, Módulo 2 (del nombramiento a la carrera). Simulacro, pregunta 13.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S14", "tema": "N", "nivel": "B", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Una calificación del desempeño es sobresaliente cuando es…", "o": ["Igual o superior al 85 %.", "Igual o superior al 90 %.", "Superior al 75 %.", "Igual o superior al 80 %."], "k": 0, "e": "Sobresaliente: 85 % o más. Satisfactorio: más de 60 % y menos de 85 %. No satisfactorio: 60 % o menos.", "f": "Cartilla Marco normativo, Módulo 2 (evaluación del desempeño). Simulacro, pregunta 14.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S15", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "Los compromisos de evaluación se concertan dentro de…", "o": ["5 días hábiles", "10 días hábiles", "15 días hábiles", "30 días hábiles"], "k": 2, "e": "La concertación de compromisos se hace dentro de los 15 días hábiles; si el evaluador omite concertar, el evaluado envía su propuesta.", "f": "Cartilla Marco normativo, Módulo 2 (Para recordar). Simulacro, pregunta 15.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S16", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "El encargo en una vacante definitiva se otorga por…", "o": ["3 meses, prorrogables por 3 más.", "6 meses.", "1 año.", "Tiempo indefinido."], "k": 0, "e": "El encargo en vacante definitiva es por 3 meses prorrogables por 3 más.", "f": "Cartilla Marco normativo, Módulo 2 (situaciones administrativas). Simulacro, pregunta 16.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S17", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La licencia no remunerada puede concederse hasta por…", "o": ["30 días hábiles", "60 días hábiles", "90 días hábiles", "120 días hábiles"], "k": 1, "e": "La licencia no remunerada se concede hasta por 60 días hábiles, prorrogables por 30 más.", "f": "Cartilla Marco normativo, Módulo 2 (situaciones administrativas). Simulacro, pregunta 17.", "n": "Clave no incluida en la cartilla: derivada del texto de la propia cartilla.", "src": "original", "comp": "M1"}, {"id": "CMN-S18", "tema": "N", "nivel": "I", "tipo": "Cuestionario original · Cartilla Marco normativo institucional", "q": "La desconexión laboral es un derecho expreso de…", ## 1. Idea central del módulo

El servidor administrativo de una universidad oficial vive en un **sistema dual**: es servidor público (art. 123 C.P.) sometido al mérito (art. 125) y a los principios de la función administrativa (art. 209), pero dentro de un **régimen especial** derivado de la autonomía universitaria (art. 69 C.P. y Ley 30 de 1992). Consecuencia: **primero el estatuto de la universidad; la Ley 909 solo llena vacíos (art. 3, num. 2)**.

Los tres resultados de aprendizaje (PPT d.7; C909 p.2):
1. Ubicar a la Universidad del Magdalena **fuera de la Rama Ejecutiva**, como ente universitario autónomo equiparado a órgano autónomo (C-589/97).
2. Distinguir clases de servidores y de empleos (carrera, LNyR, período fijo, temporal, provisional) y diferenciarlos del trabajador oficial y del contratista.
3. Explicar por qué la Ley 909 opera **supletoriamente** frente al estatuto expedido por el Consejo Superior.

## 2. Mapa temático

### Tema A. Estructura del Estado y ubicación de la universidad
- Art. 113 C.P.: tres ramas + órganos de control + organización electoral + órganos autónomos e independientes (Banco de la República, CNSC, CAR, entes universitarios autónomos). [C909 P1, P8; PPT d.9–10]
- Rama Ejecutiva: sector central (Presidencia, ministerios, departamentos administrativos, superintendencias y UAE **sin** personería) y sector descentralizado (establecimientos públicos, EICE, superintendencias y UAE **con** personería, ESE, etc.). [C909 P3–P4]
- Descentralización / desconcentración / delegación (y delegación de firma). [C909 P5]
- Establecimiento público vs ente universitario autónomo (cuadro comparativo). [C909 P9]
- Universidades: **no** son establecimientos públicos ni hacen parte de la administración central o descentralizada (C-220/97, C-589/97, C-560/00). Sin control de tutela; vínculo con el MEN solo en **políticas y planeación del sector**. [PPT d.11; C30 P31]
- Autonomía ≠ ausencia de controles: inspección y vigilancia, control fiscal. [PPT d.32–33; C30 P2]

### Tema B. Fundamento constitucional
- Art. 6 (responsabilidad), 121 (legalidad/competencia), 122 (funciones detalladas; planta y apropiación), 123 (servidores), 124 (responsabilidad disciplinaria por ley), 125 (carrera y mérito), 126 (nepotismo), 128 (doble asignación), 129 (honores de gobiernos extranjeros), 130 (CNSC), 209 (principios), 211 (delegación). [C909 P2, P10–P17]
- Educación: arts. 27 y 71 (libertades), 67 (derecho y servicio público con función social), 68 (particulares), 69 (autonomía), 189 y 211 (inspección y vigilancia), 350 y 366 (gasto social). [C30 P1–P9]

### Tema C. Servidores públicos y empleos
- Tres clases de servidores (art. 123): miembros de corporaciones públicas, empleados públicos, trabajadores oficiales. [C909 P11; PPT d.19]
- Empleado público (legal y reglamentario) vs trabajador oficial (contrato de trabajo) vs contratista (no es servidor; sin subordinación). [C909 P13; C-154/97]
- Tipos de empleo (Ley 909, art. 1): carrera, LNyR, período fijo, temporal. **Encargo y provisionalidad NO son tipos de empleo**: son mecanismos para proveer vacantes. [PPT d.20]
- Estabilidad: carrera = reforzada; LNyR = mínima (retiro discrecional no motivado); provisional = intermedia (acto motivado; cede ante el ganador). [C909 P12]
- Docentes (Ley 30, arts. 71–74): exclusiva, tiempo completo (40 h), medio tiempo = empleados públicos de régimen especial, no LNyR (salvo período de prueba); cátedra = contrato de prestación de servicios por períodos académicos; ocasionales = < 1 año, por resolución. C-006/96: cátedra y ocasionales tienen relación subordinada y prestaciones proporcionales. [C30 P41–P42; PPT d.21, 36]

### Tema D. Ley 909: objeto, principios y campo de aplicación
- Objeto: regular el sistema de empleo público y los principios de la gerencia pública. [C909 P19]
- Principios (art. 2, mod. Ley 2418/2024): igualdad, mérito, accesibilidad universal, moralidad, eficacia, economía, imparcialidad, transparencia, celeridad y publicidad. [C909 P21]
- Tres criterios: profesionalización; flexibilidad sin detrimento de la estabilidad; responsabilidad (evaluación y acuerdos de gestión). [C909 P22]
- Aplicación **integral** (art. 3, num. 1): Rama Ejecutiva nacional y territorial, IES **no** organizadas como entes autónomos, etc. Aplicación **supletoria** (art. 3, num. 2): carreras especiales, incluidos los entes universitarios autónomos. [C909 P23–P24]
- Carrera general (Ley 909; CNSC) / específica (origen legal: DIAN, Inpec…; vigila la CNSC) / especial (origen constitucional: Rama Judicial, Fiscalía, Procuraduría, contralorías, universidades estatales; fuera de la CNSC). [C909 P25–P26]
- Lo que no aplica o aplica distinto en la universidad: CNSC, Comisión de Personal, art. 46 (aprobación DAFP de plantas), gerencia pública, LNyR definidos por el estatuto. [C909 P27; PPT d.22–23]

### Tema E. Ley 909: clasificación, planeación y provisión
- Regla: carrera. Excepciones taxativas: elección popular, período fijo, trabajadores oficiales, comunidades indígenas, LNyR del art. 5. [C909 P28]
- Criterios de LNyR (art. 5): dirección/conducción/orientación; especial confianza; manejo directo de bienes, dineros o valores; escoltas; asesores de mesas directivas de asambleas y concejos. Importan las funciones, no el nombre (C-405/95). Ley no puede declarar LNyR a rector, vicerrector, decano (C-195/94). [C909 P29]
- Cambio de naturaleza del empleo (art. 6). [C909 P30]
- Empleo temporal (art. 21): excepcional; consultoría máx. 12 meses; ingreso con listas vigentes o evaluación de capacidades; no genera carrera (C-288/14). [C909 P32]
- Jornada: regla tiempo completo (art. 22). [C909 P33]
- Provisión (arts. 23–25), encargo (requisitos y duración), provisionalidad, comisión para LNyR o período (art. 26). [C909 P34–P38]

### Tema F. Carrera, concursos, evaluación y permanencia
- Carrera: sistema técnico de administración de personal; principios del art. 28. [C909 P39]
- Concurso de ascenso: 30 % ascenso / 70 % abierto; niveles asesor, profesional, técnico y asistencial. [C909 P40]
- Reserva de 7 % para personas con discapacidad, con ajuste hacia arriba. [C909 P41]
- No hay ingreso a carrera sin concurso (C-588/09); la convocatoria es la norma del concurso (SU-446/11). [C909 P42; PPT d.18]
- Permanencia (art. 37), evaluación del desempeño (arts. 38–40), capacitación (art. 36). [C909 P43–P46]

### Tema G. Retiro, protecciones y situaciones administrativas
- Causales de retiro (art. 41); carrera = reglado y motivado; LNyR = discrecional y no motivado (no arbitrario). [C909 P47–P48; PPT d.25]
- Provisional ante el ganador del concurso; pérdida de derechos de carrera (art. 42); insubsistencia por calificación (art. 43); supresión e indemnización (arts. 44–45); reformas de planta (art. 46); protecciones (arts. 51–52). [C909 P49–P54]
- Situaciones administrativas: clasificación vigente en **Decreto 1083 de 2015, art. 2.2.5.5.1 (mod. Decreto 648 de 2017)**, no en la Ley 909. [PPT d.24 — solo en la presentación]
- En la universidad: la Ley 30 no enumera causales de retiro; las desarrollan los estatutos (arts. 75 a y 79). [PPT d.25]

### Tema H. Ley 30 de 1992: sistema de educación superior
- Educación superior: servicio público cultural inherente a la finalidad social del Estado (arts. 1–2); libertades (art. 4); objetivos (art. 6, con lit. k de la Ley 2630/2026); calidad (art. 6 lit. c). [C30 P10–P14]
- Campos de acción y programas; posgrados. [C30 P15–P17]
- Carácter académico (técnicas profesionales, instituciones universitarias/escuelas tecnológicas, universidades) vs origen (estatal, privada, economía solidaria). [C30 P18–P21; PPT d.27–30]
- Autonomía (arts. 28–29); C-337/96. [C30 P22–P24; PPT d.33]
- Inspección y vigilancia (arts. 31–33), régimen sancionatorio reformado por Ley 1740/2014 (arts. 48–52). [C30 P25–P27]
- CESU, acreditación (voluntaria y temporal), sistema de información. [C30 P28–P30]

### Tema I. Ley 30: universidades estatales
- Naturaleza, régimen especial y creación (arts. 57–61). [C30 P31–P34]
- Gobierno: Consejo Superior, Consejo Académico, Rector (arts. 62–69); composición del CSU (art. 64; C-589/97). [C30 P35–P39; PPT d.34–35]
- Personal docente y administrativo (arts. 70–80). [C30 P40–P45; PPT d.36]
- Sistema de universidades estatales, financiación (arts. 84–87B con Ley 2568/2026), contratación (arts. 93–95). [C30 P46–P52; PPT d.37–38]
- Régimen estudiantil, bienestar (2 %), extensión, derechos pecuniarios, instituciones especiales. [C30 P53–P58]

## 3. Diferencias que más se confunden

| Par de conceptos | Clave para no confundirlos |
|---|---|
| Servidor público vs empleo | Art. 123 identifica a la **persona**; art. 125 clasifica el **cargo** (PPT d.19). |
| Tipo de empleo vs forma de provisión | Carrera, LNyR, período fijo, temporal son tipos; encargo y provisionalidad son mecanismos de provisión (PPT d.20–21). |
| Empleado público vs trabajador oficial vs contratista | Legal y reglamentario / contrato de trabajo / prestación de servicios sin subordinación (C909 P13). |
| Descentralización vs desconcentración vs delegación | Otra persona jurídica con tutela / dependencia de la misma entidad / transferencia del ejercicio con ley previa y acto escrito, reasumible (C909 P5). |
| Delegación de funciones vs delegación de firma | En la de firma no hay traslado de competencia (C-727/00). |
| Establecimiento público vs ente universitario autónomo | Rama Ejecutiva y tutela / fuera de la Rama Ejecutiva, solo vinculado al MEN en políticas y planeación (C909 P9). |
| Carrera general vs específica vs especial | Ley 909 + CNSC / origen legal, vigila CNSC / origen constitucional, fuera de la CNSC (C909 P26). |
| Aplicación integral vs supletoria de la Ley 909 | Art. 3 num. 1 vs art. 3 num. 2 (C909 P23–P24). |
| Encargo vs comisión | Encargo: cubrir vacante, 3+3 meses, no pierde carrera. Comisión: ejercer LNyR o período, 3+3 años (tope 6), conserva carrera; sin comisión, pierde derechos (C909 P38). |
| Retiro de carrera vs de LNyR | Reglado y motivado / discrecional, no motivado, no arbitrario (C909 P48). |
| Carácter académico vs origen de las IES | "Universidad" es carácter académico; "economía solidaria" es origen (PPT d.30). |
| Consejo Superior vs Consejo Académico | Máximo órgano de dirección y gobierno / máxima autoridad académica, presidida por el Rector (C30 P35–P39). |
| Art. 86 vs art. 87 (Ley 30) | 86: aportes base que crecen mínimo ICES (o IPC si es mayor); 87: aporte adicional ≥ 70 % del crecimiento real del PIB, que **no** hace parte de la base (C30 P48–P49). |

## 8. Contradicciones e imprecisiones detectadas entre documentos

No las resuelvo por suposición; las señalo para que sepas qué versión sustenta cada documento.

1. **Principios del art. 209 C.P.** La PPT (d.18) atribuye al art. 209 "igualdad, moralidad, eficacia, economía, celeridad, imparcialidad y **transparencia**". La C909 (P2) da la lista del art. 209 con **publicidad** (no transparencia) y explica que transparencia, mérito y accesibilidad universal los agrega la Ley 909 (art. 2, mod. Ley 2418/2024). Además, la PPT (d.6) dice "igualdad, moralidad, celeridad y **mérito** (Art. 209)", cuando el mérito está en el art. 125. → En las preguntas del banco sigo la C909, que es la que cita el texto.
2. **Estabilidad del provisional.** La PPT (d.18) dice que su desvinculación "solo cede ante el ganador del concurso". La C909 (P12, P49; C-640/12) precisa que también puede ser retirado por causas disciplinarias, baja calificación o razones del servicio, siempre con acto motivado. → La PPT es incompleta.
3. **Docentes de cátedra y ocasionales.** La PPT (d.21) los presenta como "contratista; no es empleado público ni trabajador oficial" (cátedra) y "no es empleado público ni trabajador oficial" (ocasional). La C30 (P42) recuerda que la C-006/96 declaró inexequible el aparte del art. 73 que calificaba a los de cátedra como simples contratistas y reconoció relación subordinada y prestaciones proporcionales. La propia PPT (d.36) advierte que deben leerse con la jurisprudencia. → La forma de vinculación (contrato por períodos académicos / resolución) sí es coincidente; la calificación de "contratista" es la que la Corte matizó.
4. **Presidencia del CSU.** La PPT (d.35) solo menciona Ministro (nacional) y Gobernador (departamental). La C30 (P36) añade el **alcalde** en las universidades distritales y municipales. → Omisión, no contradicción.
5. **Errata interna de la C30.** La clave del Ejercicio 1 (Anexo A) responde un "Caso 4" que no aparece en el ejercicio (solo hay 3 casos).
6. **Advertencias de las propias cartillas.** Ambas declaran que los artículos de la Constitución, la Ley 489 y algunos condicionamientos de sentencias (C-073/06, C-175/07, C-1230/05, C-220/97) se citan sin verificar el texto oficial o la parte resolutiva. Las preguntas del banco evitan exigir esos condicionamientos exactos.

## 2. Mapa de temas

**J. Régimen disciplinario (Leyes 1952 de 2019 y 2094 de 2021)**
- Finalidad: proteger la función pública y exigir deberes, con garantías. No repara daños ni reemplaza lo penal.
- Constitución: art. 6 (servidores responden por omisión o extralimitación), 29, 123, 124, 209, 269, 277.
- Autonomía de la acción disciplinaria: objeto y elementos propios; coexiste con penal y fiscal.
- C-030 de 2023: funciones disciplinarias de la Procuraduría son **administrativas, no jurisdiccionales**.
- Vigencia general del código reformado: **29 de marzo de 2022** (con excepciones). Decreto 1656 de 2021 corrigió yerros de la Ley 2094.
- Destinatarios: servidores públicos y particulares en los supuestos de ley (arts. 25 y 70): función pública, recursos públicos.
- Principios: presunción de inocencia, investigación integral, culpabilidad (prohibida la responsabilidad objetiva), separación entre instrucción y juzgamiento.
- Ilicitud sustancial: afectación sustancial del deber funcional sin justificación; no basta lo formal ni se exige daño económico.
- Culpabilidad: dolo; culpa gravísima y grave. **La culpa leve no es sancionable** (art. 29).
- Faltas: gravísimas (catálogo legal), graves y leves (criterios).
- Sanciones: destitución e inhabilidad general; suspensión e inhabilidad especial; multa; amonestación escrita (C-461 de 2023). Un llamado de atención informal no es sanción.
- Extinción (art. 32): muerte, caducidad, prescripción. **El desistimiento del quejoso no extingue la acción.**
- Prescripción (art. 33): 5 años (12 para faltas del art. 52); se interrumpe con la notificación del fallo de primera instancia; luego 2 años (3 para art. 52) para notificar la segunda.
- Mapa procesal: indagación previa máximo 6 meses no prorrogable; investigación 6 a 18 meses (términos perentorios no preclusivos); imputación (pliego de cargos con imputación fáctica y jurídica); juicio ordinario o verbal; confesión y aceptación de cargos; nulidad por falta de defensa técnica; recursos de reposición y apelación.
- Esquema de la cartilla: noticia → evaluación inicial → indagación/investigación → cierre → cargos o terminación → juzgamiento → fallo → recursos → ejecución y registro.

**K. Acoso sexual y violencias de género (Ley 2365 de 2024 y Ac. Sup. 10 de 2019)**
- Ley 2365, art. 2: acoso sexual en relaciones de poder **vertical u horizontal**, una o varias veces, en el contexto laboral y en IES.
- Art. 11 (empleadores): política interna; garantizar derechos; informar sobre la Fiscalía; remitir quejas; publicación **semestral** anonimizada y reporte al Sivige en los **últimos 10 días** del semestre. Par. 3: si el acosador es el superior jerárquico, la queja va a la **inspección de trabajo**.
- Art. 13: garantías (traslado, teletrabajo, no interacción, terminar contrato sin preaviso, confidencialidad, no confrontación); medidas 3 a 6 en **5 días hábiles**.
- Art. 14: el despido dentro de los **6 meses** siguientes a la queja carece de efecto y se presume retaliación; multa de 1 a 5000 SMLDV.
- Art. 15: la queja ante el empleador no es requisito de procedibilidad para la denuncia penal ni la queja disciplinaria.
- Arts. 18–19: modifican el CGD (art. 53.5 falta gravísima; art. 160A enfoque diferencial e interseccional en la prueba).
- Ac. Sup. 10 de 2019: Bienestar Universitario coordina el **GAV**; protege a estudiantes, docentes, egresados, administrativos y contratistas personas naturales; ruta de 6 momentos (reporte, atención inicial, orientación y atención, medidas preventivas y de cuidado, seguimiento, cierre); menores de 18: reporte inmediato al **ICBF**; el cierre del GAV no extingue otras actuaciones; Res. 316 de 2024 regula el procedimiento sancionatorio para cátedra, ocasionales y contratistas.

**L. Convivencia laboral (Res. 3461 de 2025)**
- Deroga las Res. 652 y 1356 de 2012. Fundamentos: Convenio 190 OIT, Ley 1010 de 2006, Ley 2209 de 2022 (caducidad de 3 años), Ley 2466 de 2025.
- Conformación: menos de 5 trabajadores, 1 y 1; más de 5 y menos de 20, 1 y 1 con suplentes; más de 20, 2 y 2 con suplentes. Siempre en igual número. No pueden integrarlo quienes tuvieron queja en contra o fueron víctimas en el año anterior.
- Periodo: **2 años**. Reglamento propio con acuerdos de confidencialidad.
- Rol: preventivo, orientador, conciliador y canalizador; **no determina si hay acoso**.
- Términos: recibir queja 5 días calendario; examinar 5 (ampliable 10, máximo 15); remitir en máximo 15 días calendario; informes trimestrales y anual; procedimiento completo máximo **65 días calendario**.
- Acoso sexual: **el comité no es competente** (no conciliable).
- Sector público sin acuerdo: remisión a Procuraduría o Personería. Sector privado: informa a la alta dirección y cierra; el trabajador acude al inspector o al juez.
- Reuniones ordinarias mensuales (quórum mitad más uno); extraordinarias con cada queja. ARL reporta mensualmente al Ministerio.

**M. Estatuto General (Ac. Sup. 16 de 2023)**
- Ente universitario autónomo del orden departamental. Ley 909 supletoria.
- CSU: lo preside el Gobernador; 10 integrantes (Rector con voz y sin voto); sesiona al menos 1 vez al mes; 5 miembros para deliberar y **5 votos** para decidir; presupuesto a más tardar el **15 de diciembre**; miembros no son servidores públicos (art. 34); abstención solo por conflicto, impedimento o ausencia en la discusión (art. 31); actos: Acuerdos, Resoluciones, Circulares, Comunicados (art. 32).
- Consejo Académico: al menos 2 veces al mes; mitad más uno para deliberar.
- Rector: 4 años, reelegible hasta 2 periodos más; vacancia temporal: Vicerrector Académico y luego Investigación, Extensión y Administrativo; terna con al menos 20 % del censo de cada estamento; contra sus actos particulares solo reposición (art. 138).
- 40 % de mujeres en cargos directivos de libre nombramiento; 4 principios de gobernanza (art. 9): primero la gente, gestión basada en resultados, adaptación dinámica al cambio, co-creando con la comunidad.

**N. Estatuto de Personal (Ac. Sup. 07 de 2026)**
- Comisión de Carrera: Rector, VR Administrativo, Director de Talento Humano y 3 representantes. Comisión de Personal: 2 del Rector y 2 de los funcionarios.
- Concursos: ascenso hasta 30 % (primero), abierto 70 %; 13 etapas; recursos contra resultados en 5 días hábiles (apelación ante Comisión de Carrera); lista de elegibles 2 años; desierto si nadie supera 60 %.
- Nombramiento: aceptar en 10 días; posesión en 10 días hábiles (+90); periodo de prueba 6 meses; sin calificación = superado con máxima.
- Desempeño: sobresaliente ≥ 85 %; satisfactorio > 60 % y < 85 %; no satisfactorio ≤ 60 % (2 periodos continuos = insubsistencia); concertación en 15 días hábiles; evalúa el jefe inmediato; recursos: reposición ante el evaluador y apelación ante la Comisión de Personal (art. 103).
- Situaciones: licencia no remunerada 60 + 30 días hábiles; encargo 3 + 3 meses (art. 134: puntaje; empate por antigüedad); comisión para cargo de libre nombramiento hasta 3 años prorrogables, máximo 6; desconexión laboral en trabajo a distancia (art. 122).
- Retiro: renuncia aceptada en máximo 30 días hábiles (art. 127); protecciones (art. 130); retén social (art. 156); prohibido asesorar en asuntos del cargo hasta 2 años después de dejarlo.
- Concurso especial transitorio: convocatoria en máximo 12 meses; curso de formación institucional certificable (art. 153).

**O. Política de Integridad y Buen Gobierno (Ac. Sup. 23 de 2019)**
- 6 valores: honestidad, confianza, justicia, respeto, responsabilidad, coraje.
- 6 preguntas para decidir; ante un "no", hablar. Canal VOCES: conducto regular o ciudadano@unimagdalena.edu.co / PQR. Cero represalias.
- Coordina su difusión la Oficina Asesora de Planeación. Rendición de cuentas: deber ético, parte del PAAC, audiencia pública en CSU ampliado.
- Órganos colegiados: impedimento (me aparto yo; el órgano decide de inmediato por mayoría simple) y recusación (otro pide que me aparte; causales art. 11 Ley 1437; se resuelve antes del fondo).
- Respaldo en el Estatuto de Personal: denunciar (art. 16 num. 11), no recibir dádivas (art. 17 num. 3), declararse impedido (art. 19).

## 3. Contradicciones e inconsistencias (no resueltas por suposición)

1. **Estatuto de Personal, art. 75 vs. art. 130 num. 5.** Embarazo en periodo de prueba: el art. 75 dice que el periodo se *suspende* y continúa; el art. 130 num. 5, que se *interrumpe* y se reinicia. La propia cartilla recomienda consultar a Talento Humano y a la Oficina Jurídica.
2. **Ley 2365, art. 2 vs. CGD art. 53.5.** La definición de acoso sexual incluye relaciones de poder vertical u horizontal; la falta gravísima del art. 53.5 (modificado por la misma ley) habla solo de relaciones verticales.
3. **Política de Integridad 2019 vs. Estatuto General 2023** (por ejemplo, honorarios de los consejeros). La cartilla resuelve que prevalece el Estatuto General.
4. **Res. 3461, art. 3.** Fija reglas para menos de 5, para más de 5 y menos de 20 y para más de 20 trabajadores: no dice expresamente qué pasa con exactamente 5 o exactamente 20.
5. **Claves de la cartilla del marco normativo.** No existen en el documento; las del portal están derivadas del texto y marcadas como tales.
6. **Mapa procesal**: aparece "Acoso laboral (conciliación obligatoria)" como procedimiento especial; la Res. 3461 presenta al comité como instancia conciliadora pero excluye el acoso sexual. Conviene no confundir acoso laboral con acoso sexual.
